/* p = {sym,age,sex,preg,conds:[],algs:[],n}  —  list = [{id,name,ar,sci,price,ok,form,rx,ctl}] */
function sxSuggest(p,list){const S0=SX.find(x=>x.k===p.sym);if(!S0)return {picks:[],out:[],red:''};const age=Number(p.age);const kid=age>0&&age<12;
  const conds=new Set([...(p.conds||[]),...(p.preg?['preg']:[])]);const algs=new Set(p.algs||[]);
  const why=[];const bad=sci=>{for(const [k,r] of SX_ING){if(!new RegExp('\\b('+k+')','i').test(sci))continue;

  const liq=it=>/SYR|SUSP|DROP|SUPP|شراب|نقط|لبوس|SACH|EFF/i.test((it.name||'')+' '+(it.form||''));
  const picks=[],out=[],used=new Set();

    const it=C2.find(x=>!used.has(x.id));if(it){used.add(it.id);picks.push({it,rank,key})}});

function small(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1100/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.6))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

  try{const r=await fetch(DOC()+'orders?key='+CFG.apiKey,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:toFs(d).mapValue.fields})});if(!r.ok)throw new Error(await r.text());const j=await r.json();const id=j.name.split('/').pop();
   notify(nm,d);const last={id,no,t:Date.now()};LS.set('ord-last:'+CO,last);CART=[];save();TXT='';RX='';showDone(last)}
  catch(e){console.error(e);b.disabled=false;b.textContent='ابعت الطلب ✓';bad('الطلب ما اتبعتش — اتأكد من النت وجرّب تاني')}}
async function notify(nm,d){try{const r=await fetch(BC+'pub/push?key='+BCK);const j=await r.json();const u=(j.fields?.url?.stringValue||'').replace(/\/+$/,'');if(!u)return;
  await fetch(u+'/notify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({t:'p-'+CO,kind:'ph',title:'🛵 طلب أونلاين جديد',body:nm+' — '+(d.items.map(x=>x.name).join('، ')||d.text||'طلب مكتوب').slice(0,120)}),keepalive:true})}catch(e){}}
const STT={new:['وصل للصيدلية ✓','الصيدلي هيراجع طلبك ويكلّمك'],conf:['بيتجهز 💊','الصيدلية بتجهز طلبك'],out:['في الطريق ليك 🛵','الطيار خرج بطلبك'],done:['اتسلّم ✓','بالشفا'],cancel:['اتلغى','كلّم الصيدلية لو عندك سؤال']};
async function showDone(last){TAB='done';$('#bar').classList.add('hide');let st='new';try{const r=await fetch(DOC()+'orders/'+last.id+'?key='+CFG.apiKey);if(r.ok){const j=await r.json();st=j.fields?.st?.stringValue||'new'}}catch(e){}const s=STT[st]||STT.new;
  $('#app').innerHTML=head()+`<div class="card empty"><div class="big">${st==='cancel'?'😕':'🎉'}</div><b style="font-size:20px">${s[0]}</b><div style="margin-top:6px">${s[1]}</div><div class="mut sm" style="margin-top:6px">رقم الطلب <b class="num" dir="ltr">${esc(last.no)}</b></div>
   ${SHOP.phone?`<div class="row" style="justify-content:center;margin-top:14px"><a class="btn o" href="tel:${esc(SHOP.phone)}">📞 كلّم الصيدلية</a></div>`:''}<div class="row" style="justify-content:center;margin-top:10px"><button class="btn o sm" id="rf">🔄 تحديث الحالة</button><button class="btn sm" id="nw">طلب جديد</button></div></div>`;
  $('#rf').onclick=()=>showDone(last);$('#nw').onclick=()=>{LS.set('ord-last:'+CO,null);TAB='items';render()}}
boot();
</script>
