*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{font-family:Cairo,system-ui,Tahoma,sans-serif;color:var(--tx);background:var(--bg);font-size:14px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}

.side-in{height:100%;width:252px;border-radius:30px;background:var(--side);border:1px solid var(--cbd);backdrop-filter:var(--sblur);-webkit-backdrop-filter:var(--sblur);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 20px 50px rgba(60,40,20,.15);display:flex;flex-direction:column;padding:14px 12px;gap:1px;position:relative;transition:width .2s}

.side .nav{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;display:flex;flex-direction:column;gap:1px;margin:0 -4px;padding:0 4px}
.side .nav::-webkit-scrollbar{display:none}
.hd{display:flex;gap:10px;align-items:center;padding:0 4px 8px;min-width:0}.hd b{font-size:15px;display:block;line-height:1.25}.hd small{font-size:11px;color:var(--mu);display:block}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#1C2E5A,#0E1A36);display:grid;place-items:center;flex:none;box-shadow:0 4px 12px rgba(0,0,0,.25);overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.qs{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--cbd);border-radius:13px;padding:7px 12px;font-size:12.5px;color:var(--mu);margin-bottom:4px;width:100%}
.qs kbd{margin-right:auto;font-size:10px;background:rgba(127,127,127,.12);padding:1px 6px;border-radius:6px;font-family:inherit}
.gh{font-size:11px;font-weight:700;color:var(--mu);padding:8px 8px 2px;white-space:nowrap}

.it:hover{background:var(--soft)}
.it.on{background:var(--hi);box-shadow:0 6px 18px rgba(0,0,0,.08)}

.tile{width:31px;height:31px;border-radius:10px;display:grid;place-items:center;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 10px rgba(0,0,0,.16)}
.tile svg,.pill svg,.ico{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.usr{display:flex;align-items:center;gap:10px;padding:10px 6px 0;border-top:1px solid var(--line);margin-top:6px;min-width:0;width:100%;text-align:right}

.sb-tg{position:absolute;left:-11px;top:24px;width:22px;height:22px;border-radius:50%;background:#fff;color:#555;box-shadow:0 2px 8px rgba(0,0,0,.15);display:grid;place-items:center;font-size:12px;z-index:3}
/* collapsed */
html:is([data-sb=mini],[data-sb=dock],[data-sb=neon]) .side-in{width:74px;padding:14px 10px}
html:is([data-sb=mini],[data-sb=dock],[data-sb=neon]) .side .lbl,html:is([data-sb=mini],[data-sb=dock],[data-sb=neon]) .gh,html:is([data-sb=mini],[data-sb=dock],[data-sb=neon]) .hd>div:not(.logo),html:is([data-sb=mini],[data-sb=dock],[data-sb=neon]) .qs span,html:is([data-sb=mini],[data-sb=dock],[data-sb=neon]) .qs kbd,html:is([data-sb=mini],[data-sb=dock],[data-sb=neon]) .usr>div:not(.av){display:none}
html:is([data-sb=mini],[data-sb=dock],[data-sb=neon]) .it{justify-content:center;padding:5px}html:is([data-sb=mini],[data-sb=dock],[data-sb=neon]) .it .n{position:absolute;top:-2px;left:2px;margin:0;padding:0 5px;font-size:10px;line-height:16px}
html:is([data-sb=mini],[data-sb=dock],[data-sb=neon]) .hd{justify-content:center;padding:0 0 8px}html:is([data-sb=mini],[data-sb=dock],[data-sb=neon]) .qs{justify-content:center;padding:8px}html:is([data-sb=mini],[data-sb=dock],[data-sb=neon]) .usr{justify-content:center;padding:10px 0 0}
html:is([data-sb=mini],[data-sb=dock],[data-sb=neon]) .it.on{background:none;box-shadow:none}html:is([data-sb=mini],[data-sb=dock],[data-sb=neon]) .it.on .tile{transform:scale(1.18);box-shadow:0 0 0 3px var(--hi),0 6px 14px rgba(0,0,0,.2)}
html:is([data-sb=mini],[data-sb=dock],[data-sb=neon]) .gsep{display:block}.gsep{display:none;height:1px;background:var(--line);margin:5px 8px}
.side .bell{display:none}
/* دوك */
html[data-sb=dock] .side-in{background:rgba(14,12,12,.5);border-color:rgba(255,255,255,.14);color:#F4F1EA;width:78px}
html[data-sb=dock] .tile{width:40px;height:40px;border-radius:13px;transition:transform .18s}html[data-sb=dock] .tile svg{width:20px;height:20px}
html[data-sb=dock] .it:hover .tile{transform:scale(1.25)}html[data-sb=dock] .it:hover{background:none}html[data-sb=dock] .it.on .tile{transform:scale(1.12);box-shadow:0 0 0 3px rgba(255,255,255,.85),0 6px 14px rgba(0,0,0,.3)}
html[data-sb=dock] .qs,html[data-sb=neon] .qs{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12);color:#ddd}html[data-sb=dock] .gsep,html[data-sb=neon] .gsep{background:rgba(255,255,255,.12)}

html[data-sb=neon] .side-in{background:rgba(10,10,14,.62);border-color:rgba(255,255,255,.1);color:#F4F1EA;width:82px}

html[data-sb=neon] .it.on .tile{transform:none;border:1.5px solid var(--c);box-shadow:0 0 18px var(--c),inset 0 0 10px rgba(255,255,255,.06)}
/* سبليت */
.side.split{display:flex;gap:10px}.side.split .rail{width:74px;align-items:center;gap:8px;padding:14px 8px}.side.split .rail .it{justify-content:center;padding:4px}.side.split .rail .it.on{background:none;box-shadow:none}.side.split .rail .it.on .tile{box-shadow:0 0 0 3px var(--hi),0 6px 16px rgba(0,0,0,.2);transform:scale(1.1)}
.side.split .rail .n{position:absolute;top:-4px;left:2px;margin:0;padding:0 5px;font-size:10px;line-height:16px}.side.split .panel{width:220px;padding:18px 12px;gap:2px}.side.split .panel .it{padding:9px 12px;font-size:14px}.side.split .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.35;flex:none}.side.split .it.on .dot{background:var(--a2);opacity:1}
.tip{position:fixed;z-index:99;pointer-events:none;background:rgba(255,255,255,.92);color:#222;font-size:13px;font-weight:700;padding:6px 14px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.15);backdrop-filter:blur(14px);white-space:nowrap}
/* main */
main{flex:1;min-width:0;padding:22px 26px 30px 20px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:46px}
.top h1{font-size:25px;font-weight:800;line-height:1.2}.top .sub{color:var(--mu);font-size:13px}
.crumb{font-size:12.5px;color:var(--mu)}.crumb button{color:var(--mu);font-weight:600}.crumb button:hover{color:var(--ac)}
.card{background:var(--cb);border:1px solid var(--cbd);border-radius:22px;padding:18px;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--sh);min-width:0}
.card.p0{padding:0;overflow:hidden}.card h3{font-size:15px;font-weight:800}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:30px;background:var(--grs);color:var(--gr);white-space:nowrap;line-height:1.5}
.chip.a{background:var(--ams);color:var(--am)}.chip.r{background:var(--rds);color:var(--rd)}.chip.b{background:var(--bls);color:var(--bl)}.chip.o{background:var(--acs);color:var(--ac)}
.chip.g{background:var(--soft);color:var(--tx);border:1px solid var(--cbd);gap:5px;display:inline-flex}
button.chip{cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:700;font-size:14px;padding:9px 17px;border-radius:13px;background:var(--org);color:#fff;white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 20px rgba(232,105,31,.25);transition:transform .1s,filter .1s}
html[data-acc=navy] .btn:not(.o):not(.d){box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 8px 20px rgba(28,46,90,.25)}
.btn:hover{filter:brightness(1.05)}.btn:active{transform:scale(.97)}
.btn.o{background:var(--soft);color:var(--tx);border:1px solid var(--cbd);box-shadow:0 3px 10px rgba(0,0,0,.04)}
.btn.d{background:var(--rds);color:var(--rd);box-shadow:none}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:11px}.btn.lg{padding:13px 22px;font-size:16px;border-radius:16px}
.btn[disabled]{opacity:.45;pointer-events:none}
.ib{width:34px;height:34px;border-radius:11px;display:inline-grid;place-items:center;background:var(--soft);border:1px solid var(--cbd);font-size:15px;flex:none}
kbd,.kbd{font-family:inherit;font-size:11px;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--mu);background:var(--soft);line-height:18px;white-space:nowrap}
.btn kbd{background:rgba(255,255,255,.22);color:inherit;border-color:rgba(255,255,255,.35)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:right;font-size:12px;color:var(--mu);font-weight:700;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.cl{cursor:pointer}tr.cl:hover td{background:var(--soft)}
tr.hl td{background:var(--hi)}
td.num,th.num{text-align:right}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.k{font-size:12.5px;color:var(--mu);font-weight:700}.kv{font-size:28px;font-weight:800;margin-top:2px;line-height:1.3}
.bar{height:8px;border-radius:9px;background:rgba(127,127,127,.14);overflow:hidden}.bar>b{display:block;height:100%;background:var(--org);border-radius:9px}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--cbd);border-radius:12px;padding:3px;flex-wrap:wrap}
.seg button{padding:4px 11px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--mu);white-space:nowrap}
.seg button.on{background:var(--hi);color:var(--ac);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.pill{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex-shrink:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 14px rgba(0,0,0,.15)}
.pill svg{width:22px;height:22px}
.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:700;color:var(--mu);min-width:0}
.f>input,.f>select,.f>textarea{color:var(--tx);font-weight:500;font-size:14px}
.f small{font-weight:500}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;cursor:pointer}.chk input{width:18px;height:18px;accent-color:var(--a2);flex:none}
.empty{padding:34px 16px;text-align:center;color:var(--mu)}.empty b{display:block;color:var(--tx);font-size:16px;margin-bottom:4px}.empty .em{font-size:34px;margin-bottom:6px}
.note{border-radius:14px;padding:10px 13px;font-size:13px;background:var(--acs);color:var(--tx)}.note.a{background:var(--ams)}.note.r{background:var(--rds)}.note.b{background:var(--bls)}.note.ok{background:var(--grs)}
.srch{display:flex;align-items:center;gap:10px;background:var(--hi);border:1px solid var(--cbd);border-radius:18px;padding:5px 8px 5px 16px;box-shadow:0 0 0 5px var(--acs),0 10px 30px rgba(0,0,0,.08)}
.srch input{border:0;background:transparent;box-shadow:none!important;font-size:17px;padding:8px 0}
.list-it{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--cbd);background:var(--soft);border-radius:16px;min-width:0}.list-it.wrap{flex-wrap:wrap}
.qty{display:inline-flex;align-items:center;border:1px solid var(--cbd);background:var(--soft);border-radius:10px;flex:none}
.qty button{width:28px;height:30px;font-weight:800;font-size:16px}.qty input{width:44px;border:0;background:transparent;text-align:center;padding:4px 0;font-weight:800;box-shadow:none!important}
/* modal + toast */
.mb{position:fixed;inset:0;background:rgba(20,14,10,.32);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:80;padding:18px;animation:fi .15s}
.md{width:min(620px,100%);max-height:calc(100dvh - 36px);overflow:auto;background:var(--hi);border:1px solid var(--cbd);border-radius:26px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.3);backdrop-filter:var(--sblur);-webkit-backdrop-filter:var(--sblur);display:flex;flex-direction:column;gap:14px;animation:pu .18s}
html[data-th=dark] .md{background:rgba(38,30,27,.92)}
html[data-lite="1"] .md{background:#fff}html[data-lite="1"][data-th=dark] .md{background:#2a221f}
.md.w{width:min(900px,100%)}.md h2{font-size:19px;font-weight:800}

@keyframes fi{from{opacity:0}}@keyframes pu{from{opacity:0;transform:translateY(12px) scale(.98)}}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{background:rgba(25,20,18,.9);color:#fff;padding:10px 18px;border-radius:14px;font-weight:700;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:pu .2s;max-width:90vw;text-align:center}
/* login */
.auth{flex:1;width:100%;min-height:100dvh;display:grid;place-items:center;padding:20px}
.auth .card.demo{width:min(880px,100%);padding:34px}

.cart .lines{overflow:auto;flex:1;min-height:120px}
.cl-it{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}

.tot{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}

<script>
"use strict";
/* ================================================================

   كل صيدلية ليها كود في الرابط (?c=...) وقاعدة بيانات Firebase لوحدها.
   ?demo=1 = نسخة تجريبية على الجهاز بس.
   ================================================================ */
const APP_VER='1.2.0';
const RELEASES=[['1.2.0','2026-11-27',['الفاتورة: تليفون العميل — لو متسجل بيظهر لوحده، ولو جديد يتسجل من مكانه، والفاتورة تتبعت له واتساب','اختيار الإكسباير (التشغيلة) في الفاتورة، والبحث بيطلّع الصنف مقسوم بالإكسباير','منتجات غير الأدوية (تجميل وبامبرز ومناديل وزيوت وبرفانات) بأنواعها، وسعر للقطعة غير سعر العبوة','الطلبات: بالتليفون أو أونلاين بلوكيشن العميل، وتتحوّل لفاتورة وتروح للطيار، والطيار يشوف العنوان على الخريطة','صفحة الطلب أونلاين للعملاء بلينك وكود QR','اقتراح علاج حسب الشكوى (بأسئلة عن السن والأمراض والحساسية)','أدوية الجدول لازم صورة الروشتة، وتتحدد من فاتورة الشرا','المصروفات الثابتة كل شهر (إيجار وكهربا…) وبنود بتعدّلها','الخزينة: فلوس الدرج بتتحوّل لها مع تقفيل الوردية','إشعارات الموبايل بإعدادات زي سيستم الصيانة','تحميل أخف بكتير: كل جهاز بيحمّل شغله بس، والفواتير القديمة بصلاحية وبتتجاب لما تطلبها']],['1.1.0','2026-11-26',['البصمة بكود QR بيتغير كل ٣٠ ثانية، والتأخير والإضافي بيتحسبوا لوحدهم','المرتبات والسلف والمكافآت والخصومات، وقسيمة لكل موظف','الإجازات بطلب وموافقة ورصيد','كارت الموظف بـ QR للتأكد إنه لسه شغال','الصيدلية الحية: مين شغال ومين غايب والمبيعات لحظة بلحظة','الإشعارات: الجرس جوه السيستم وإشعارات على الموبايل','أشكال جديدة للقائمة الجانبية: دوك ونيون وسبليت']],['1.0.0','2026-11-26',['الكاشير بالعلبة والشريط والقرص، والسعر بالتشغيلة، والبيع من غير نت','الأصناف والتشغيلات والصلاحية، والنواقص وطلبيات الموزعين','المشتريات والموزعين والمرتجعات، والورديات والدرج، والتقارير','التأمين والتعاقدات، والدليفري، ودفتر الجداول، والعلاج الشهري بتذكير واتساب','الفروع والتحويل بينها، وتنبيه التداخلات الدوائية']]];
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36).slice(-5)+Math.random().toString(36).slice(2,8);
const r2=n=>Math.round((Number(n)||0)*100)/100;
const fm=(n,d)=>{n=Number(n)||0;const o={minimumFractionDigits:d??(Number.isInteger(r2(n))?0:2),maximumFractionDigits:2};return n.toLocaleString('en-US',o)};
const money=n=>fm(n,2);
const pad=(n,l=2)=>String(n).padStart(l,'0');
const dstr=d=>{d=d?new Date(d):new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const today=()=>dstr();
const addDays=(s,n)=>{const d=new Date((s||today())+'T12:00:00');d.setDate(d.getDate()+n);return dstr(d)};

const AR_D=['الأحد','الاتنين','التلات','الأربع','الخميس','الجمعة','السبت'];
const dayTxt=s=>{if(!s)return '';const d=new Date(String(s).slice(0,10)+'T12:00:00');return d.getDate()+' '+AR_M[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'')};
const timeTxt=iso=>{const d=new Date(iso);let h=d.getHours(),m=d.getMinutes();const ap=h<12?'ص':'م';h=h%12||12;return h+':'+pad(m)+' '+ap};
const dtTxt=iso=>iso?dayTxt(dstr(iso))+' · '+timeTxt(iso):'';
const expTxt=e=>e?e.slice(5,7)+'/'+e.slice(0,4):'—';
const monthsLeft=e=>{if(!e)return 999;const [y,m]=e.split('-').map(Number);const n=new Date();return (y-n.getFullYear())*12+(m-1-n.getMonth())};
const norm=s=>String(s||'').toLowerCase().replace(/[أإآا]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[ًٌٍَُِّْـ]/g,'').replace(/\s+/g,' ').trim();
const isAr=s=>/[؀-ۿ]/.test(s);
const plural=(n,one,two,many)=>n===1?one:n===2?(two||one):n>=3&&n<=10?many:one;
let TT=null;
function toast(m){const el=document.createElement('div');el.textContent=m;$('#toast').appendChild(el);setTimeout(()=>el.remove(),3200)}
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`)){res();return}const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load '+src));document.head.appendChild(s)})}

/* ---------- الأيقونات والألوان ---------- */
const IC={home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',cash:'<rect x="2" y="6" width="20" height="13" rx="2"/><circle cx="12" cy="12.5" r="2.5"/><path d="M6 10v.01M18 15v.01"/>',
pill:'<path d="M10.5 3.5a5 5 0 0 1 7 7l-7 7a5 5 0 0 1-7-7z"/><path d="M7 7l7 7"/>',box:'<path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8"/>',
truck:'<path d="M2 6h12v10H2zM14 10h4l3 3v3h-7"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',list:'<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>',
users:'<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-6"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
chart:'<path d="M4 20V11M10 20V5M16 20v-7M2 20h20"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',receipt:'<path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 0 1-4 0v-.1a1.6 1.6 0 0 0-2.6-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3.6 14H3a2 2 0 0 1 0-4h.1a1.6 1.6 0 0 0 1.2-2.6l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 10 3.6V3a2 2 0 0 1 4 0v.1a1.6 1.6 0 0 0 2.6 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7H21a2 2 0 0 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',upload:'<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>',swap:'<path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/>',
wallet:'<rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M16 15h2"/>',ret:'<path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>',tag:'<path d="M3 12V3h9l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
grid:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',
out:'<path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 17l-5-5 5-5M5 12h11"/>',calc:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01"/>'};

const PERMS=[
 ['البيع',[['pos','البيع على الكاشير'],['discount','عمل خصم في الفاتورة'],['price_edit','تغيير سعر صنف في الفاتورة'],['credit_sale','البيع الآجل على حساب عميل'],['returns','مرتجع من عميل'],['neg_sale','البيع لو الرصيد مش كفاية']]],
 ['الأصناف والمخزن',[['items','إضافة وتعديل الأصناف والأسعار'],['stock_adj','الجرد وتسوية الكميات'],['shorts','النواقص وطلبيات الموزعين'],['import','تحديث قائمة الأدوية والأسعار من ملف']]],

const Q=new URLSearchParams(location.search);
const DEMO=Q.get('demo')==='1';
const CO=(()=>{const c=Q.get('c');if(c&&/^[A-Za-z0-9_-]{3,60}$/.test(c)){LS.set('ph-last-co',c);return c}if(DEMO)return '';const l=LS.get('ph-last-co','');if(l&&/^[A-Za-z0-9_-]{3,60}$/.test(l)){history.replaceState(null,'',location.pathname+'?c='+l+location.hash);return l}return ''})();

const cfgKey=()=>'ph-cfg:'+CO;

function setPath(o,path,v){const p=path.split('.');let x=o;for(let i=0;i<p.length-1;i++){if(typeof x[p[i]]!=='object'||!x[p[i]])x[p[i]]={};x=x[p[i]]}const k=p[p.length-1];if(v&&v.__inc!==undefined)x[k]=r2((Number(x[k])||0)+v.__inc);else if(v&&v.__del)delete x[k];else x[k]=v}
function applyPatch(doc,f){for(const k in f)setPath(doc,k,f[k])}
function toFs(f){const o={};for(const k in f){const v=f[k];o[k]=v&&v.__inc!==undefined?firebase.firestore.FieldValue.increment(v.__inc):v&&v.__del?firebase.firestore.FieldValue.delete():v}return o}
const clean=o=>JSON.parse(JSON.stringify(o));

/* ops: [{t:'put',c,d}|{t:'patch',c,id,f}|{t:'del',c,id}] */
const DB={
  async run(ops){
    if(!ops.length)return;
    if(MODE==='demo'){for(const o of ops){if(o.t==='sum'||o.t==='stk')continue;if(o.t==='put'){const d=clean(o.d);const i=S[o.c].findIndex(x=>x.id===d.id);if(i>=0)S[o.c][i]=d;else S[o.c].push(d)}else if(o.t==='patch'){let d=S[o.c].find(x=>x.id===o.id);if(!d){d={id:o.id};S[o.c].push(d)}applyPatch(d,o.f)}else if(o.t==='del'){S[o.c]=S[o.c].filter(x=>x.id!==o.id)}else if(o.t==='set'){let d=S[o.c].find(x=>x.id===o.id);if(!d){d={id:o.id};S[o.c].push(d)}applyPatch(d,o.f)}else if(o.t==='meta'){S[o.k]={...(S[o.k]||{}),...clean(o.d)}}}demoSave();rerender();return}
    if(subLocked()&&!ME?.dev){toast(subMsg());throw new Error('locked')}
    ops=xformOps(ops);USG.w+=ops.length;usgLater();
    for(let i=0;i<ops.length;i+=400){const b=FB.db.batch();for(const o of ops.slice(i,i+400)){
      if(o.t==='stk'){b.set(FB.db.collection('stk').doc(o.br+'~'+o.iid),nestFs({...o.f,br:o.br,iid:o.iid}),{merge:true});continue}
      if(o.t==='sum'){b.set(FB.db.collection('days').doc(o.id),nestFs(o.f),{merge:true});continue}
      if(o.t==='set'){b.set(FB.db.collection(o.c).doc(o.id),nestFs(o.f),{merge:true});continue}
      if(o.t==='put'){const {id,...d}=clean(o.d);b.set(FB.db.collection(o.c).doc(id),d)}
      else if(o.t==='patch')b.update(FB.db.collection(o.c).doc(o.id),toFs(o.f));
      else if(o.t==='del')b.delete(FB.db.collection(o.c).doc(o.id));
      else if(o.t==='meta')b.set(FB.db.doc('meta/'+o.k),clean(o.d),{merge:true});}
      const p=b.commit();if(navigator.onLine)await Promise.race([p,new Promise(r=>setTimeout(r,2500))]).catch(e=>{toast(fbErr(e));throw e});else p.catch(e=>toast(fbErr(e)))}
  },
  put(c,d){return DB.run([{t:'put',c,d}])},
  patch(c,id,f){return DB.run([{t:'patch',c,id,f}])},
  del(c,id){return DB.run([{t:'del',c,id}])},
  meta(k,d){return DB.run([{t:'meta',k,d}])},
  async range(c,field,from,to){
    if(MODE==='demo')return S[c].filter(x=>(x[field]||'')>=from&&(x[field]||'')<=to+'~');
    const q=await FB.db.collection(c).where(field,'>=',from).where(field,'<=',to+'~').get();
    return q.docs.map(d=>({...d.data(),id:d.id}));
  }
};

function subState(){const s=S?.sub;if(DEMO||!s||!s.until)return {ok:true};if(s.stop)return {ok:false,lock:true,msg:'السيستم متوقف — كلّم Beam Care'};
  const t=today(),end=addDays(s.until,Number(s.grace||0));
  if(t>end)return {ok:false,lock:s.mode==='full',ro:s.mode!=='full',msg:'الاشتراك انتهى يوم '+dayTxt(s.until)+' — جدّده علشان ترجع تشتغل'};
  if(t>s.until)return {ok:true,warn:'الاشتراك انتهى يوم '+dayTxt(s.until)+' — فاضل '+((new Date(end)-new Date(t))/864e5+1)+' يوم سماح'};
  const left=Math.round((new Date(s.until)-new Date(t))/864e5);if(left<=Number(s.warn??7))return {ok:true,warn:'الاشتراك هيخلص بعد '+left+' يوم ('+dayTxt(s.until)+')'};return {ok:true}}

/* ================================================================

   u = [{n:'علبة',k:1},{n:'شريط',k:3},{n:'قرص',k:10}]  ← k = كام واحدة جوه اللي قبلها

const unitsOf=it=>it?.u?.length?it.u:[{n:'علبة',k:1}];
const fac=(it,i)=>{const u=unitsOf(it);let f=1;for(let j=i+1;j<u.length;j++)f*=Math.max(1,Number(u[j].k)||1);return f};
const roundUp=(v,st)=>{st=Number(st)||0;if(!st)return r2(v);return r2(Math.ceil((v-1e-9)/st)*st)};
const unitPrice=(it,boxPrice,i)=>i===0?r2(boxPrice):Number(unitsOf(it)[i]?.p)>0?r2(unitsOf(it)[i].p):roundUp(boxPrice/fac(it,0)*fac(it,i),S.settings.round);

function qtyTxt(it,base){base=r2(base);if(base===0)return '0';const u=unitsOf(it);const neg=base<0;let q=Math.abs(base);const out=[];for(let i=0;i<u.length;i++){const f=fac(it,i);const n=Math.floor(q/f+1e-9);q=r2(q-n*f);if(n)out.push(n+' '+u[i].n)}if(q>0)out.push(fm(q)+' '+u[u.length-1].n);return (neg?'− ':'')+(out.join(' و ')||'0')}
const curYM=()=>today().slice(0,7);
const isExp=e=>!!e&&e<curYM();
function batchesOf(it,all,br){br=br||BR;const bt=it?.bt||{},bq=it?.bq||{};return Object.keys({...bt,...bq}).map(id=>({id,...(bt[id]||{}),br:bBr(id,bt[id]),q:r2(bq[id]||0)})).filter(b=>(br==='*'||b.br===br)&&(all||b.q!==0)).sort((a,b)=>(a.exp||'9999').localeCompare(b.exp||'9999')||(a.at||'').localeCompare(b.at||''))}

function allocate(it,ui,q,allowNeg,pin){let need=r2(q*fac(it,ui));const out=[];const SL0=sellable(it);if(pin){const k=SL0.findIndex(b=>b.id===pin);if(k>0)SL0.unshift(SL0.splice(k,1)[0])}for(const b of SL0){if(need<=0)break;const t=Math.min(b.q,need);out.push({bid:b.id,base:r2(t),bp:r2(b.price||it.price||0),cost:r2((b.cost??it.cost??0)/fac(it,0)),exp:b.exp,no:b.no});need=r2(need-t)}

function findItems(q,n=30){q=String(q||'').trim();if(!q)return [];const t=norm(q);
  if(/^\d{6,}$/.test(q)){const b=S.items.filter(it=>(it.bc||[]).includes(q));if(b.length)return b}
  const sc=[];for(const it of S.items){if(it.off)continue;const a=norm(it.name),b=norm(it.ar),c=norm(it.sci);let s=0;
    if(a.startsWith(t)||b.startsWith(t))s=3;else if(a.includes(' '+t)||b.includes(' '+t))s=2;else if(a.includes(t)||b.includes(t))s=1.5;else if(c.includes(t))s=1;
    if(s){if(qtyOf(it)>0)s+=.5;sc.push([s,it])}}
  return sc.sort((x,y)=>y[0]-x[0]||x[1].name.localeCompare(y[1].name)).slice(0,n).map(x=>x[1])}
/* البديل لازم نفس المادة الفعالة ونفس التركيز ونفس الشكل (أقراص مع أقراص، شراب مع شراب) */
const FORMK=[['liq',/SUSP|SYR|SYRUP|SOL\b|SOLUTION|DROPS|LIQUID|ELIXIR|شراب|نقط/i],['top',/CREAM|OINT|GEL|LOTION|كريم|مرهم|جل/i],['inj',/AMP|VIAL|INJ|حقن|أمبول/i],['inh',/INHAL|SPRAY|بخاخ/i],['sup',/SUPP|لبوس/i],['sach',/SACH|EFF|فوار|أكياس/i]];
function formKey(it){const t=(it.name||'')+' '+(it.form||'')+' '+(it.rt||'');for(const [k,re] of FORMK)if(re.test(t))return k;return 'sol'}
function strength(it){const m=String(it.name||'').match(/(\d+(?:\.\d+)?)\s*(mg|g|gm|mcg|iu|%|ml)?(?![\d\/])/i);if(!m)return null;let v=Number(m[1]);const u=(m[2]||'').toLowerCase();if(u==='g'||u==='gm')v*=1000;if(u==='mcg')v/=1000;return v}
const altKey=it=>norm(it.sci)+'|'+formKey(it);
function isAlt(a,b){if(!norm(a.sci)||altKey(a)!==altKey(b))return false;const x=strength(a),y=strength(b);return x==null||y==null||x===y}
function altsOf(it,n=6,all){return S.items.filter(x=>x.id!==it.id&&!x.off&&isAlt(it,x)&&(all||sellQty(x)>0)).sort((a,b)=>curPrice(a)-curPrice(b)).slice(0,n)}
function catFind(q,n=8){if(!CAT)return [];const t=norm(q);if(t.length<2)return [];const mine=new Set(S.items.map(i=>i.ck||i.name));const out=[];for(const c of CAT){if(mine.has(c.en))continue;if(c.k.startsWith(t)||c.ka.startsWith(t)){out.push(c);if(out.length>=n)break}}return out}

/* بيوزّع كل الفاتورة على التشغيلات مع بعض (لو نفس الصنف اتكرر) */
function cartCalc(){const tmp={};let sub=0,ok=true;const out=POS.lines.map(l=>{const it=itemOf(l.iid);if(!it)return {l,gone:true,total:0,parts:[]};
    if(!tmp[it.id])tmp[it.id]={...it,bq:{...(it.bq||{})}};const t=tmp[it.id];const al=allocate(t,l.ui,l.q,S.settings.negSale||can('neg_sale'),l.bid);
    al.out.forEach(p=>{if(t.bq[p.bid]!=null)t.bq[p.bid]=r2(t.bq[p.bid]-p.base)});
    let total=0;const parts=al.out.map(p=>{const units=r2(p.base/fac(it,l.ui));const up=l.pov!=null?l.pov:unitPrice(it,p.bp,l.ui);total+=units*up;return {...p,units,up}});
    if(!al.ok){ok=false;const up=l.pov!=null?l.pov:unitPrice(it,curPrice(it),l.ui);total+=r2(al.miss/fac(it,l.ui))*up}
    total=r2(total);sub+=total;return {l,it,parts,total,miss:al.ok?0:al.miss,prices:[...new Set(parts.map(p=>p.up))]}});
  sub=r2(sub);let disc=0;if(POS.disc){disc=POS.disc.t==='p'?r2(sub*POS.disc.v/100):r2(Math.min(sub,POS.disc.v))}
  const goods=r2(sub-disc),fee=POS.dlv?r2(POS.dlv.fee||0):0;let ins=0;if(POS.ins){ins=r2(goods*(Number(POS.ins.pct)||0)/100);if(POS.ins.cap)ins=Math.min(ins,Number(POS.ins.cap))}
  const total=r2(goods+fee);return {rows:out,sub,disc,goods,fee,ins,total,due:r2(total-ins),ok}}
function addToCart(it,ui,q,bid){if(!it)return;ui=ui??(LS.get('ph-ui:'+it.id,null)??0);if(ui>=unitsOf(it).length)ui=0;q=q||1;
  const ex=POS.lines.findIndex(l=>l.iid===it.id&&l.ui===ui&&l.pov==null&&(l.bid||'')===(bid||''));if(ex>=0){POS.lines[ex].q=r2(POS.lines[ex].q+q);POS.act=ex}else{POS.lines.push(bid?{iid:it.id,ui,q,bid}:{iid:it.id,ui,q});POS.act=POS.lines.length-1}
  POS.q='';POS.sel=0;const c=cartCalc();const r=c.rows[POS.act];if(r?.miss)toast('⚠️ الرصيد مش كفاية — المتاح '+qtyTxt(it,sellQty(it)));
  posRefresh(true)}

function posKey(e){const k=e.key,n=POS.res.length+POS.cat.length;
  if(k==='ArrowDown'){e.preventDefault();POS.sel=Math.min(n-1,POS.sel+1);posRes()}
  else if(k==='ArrowUp'){e.preventDefault();POS.sel=Math.max(0,POS.sel-1);posRes()}
  else if(k==='Enter'){e.preventDefault();const q=POS.q.trim();if(!q){if(POS.lines.length)ACT.pay('cash');return}
    if(/^\d{6,}$/.test(q)){const b=S.items.find(it=>(it.bc||[]).includes(q));if(b){addToCart(b);return}}
    const it=POS.res[POS.sel];if(it)addToCart(it);else{const c=POS.cat[POS.sel-POS.res.length];if(c&&can('items'))ACT.posCatAdd(c.en)}}
  else if(k==='Escape'){if(POS.q){POS.q='';e.target.value='';posRes()}}
  else if((k==='+'||k==='-')&&!POS.q&&POS.act>=0){e.preventDefault();ACT.posQ(POS.act+':'+(k==='+'?1:-1))}
  else if(k==='Delete'&&!POS.q&&POS.act>=0){e.preventDefault();ACT.posDel(POS.act)}}
document.addEventListener('keydown',e=>{if(VIEW!=='pos'||!ME||MD)return;const k=e.key;
  if(k==='F2'){e.preventDefault();$('#pq')?.focus()}else if(k==='F9'){e.preventDefault();ACT.pay('cash')}else if(k==='F10'){e.preventDefault();ACT.pay('card')}else if(k==='F8'){e.preventDefault();ACT.posCust()}else if(k==='F6'){e.preventDefault();ACT.posDisc()}else if(k==='F7'){e.preventDefault();ACT.posHold()}
  else if(k==='F4'&&POS.act>=0){e.preventDefault();const l=POS.lines[POS.act];const it=itemOf(l.iid);l.ui=(l.ui+1)%unitsOf(it).length;LS.set('ph-ui:'+l.iid,l.ui);posCart()}});

ACT.posQ=id=>{const [i,d]=id.split(':').map(Number);const l=POS.lines[i];if(!l)return;l.q=r2(l.q+d);if(l.q<=0)POS.lines.splice(i,1);POS.act=Math.min(i,POS.lines.length-1);posCart()};
ACT.posDel=i=>{POS.lines.splice(Number(i),1);POS.act=Math.min(Number(i),POS.lines.length-1);posCart();$('#pq')?.focus()};

ACT.posPrice=i=>{if(!can('price_edit')){toast('مش معاك صلاحية تغيير السعر');return}const l=POS.lines[i],it=itemOf(l.iid);modal({title:'سعر '+esc(unitsOf(it)[l.ui].n)+' في الفاتورة دي',body:`<label class="f">السعر<input name="p" type="number" step="0.01" min="0" value="${l.pov??unitPrice(it,curPrice(it),l.ui)}" inputmode="decimal"></label><p class="mut sm">السعر الأصلي ${money(unitPrice(it,curPrice(it),l.ui))} — التغيير ده للفاتورة دي بس.</p>`,foot:l.pov!=null?'<button type="button" class="btn o" data-a="posPriceReset" data-id="'+i+'">رجّع الأصلي</button>':'',onOk:f=>{const v=Number(f.p.value);if(!(v>=0))return false;l.pov=r2(v);posCart()}})};

ACT.posDisc=()=>{if(!POS.lines.length)return;if(!can('discount')){toast('مش معاك صلاحية الخصم');return}const d=POS.disc||{t:'p',v:''};modal({title:'خصم على الفاتورة',body:`<div class="seg" id="dt"><button type="button" class="${d.t==='p'?'on':''}" data-t="p">نسبة %</button><button type="button" class="${d.t==='a'?'on':''}" data-t="a">مبلغ</button></div><label class="f">القيمة<input name="v" type="number" step="0.01" min="0" value="${d.v}" inputmode="decimal" autofocus></label>`,foot:POS.disc?'<button type="button" class="btn d" data-a="posDiscOff">شيل الخصم</button>':'',after:f=>{let t=d.t;f.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{t=b.dataset.t;f.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x===b))});f._t=()=>t},onOk:f=>{const v=Number(f.v.value);const t=f._t();if(!(v>0)){POS.disc=null}else{if(t==='p'&&v>100)return false;POS.disc={t,v:r2(v)}}posCart()}})};

ACT.pay=async m=>{if(!POS.lines.length)return;if(!can('pos')){toast('مش معاك صلاحية البيع');return}if(posNeedShift()){ACT.shiftOpen();return}
  const c=cartCalc();if(c.rows.some(r=>r.gone)){POS.lines=POS.lines.filter(l=>itemOf(l.iid));posCart();return}
  if(!c.ok){toast('فيه صنف رصيده مش كفاية — قلّل الكمية أو شيله');return}
  if(featOn('ctl')&&c.rows.some(r=>r.it?.ctl)&&!POS.rx?.img){ACT.rxModal(m);return}
  if(POS.dlv&&m==='cash')return finishSale(c,{cash:c.due});
  const cu=POS.cust?byId('custs',POS.cust):null;
  if(m==='credit'){if(!cu){toast('اختار العميل الأول');ACT.posCust();return}if(cu.limit&&r2((cu.bal||0)+c.due)>cu.limit&&!await confirmBox(`حساب ${esc(cu.name)} هيعدّي الحد المسموح (${money(cu.limit)}). تكمّل؟`,'كمّل'))return;return finishSale(c,{credit:c.due})}

function priceHist(it){const p=[...(it.ph||[])];batchesOf(it,true).forEach(b=>{if(b.price&&b.at)p.push({d:b.at.slice(0,10),p:b.price})});p.sort((a,b)=>a.d.localeCompare(b.d));const o=[];p.forEach(x=>{if(!o.length||o[o.length-1].p!==x.p)o.push(x)});return o}
function priceChart(ph){const W=560,H=120,mn=Math.min(...ph.map(x=>x.p))*.92,mx=Math.max(...ph.map(x=>x.p))*1.05;const X=i=>60+i*(W-130)/(ph.length-1),Y=p=>H-14-(p-mn)/(mx-mn||1)*(H-40);let d='';ph.forEach((x,i)=>{d+=(i?` L${X(i)} ${Y(ph[i-1].p)} L`:'M')+`${X(i)} ${Y(x.p)}`});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="margin-top:6px;overflow:visible"><path d="${d} L${W-6} ${Y(ph[ph.length-1].p)}" fill="none" stroke="var(--a2)" stroke-width="3" stroke-linejoin="round"/>${ph.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.p)}" r="4.5" fill="var(--a2)"/><text x="${X(i)}" y="${Y(x.p)-10}" text-anchor="middle" font-size="11.5" fill="currentColor" opacity=".7" font-family="Cairo">${fm(x.p)} ج · ${x.d.slice(5,7)}/${x.d.slice(2,4)}</text>`).join('')}</svg>`}
function moves(it){const m=[];S.sales.forEach(s=>s.lines.forEach(l=>{if(l.iid===it.id)m.push({at:s.at,t:s.type==='ret'?'مرتجع':'بيع',c:s.type==='ret'?'b':'g',q:(s.type==='ret'?'+':'−')+fm(l.q)+' '+l.un})}));S.purch.forEach(p=>p.lines.forEach(l=>{if(l.iid===it.id)m.push({at:p.at,t:'شرا',c:'o',q:'+'+fm(l.q+(l.bonus||0))+' '+unitsOf(it)[0].n})}));S.adjs.forEach(a=>{if(a.iid===it.id)m.push({at:a.at,t:a.reason||'جرد',c:'a',q:(a.diff>0?'+':'−')+qtyTxt(it,Math.abs(a.diff))})});return m.sort((a,b)=>b.at.localeCompare(a.at))}

let SF='near';
function expRows(){const rows=[];const W=S.settings.expWarn;for(const it of S.items){const rate=soldOf(it,30)/30;let cum=0;for(const b of batchesOf(it)){if(b.q<=0)continue;cum+=b.q;const ml=monthsLeft(b.exp);const ex=isExp(b.exp);if(!ex&&ml>=W)continue;
   const daysLeft=Math.max(0,(ml+1)*30-new Date().getDate());const sellDays=rate>0?cum/rate:Infinity;
   const val=r2(b.q/fac(it,0)*(b.cost??it.cost??0));const sug=ex?'exp':sellDays<=daysLeft*.9?'ok':b.sup&&ml<=W?'ret':'promo';rows.push({it,b,ml,ex,val,sug,sellDays})}}
  return rows.sort((a,b)=>(a.b.exp||'').localeCompare(b.b.exp||''))}
const stagnantItems=()=>{const d=addDays(today(),-S.settings.stagnant);return S.items.filter(it=>qtyOf(it)>0&&(!it.ls||it.ls<d)&&(it.at||'').slice(0,10)<d)};

function lastSupOf(it){const b=batchesOf(it,true).filter(x=>x.sup).sort((a,b)=>(b.at||'').localeCompare(a.at||''))[0];return b?.sup||it.sup||''}
function shortList(){const open=S.shorts.filter(s=>s.status==='open'&&inBr(s));const L=open.map(s=>({key:'m'+s.id,doc:s,iid:s.iid||'',name:s.iid?itemOf(s.iid)?.name||s.name:s.name,need:s.q||1,kind:s.cust?'cust':'manual',sup:s.iid?lastSupOf(itemOf(s.iid)||{}):'',note:s.note||'',cust:s.cust||''}));
  const have=new Set(open.map(s=>s.iid).filter(Boolean));
  S.items.forEach(it=>{if(it.off||!it.reorder||have.has(it.id))return;const bx=boxesOf(it);if(bx>it.reorder)return;if(it.ord&&it.ordAt!=null&&bx<=it.ordAt)return;L.push({key:'a'+it.id,iid:it.id,name:it.name,need:Math.max(1,Math.ceil(it.reorder*2-bx)),kind:'auto',sup:lastSupOf(it)})});return L}

function cartWarn(c){const W=[];const its=c.rows.filter(r=>!r.gone).map(r=>r.it);const cu=POS.cust?byId('custs',POS.cust):null;
  const chronicIts=(cu?.chronic||[]).map(x=>itemOf(x.iid)).filter(it=>it&&!its.some(y=>y.id===it.id));
  const all=[...its.map(it=>({it,mine:false})),...chronicIts.map(it=>({it,mine:true}))];const seen=new Set();
  for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){if(all[i].mine&&all[j].mine)continue;const A=ingr(all[i].it),B=ingr(all[j].it);
   for(const [p,q,lv,t] of IX){if((hit(A,p)&&hit(B,q))||(hit(A,q)&&hit(B,p))){const k=[all[i].it.id,all[j].it.id,t].join();if(seen.has(k))continue;seen.add(k);W.push({lv,t:`<span class="en b">${esc(all[i].it.name)}</span> مع <span class="en b">${esc(all[j].it.name)}</span>${all[i].mine||all[j].mine?' (العميل بياخده شهري)':''}: ${t}`})}}}
  /* نفس المادة الفعالة في صنفين (مثلاً بانادول + كونجستال = باراسيتامول مرتين) */
  const cnt={};its.forEach(it=>new Set(ingr(it)).forEach(g=>{(cnt[g]=cnt[g]||[]).push(it)}));for(const g in cnt)if(cnt[g].length>1&&g.length>3)W.push({lv:'mid',t:`<span class="en">${esc(g)}</span> موجودة في ${cnt[g].length} أصناف في الفاتورة (${cnt[g].map(x=>`<span class="en">${esc(x.name)}</span>`).join('، ')}) — اتأكد من الجرعة`});
  if(cu?.notes&&/حساسي|allerg/i.test(cu.notes))W.push({lv:'mid',t:'العميل عنده ملاحظة حساسية: '+esc(cu.notes)});
  return W}

  const draw=async()=>{const k=Math.random().toString(36).slice(2,10);const at=Date.now();await DB.meta('attq',{k,at,br:BR});const url=location.origin+location.pathname+(CO?'?c='+encodeURIComponent(CO):'?demo=1')+'#att='+k;const q=qrcode(0,'M');q.addData(url);q.make();const el=$('#kq');if(el){el.innerHTML=q.createSvgTag({cellSize:8,margin:2,scalable:true});const s=el.querySelector('svg');if(s){s.style.width='100%';s.style.height='100%'}}const t=$('#kt');if(t)t.textContent=new Date().toLocaleTimeString('ar-EG',{hour:'numeric',minute:'2-digit'})};

let ATT_PENDING=(()=>{const m=location.hash.match(/^#att=([a-z0-9]{6,12})$/);if(m){history.replaceState(null,'',location.pathname+location.search);return m[1]}return ''})();
async function attFromScan(){if(!ATT_PENDING||!ME)return;const k=ATT_PENDING;ATT_PENDING='';
  let q=S.attq;if(MODE==='fb'){try{const d=await FB.db.doc('meta/attq').get({source:'server'});q=d.exists?d.data():null}catch(e){toast('محتاج نت علشان البصمة');return}}
  if(!q||q.k!==k||Date.now()-q.at>75000){toast('الكود ده قديم — اعمل سكان تاني للشاشة');return}
  const p=await punch(ME,'qr');if(p)modal({title:p.kind==='in'?'✅ صباح الخير':'👋 مع السلامة',ok:false,body:`<div style="text-align:center;font-size:17px"><b>${esc(ME.name)}</b><div class="kv num" style="margin:8px 0">${timeTxt(p.at)}</div>${p.kind==='in'?'حضورك اتسجل':'انصرافك اتسجل'}${p.kind==='in'&&dayStat(ME,today()).late?`<div class="note a" style="margin-top:8px">متأخر ${hmTxt(dayStat(ME,today()).late)}</div>`:''}</div>`})}

/* ---------- المرتبات والسلف ---------- */
let PR={mo:'',tab:'pay'};
function payCalc(u,mo){const cfg=hrCfg();const sal=Number(u.sal)||0;const day=sal/30,min=day/(cfg.hours*60);const s=monthSum(u,mo);
  const lines=[['المرتب الأساسي',sal]];if(s.absent)lines.push([`غياب ${s.absent} يوم`,-r2(s.absent*day)]);if(s.unpaid)lines.push([`إجازة بدون مرتب ${s.unpaid} يوم`,-r2(s.unpaid*day)]);if(s.lateMin)lines.push([`تأخير ${hmTxt(s.lateMin)}`,-r2(s.lateMin*min)]);if(s.early)lines.push([`انصراف بدري ${hmTxt(s.early)}`,-r2(s.early*min)]);if(s.ot)lines.push([`إضافي ${hmTxt(s.ot)}`,r2(s.ot*min*cfg.otRate)]);
  S.hradj.filter(a=>a.uid===u.id&&a.mo===mo).forEach(a=>lines.push([(a.kind==='bonus'?'مكافأة':'جزاء')+(a.note?' — '+a.note:''),a.kind==='bonus'?a.amount:-a.amount,a.id]));
  S.loans.filter(l=>l.uid===u.id&&r2(l.amount-(l.paid||0))>0&&l.start<=mo).forEach(l=>{const done=S.slips.some(x=>x.mo===mo&&x.uid===u.id&&(x.loans||[]).some(y=>y.id===l.id));const left=r2(l.amount-(l.paid||0));const inst=Math.min(l.inst,done?l.inst:left);lines.push([`قسط سلفة (${money(l.amount)})`,-r2(inst),'',l.id])});
  return {sal,s,lines,net:r2(lines.reduce((a,x)=>a+x[1],0))}}

const sxRule=re=>SX_ING.find(([k])=>k.split('|').some(x=>re.split('|').includes(x)))||null;
function sxIngRe(key){const r=sxRule(key);return new RegExp('\\b('+(r?r[0]:key)+')','i')}
/* p = {sym,age,sex,preg,conds:[],algs:[],n}  —  list = [{id,name,ar,sci,price,ok,form,rx,ctl}] */
function sxSuggest(p,list){const S0=SX.find(x=>x.k===p.sym);if(!S0)return {picks:[],out:[],red:''};const age=Number(p.age);const kid=age>0&&age<12;
  const conds=new Set([...(p.conds||[]),...(p.preg?['preg']:[])]);const algs=new Set(p.algs||[]);
  const why=[];const bad=sci=>{for(const [k,r] of SX_ING){if(!new RegExp('\\b('+k+')','i').test(sci))continue;
    const c=r.x.find(x=>conds.has(x));if(c)return 'مش مناسب مع '+(SX_CONDS.find(z=>z[0]===c)||['',''])[1];
    if(p.age!==''&&p.age!=null&&age<r.age)return 'مش مناسب للسن ده';const a=(r.alg||[]).find(x=>algs.has(x));if(a)return 'عنده حساسية من '+(SX_ALG.find(z=>z[0]===a)||['',''])[1]}return ''};
  const liq=it=>/SYR|SUSP|DROP|SUPP|شراب|نقط|لبوس|SACH|EFF/i.test((it.name||'')+' '+(it.form||''));
  const picks=[],out=[],used=new Set();
  S0.ing.forEach((key,rank)=>{const re=sxIngRe(key);let C=list.filter(it=>it.sci&&re.test(it.sci)&&!it.rx&&!it.ctl);if(!C.length)return;
    const C2=[];C.forEach(it=>{const b=bad(it.sci);if(b){if(!out.some(o=>o.k===key))out.push({k:key,it,why:b})}else C2.push(it)});
    C2.sort((a,b)=>(b.ok?1:0)-(a.ok?1:0)||(kid?(liq(b)?1:0)-(liq(a)?1:0):(liq(a)?1:0)-(liq(b)?1:0))||(a.sci.split('+').length-b.sci.split('+').length)||(a.price||0)-(b.price||0));
    const it=C2.find(x=>!used.has(x.id));if(it){used.add(it.id);picks.push({it,rank,key})}});
  return {picks:picks.slice(0,Math.max(1,Number(p.n)||3)),out,red:S0.red,name:S0.n}}

function parseLoc(t){t=String(t||'');let m=t.match(/(-?\d{1,2}\.\d{3,})\s*,\s*(-?\d{1,3}\.\d{3,})/)||t.match(/@(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/)||t.match(/[?&]q(?:uery)?=(-?\d{1,2}\.\d+)(?:%2C|,)(-?\d{1,3}\.\d+)/);return m?{lat:Number(m[1]),lng:Number(m[2])}:t.startsWith('http')?{url:t}:null}
const locLink=loc=>loc?.url||mapUrl(loc);
ACT.posDlv=()=>{const cu=POS.cust?byId('custs',POS.cust):null;const d=POS.dlv||{};const D=drivers();
  modal({title:'🛵 طلب دليفري / تليفون',body:`<label class="f">تليفون العميل<input name="ph" value="${esc(d.phone||cu?.phone||POS.ph||'')}" dir="ltr" inputmode="tel" required></label><div id="dlc" class="mut sm">${cu?'👤 '+esc(cu.name):''}</div>
   <label class="f">العنوان<input name="addr" value="${esc(d.addr||cu?.addr||'')}" required></label>
   <label class="f">📍 اللوكيشن <small class="mut">(الصق لينك جوجل ماب اللي العميل بعته، أو الإحداثيات)</small><input name="loc" value="${esc(d.loc?(d.loc.url||d.loc.lat+','+d.loc.lng):cu?.loc?(cu.loc.url||cu.loc.lat+','+cu.loc.lng):'')}" dir="ltr" placeholder="https://maps.app.goo.gl/…"></label>
   <div class="g2"><label class="f">مصاريف التوصيل<input name="fee" type="number" min="0" step="1" value="${d.fee??S.settings.dlvFee??''}" inputmode="numeric"></label><label class="f">الطيار<select name="drv">${D.map(u=>`<option value="${u.id}" ${d.driver===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}<option value="" ${d.driver===''?'selected':''}>طيار من برّه</option></select></label></div><div class="mut sm">الطيار هيشوف الطلب والعنوان واللوكيشن على موبايله، ولو الدفع كاش هيحصّل الفلوس ويسلّمها بعدين.</div>`,
   foot:POS.dlv?'<button type="button" class="btn d" data-a="posDlvOff">مش دليفري</button>':'',
   after:f=>{f.ph.oninput=async()=>{const ph=phN(f.ph.value);if(ph.length<11)return;const c=await custByPhone(ph);f.querySelector('#dlc').innerHTML=c?'👤 '+esc(c.name)+(c.bal>0?' · عليه '+money(c.bal):''):'<span class="mut">عميل جديد — هيتسجل باسم «عميل دليفري» لحد ما تعدّله</span>';if(c){if(!f.addr.value&&c.addr)f.addr.value=c.addr;if(!f.loc.value&&c.loc)f.loc.value=c.loc.url||c.loc.lat+','+c.loc.lng}}},
   onOk:async f=>{const ph=phN(f.ph.value);const u=byId('users',f.drv.value);const loc=parseLoc(f.loc.value.trim());let c=cu&&phN(cu.phone)===ph?cu:await custByPhone(ph);
    if(!c&&ph){c={id:uid(),name:'عميل دليفري '+ph.slice(-4),phone:ph,addr:f.addr.value.trim(),bal:0,at:new Date().toISOString(),...(loc?{loc}:{})};await DB.put('custs',c);if(MODE==='fb'){CX[c.id]=c;mergeCusts()}}
    else if(c&&(!c.addr||loc&&!c.loc))await DB.patch('custs',c.id,{...(c.addr?{}:{addr:f.addr.value.trim()}),...(loc&&!c.loc?{loc}:{})});
    if(c)POS.cust=c.id;POS.dlv={addr:f.addr.value.trim(),phone:ph,fee:r2(f.fee.value||0),driver:u?.id||'',driverName:u?.name||'طيار من برّه',...(loc?{loc}:{})};posCart()}})};

{const _dv=VIEWS.dlv.html;VIEWS.dlv.html=function(){let h=_dv.call(this);return h.replace(/<button class="btn sm" data-a="dlvDone" data-id="([^"]+)">/g,(m,id)=>{const s=byId('sales',id);const u=s?(locLink(s.dlv.loc)||mapUrl(null,s.dlv.addr)):'';return `${u?`<a class="btn o sm" href="${esc(u)}" target="_blank" rel="noopener">📍 الخريطة</a>`:''}${s?.dlv?.phone?`<a class="btn o sm" href="tel:${esc(s.dlv.phone)}">📞</a>`:''}<button class="btn o sm" data-a="saleView" data-id="${id}">🧾</button>`+m})}}

   ${o.text?`<div class="note sm">📝 ${esc(o.text)}</div>`:''}${o.sx?`<div class="note b sm">🩺 الشكوى: <b>${esc(o.sx.name||'')}</b>${o.sx.age?' · السن '+esc(o.sx.age):''}${o.sx.sex?' · '+(o.sx.sex==='f'?'أنثى':'ذكر'):''}${(o.sx.conds||[]).length?' · '+o.sx.conds.map(c=>esc((SX_CONDS.find(z=>z[0]===c)||['',c])[1])).join('، '):''}${(o.sx.algs||[]).length?' · حساسية: '+o.sx.algs.map(c=>esc((SX_ALG.find(z=>z[0]===c)||['',c])[1])).join('، '):''}</div>`:''}
   <div class="row wrap" style="gap:6px">${u?`<a class="btn o sm" href="${esc(u)}" target="_blank" rel="noopener">📍 الخريطة</a>`:''}${o.phone?`<a class="btn o sm" target="_blank" rel="noopener" href="${esc(waLink(o.phone,'أهلاً '+(o.name||'')+' 🌿\nبخصوص طلبك من '+S.settings.name+' رقم '+(o.no||'')+':\n'))}">💬 واتساب</a>`:''}${o.rxImg?`<button class="btn o sm" data-a="ordRx" data-id="${o.id}">📷 الروشتة</button>`:''}<span class="sp"></span>
