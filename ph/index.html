<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Beam Care Pharmacy</title>
<meta name="theme-color" content="#F3EEE8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="الصيدلية">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<style>
:root{--tx:#1b1b22;--mu:rgba(27,27,34,.58);--cb:rgba(255,255,255,.42);--cbd:rgba(255,255,255,.8);--line:rgba(0,0,0,.075);--soft:rgba(255,255,255,.58);--hi:rgba(255,255,255,.88);--side:rgba(255,255,255,.48);--inp:rgba(255,255,255,.72);
--a1:#F8A55E;--a2:#E8691F;--ac:#D9601A;--acs:rgba(232,105,31,.14);--org:linear-gradient(180deg,var(--a1),var(--a2));
--gr:#15934F;--grs:rgba(34,197,94,.16);--am:#B87304;--ams:rgba(245,166,35,.2);--rd:#D93C40;--rds:rgba(239,68,68,.14);--bl:#2463D9;--bls:rgba(59,130,246,.14);
--bg:#EFE9E2 url(../bg/glass-light.jpg) center/cover fixed;--sh:0 10px 30px rgba(0,0,0,.06);--blur:blur(14px) saturate(160%);--sblur:blur(24px) saturate(170%);color-scheme:light}
html[data-th=dark]{--tx:#F6F1EA;--mu:rgba(246,241,234,.62);--cb:rgba(28,22,20,.3);--cbd:rgba(255,255,255,.13);--line:rgba(255,255,255,.09);--soft:rgba(255,255,255,.08);--hi:rgba(255,255,255,.15);--side:rgba(20,16,15,.42);--inp:rgba(255,255,255,.09);
--gr:#5BE08F;--grs:rgba(34,197,94,.22);--am:#FFC25C;--ams:rgba(245,166,35,.22);--rd:#FF8A8A;--rds:rgba(239,68,68,.22);--bl:#8DB6FF;--bls:rgba(59,130,246,.24);--acs:rgba(255,140,60,.2);--ac:#FFA866;
--bg:#1d1512 url(../bg/glass-warm.jpg) center/cover fixed;--sh:0 10px 30px rgba(0,0,0,.25);color-scheme:dark}
html[data-acc=navy]{--a1:#3E5C9E;--a2:#1C2E5A;--ac:#22386E;--acs:rgba(28,46,90,.13)}
html[data-acc=navy][data-th=dark]{--a1:#E9C982;--a2:#C99A3E;--ac:#E3BE6A;--acs:rgba(227,190,106,.18)}
html[data-acc=teal]{--a1:#2BB5A6;--a2:#0E7C70;--ac:#0E7C70;--acs:rgba(14,124,112,.13)}
html[data-acc=teal][data-th=dark]{--ac:#5FD6C8}
html[data-acc=violet]{--a1:#A07CFF;--a2:#6A3FE0;--ac:#6A3FE0;--acs:rgba(106,63,224,.13)}
html[data-acc=violet][data-th=dark]{--ac:#B9A0FF}
html[data-lite="1"]{--blur:none;--sblur:none;--cb:rgba(255,255,255,.9);--side:rgba(255,255,255,.94)}
html[data-lite="1"][data-th=dark]{--cb:rgba(34,28,26,.94);--side:rgba(28,23,21,.96)}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{font-family:Cairo,system-ui,Tahoma,sans-serif;color:var(--tx);background:var(--bg);font-size:14px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,select,textarea{background:var(--inp);border:1px solid var(--cbd);border-radius:12px;padding:9px 12px;outline:none;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 4px var(--acs)}
select option{background:#fff;color:#111}
textarea{min-height:70px;resize:vertical}
a{color:var(--ac)}
.en{direction:ltr;unicode-bidi:isolate}.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.mut{color:var(--mu)}.sm{font-size:12px}.xs{font-size:11px}.b{font-weight:700}.bb{font-weight:800}
.row{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:10px}.sp{flex:1}.g{display:grid;gap:14px}
.nowrap{white-space:nowrap}.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* shell */
#app{display:flex;min-height:100vh;min-height:100dvh}
.side{position:sticky;top:0;height:100vh;height:100dvh;padding:16px 0 16px 0;margin-right:16px;flex:none;z-index:20}
.side-in{height:100%;width:252px;border-radius:30px;background:var(--side);border:1px solid var(--cbd);backdrop-filter:var(--sblur);-webkit-backdrop-filter:var(--sblur);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 20px 50px rgba(60,40,20,.15);display:flex;flex-direction:column;padding:14px 12px;gap:1px;position:relative;transition:width .2s}
html[data-th=dark] .side-in{box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 24px 60px rgba(0,0,0,.4)}
.side .nav{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;display:flex;flex-direction:column;gap:1px;margin:0 -4px;padding:0 4px}
.side .nav::-webkit-scrollbar{display:none}
.hd{display:flex;gap:10px;align-items:center;padding:0 4px 8px;min-width:0}.hd b{font-size:15px;display:block;line-height:1.25}.hd small{font-size:11px;color:var(--mu);display:block}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#1C2E5A,#0E1A36);display:grid;place-items:center;flex:none;box-shadow:0 4px 12px rgba(0,0,0,.25);overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.qs{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--cbd);border-radius:13px;padding:7px 12px;font-size:12.5px;color:var(--mu);margin-bottom:4px;width:100%}
.qs kbd{margin-right:auto;font-size:10px;background:rgba(127,127,127,.12);padding:1px 6px;border-radius:6px;font-family:inherit}
.gh{font-size:11px;font-weight:700;color:var(--mu);padding:8px 8px 2px;white-space:nowrap}
.it{display:flex;align-items:center;gap:11px;padding:4px 7px;border-radius:14px;font-size:13.5px;font-weight:600;width:100%;text-align:right;white-space:nowrap;position:relative}
.it:hover{background:var(--soft)}
.it.on{background:var(--hi);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.it .n{margin-right:auto;font-size:11px;font-weight:700;color:#fff;background:#FF3B30;border-radius:99px;padding:0 7px;line-height:18px}
.tile{width:31px;height:31px;border-radius:10px;display:grid;place-items:center;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 10px rgba(0,0,0,.16)}
.tile svg,.pill svg,.ico{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.usr{display:flex;align-items:center;gap:10px;padding:10px 6px 0;border-top:1px solid var(--line);margin-top:6px;min-width:0;width:100%;text-align:right}
.usr b{font-size:13px;display:block;line-height:1.2}.usr small{font-size:11px;color:var(--mu)}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#F6C27C,#DE8B3C);display:grid;place-items:center;font-weight:800;color:#2A1606;position:relative;flex:none;font-size:14px}
.av.on::after{content:"";position:absolute;bottom:0;left:0;width:10px;height:10px;border-radius:50%;background:#34C759;border:2px solid #fff}
.sb-tg{position:absolute;left:-11px;top:24px;width:22px;height:22px;border-radius:50%;background:#fff;color:#555;box-shadow:0 2px 8px rgba(0,0,0,.15);display:grid;place-items:center;font-size:12px;z-index:3}
/* collapsed */
html[data-sb=mini] .side-in{width:74px;padding:14px 10px}
html[data-sb=mini] .side .lbl,html[data-sb=mini] .gh,html[data-sb=mini] .hd>div:not(.logo),html[data-sb=mini] .qs span,html[data-sb=mini] .qs kbd,html[data-sb=mini] .usr>div:not(.av){display:none}
html[data-sb=mini] .it{justify-content:center;padding:5px}html[data-sb=mini] .it .n{position:absolute;top:-2px;left:2px;margin:0;padding:0 5px;font-size:10px;line-height:16px}
html[data-sb=mini] .hd{justify-content:center;padding:0 0 8px}html[data-sb=mini] .qs{justify-content:center;padding:8px}html[data-sb=mini] .usr{justify-content:center;padding:10px 0 0}
html[data-sb=mini] .it.on{background:none;box-shadow:none}html[data-sb=mini] .it.on .tile{transform:scale(1.18);box-shadow:0 0 0 3px var(--hi),0 6px 14px rgba(0,0,0,.2)}
html[data-sb=mini] .gsep{display:block}.gsep{display:none;height:1px;background:var(--line);margin:5px 8px}
.tip{position:fixed;z-index:99;pointer-events:none;background:rgba(255,255,255,.92);color:#222;font-size:13px;font-weight:700;padding:6px 14px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.15);backdrop-filter:blur(14px);white-space:nowrap}
/* main */
main{flex:1;min-width:0;padding:22px 26px 30px 20px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:46px}
.top h1{font-size:25px;font-weight:800;line-height:1.2}.top .sub{color:var(--mu);font-size:13px}
.crumb{font-size:12.5px;color:var(--mu)}.crumb button{color:var(--mu);font-weight:600}.crumb button:hover{color:var(--ac)}
.card{background:var(--cb);border:1px solid var(--cbd);border-radius:22px;padding:18px;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--sh);min-width:0}
.card.p0{padding:0;overflow:hidden}.card h3{font-size:15px;font-weight:800}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:30px;background:var(--grs);color:var(--gr);white-space:nowrap;line-height:1.5}
.chip.a{background:var(--ams);color:var(--am)}.chip.r{background:var(--rds);color:var(--rd)}.chip.b{background:var(--bls);color:var(--bl)}.chip.o{background:var(--acs);color:var(--ac)}
.chip.g{background:var(--soft);color:var(--tx);border:1px solid var(--cbd);gap:5px;display:inline-flex}
button.chip{cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:700;font-size:14px;padding:9px 17px;border-radius:13px;background:var(--org);color:#fff;white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 20px rgba(232,105,31,.25);transition:transform .1s,filter .1s}
html[data-acc=navy] .btn:not(.o):not(.d){box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 8px 20px rgba(28,46,90,.25)}
.btn:hover{filter:brightness(1.05)}.btn:active{transform:scale(.97)}
.btn.o{background:var(--soft);color:var(--tx);border:1px solid var(--cbd);box-shadow:0 3px 10px rgba(0,0,0,.04)}
.btn.d{background:var(--rds);color:var(--rd);box-shadow:none}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:11px}.btn.lg{padding:13px 22px;font-size:16px;border-radius:16px}
.btn[disabled]{opacity:.45;pointer-events:none}
.ib{width:34px;height:34px;border-radius:11px;display:inline-grid;place-items:center;background:var(--soft);border:1px solid var(--cbd);font-size:15px;flex:none}
kbd,.kbd{font-family:inherit;font-size:11px;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--mu);background:var(--soft);line-height:18px;white-space:nowrap}
.btn kbd{background:rgba(255,255,255,.22);color:inherit;border-color:rgba(255,255,255,.35)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:right;font-size:12px;color:var(--mu);font-weight:700;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.cl{cursor:pointer}tr.cl:hover td{background:var(--soft)}
tr.hl td{background:var(--hi)}
td.num,th.num{text-align:right}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.k{font-size:12.5px;color:var(--mu);font-weight:700}.kv{font-size:28px;font-weight:800;margin-top:2px;line-height:1.3}
.bar{height:8px;border-radius:9px;background:rgba(127,127,127,.14);overflow:hidden}.bar>b{display:block;height:100%;background:var(--org);border-radius:9px}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--cbd);border-radius:12px;padding:3px;flex-wrap:wrap}
.seg button{padding:4px 11px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--mu);white-space:nowrap}
.seg button.on{background:var(--hi);color:var(--ac);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.pill{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex-shrink:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 14px rgba(0,0,0,.15)}
.pill svg{width:22px;height:22px}
.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:700;color:var(--mu);min-width:0}
.f>input,.f>select,.f>textarea{color:var(--tx);font-weight:500;font-size:14px}
.f small{font-weight:500}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;cursor:pointer}.chk input{width:18px;height:18px;accent-color:var(--a2);flex:none}
.empty{padding:34px 16px;text-align:center;color:var(--mu)}.empty b{display:block;color:var(--tx);font-size:16px;margin-bottom:4px}.empty .em{font-size:34px;margin-bottom:6px}
.note{border-radius:14px;padding:10px 13px;font-size:13px;background:var(--acs);color:var(--tx)}.note.a{background:var(--ams)}.note.r{background:var(--rds)}.note.b{background:var(--bls)}.note.ok{background:var(--grs)}
.srch{display:flex;align-items:center;gap:10px;background:var(--hi);border:1px solid var(--cbd);border-radius:18px;padding:5px 8px 5px 16px;box-shadow:0 0 0 5px var(--acs),0 10px 30px rgba(0,0,0,.08)}
.srch input{border:0;background:transparent;box-shadow:none!important;font-size:17px;padding:8px 0}
.list-it{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--cbd);background:var(--soft);border-radius:16px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--cbd);background:var(--soft);border-radius:10px;flex:none}
.qty button{width:28px;height:30px;font-weight:800;font-size:16px}.qty input{width:44px;border:0;background:transparent;text-align:center;padding:4px 0;font-weight:800;box-shadow:none!important}
/* modal + toast */
.mb{position:fixed;inset:0;background:rgba(20,14,10,.32);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:80;padding:18px;animation:fi .15s}
.md{width:min(620px,100%);max-height:calc(100dvh - 36px);overflow:auto;background:var(--hi);border:1px solid var(--cbd);border-radius:26px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.3);backdrop-filter:var(--sblur);-webkit-backdrop-filter:var(--sblur);display:flex;flex-direction:column;gap:14px;animation:pu .18s}
html[data-th=dark] .md{background:rgba(38,30,27,.92)}
html[data-lite="1"] .md{background:#fff}html[data-lite="1"][data-th=dark] .md{background:#2a221f}
.md.w{width:min(900px,100%)}.md h2{font-size:19px;font-weight:800}
.md .ft{display:flex;gap:8px;justify-content:flex-start;position:sticky;bottom:-22px;margin:0 -22px -22px;padding:14px 22px;background:inherit;border-top:1px solid var(--line);border-radius:0 0 26px 26px}
@keyframes fi{from{opacity:0}}@keyframes pu{from{opacity:0;transform:translateY(12px) scale(.98)}}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{background:rgba(25,20,18,.9);color:#fff;padding:10px 18px;border-radius:14px;font-weight:700;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:pu .2s;max-width:90vw;text-align:center}
/* login */
.auth{min-height:100dvh;display:grid;place-items:center;padding:20px}
.auth .card{width:min(420px,100%);padding:28px;display:flex;flex-direction:column;gap:14px}
/* POS */
.pos{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(360px,1fr);gap:16px;align-items:start}
.res{max-height:calc(100dvh - 260px);overflow:auto}
.res tr.sel td{background:var(--hi)}.res tr.sel td:first-child{box-shadow:inset -3px 0 0 var(--a2)}
.cart{position:sticky;top:16px;display:flex;flex-direction:column;gap:8px;max-height:calc(100dvh - 40px)}
.cart .lines{overflow:auto;flex:1;min-height:120px}
.cl-it{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.cl-it.sel{background:var(--soft);border-radius:12px}
.tot{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}
.pay{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.alt-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
/* bottom bar (phone) */
.bbar{display:none}
.more-g{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px}
.more-g button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:700;text-align:center}
.more-g .tile{width:52px;height:52px;border-radius:16px}.more-g .tile svg{width:24px;height:24px}
/* print */
#prt{display:none}
@media print{body{background:#fff!important}#app,#toast,.mb{display:none!important}#prt{display:block!important;color:#000;font-family:Cairo,Tahoma,sans-serif}@page{margin:0}}
.rc{width:76mm;padding:3mm 2mm;font-size:11.5px;color:#000}.rc h4{text-align:center;font-size:15px}.rc .c{text-align:center}.rc table{font-size:11px;border-collapse:collapse;width:100%}.rc td,.rc th{padding:2px 1px;border:0;border-bottom:1px dashed #999;color:#000}.rc .t{display:flex;justify-content:space-between;font-size:12px}.rc .big{font-size:15px;font-weight:800}
.rcA4{width:190mm;padding:10mm;font-size:13px}
/* responsive */
@media (max-width:1100px){.pos{grid-template-columns:1fr}.cart{position:static;max-height:none}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
 :root{--blur:blur(10px) saturate(150%)}
 body{font-size:14px;background-attachment:scroll}
 .side{display:none}
 main{padding:calc(env(safe-area-inset-top,0px) + 14px) max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 104px) max(14px,env(safe-area-inset-left,0px));gap:12px}
 .top h1{font-size:21px}.kv{font-size:23px}
 .g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .card{padding:14px;border-radius:20px}
 .bbar{display:flex;position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);height:70px;border-radius:26px;background:var(--side);border:1px solid var(--cbd);backdrop-filter:var(--sblur);-webkit-backdrop-filter:var(--sblur);align-items:center;justify-content:space-around;padding:0 6px;box-shadow:0 14px 40px rgba(0,0,0,.18);z-index:40}
 .bbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;min-width:58px;position:relative}
 .bbar .tile{width:34px;height:34px}.bbar .on .tile{transform:translateY(-3px) scale(1.12)}
 .bbar .n{position:absolute;top:-6px;left:8px;background:#FF3B30;color:#fff;border-radius:99px;font-size:10px;padding:0 5px;line-height:16px}
 .mb{align-items:flex-end;padding:0}
 .md{border-radius:26px 26px 0 0;max-height:92dvh;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px)}
 .md .ft{margin:0 -16px calc(-18px - env(safe-area-inset-bottom,0px));padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px);bottom:calc(-18px - env(safe-area-inset-bottom,0px));border-radius:0}
 .hide-m{display:none!important}
 .res{max-height:none}
 .srch input{font-size:16px}
 #toast{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 12px)}
 .m-cartbar{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 88px);z-index:39}
}

const Q=new URLSearchParams(location.search);
const DEMO=Q.get('demo')==='1';

function parseFbCfg(t){const o={};['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId'].forEach(k=>{const m=String(t||'').match(new RegExp(k+'["\']?\\s*:\\s*["\']([^"\']+)["\']'));if(m)o[k]=m[1]});return o.apiKey&&o.projectId?o:null}
function fbErr(e){const c=e?.code||'';const m={'auth/invalid-credential':'اسم المستخدم أو كلمة السر غلط','auth/wrong-password':'اسم المستخدم أو كلمة السر غلط','auth/user-not-found':'اسم المستخدم أو كلمة السر غلط','auth/invalid-login-credentials':'اسم المستخدم أو كلمة السر غلط','auth/too-many-requests':'محاولات كتير — استنى شوية وجرب تاني','auth/network-request-failed':'مفيش إنترنت','auth/email-already-in-use':'اسم المستخدم ده موجود قبل كده','auth/weak-password':'كلمة السر لازم 6 حروف أو أرقام على الأقل','permission-denied':'مفيش صلاحية للعملية دي','unavailable':'مفيش اتصال بالسيرفر — هيتبعت أول ما النت يرجع'};return m[c]||e?.message||'حصلت مشكلة'}

function setPath(o,path,v){const p=path.split('.');let x=o;for(let i=0;i<p.length-1;i++){if(typeof x[p[i]]!=='object'||!x[p[i]])x[p[i]]={};x=x[p[i]]}const k=p[p.length-1];if(v&&v.__inc!==undefined)x[k]=r2((Number(x[k])||0)+v.__inc);else if(v&&v.__del)delete x[k];else x[k]=v}
function applyPatch(doc,f){for(const k in f)setPath(doc,k,f[k])}
function toFs(f){const o={};for(const k in f){const v=f[k];o[k]=v&&v.__inc!==undefined?firebase.firestore.FieldValue.increment(v.__inc):v&&v.__del?firebase.firestore.FieldValue.delete():v}return o}
const clean=o=>JSON.parse(JSON.stringify(o));

/* ops: [{t:'put',c,d}|{t:'patch',c,id,f}|{t:'del',c,id}] */
const DB={
  async run(ops){
    if(!ops.length)return;
    if(MODE==='demo'){for(const o of ops){if(o.t==='put'){const d=clean(o.d);const i=S[o.c].findIndex(x=>x.id===d.id);if(i>=0)S[o.c][i]=d;else S[o.c].push(d)}else if(o.t==='patch'){let d=S[o.c].find(x=>x.id===o.id);if(!d){d={id:o.id};S[o.c].push(d)}applyPatch(d,o.f)}else if(o.t==='del'){S[o.c]=S[o.c].filter(x=>x.id!==o.id)}else if(o.t==='meta'){S[o.k]={...(S[o.k]||{}),...clean(o.d)}}}demoSave();rerender();return}
    if(subLocked()&&!ME?.dev){toast(subMsg());throw new Error('locked')}
    for(let i=0;i<ops.length;i+=400){const b=FB.db.batch();for(const o of ops.slice(i,i+400)){
      if(o.t==='put'){const {id,...d}=clean(o.d);b.set(FB.db.collection(o.c).doc(id),d)}
      else if(o.t==='patch')b.update(FB.db.collection(o.c).doc(o.id),toFs(o.f));
      else if(o.t==='del')b.delete(FB.db.collection(o.c).doc(o.id));
      else if(o.t==='meta')b.set(FB.db.doc('meta/'+o.k),clean(o.d),{merge:true});}
      const p=b.commit();if(navigator.onLine)await Promise.race([p,new Promise(r=>setTimeout(r,2500))]).catch(e=>{toast(fbErr(e));throw e});else p.catch(e=>toast(fbErr(e)))}
  },
  put(c,d){return DB.run([{t:'put',c,d}])},
  patch(c,id,f){return DB.run([{t:'patch',c,id,f}])},
  del(c,id){return DB.run([{t:'del',c,id}])},
  meta(k,d){return DB.run([{t:'meta',k,d}])},
  async range(c,field,from,to){
    if(MODE==='demo')return S[c].filter(x=>(x[field]||'')>=from&&(x[field]||'')<=to+'~');
    const q=await FB.db.collection(c).where(field,'>=',from).where(field,'<=',to+'~').get();
    return q.docs.map(d=>({...d.data(),id:d.id}));
  }
};

  const db=FB.db;
  UNSUB.push(db.doc('meta/settings').onSnapshot(d=>{S.settings={...DEF_SET,...(d.exists?d.data():{})};applyLook();rerender()}));
  UNSUB.push(db.doc('meta/sub').onSnapshot(d=>{S.sub=d.exists?d.data():null;rerender()},()=>{}));
  ['users','items','sups','custs','shorts'].forEach(c=>L(c,db.collection(c)));

  L('exps',db.collection('exps').where('day','>=',SINCE()));
  L('adjs',db.collection('adjs').where('day','>=',SINCE()));

  L('purch',db.collection('purch').where('day','>=',addDays(today(),-370)));
  L('sret',db.collection('sret').where('day','>=',addDays(today(),-370)));
  L('shifts',db.collection('shifts').where('day','>=',SINCE()));
  L('ins',db.collection('ins'));
  L('trf',db.collection('trf').where('day','>=',addDays(today(),-120)));
}

/* ---------- الاشتراك (بيتكتب من لوحة Beam Care) ---------- */
function subState(){const s=S?.sub;if(DEMO||!s||!s.until)return {ok:true};if(s.stop)return {ok:false,lock:true,msg:'السيستم متوقف — كلّم Beam Care'};
  const t=today(),end=addDays(s.until,Number(s.grace||0));
  if(t>end)return {ok:false,lock:s.mode==='full',ro:s.mode!=='full',msg:'الاشتراك انتهى يوم '+dayTxt(s.until)+' — جدّده علشان ترجع تشتغل'};
  if(t>s.until)return {ok:true,warn:'الاشتراك انتهى يوم '+dayTxt(s.until)+' — فاضل '+((new Date(end)-new Date(t))/864e5+1)+' يوم سماح'};
  const left=Math.round((new Date(s.until)-new Date(t))/864e5);if(left<=Number(s.warn??7))return {ok:true,warn:'الاشتراك هيخلص بعد '+left+' يوم ('+dayTxt(s.until)+')'};return {ok:true}}
const subLocked=()=>!subState().ok;
const subMsg=()=>subState().msg||'';
const subOn=k=>DEMO||!S?.sub||S.sub[k]!==false;

/* ================================================================
   الوحدات والتشغيلات
   u = [{n:'علبة',k:1},{n:'شريط',k:3},{n:'قرص',k:10}]  ← k = كام واحدة جوه اللي قبلها
   الكمية دايماً بتتسجل بأصغر وحدة
   ================================================================ */
const unitsOf=it=>it?.u?.length?it.u:[{n:'علبة',k:1}];
const fac=(it,i)=>{const u=unitsOf(it);let f=1;for(let j=i+1;j<u.length;j++)f*=Math.max(1,Number(u[j].k)||1);return f};
const roundUp=(v,st)=>{st=Number(st)||0;if(!st)return r2(v);return r2(Math.ceil((v-1e-9)/st)*st)};
const unitPrice=(it,boxPrice,i)=>i===0?r2(boxPrice):roundUp(boxPrice/fac(it,0)*fac(it,i),S.settings.round);

const SB=()=>S.sales.filter(inBr);
const bBr=(id,m)=>m?.br||(id.startsWith('_neg_')?id.slice(5):'main');
const negId=()=>BR==='main'?'_neg':'_neg_'+BR;
const qtyOf=(it,br)=>r2(batchesOf(it,true,br).reduce((a,b)=>a+(Number(b.q)||0),0));
const boxesOf=it=>r2(qtyOf(it)/fac(it,0));
function qtyTxt(it,base){base=r2(base);if(base===0)return '0';const u=unitsOf(it);const neg=base<0;let q=Math.abs(base);const out=[];for(let i=0;i<u.length;i++){const f=fac(it,i);const n=Math.floor(q/f+1e-9);q=r2(q-n*f);if(n)out.push(n+' '+u[i].n)}if(q>0)out.push(fm(q)+' '+u[u.length-1].n);return (neg?'− ':'')+(out.join(' و ')||'0')}
const curYM=()=>today().slice(0,7);
const isExp=e=>!!e&&e<curYM();
function batchesOf(it,all,br){br=br||BR;const bt=it?.bt||{},bq=it?.bq||{};return Object.keys({...bt,...bq}).map(id=>({id,...(bt[id]||{}),br:bBr(id,bt[id]),q:r2(bq[id]||0)})).filter(b=>(br==='*'||b.br===br)&&(all||b.q!==0)).sort((a,b)=>(a.exp||'9999').localeCompare(b.exp||'9999')||(a.at||'').localeCompare(b.at||''))}
const sellable=it=>batchesOf(it).filter(b=>b.q>0&&!isExp(b.exp));
const sellQty=it=>r2(sellable(it).reduce((a,b)=>a+b.q,0));
const nearExp=(it,m)=>batchesOf(it).filter(b=>b.q>0&&b.exp&&!isExp(b.exp)&&monthsLeft(b.exp)<(m??S.settings.expWarn));
const curPrice=it=>{const b=sellable(it)[0];return r2(b?.price||it.price||0)};
const lastCost=it=>r2(it.cost||0);
/* بيختار من الأقرب انتهاءً الأول، وكل تشغيلة بسعرها المطبوع */
function allocate(it,ui,q,allowNeg){let need=r2(q*fac(it,ui));const out=[];for(const b of sellable(it)){if(need<=0)break;const t=Math.min(b.q,need);out.push({bid:b.id,base:r2(t),bp:r2(b.price||it.price||0),cost:r2((b.cost??it.cost??0)/fac(it,0)),exp:b.exp,no:b.no});need=r2(need-t)}
  if(need>0){if(!allowNeg)return {ok:false,miss:need,out};out.push({bid:negId(),base:need,bp:r2(it.price||0),cost:r2((it.cost||0)/fac(it,0)),neg:true});}
  return {ok:true,out}}

const FORM_OF={'ORAL.SOLID':'أقراص/كبسول','ORAL.LIQUID':'شراب','TOPICAL':'كريم/مرهم','INJECTION':'حقن','EFF':'فوار/أكياس','SPRAY':'بخاخ','RECTAL':'لبوس','EYE':'قطرة عين','EAR':'قطرة أذن','VAGINAL':'مهبلي','MOUTH':'للفم','SOAP':'غسول','UNKNOWN':''};
function unitsGuess(c){const n=String(c.en).toUpperCase();if(c.rt==='ORAL.SOLID'&&c.pk){const s=c.pk%10===0&&c.pk>=20?c.pk/10:c.pk%7===0&&c.pk>=14?c.pk/7:c.pk%6===0&&c.pk>=12?c.pk/6:0;return s>1?[{n:'علبة',k:1},{n:'شريط',k:s},{n:/CAP/.test(n)?'كبسولة':'قرص',k:c.pk/s}]:[{n:'علبة',k:1},{n:/CAP/.test(n)?'كبسولة':'قرص',k:c.pk}]}
  if(/AMP/.test(n)&&c.pk)return [{n:'علبة',k:1},{n:'أمبول',k:c.pk}];if(/SACH/.test(n)&&c.pk)return [{n:'علبة',k:1},{n:'كيس',k:c.pk}];if(/SUPP/.test(n)&&c.pk)return [{n:'علبة',k:1},{n:'لبوسة',k:c.pk}];return [{n:/SYRUP|SUSP|SOL\b|DROPS|ML/.test(n)?'زجاجة':/CREAM|OINT|GEL/.test(n)?'أنبوبة':'علبة',k:1}]}
function itemFromCat(c){return {id:uid(),name:c.en,ar:c.ar,sci:c.sci,co:c.co,cls:c.cls,form:FORM_OF[c.rt]||'',rt:c.rt,price:c.price,cost:r2(c.price*.8),u:unitsGuess(c),bc:[],reorder:S.settings.reorderDef,ck:c.en,bt:{},bq:{},at:new Date().toISOString()}}

function findItems(q,n=30){q=String(q||'').trim();if(!q)return [];const t=norm(q);
  if(/^\d{6,}$/.test(q)){const b=S.items.filter(it=>(it.bc||[]).includes(q));if(b.length)return b}
  const sc=[];for(const it of S.items){if(it.off)continue;const a=norm(it.name),b=norm(it.ar),c=norm(it.sci);let s=0;
    if(a.startsWith(t)||b.startsWith(t))s=3;else if(a.includes(' '+t)||b.includes(' '+t))s=2;else if(a.includes(t)||b.includes(t))s=1.5;else if(c.includes(t))s=1;
    if(s){if(qtyOf(it)>0)s+=.5;sc.push([s,it])}}
  return sc.sort((x,y)=>y[0]-x[0]||x[1].name.localeCompare(y[1].name)).slice(0,n).map(x=>x[1])}

function strength(it){const m=String(it.name||'').match(/(\d+(?:\.\d+)?)\s*(mg|g|gm|mcg|iu|%|ml)?(?![\d\/])/i);if(!m)return null;let v=Number(m[1]);const u=(m[2]||'').toLowerCase();if(u==='g'||u==='gm')v*=1000;if(u==='mcg')v/=1000;return v}

function cartCalc(){const tmp={};let sub=0,ok=true;const out=POS.lines.map(l=>{const it=itemOf(l.iid);if(!it)return {l,gone:true,total:0,parts:[]};
    if(!tmp[it.id])tmp[it.id]={...it,bq:{...(it.bq||{})}};const t=tmp[it.id];const al=allocate(t,l.ui,l.q,S.settings.negSale||can('neg_sale'));
    al.out.forEach(p=>{if(t.bq[p.bid]!=null)t.bq[p.bid]=r2(t.bq[p.bid]-p.base)});
    let total=0;const parts=al.out.map(p=>{const units=r2(p.base/fac(it,l.ui));const up=l.pov!=null?l.pov:unitPrice(it,p.bp,l.ui);total+=units*up;return {...p,units,up}});
    if(!al.ok){ok=false;const up=l.pov!=null?l.pov:unitPrice(it,curPrice(it),l.ui);total+=r2(al.miss/fac(it,l.ui))*up}

ACT.pay=async m=>{if(!POS.lines.length)return;if(!can('pos')){toast('مش معاك صلاحية البيع');return}if(posNeedShift()){ACT.shiftOpen();return}
  const c=cartCalc();if(c.rows.some(r=>r.gone)){POS.lines=POS.lines.filter(l=>itemOf(l.iid));posCart();return}
  if(!c.ok){toast('فيه صنف رصيده مش كفاية — قلّل الكمية أو شيله');return}
  if(c.rows.some(r=>r.it?.ctl)&&!POS.rx){ACT.rxModal(m);return}
  if(POS.dlv&&m==='cash')return finishSale(c,{cash:c.due});
  const cu=POS.cust?byId('custs',POS.cust):null;
  if(m==='credit'){if(!cu){toast('اختار العميل الأول');ACT.posCust();return}if(cu.limit&&r2((cu.bal||0)+c.due)>cu.limit&&!await confirmBox(`حساب ${esc(cu.name)} هيعدّي الحد المسموح (${money(cu.limit)}). تكمّل؟`,'كمّل'))return;return finishSale(c,{credit:c.due})}
  if(m==='card'||m==='wallet')return finishSale(c,{[m]:c.due});
  if(m==='split'){modal({title:'دفع مقسّم — الإجمالي <span class="num">'+money(c.due)+'</span>',body:`<div class="g2"><label class="f">كاش<input name="cash" type="number" step="0.01" min="0" inputmode="decimal"></label><label class="f">فيزا<input name="card" type="number" step="0.01" min="0" inputmode="decimal"></label><label class="f">محفظة<input name="wallet" type="number" step="0.01" min="0" inputmode="decimal"></label>${cu&&can('credit_sale')?`<label class="f">آجل على ${esc(cu.name)}<input name="credit" type="number" step="0.01" min="0" inputmode="decimal"></label>`:''}</div><div class="mut sm" id="sl"></div>`,ok:'تم',after:f=>{const up=()=>{const s=['cash','card','wallet','credit'].reduce((a,k)=>a+(Number(f[k]?.value)||0),0);f.querySelector('#sl').innerHTML=`المدفوع <b class="num">${money(s)}</b> — ${r2(s-c.due)===0?'<b style="color:var(--gr)">مظبوط ✓</b>':`<b style="color:var(--rd)">${s<c.due?'ناقص':'زيادة'} ${money(Math.abs(s-c.due))}</b>`}`};f.oninput=up;up()},onOk:f=>{const p={};['cash','card','wallet','credit'].forEach(k=>{const v=Number(f[k]?.value)||0;if(v)p[k]=r2(v)});const s=r2(Object.values(p).reduce((a,b)=>a+b,0));if(s!==c.due){toast('المبالغ لازم مجموعها يساوي الإجمالي');return false}return finishSale(c,p)}});return}
  modal({title:'دفع كاش',body:`<div class="row" style="justify-content:space-between"><span class="mut">المطلوب</span><b class="num" style="font-size:30px">${money(c.due)}</b></div><label class="f">العميل دفع كام؟<input name="got" type="number" step="0.01" min="0" value="${c.due}" inputmode="decimal" autofocus></label><div class="row wrap" style="gap:6px">${[...new Set([c.due,Math.ceil(c.due/5)*5,Math.ceil(c.due/10)*10,Math.ceil(c.due/50)*50,Math.ceil(c.due/100)*100,200,500].filter(v=>v>=c.due))].slice(0,6).map(v=>`<button type="button" class="chip g" data-v="${v}"><span class="num">${money(v)}</span></button>`).join('')}</div><div class="note ok row" style="font-size:16px"><span>الباقي للعميل</span><span class="sp"></span><b class="num" id="chg" style="font-size:26px">0.00</b></div>`,ok:'تم الدفع ✓ (Enter)',after:f=>{const up=()=>{const g=Number(f.got.value)||0;f.querySelector('#chg').textContent=money(Math.max(0,g-c.due))};f.got.oninput=up;f.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{f.got.value=b.dataset.v;up()});f.got.select();up()},onOk:f=>{const g=r2(Number(f.got.value)||0);if(g<c.due){toast('المبلغ أقل من الإجمالي — لو هيدفع جزء استخدم «دفع مقسّم»');return false}return finishSale(c,{cash:c.due},g)}})};
async function finishSale(c,pay,got){
  const sh=shiftOf(ME.id);const cu=POS.cust?byId('custs',POS.cust):null;const now=new Date().toISOString();
  const lines=[];c.rows.forEach(r=>{r.parts.forEach(p=>lines.push({iid:r.it.id,name:r.it.name,ui:r.l.ui,un:unitsOf(r.it)[r.l.ui].n,q:p.units,p:p.up,bid:p.bid,base:p.base,cost:p.cost,exp:p.exp||'',bno:p.no||''}))});
  /* الخصم بيتوزع على السطور بالنسبة علشان المرتجع يرجع بالسعر الصح */
  if(c.disc){const f=c.disc/c.sub;lines.forEach(l=>l.dp=r2(l.p*f))}
  const sale={id:uid(),br:BR,no:nextNo('s'),type:'sale',at:now,day:today(),by:ME.id,byName:ME.name,shift:sh?.id||'',cust:cu?.id||'',custName:cu?.name||'',lines,sub:c.sub,disc:c.disc,total:c.total,goods:c.goods,fee:c.fee||0,pay:{...pay,...(c.ins?{ins:c.ins}:{})},got:got||0,change:got?r2(got-c.due):0,dev:devCode()};
  if(POS.ins)sale.ins={co:POS.ins.co,name:POS.ins.name,no:POS.ins.no||'',appr:POS.ins.appr||'',pct:POS.ins.pct,amt:c.ins};
  if(POS.dlv)sale.dlv={addr:POS.dlv.addr,phone:POS.dlv.phone,driver:POS.dlv.driver,driverName:POS.dlv.driverName,st:'out',due:pay.cash||0};
  if(POS.rx)sale.rx={...POS.rx};
  const ops=[{t:'put',c:'sales',d:sale}];const per={};lines.forEach(l=>{per[l.iid]=per[l.iid]||{ls:today()};per[l.iid]['bq.'+l.bid]=INC(-l.base)});
  for(const id in per)ops.push({t:'patch',c:'items',id,f:per[id]});
  if(pay.credit&&cu)ops.push({t:'patch',c:'custs',id:cu.id,f:{bal:INC(pay.credit),last:today()}});
  else if(cu)ops.push({t:'patch',c:'custs',id:cu.id,f:{last:today()}});
  if(c.ins)ops.push({t:'patch',c:'ins',id:POS.ins.co,f:{bal:INC(c.ins)}});
  await DB.run(ops);
  if(POS.print)printReceipt(sale);
  const waCu=cu;POS.lines=[];POS.cust='';POS.disc=null;POS.ins=null;POS.dlv=null;POS.rx=null;POS.act=-1;POS.q='';
  toast('اتباعت ✓ فاتورة '+sale.no+(sale.change?' — الباقي '+money(sale.change):''));
  if(VIEW==='pos'){closeModal();render();}
}

   f.querySelectorAll('[data-si]').forEach(el=>el.onchange=()=>{const l=lines[el.dataset.si];l[el.dataset.k]=el.dataset.k==='bid'?el.value:Number(el.value);draw(f)});f.querySelectorAll('[data-sd]').forEach(b=>b.onclick=()=>{lines.splice(b.dataset.sd,1);draw(f)});
   f.querySelector('#srt').textContent=money(lines.reduce((a,l)=>a+l.q*l.cost,0))};
  modal({title:'↩️ مرتجع لموزع',wide:true,body:`<label class="f">الموزع<select name="sup" required><option value="">اختار…</option>${S.sups.map(s=>`<option value="${s.id}" ${s.id===sid?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label><input id="srq" placeholder="ضيف صنف…"><div id="srr" class="col" style="gap:4px"></div><div id="srl" class="col" style="gap:6px"></div><div class="tot" style="font-size:18px;font-weight:800"><span>قيمة المرتجع</span><span class="num" id="srt"></span></div><label class="f">ملاحظة<input name="note" placeholder="مثلاً: قرب ينتهي / تالف"></label><div class="mut sm">قيمة المرتجع بتتخصم من حساب الموزع.</div>`,ok:'سجّل المرتجع',
   after:f=>{draw(f);const q=f.querySelector('#srq'),r=f.querySelector('#srr');q.oninput=()=>{const L=findItems(q.value,6).filter(it=>qtyOf(it)>0);r.innerHTML=L.map(it=>`<button type="button" class="list-it" data-i="${it.id}" style="padding:6px 10px"><span class="en b">${esc(it.name)}</span><span class="sp"></span>${stockChip(it)}</button>`).join('');r.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const it=itemOf(b.dataset.i);const bb=batchesOf(it).filter(x=>x.q>0)[0];lines.push({iid:it.id,bid:bb.id,q:1,cost:r2(bb.cost??it.cost??0)});q.value='';r.innerHTML='';draw(f)})}},
   onOk:async f=>{if(!f.sup.value){toast('اختار الموزع');return false}if(!lines.length)return false;const ops=[];const now=new Date().toISOString();const L=[];
    for(const l of lines){const it=itemOf(l.iid);const b=batchesOf(it).find(x=>x.id===l.bid);const base=r2(l.q*fac(it,0));if(!b||base<=0||base>b.q+1e-6){toast('كمية '+it.name+' أكبر من الموجود');return false}L.push({...l,base,name:it.name,exp:b.exp,bno:b.no||''});ops.push({t:'patch',c:'items',id:l.iid,f:{['bq.'+l.bid]:INC(-base)}})}
    const total=r2(L.reduce((a,l)=>a+l.q*l.cost,0));ops.push({t:'put',c:'sret',d:{id:uid(),br:BR,sup:f.sup.value,lines:L,total,note:f.note.value.trim(),day:today(),at:now,by:ME.id,byName:ME.name}});ops.push({t:'patch',c:'sups',id:f.sup.value,f:{bal:INC(-total)}});
    await DB.run(ops);toast('المرتجع اتسجل ✓ واتخصم من حساب الموزع')}})};

VIEWS.sups={html(){const L=[...S.sups].sort((a,b)=>(b.bal||0)-(a.bal||0));const tot=L.reduce((a,s)=>a+Math.max(0,s.bal||0),0);
  return `<div class="top"><div><h1>الموزعين</h1><div class="sub">إجمالي اللي عليك للموزعين <b class="num">${money(tot)}</b> ج</div></div><span class="sp"></span><button class="btn" data-a="supEdit" data-id="">+ موزع جديد</button></div>
  <div class="card"><div class="tw"><table><thead><tr><th>الموزع</th><th>المندوب</th><th class="hide-m">الخصم المعتاد</th><th>آخر فاتورة</th><th>ليه عندك</th></tr></thead><tbody>${L.map(s=>`<tr class="cl" data-go="sup" data-arg="${s.id}"><td class="b">${esc(s.name)}</td><td>${esc(s.rep||'')} <span class="mut num sm">${esc(s.repPhone||s.phone||'')}</span></td><td class="hide-m">${s.disc?s.disc+'%':''}</td><td class="mut">${s.last?dayTxt(s.last):'—'}</td><td>${(s.bal||0)>0?`<span class="chip a num">${money(s.bal)}</span>`:(s.bal||0)<0?`<span class="chip b">ليك ${money(-s.bal)}</span>`:'<span class="chip">خالص</span>'}</td></tr>`).join('')||'<tr><td colspan="5"><div class="empty"><div class="em">🚚</div><b>ضيف الموزعين اللي بتتعامل معاهم</b>ابن سينا، المتحدة، فارما أوفرسيز…</div></td></tr>'}</tbody></table></div></div>`}};
VIEWS.sup={html(id){const s=byId('sups',id);if(!s)return '<div class="card empty">الموزع مش موجود</div>';const rows=supStatement(s);
  return `<div class="crumb"><button data-go="sups">الموزعين</button></div><div class="card row wrap">${pillI('sups','swap')}<div><h1 style="font-size:23px">${esc(s.name)}</h1><div class="mut">${esc(s.rep||'')} <span class="num">${esc(s.repPhone||'')}</span>${s.phone?' · الشركة <span class="num">'+esc(s.phone)+'</span>':''}${s.disc?' · خصم معتاد '+s.disc+'%':''}</div></div><span class="sp"></span><div style="text-align:left"><div class="k">${(s.bal||0)>=0?'ليه عندك':'ليك عنده'}</div><div class="kv num" style="color:${(s.bal||0)>0?'var(--am)':'inherit'}">${money(Math.abs(s.bal||0))}</div></div>
   <div class="row wrap" style="width:100%;gap:6px">${can('sup_pay')?`<button class="btn" data-a="supPay" data-id="${s.id}">💸 دفع</button>`:''}${can('purch')?`<button class="btn o" data-a="pnFor" data-id="${s.id}">+ فاتورة شرا</button><button class="btn o" data-a="sretNew" data-id="${s.id}">↩️ مرتجع</button>`:''}<button class="btn o" data-a="supEdit" data-id="${s.id}">✏️ تعديل</button></div></div>
  <div class="card"><h3>كشف الحساب</h3><div class="tw"><table style="margin-top:6px"><thead><tr><th>التاريخ</th><th>البيان</th><th>عليك</th><th>دفعت / رجّعت</th><th>الرصيد</th></tr></thead><tbody>${rows.map(r=>`<tr ${r.pid?`class="cl" data-a="purchView" data-id="${r.pid}"`:''}><td class="nowrap">${dayTxt(r.d)}</td><td>${r.t}</td><td class="num">${r.dr?money(r.dr):''}</td><td class="num">${r.cr?money(r.cr):''}</td><td class="num b">${money(r.bal)}</td></tr>`).reverse().join('')||'<tr><td colspan="5"><div class="empty">لسه مفيش حركة</div></td></tr>'}</tbody></table></div><div class="mut xs" style="margin-top:6px">آخر سنة</div></div>`}};
function supStatement(s){const R=[];S.purch.filter(p=>p.sup===s.id).forEach(p=>R.push({d:p.date,at:p.at,t:'فاتورة شرا '+(p.no?'#'+esc(p.no):''),dr:p.total,pid:p.id}));S.pays.filter(p=>p.kind==='sup'&&p.ref===s.id).forEach(p=>R.push({d:p.day,at:p.at,t:'دفع '+(PAYM[p.method]||'')+(p.note?' — '+esc(p.note):''),cr:p.amount}));S.sret.filter(p=>p.sup===s.id).forEach(p=>R.push({d:p.day,at:p.at,t:'مرتجع ('+p.lines.length+' صنف)',cr:p.total}));
  R.sort((a,b)=>(a.at||'').localeCompare(b.at||''));const net=R.reduce((a,r)=>a+(r.dr||0)-(r.cr||0),0);let bal=r2((s.bal||0)-net);R.forEach(r=>{bal=r2(bal+(r.dr||0)-(r.cr||0));r.bal=bal});return R}

  onOk:async f=>{const d={name:f.name.value.trim(),rep:f.rep.value.trim(),repPhone:f.repPhone.value.trim(),phone:f.phone.value.trim(),disc:Number(f.disc.value)||0,notes:f.notes.value.trim()};if(!d.name)return false;if(id){await DB.patch('sups',id,d)}else{const n={id:uid(),...d,bal:r2(f.bal.value||0),at:new Date().toISOString()};await DB.put('sups',n);if(VIEW==='pnew'){PN.sup=n.id;pnSave();render(true)}}toast('اتحفظ ✓')}})};

  modal({title:'دفع لـ '+esc(s.name),body:`<div class="note sm">ليه عندك <b class="num">${money(s.bal||0)}</b></div><div class="g2"><label class="f">المبلغ<input name="a" type="number" step="0.01" min="0" value="${p?r2(p.total-(p.paid||0)):''}" required inputmode="decimal" autofocus></label><label class="f">الطريقة<select name="m">${Object.entries(PAYM).filter(x=>x[0]!=='card').map(([k,t])=>`<option value="${k}">${t}</option>`).join('')}</select></label></div>${sh?'<label class="chk"><input type="checkbox" name="dr"> من درج الكاشير</label>':''}<label class="f">ملاحظة<input name="note"></label>`,ok:'سجّل الدفع',

   <div class="row wrap" style="width:100%;gap:6px">${(c.bal||0)>0?`<button class="btn" data-a="custPay" data-id="${c.id}">💵 استلام فلوس</button>`:''}<button class="btn o" data-a="custSell" data-id="${c.id}">🧾 فاتورة له</button><button class="btn o" data-a="custNew" data-id="${c.id}">✏️ تعديل</button></div></div>
  <div class="g" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)" id="cug"><div class="card"><h3>الفواتير والمدفوعات</h3><div class="tw"><table style="margin-top:6px"><tbody>${[...sales.map(s=>({at:s.at,h:`<td class="nowrap mut sm">${dtTxt(s.at)}</td><td>${s.type==='ret'?'<span class="chip b">مرتجع</span>':'فاتورة'} <span class="num">${esc(s.no)}</span></td><td class="num">${money(s.total)}</td><td>${s.pay?.credit?`<span class="chip a">آجل ${money(s.pay.credit)}</span>`:''}</td>`,id:s.id})),...pays.map(p=>({at:p.at,h:`<td class="nowrap mut sm">${dtTxt(p.at)}</td><td><span class="chip">دفع ${PAYM[p.method]||''}</span></td><td class="num">${money(p.amount)}</td><td></td>`}))].sort((a,b)=>b.at.localeCompare(a.at)).slice(0,60).map(r=>`<tr ${r.id?`class="cl" data-a="saleView" data-id="${r.id}"`:''}>${r.h}</tr>`).join('')||'<tr><td><div class="empty">لسه مفيش</div></td></tr>'}</tbody></table></div></div>
   <div class="col" style="gap:14px"><div class="card"><div class="row"><h3>العلاج الشهري</h3><span class="sp"></span><button class="btn sm o" data-a="chrAdd" data-id="${c.id}">+ علاج شهري</button></div><div class="col" style="gap:6px;margin-top:8px">${(c.chronic||[]).map((x,i)=>{const it=itemOf(x.iid);const d=chronicDue().find(z=>z.c.id===c.id&&z.i===i);return it?`<div class="list-it"><span class="en b ell">${esc(it.name)}</span><span class="mut sm">${fm(x.q||1)} ${esc(unitsOf(it)[x.ui||0]?.n||'')} / ${x.every||30} يوم</span><span class="sp"></span>${d?`<span class="chip ${d.days<0?'r':d.days<=3?'a':'g'}">${d.days<0?'متأخر':'بعد '+d.days+' يوم'}</span>`:''}<button class="ib" data-a="chrDel" data-id="${c.id}|${i}">✕</button></div>`:''}).join('')||'<div class="mut sm">لو بياخد علاج كل شهر ضيفه — والسيستم يفكّرك قبل ما يخلص</div>'}</div>${c.ins?.co?`<div class="note b sm" style="margin-top:8px">🏥 ${esc(byId('ins',c.ins.co)?.name||'')} · كارنيه <span class="num">${esc(c.ins.no||'')}</span></div>`:''}</div>

ACT.custPay=id=>{const c=byId('custs',id);const sh=shiftOf(ME.id);modal({title:'استلام فلوس من '+esc(c.name),body:`<div class="note sm">عليه <b class="num">${money(c.bal||0)}</b></div><div class="g2"><label class="f">المبلغ<input name="a" type="number" step="0.01" min="0" value="${c.bal||''}" required inputmode="decimal" autofocus></label><label class="f">الطريقة<select name="m"><option value="cash">كاش${sh?' (في الدرج)':''}</option><option value="card">فيزا</option><option value="wallet">محفظة</option></select></label></div>`,ok:'سجّل',

let SLF={d:'',q:'',u:''};
VIEWS.sales={

function shiftCash(sh){const sales=S.sales.filter(s=>s.shift===sh.id);let cashIn=0,cashOut=0,card=0,wallet=0,credit=0,n=0;
  sales.forEach(s=>{const p=s.pay||{};if(s.type==='ret'){cashOut+=p.cash||0;card-=p.card||0;wallet-=p.wallet||0}else{n++;cashIn+=p.cash||0;card+=p.card||0;wallet+=p.wallet||0;credit+=p.credit||0}});
  const cp=S.pays.filter(p=>p.shift===sh.id&&p.kind==='cust').reduce((a,p)=>a+p.amount,0);const sp=S.pays.filter(p=>p.shift===sh.id&&p.kind==='sup').reduce((a,p)=>a+p.amount,0);const ex=S.exps.filter(e=>e.shift===sh.id).reduce((a,e)=>a+e.amount,0);
  const expct=r2((sh.open||0)+cashIn-cashOut+cp-sp-ex);return {n,cashIn:r2(cashIn),cashOut:r2(cashOut),card:r2(card),wallet:r2(wallet),credit:r2(credit),cp:r2(cp),sp:r2(sp),ex:r2(ex),expct,net:r2(cashIn-cashOut+card+wallet+credit)}}

const hit=(ings,pat)=>{const re=new RegExp('\\b('+pat+')','i');return ings.some(x=>re.test(x))};
function cartWarn(c){const W=[];const its=c.rows.filter(r=>!r.gone).map(r=>r.it);const cu=POS.cust?byId('custs',POS.cust):null;
  const chronicIts=(cu?.chronic||[]).map(x=>itemOf(x.iid)).filter(it=>it&&!its.some(y=>y.id===it.id));
  const all=[...its.map(it=>({it,mine:false})),...chronicIts.map(it=>({it,mine:true}))];const seen=new Set();
  for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){if(all[i].mine&&all[j].mine)continue;const A=ingr(all[i].it),B=ingr(all[j].it);
   for(const [p,q,lv,t] of IX){if((hit(A,p)&&hit(B,q))||(hit(A,q)&&hit(B,p))){const k=[all[i].it.id,all[j].it.id,t].join();if(seen.has(k))continue;seen.add(k);W.push({lv,t:`<span class="en b">${esc(all[i].it.name)}</span> مع <span class="en b">${esc(all[j].it.name)}</span>${all[i].mine||all[j].mine?' (العميل بياخده شهري)':''}: ${t}`})}}}
  /* نفس المادة الفعالة في صنفين (مثلاً بانادول + كونجستال = باراسيتامول مرتين) */
  const cnt={};its.forEach(it=>new Set(ingr(it)).forEach(g=>{(cnt[g]=cnt[g]||[]).push(it)}));for(const g in cnt)if(cnt[g].length>1&&g.length>3)W.push({lv:'mid',t:`<span class="en">${esc(g)}</span> موجودة في ${cnt[g].length} أصناف في الفاتورة (${cnt[g].map(x=>`<span class="en">${esc(x.name)}</span>`).join('، ')}) — اتأكد من الجرعة`});
  if(cu?.notes&&/حساسي|allerg/i.test(cu.notes))W.push({lv:'mid',t:'العميل عنده ملاحظة حساسية: '+esc(cu.notes)});
  return W}

  return `<div class="top"><div><h1>العلاج الشهري</h1><div class="sub">العملاء اللي بياخدوا علاج كل شهر — السيستم بيفكّرك قبل ما يخلص، وتبعتلهم واتساب بضغطة</div></div></div>

ACT.brAdd=()=>{const mx=Number(S.sub?.maxBranches)||0;if(mx&&BRS().length>=mx){toast('وصلت لعدد الفروع في باقتك ('+mx+') — كلّم Beam Care');return}modal({title:'فرع جديد',body:`<label class="f">اسم الفرع<input name="n" required autofocus></label><label class="f">العنوان<input name="a"></label><label class="f">التليفون<input name="p" dir="ltr"></label>`,onOk:async f=>{const b=[...BRS().map(x=>({...x})),{id:uid(),name:f.n.value.trim(),addr:f.a.value.trim(),phone:f.p.value.trim()}];await DB.meta('settings',{branches:b});toast('الفرع اتضاف ✓')}})};
ACT.brEdit=id=>{const b=BRS().find(x=>x.id===id);modal({title:'تعديل الفرع',body:`<label class="f">اسم الفرع<input name="n" value="${esc(b.name)}" required></label><label class="f">العنوان<input name="a" value="${esc(b.addr||'')}"></label><label class="f">التليفون<input name="p" value="${esc(b.phone||'')}" dir="ltr"></label>`,onOk:async f=>{const L=BRS().map(x=>x.id===id?{...x,name:f.n.value.trim(),addr:f.a.value.trim(),phone:f.p.value.trim()}:{...x});await DB.meta('settings',{branches:L});toast('اتحفظ ✓')}})};
ACT.brSet=id=>{if(ME.br&&ME.br!==id&&!ME.dev&&ME.role!=='owner'){toast('حسابك على فرع واحد بس');return}BR=id;LS.set(brKey(),id);POS.lines=[];closeModal();toast('الجهاز ده بقى على '+brName(id));render()};
ACT.trfNew=iid=>{const it=itemOf(iid);const B=batchesOf(it).filter(b=>b.q>0);if(!B.length){toast('مفيش رصيد في الفرع ده');return}const u=unitsOf(it);
  modal({title:'↔️ تحويل <span class="en">'+esc(it.name)+'</span> لفرع تاني',body:`<div class="g2"><label class="f">لـ<select name="to" required>${BRS().filter(b=>b.id!==BR).map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></label><label class="f">التشغيلة<select name="bid">${B.map(b=>`<option value="${b.id}">${esc(b.no||'—')} · ${expTxt(b.exp)} · ${esc(qtyTxt(it,b.q))}</option>`).join('')}</select></label><label class="f">الكمية<div class="row" style="gap:6px"><input name="q" type="number" min="1" step="1" required inputmode="numeric"><select name="ui" style="width:auto">${unitsOpts(it,0)}</select></div></label></div>`,ok:'حوّل',
   onOk:async f=>{const b=B.find(x=>x.id===f.bid.value);const base=r2(Number(f.q.value)*fac(it,Number(f.ui.value)));if(!(base>0)||base>b.q+1e-6){toast('الكمية أكبر من الموجود');return false}const nb=uid();const meta={...(it.bt?.[b.id]||{}),br:f.to.value,from:b.id,at:new Date().toISOString()};
    await DB.run([{t:'patch',c:'items',id:iid,f:{['bq.'+b.id]:INC(-base),['bt.'+nb]:meta,['bq.'+nb]:INC(base)}},{t:'put',c:'trf',d:{id:uid(),day:today(),at:new Date().toISOString(),by:ME.id,byName:ME.name,from:BR,to:f.to.value,iid,name:it.name,base,bno:b.no||'',exp:b.exp||'',cost:r2(base/fac(it,0)*(b.cost??it.cost??0))}}]);toast('اتحوّل ✓ لـ '+brName(f.to.value))}})};

/* ---------- واتساب الفاتورة ---------- */
ACT.saleWa=id=>{const s=byId('sales',id);const cu=s.cust?byId('custs',s.cust):null;const txt=`${S.settings.name}\nفاتورة ${s.no} — ${dayTxt(s.day)}\n\n`+s.lines.map(l=>`• ${l.name} × ${fm(l.q)} ${l.un} = ${money(l.q*l.p)}`).join('\n')+`\n\nالإجمالي: ${money(s.total)} ج${s.ins?`\nنصيب ${s.ins.name}: ${money(s.ins.amt)}`:''}\n\nشكراً لزيارتكم 🌿`;
  modal({title:'ابعت الفاتورة واتساب',body:`<label class="f">رقم العميل<input name="ph" value="${esc(cu?.phone||s.dlv?.phone||'')}" dir="ltr" inputmode="tel" required></label><textarea name="t" style="min-height:200px;font-size:13px">${esc(txt)}</textarea>`,ok:'افتح واتساب',onOk:f=>{const l=waLink(f.ph.value,f.t.value);if(!l){toast('اكتب الرقم');return false}window.open(l,'_blank','noopener')}})};

/* ---------- ربط المرحلة 2 بالشاشات الموجودة ---------- */
/* الوردية: كاش الدليفري بيدخل الدرج لما الطيار يسلّمه، والتحصيل من شركات التأمين كاش */
const _shc=shiftCash;shiftCash=function(sh){const r=_shc(sh);let adj=0;
  S.sales.forEach(s=>{if(!s.dlv||s.type==='ret')return;const c=s.pay?.cash||0;if(s.shift===sh.id&&!(s.dlv.paid&&s.dlv.ps===sh.id))adj-=c;if(s.dlv.paid&&s.dlv.ps===sh.id&&s.shift!==sh.id)adj+=c});
  const ic=S.pays.filter(p=>p.shift===sh.id&&p.kind==='ins'&&p.method==='cash').reduce((a,p)=>a+p.amount,0);
  r.dlvOut=r2(-Math.min(0,adj));r.cashIn=r2(r.cashIn+adj);r.cp=r2(r.cp+ic);r.expct=r2(r.expct+adj+ic);return r};

boot();
</script>
