<style>
:root{
  --brand:#2F6F68; --brand-d:#1F4E49; --gold:#C98F4E; --gold-l:#DDA86E; --mint:#A9CEC4;
  --bg:#F4F6F5; --card:#fff; --ink:#1E3B38; --muted:#5E7E79; --line:#DCE5E2;
  --red:#B3412F; --red-bg:#FBEDEA; --ok:#2E7D4F; --ok-bg:#E6F4EC; --warn:#8A5A12; --warn-bg:#FCF3E3;
}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,select{font-family:inherit;font-size:15px}
a{color:var(--brand)}
h1,h2,h3{margin:0}
.btn{border:0;border-radius:10px;padding:10px 18px;cursor:pointer;font-weight:700;min-height:44px;background:var(--brand);color:#fff}
.btn:hover{filter:brightness(.92)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.gold{background:var(--gold)}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--line)}
.btn.danger{background:var(--red)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:14px}
input,select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-height:44px}
input:focus,select:focus{outline:2px solid var(--mint);border-color:var(--brand)}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px;color:var(--muted)}
label.chk{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick label{cursor:pointer;position:relative}
.pick input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.pick span{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:14px;color:var(--ink);transition:.12s}
.pick label:hover span{border-color:var(--brand)}
.pick input:checked+span{background:var(--brand);color:#fff;border-color:var(--brand)}
.pick input:checked+span svg{stroke:#fff}
.pick input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}
.pick input:disabled+span{opacity:.55;cursor:default}
.pick input:disabled:checked+span{opacity:1}
.pick.swatch span{width:34px;height:34px;padding:0;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.pick.swatch input:checked+span{border-color:#fff;box-shadow:0 0 0 2.5px var(--ink)}
label.sw{justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}
label.sw input[type=checkbox]{appearance:none;-webkit-appearance:none;order:2;width:46px;height:27px;min-height:0;border-radius:99px;background:#cfd6d4;position:relative;flex:none;cursor:pointer;transition:.15s;margin:0;padding:0;border:0}
label.sw input[type=checkbox]::after{content:'';position:absolute;top:3px;right:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.15s}
label.sw input[type=checkbox]:checked{background:var(--brand)}
label.sw input[type=checkbox]:checked::after{right:22px}
label.sw input[type=checkbox]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
label.chk input{width:20px;height:20px;min-height:0;accent-color:var(--brand)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:900px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}

/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login-card{background:#fff;border-radius:24px;padding:40px 32px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:18px;box-shadow:0 10px 40px rgba(30,59,56,.08)}
.login-brand{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.login-brand h1{font-size:24px;color:var(--brand)}
.login-brand p{margin:0;color:var(--muted);font-size:14px}
.err{background:var(--red-bg);color:var(--red);padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600}

/* shell */
.top{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5;flex-wrap:wrap}
.fcol{display:flex;flex-direction:column;gap:14px}
.top .name{font-weight:800;font-size:18px;color:var(--brand)}
.top .sub{color:var(--muted);font-size:13px}
.top .sp{flex:1}
.layout{display:flex;gap:0;min-height:calc(100vh - 61px)}
.side{width:230px;background:#fff;border-left:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.side button{background:transparent;border:0;text-align:right;padding:10px 14px;border-radius:10px;cursor:pointer;color:var(--ink);font-weight:600;min-height:44px}
.side button:hover{background:var(--bg)}
.side button.on{background:var(--brand);color:#fff}
.side button{display:flex;align-items:center;gap:10px}
.nico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
body.ico-filled .side .nico{fill:currentColor;stroke:var(--card,#fff);stroke-width:1.3}
body.ico-duotone .side .nico{fill:var(--mint);stroke:var(--brand)}
body.ico-circle .side .nico{background:var(--brand);stroke:#fff;border-radius:50%;padding:5px;box-sizing:content-box}
body.ico-square .side .nico{background:var(--soft);stroke:var(--brand);border-radius:8px;padding:5px;box-sizing:content-box}
body.ico-circle .side button.on,body.ico-square .side button.on{background:var(--soft);color:var(--ink)}
body.nav-top .layout{flex-direction:column}
body.nav-top .side{width:auto;flex-direction:row;overflow-x:auto;border-left:0;border-bottom:1px solid var(--line);padding:8px}
body.nav-top .side button{white-space:nowrap}
body.nav-top .side .side-end{margin-top:0;margin-inline-start:auto;border-top:0;padding-top:0;flex-direction:row}
body.nav-rail .side{width:74px;align-items:stretch}
body.nav-rail .side button{justify-content:center;padding:10px 6px}
body.nav-rail .side button span{display:none}
body.nav-rail .side .meta{display:none}
body.lk-dark .card,body.lk-dark .top,body.lk-dark .side,body.lk-dark table,body.lk-dark .modal,body.lk-dark input,body.lk-dark select,body.lk-dark textarea,body.lk-dark .login-card,body.lk-dark .locked .card{background:#1B1B1F;color:var(--ink)}
body.lk-dark .btn,body.lk-dark .side button.on{color:#111}
body.lk-dark .btn.ghost{color:var(--brand);background:transparent}
body.lk-dark .chip.mute{background:#2A2A2E}
body.lk-dark th{color:var(--muted)}
.side .navsec{font-size:11.5px;font-weight:700;color:var(--muted);padding:12px 14px 4px;letter-spacing:.2px}
.side .nico{width:21px;height:21px}
@media (min-width:901px){
  body.nav-mini:not(.nav-top) .side,body.nav-rail .side{width:76px;position:sticky;top:0;align-self:flex-start;height:calc(100vh - 61px);overflow-y:auto;overflow-x:hidden;z-index:30;transition:width .18s ease,margin .18s ease,box-shadow .18s}
  body.nav-mini:not(.nav-top) .side:not(:hover) button,body.nav-rail .side:not(:hover) button{justify-content:center;padding:10px 6px}
  body.nav-mini:not(.nav-top) .side:not(:hover) button span,body.nav-rail .side:not(:hover) button span,body.nav-mini:not(.nav-top) .side:not(:hover) .navsec{display:none}
  body.nav-mini:not(.nav-top) .side:not(:hover) .navsec{display:block;height:1px;padding:0;margin:8px 10px;background:var(--line);font-size:0}
  body.nav-mini:not(.nav-top) .side:hover,body.nav-rail .side:hover{width:250px;margin-left:-174px;box-shadow:-14px 0 34px rgba(20,25,40,.14)}
  body.nav-rail .side:hover button span{display:inline}
  body.nav-rail .side .navsec{display:none}
  body.nav-mini:not(.nav-top) .side button,body.nav-rail .side button{min-height:40px;padding-top:8px;padding-bottom:8px}
  body.nav-mini:not(.nav-top) .side .navsec{padding-top:8px}
  body.nav-rail .side:hover .navsec{display:block}
}
body.nav-top .side .navsec,body.nav-top .side .mini-tg{display:none}
.lg-card{display:inline-flex;align-items:center;justify-content:center;background:#fff;border-radius:14px;box-shadow:0 4px 16px rgba(20,40,40,.10);border:1px solid rgba(0,0,0,.05);flex:none;box-sizing:border-box}
.lg-ico{display:inline-flex;flex:none;box-shadow:0 5px 16px rgba(47,111,104,.28);overflow:hidden}
.mbar{display:none}
.hamb,.dr-head,.drawer-bg{display:none}
.hamb{background:none;border:0;cursor:pointer;color:var(--ink);width:42px;height:42px;border-radius:12px;align-items:center;justify-content:center;flex:none}
.hamb:hover{background:var(--bg)}
@media (max-width:900px){
  .hamb{display:inline-flex}
  body.drawer-open .drawer-bg{display:block;position:fixed;inset:0;background:rgba(15,25,25,.45);z-index:59}
  body.drawer-open .layout .side{display:flex!important;position:fixed;top:0;right:0;bottom:0;width:min(300px,84vw);z-index:60;flex-direction:column;overflow-y:auto;overflow-x:hidden;border-left:1px solid var(--line);border-bottom:0;padding:12px 10px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:-18px 0 40px rgba(0,0,0,.18);background:#fff;animation:drIn .18s ease}
  body.drawer-open .side button{white-space:normal}
  body.drawer-open .side .navsec{display:block}
  body.drawer-open .side .dr-head{display:flex;align-items:center;gap:10px;padding:4px 4px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
  body.drawer-open .side .side-end{margin-top:auto;flex-direction:column;border-top:1px solid var(--line);padding-top:8px}
  body.drawer-open .side .mini-tg{display:none}
}
@keyframes drIn{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
body.lk-dark.drawer-open .layout .side{background:#1B1B1F}
@media (max-width:900px){
  .mbar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;box-shadow:0 -4px 18px rgba(0,0,0,.06)}
  .mbar button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:inherit;font-size:11.5px;color:var(--muted);cursor:pointer;min-height:54px;padding:2px}
  .mbar button.on{color:var(--brand);font-weight:700}
  .mbar button .nico{width:23px;height:23px}
  .mbar .plus .pl{width:50px;height:40px;border-radius:14px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:400;line-height:1;box-shadow:0 4px 12px rgba(0,0,0,.15)}
  body:has(.mbar) .layout .side{display:none}
  body:has(.mbar) .main{padding-bottom:96px}
  body:has(.mbar) .toast{bottom:92px}
}
body.lk-dark .mbar{background:#1B1B1F}
.side .side-end{margin-top:auto;border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:4px}
.side .side-end button.out{color:var(--red)}
.main{flex:1;padding:24px;min-width:0;display:flex;flex-direction:column;gap:20px}
@media(max-width:820px){
  .layout{flex-direction:column}
  .side{width:auto;flex-direction:row;overflow-x:auto;border-left:0;border-bottom:1px solid var(--line);padding:8px}
  .side button{white-space:nowrap}
  .side .navsec,.side .mini-tg{display:none}
  .side .side-end{margin-top:0;margin-inline-start:auto;border-top:0;padding-top:0;flex-direction:row}
  body.nav-rail .side{width:auto;flex-direction:row}
  body.nav-bottom .side{position:fixed;bottom:0;left:0;right:0;z-index:20;justify-content:flex-start;overflow-x:auto;border-bottom:0;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  body.nav-bottom .side button{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px;min-height:52px}
  body.nav-bottom .main{padding-bottom:96px}
  .main{padding:16px}
}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.head h2{font-size:24px;flex:1}
.card{background:#fff;border-radius:16px;padding:20px;border:1px solid var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.clinic-card{display:flex;flex-direction:column;gap:12px}
.clinic-card .row{display:flex;align-items:center;gap:10px}
.clinic-card h3{font-size:18px;flex:1}
.meta{color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:6px 16px}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:700}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.bad{background:var(--red-bg);color:var(--red)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.mute{background:var(--bg);color:var(--muted)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.theme-o{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer;font-size:13px;min-height:44px}
.theme-o:has(input:checked){border-color:var(--brand);background:var(--ok-bg)}
.theme-o input{position:absolute;opacity:0;pointer-events:none}
.theme-o:has(input:focus-visible){outline:3px solid var(--gold);outline-offset:2px}
.theme-o .sw{display:flex;gap:3px;padding:4px;border-radius:8px;border:1px solid var(--line);flex:none}
.theme-o .sw i{width:12px;height:18px;border-radius:4px;display:block}
.tabs{display:flex;gap:6px;border-bottom:1.5px solid var(--line);overflow-x:auto}
.tabs button{background:transparent;border:0;padding:10px 16px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1.5px;white-space:nowrap;min-height:44px}
.tabs button.on{color:var(--brand);border-bottom-color:var(--gold)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{padding:12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-size:13px;font-weight:700;background:#FAFCFB}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:26px;color:var(--brand)}
.stat span{color:var(--muted);font-size:13px}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.bar i.full{background:var(--red)}
.notice{padding:14px 16px;border-radius:12px;font-weight:600}
.notice.warn{background:var(--warn-bg);color:var(--warn)}
.notice.info{background:#EAF3F1;color:var(--brand-d)}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.perms th,.perms td{text-align:center}
.perms td:first-child,.perms th:first-child{text-align:right}
.perms input{width:20px;height:20px;min-height:0;accent-color:var(--brand)}
.linkbox{display:flex;gap:8px}
.linkbox input{direction:ltr;text-align:left;font-size:13px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(20,40,38,.45);display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto;z-index:70}
.modal{background:#fff;border-radius:18px;width:100%;max-width:640px;padding:24px;display:flex;flex-direction:column;gap:16px}
.modal h3{font-size:20px}
.modal .acts{display:flex;gap:10px;justify-content:flex-start;flex-wrap:wrap}
.section-t{font-weight:800;color:var(--brand);font-size:15px;margin-top:4px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;z-index:80}
.loading{display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--muted)}
.locked{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center}
@media print{.top,.side,.btn,#installBtn,.tabs{display:none!important}.main{padding:0}}
.locked .card{max-width:440px;display:flex;flex-direction:column;gap:14px;align-items:center}
</style>
</head>
<body>
<div id="app"><div class="loading">جاري التحميل...</div></div>
<div id="modal"></div>
<button id="installBtn" class="btn gold sm" style="display:none;position:fixed;bottom:16px;left:16px;z-index:15;box-shadow:0 6px 20px rgba(0,0,0,.2)" onclick="A.install()">ثبّت الأبليكيشن على جهازك</button>

<script type="module">
import { initializeApp, deleteApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

/* ========================================================= */
const $app = document.getElementById('app');
const $modal = document.getElementById('modal');
// صفحة الحجز أونلاين لعملاء العيادة: ?book=<id العيادة>
const BOOK_C = new URLSearchParams(location.search).get('book');
const FB_C = (() => { const v = new URLSearchParams(location.search).get('fb') || ''; return /^[A-Za-z0-9_-]{2,60}\.[A-Za-z0-9_-]{6,60}$/.test(v) ? v : ''; })();
const ATT_Q = (() => { const v = new URLSearchParams(location.search).get('att') || ''; return /^[A-Za-z0-9_-]{2,60}\.[A-Za-z0-9_-]{1,60}$/.test(v) ? v : ''; })();

if (firebaseConfig.apiKey.startsWith('PASTE')) {
  $app.innerHTML = `<div class="locked"><div class="card">${ICON(64)}<h2>لسه محتاج إعداد</h2><p>افتح الملف وحط بيانات مشروع Firebase مكان <b>firebaseConfig</b> في أول الكود.</p></div></div>`;
  throw new Error('firebase config missing');
}

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
// الشغل من غير نت: البيانات بتتحفظ على الجهاز وبتترفع لوحدها أول ما النت يرجع
let db;
try { db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
catch (e) { console.warn('offline cache off', e); db = getFirestore(app); }
let NET_OFF = !navigator.onLine;
let OFF_N = 0;
// أي حفظ: لو مفيش نت (أو النت بطيء جداً) بنكمل على طول، والعملية بتترفع لوحدها بعدين
function W(p) {
  let fired = false;

    fired = true; OFF_N++; netBar();

function watchClinicUpd() {
  try { if (UPD_UNSUB) UPD_UNSUB(); } catch (e) {}

  let was = !!S.clinic.upd;
  UPD_UNSUB = onSnapshot(doc(db, 'clinics', id), d => {
    if (!S.clinic || S.clinic.id !== id || S.viewAs) return;
    const x = d.data() || {}; const now = !!x.upd;

    S.clinic = { ...S.clinic, upd: x.upd, updMsg: x.updMsg, updUntil: x.updUntil, look: x.look };

  for (const col of sub) { try { const s = await getDocs(collection(db, 'clinics', c.id, col)); cur[col] = {}; s.docs.forEach(d => { cur[col][d.id] = encTs(d.data()); }); } catch (err) { cur[col] = null; } }
  try { const s = await getDocs(query(collection(db, 'users'), where('clinicId', '==', c.id))); cur.users = {}; s.docs.forEach(d => { cur.users[d.id] = encTs(d.data()); }); } catch (err) { cur.users = null; }
  saveBlob(new Blob([JSON.stringify({ clinic: c.name, date: 'قبل-الاسترجاع-' + todayStr(), cols: cur })], { type: 'application/json' }), `${c.name || c.id}-before-restore-${todayStr()}.json`);
  prog('بيرجّع البيانات…');
  const ops = [];
  for (const col of [...sub, 'users']) {
    if (cur[col] === null || cur[col] === undefined) continue;
    const want = bk.cols[col] || {}, have = cur[col] || {};
    const ref = id => col === 'users' ? doc(db, 'users', id) : doc(db, 'clinics', c.id, col, id);
    for (const [id, x] of Object.entries(want)) if (!have[id] || JSON.stringify(have[id]) !== JSON.stringify(x)) ops.push(['set', ref(id), decTs(x)]);
    if (col !== 'users') for (const id of Object.keys(have)) if (!want[id]) ops.push(['del', ref(id)]);
  }
  for (let i = 0; i < ops.length; i += 400) {
    const b = writeBatch(db);
    ops.slice(i, i + 400).forEach(([k, ref, x]) => { if (k === 'set') b.set(ref, x); else b.delete(ref); });
    await b.commit(); prog(`بيرجّع البيانات… ${Math.min(ops.length, i + 400)} من ${ops.length}`);
  }

}

      catch (err) { cur[col] = null; }
    }
    for (const m of ['settings', 'nav', 'gs', 'counter']) { try { const s = await getDoc(doc(r.db, 'meta', m)); if (s.exists()) curMeta[m] = encTs(s.data()); } catch (err) {} }
    saveBlob(new Blob([JSON.stringify({ company: c.name, date: 'قبل-الاسترجاع-' + todayStr(), cols: cur, meta: curMeta })], { type: 'application/json' }), `${c.name || c.id}-before-restore-${todayStr()}.json`);
    prog('بيرجّع البيانات…');
    const ops = [];

      if (cur[col] === null) continue;

      for (const [id, x] of Object.entries(want)) if (!have[id] || strip(have[id]) !== strip(x)) ops.push(['set', col, id, { ...decTs(x), _u: serverTimestamp() }]);
      if (col !== 'users') for (const id of Object.keys(have)) if (!want[id]) ops.push(['del', col, id]);

    const st = { ...(bk.meta.settings || curMeta.settings || {}) };

    if (curMeta.settings?.announcements) st.announcements = curMeta.settings.announcements;
    ops.push(['set', 'meta', 'settings', decTs(st)]);
    let done = 0;
    for (let i = 0; i < ops.length; i += 400) {
      const b = writeBatch(r.db);
      ops.slice(i, i + 400).forEach(([k, col, id, x]) => { const ref = doc(r.db, col, id); if (k === 'set') b.set(ref, x); else b.delete(ref); });
      await b.commit(); done = Math.min(ops.length, i + 400); prog(`بيرجّع البيانات… ${done} من ${ops.length}`);

      sh.getRange(1,1,1,head.length).setValues([head]).setFontWeight('bold');
      if(rows.length){const vals=rows.map(r=>head.map(h=>r[h]!==undefined?r[h]:''));const start=d.bulk.append?sh.getLastRow()+1:2;sh.getRange(start,1,vals.length,head.length).setValues(vals);}
      return ContentService.createTextOutput('ok');
    }
    (d.ops||[]).forEach(op=>{
      const sh=getSh(op.s);
      let head=sh.getRange(1,1,1,Math.max(1,sh.getLastColumn())).getValues()[0];
      const n=sh.getLastRow()-1;const ids=n>0?sh.getRange(2,1,n,1).getValues().map(r=>String(r[0])):[];
      const ri=ids.indexOf(String(op.id));

      Object.keys(op.row).forEach(k=>{if(head.indexOf(k)<0){head.push(k);sh.getRange(1,head.length).setValue(k).setFontWeight('bold');}});
      const vals=head.map(h=>h==='id'?op.id:(op.row[h]!==undefined?op.row[h]:''));
      if(ri>=0)sh.getRange(ri+2,1,1,vals.length).setValues([vals]);else sh.appendRow(vals);
    });
  }finally{lock.releaseLock();}
  return ContentService.createTextOutput('ok');
}`}

async function loadAlerts(tenants) {
  const L = [];
  const P = t => PRODUCTS[t.product] || PRODUCTS.clinic;
  tenants.forEach(t => {
    if (t.id === MYCO?.tenantId) return;
    const d = daysLeft(t);
    if (t.active === false) L.push({ lv: 'mute', t, msg: 'موقوف' });
    else if (d <= 0) L.push({ lv: 'bad', t, msg: 'الاشتراك خلص', renew: true });
    else if (d <= 7) L.push({ lv: 'warn', t, msg: `الاشتراك هيخلص بعد ${d} يوم`, renew: true });
    if (t.upd) L.push({ lv: 'warn', t, msg: 'السيستم متوقف للتحديث — متنساش ترجّعه' });
  });
  try {
    const g = await ghCfg();
    if (g.token) {
      const idx = await gh('contents/index.json?ref=data', { raw: true, soft: true });
      const j = idx ? await idx.json() : {};
      const look = (ix, prod) => Object.entries(ix || {}).forEach(([id, x]) => {
        const t = tenants.find(y => y.id === id && y.product === prod); if (!t) return;
        if (x.last && !x.last.ok) L.push({ lv: 'bad', t, msg: 'آخر نسخة احتياطية فيها مشكلة', tab: 'backups' });
        else if (x.last?.at && Date.now() - new Date(x.last.at).getTime() > 2.5 * 864e5) L.push({ lv: 'warn', t, msg: 'مفيش نسخة احتياطية من أكتر من يومين', tab: 'backups' });
        const c = x.days?.[0]?.counts || {}, lim = prod === 'maint' ? t.plan?.maxCustomers : t.plan?.maxClients;
        if (lim && c.clients && c.clients >= lim * 0.9) L.push({ lv: 'gold', t, msg: `قرب يوصل لحد الباكدج (${c.clients} من ${lim} عميل) — فرصة تعرض عليه باكدج أكبر` });
      });
      look(j.companies, 'maint'); look(j.clinics, 'clinic');
    }
  } catch (e) { console.error(e); }
  const rank = { bad: 0, warn: 1, gold: 2, mute: 3 };
  return L.sort((a, b) => rank[a.lv] - rank[b.lv]);
}

async function drawQrCard(k) {
  await loadQrLib();

  const [, , title, sub] = JOIN_KINDS.find(x => x[0] === k) || JOIN_KINDS[0];
  const link = joinLink(k);

  new window.QRCode(tmp, { text: link, width: 460, height: 460, colorDark: '#1E3B38', colorLight: '#ffffff', correctLevel: window.QRCode.CorrectLevel.H });
  const qc = tmp.querySelector('canvas');
  try { await document.fonts?.load('800 40px Cairo'); await document.fonts?.load('600 24px Cairo'); } catch (e) {}
  const x = cv.getContext('2d'), W = cv.width, H = cv.height;
  x.fillStyle = '#ffffff'; x.fillRect(0, 0, W, H);
  x.fillStyle = '#2F6F68'; x.fillRect(0, 0, W, 200);
  const star = (cx, cy, r, col) => { x.fillStyle = col; x.beginPath(); const pts = [[0, -1], [.11, -.11], [1, 0], [.11, .11], [0, 1], [-.11, .11], [-1, 0], [-.11, -.11]]; pts.forEach(([a, b], i) => i ? x.lineTo(cx + a * r, cy + b * r) : x.moveTo(cx + a * r, cy + b * r)); x.closePath(); x.fill(); };
  star(W / 2, 62, 34, '#DDA86E');
  x.direction = 'rtl'; x.textAlign = 'center'; x.fillStyle = '#ffffff';
  x.font = '800 40px Cairo, sans-serif'; x.fillText('Beam Care', W / 2, 150);
  x.fillStyle = '#1E3B38'; x.font = '800 38px Cairo, sans-serif'; x.fillText(title, W / 2, 268);
  x.fillStyle = '#5E7E79'; x.font = '600 24px Cairo, sans-serif'; x.fillText(sub, W / 2, 310);
  if (qc) { x.fillStyle = '#F4F6F5'; x.fillRect(W / 2 - 250, 340, 500, 500); x.drawImage(qc, W / 2 - 230, 360, 460, 460); }
  star(W / 2, 590, 30, '#ffffff'); star(W / 2, 590, 22, '#C98F4E');
  x.fillStyle = '#2F6F68'; x.font = '700 26px Cairo, sans-serif'; x.fillText('امسح الكود واختار الباكدج المناسب', W / 2, 888);

}

function lookMini(L) {
  const c = L.c, dark = !!L.dark, card = dark ? '#1B1B1F' : '#fff';
  const ic = (k, on) => {
    const col = on || ['circle', 'square', 'duotone'].includes(L.icons) ? c[0] : c[6];
    const base = `width="16" height="16" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"`;
    if (L.icons === 'filled') return `<svg ${base} fill="${col}" stroke="${card}" stroke-width="1.3">${NAV_ICO[k]}</svg>`;
    if (L.icons === 'duotone') return `<svg ${base} fill="${c[8]}" stroke="${c[0]}" stroke-width="1.8">${NAV_ICO[k]}</svg>`;
    if (L.icons === 'circle') return `<span style="width:24px;height:24px;border-radius:50%;background:${c[0]};display:inline-flex;align-items:center;justify-content:center"><svg ${base} width="14" height="14" fill="none" stroke="#fff" stroke-width="2">${NAV_ICO[k]}</svg></span>`;
    if (L.icons === 'square') return `<span style="width:24px;height:24px;border-radius:7px;background:${c[8]}88;display:inline-flex;align-items:center;justify-content:center"><svg ${base} width="14" height="14" fill="none" stroke="${c[0]}" stroke-width="2">${NAV_ICO[k]}</svg></span>`;
    return `<svg ${base} fill="none" stroke="${col}" stroke-width="1.7">${NAV_ICO[k]}</svg>`;
  };
  const items = ['home', 'bookings', 'clients', 'payments'];
  const stat = (v, l) => `<div style="background:${card};border:1px solid ${c[5]};border-radius:8px;padding:5px 7px"><b style="font-size:13px;color:${c[7]}">${v}</b><div style="font-size:9px;color:${c[6]}">${l}</div></div>`;
  const body = `<div style="flex:1;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0"><b style="font-size:11px;color:${c[7]}">الرئيسية</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:5px">${stat('١٢', 'حجز')}${stat('٨', 'جلسة')}</div><span style="background:${c[0]};color:${dark ? '#111' : '#fff'};font-size:9px;font-weight:700;border-radius:6px;padding:3px 7px;align-self:flex-start">+ حجز جديد</span></div>`;
  let nav;
  if (L.nav === 'side') nav = `<div style="width:84px;background:${card};border-left:1px solid ${c[5]};padding:6px 4px;display:flex;flex-direction:column;gap:3px">${items.map((k, i) => `<div style="display:flex;align-items:center;gap:4px;padding:3px 4px;border-radius:6px;background:${i ? 'transparent' : c[8] + '66'};font-size:9px;color:${i ? c[6] : c[7]};font-weight:${i ? 500 : 700}">${ic(k, !i)}<span>${['الرئيسية', 'الحجوزات', 'العملاء', 'الحسابات'][i]}</span></div>`).join('')}</div>`;
  else if (L.nav === 'rail') nav = `<div style="width:36px;background:${card};border-left:1px solid ${c[5]};padding:6px 4px;display:flex;flex-direction:column;gap:5px;align-items:center">${items.map((k, i) => `<div style="padding:3px;border-radius:6px;background:${i ? 'transparent' : c[8] + '66'}">${ic(k, !i)}</div>`).join('')}</div>`;
  else if (L.nav === 'top') return `<div style="height:134px;background:${c[4]};border-radius:10px;border:1px solid ${c[5]};overflow:hidden;display:flex;flex-direction:column"><div style="background:${card};border-bottom:1px solid ${c[5]};padding:4px 6px;display:flex;gap:6px">${items.map((k, i) => ic(k, !i)).join('')}</div>${body}</div>`;
  else return `<div style="height:134px;background:${c[4]};border-radius:10px;border:1px solid ${c[5]};overflow:hidden;display:flex;flex-direction:column">${body}<div style="background:${card};border-top:1px solid ${c[5]};padding:4px 6px;display:flex;justify-content:space-around">${items.map((k, i) => ic(k, !i)).join('')}</div></div>`;
  return `<div style="height:134px;background:${c[4]};border-radius:10px;border:1px solid ${c[5]};overflow:hidden;display:flex">${nav}${body}</div>`;
}

async function setLook(t, k) {
  const P = PRODUCTS[t.product];
  const L = LOOKS[k];
  const upd = { look: k };
  if (P.remote) Object.assign(upd, { theme: L.pm[0], layout: L.pm[1], icons: L.icons });
  await updateDoc(tdoc(P, t.id), upd);
  if (P.remote) { if (!(await syncRemote(P, t.id))) return false; }
  return true;
}
A.lookAll = async (k, pk) => {
  const P = PRODUCTS[pk];
  if (!confirm(`تنزّل شكل "${LOOKS[k].name}" لكل ${P.short}؟`)) return;
  const ts = (await loadAllTenants()).filter(t => t.product === pk && t.id !== MYCO?.tenantId);
  let bad = 0; toast('بينزّل…');
  for (const t of ts) { try { if (!(await setLook(t, k))) bad++; } catch (e) { console.error(e); bad++; } }
  toast(bad ? `اتنزّل، بس ${bad} مقدرتش أوصلهم` : `اتنزّل لـ ${ts.length} ✓`);
  A.dev('looks');
};
A.lookOneModal = async k => {
  const all = (await loadAllTenants()).filter(t => PRODUCTS[t.product]?.ready);
  openModal(`<h3>نزّل شكل "${esc(LOOKS[k].name)}" لعميل واحد</h3>
  <form onsubmit="A.lookOneSave(event,'${k}')" class="fcol">
    <label class="f">العميل<select name="t">${all.map(t => `<option value="${esc(t.id)}">${esc(t.name)} — ${esc(prodOf(t).short)}</option>`).join('')}</select></label>
    ${formActs('نزّله')}</form>`);
};
A.lookOneSave = async (e, k) => {
  e.preventDefault();
  const id = e.target.t.value, t = (S.tenants || []).find(x => x.id === id);
  busy(e.target.querySelector('[type=submit]'), true, '...');
  try { const ok = await setLook(t, k); A.closeModal(); toast(ok ? 'اتنزّل ✓' : 'اتحفظ، بس مقدرتش أوصل لسيستمهم'); A.dev('looks'); }
  catch (err) { toast(err.message || err.code); }
};

async function loadAllTenants() {

A.planPick = (f, pk, amountOnly) => {

function tenantFields(f, P) {

A.logoPick = async inp => {
  const fl = inp.files?.[0]; if (!fl) return;
  if (!/^image\//.test(fl.type)) return toast('اختار صورة');
  try {
    const url = await new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(fl); });
    const im = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    const max = 360, k = Math.min(1, max / Math.max(im.width, im.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
    cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
    let data = cv.toDataURL('image/png');
    if (data.length > 180000) data = cv.toDataURL('image/webp', 0.9);
    if (data.length > 180000) data = cv.toDataURL('image/jpeg', 0.85);
    const f = inp.closest('form'); f.logo.value = data;
    document.getElementById('logoPrev').innerHTML = logoHTML({ logo: data }, 44);
    toast('تمام — اضغط حفظ علشان اللوجو يتسجل');
  } catch (e) { console.error(e); toast('مقدرتش أقرا الصورة'); }
};

const MAINT_APP = 'https://beamcare.github.io/m/';
A.saveTenant = async (e, pk, id) => {
  e.preventDefault();
  const isNew = !id;
  const f = e.target, P = PRODUCTS[pk], btn = f.querySelector('[type=submit]');
  let data;
  try { data = tenantFields(f, P); } catch (er) { return toast(er.message); }
  busy(btn, true, 'جاري الحفظ...');
  try {
    const batch = writeBatch(db);
    if (id) {
      if (endOfDay(f.ed.value) <= new Date(f.sd.value + 'T00:00:00')) { busy(btn, false, 'حفظ'); return toast('تاريخ النهاية لازم يكون بعد البداية'); }
      data.startAt = Timestamp.fromDate(new Date(f.sd.value + 'T00:00:00'));
      data.expiresAt = Timestamp.fromDate(endOfDay(f.ed.value));
      if (P.remote && !data.url) data.url = MAINT_APP + '?c=' + id;
      batch.update(tdoc(P, id), data);
    } else {
      const ref = doc(tcol(P));
      id = ref.id;
      if (P.remote && !data.url) data.url = MAINT_APP + '?c=' + id;
      const tdays = Number(f.trialDays?.value) || 0;
      const months = tdays ? 0 : (Number(f.months.value) || 1);
      const start = new Date(f.sd.value + 'T00:00:00');
      const end = tdays ? new Date(start.getTime() + (tdays - 1) * 864e5) : addMonths(start, months); end.setHours(23, 59, 59);
      if (tdays) data.trial = true;
      data.startAt = Timestamp.fromDate(start);
      data.expiresAt = Timestamp.fromDate(end);
      data.createdAt = serverTimestamp();
      batch.set(ref, data);
      batch.set(doc(collection(db, 'billing')), billingDoc(P, { id, ...data }, 'new', months, start, end, Number(f.amount.value) || 0, f.method.value, f.note.value.trim()));
    }
    batch.set(doc(db, 'brands', id), brandDoc(P, data));
    await batch.commit();
    if (isNew && S.reqFill?.pk === pk) await reqMarkPaid(id, data, f).catch(er => { console.error(er); toast('اتحفظ، بس مقدرتش أحدّث الطلب: ' + (er.code || er.message)); });
    if (P.remote) { await saveConn(P, id, f); await withTimeout(remoteConn({ ...data, id }, true), 20000, 'timeout').catch(() => {}); await withTimeout(syncRemote(P, id), 25000, 'timeout').catch(() => {}); }
    A.closeModal(); toast('اتحفظ'); A.openTenant(pk, id);
  } catch (err) { console.error(err); busy(btn, false, 'حفظ'); toast('مقدرتش أحفظ: ' + (err.code || err.message)); }
};

async function loadTenant(pk, id) {
  await loadMyCo();
  const P = PRODUCTS[pk];
  if (P.remote) {
    const [t, bl, cs] = await Promise.all([
      getDoc(tdoc(P, id)),
      getDocs(query(collection(db, 'billing'), where('tenantId', '==', id))).catch(() => null),
      getDoc(doc(db, P.col, id, 'meta', 'conn')).catch(() => null),
    ]);
    if (!t.exists()) throw new Error('مش لاقي البيانات دي');
    S.dp = P; S.dc = { ...t.data(), id, product: P.key };
    S.dBilling = bl ? bl.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.date || '').localeCompare(a.date || '')) : [];
    S.dConn = { user: cs && cs.exists() ? cs.data().user || '' : '' };
    await loadRemoteInto(S.dc);
    if (!S.plans) await loadPlans().catch(() => {});
    return;
  }
  const [t, bs, us] = await Promise.all([
    getDoc(tdoc(P, id)),
    getDocs(tcol(P, id, 'branches')),
    getDocs(query(collection(db, 'users'), where(P.userKey, '==', id))),
  ]);
  if (!t.exists()) throw new Error('مش لاقي البيانات دي');
  S.dp = P;
  S.dc = { ...t.data(), id, product: t.data().product || P.key };
  S.dBranches = bs.docs.map(d => ({ id: d.id, ...d.data() }));
  S.dUsers = us.docs.map(d => ({ id: d.id, ...d.data() }));
  const extra = [
    getDocs(query(collection(db, 'billing'), where('tenantId', '==', id))).then(s => { S.dBilling = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.date || '').localeCompare(a.date || '')); }).catch(() => { S.dBilling = []; }),
    getDoc(tdoc(P, id, 'meta', 'counters')).then(c => { S.dClients = c.exists() ? (c.data().clients || 0) : 0; }).catch(() => { S.dClients = 0; }),
  ];
  if (P.key === 'clinic') extra.push(getDocs(tcol(P, id, 'clients')).then(s => { S.dClientList = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar')); }).catch(() => { S.dClientList = []; }));
  await Promise.all(extra);
  if (!S.plans) await loadPlans().catch(() => {});
  // تحديث البيانات القديمة: نوع المنتج على العميل واليوزرات، ودليل الموظفين
  try {
    const batch = writeBatch(db);
    if (!t.data().product) batch.update(tdoc(P, id), { product: P.key });
    S.dUsers.forEach(u => {
      if (u.product !== P.key || u.tenantId !== id) batch.update(doc(db, 'users', u.id), { product: P.key, tenantId: id });
      batch.set(tdoc(P, id, 'staff', u.id), { name: u.name || '', role: u.role, branchIds: u.branchIds || [], active: u.active !== false, prevIds: u.prevIds || [] });
    });
    await batch.commit();
  } catch (e) { console.error('sync', e); }
}
A.openTenant = async (pk, id, tab = 'sub') => {
  devShell('tenant', LOADING);

A.renewCalc = f => {
  const c = S.dc, p = (S.plans || []).find(x => x.id === f.planId.value);
  const months = Number(f.months.value) || 1;
  const from = new Date(Math.max(Date.now(), toDate(c.expiresAt)?.getTime() || 0));
  const to = addMonths(from, months);
  if (p) f.amount.value = Math.round((p.price || 0) * months / (p.months || 1));
  document.getElementById('renewTo').textContent = `الاشتراك هيبقى لحد ${fmt(to)}` + (p && p.id !== c.planId ? ` · الحدود والمميزات هتتغير لباكدج "${p.name}"` : '');
};
A.saveRenew = async e => {
  e.preventDefault();
  const f = e.target, P = S.dp, c = S.dc, btn = f.querySelector('[type=submit]');
  const p = (S.plans || []).find(x => x.id === f.planId.value);
  const months = Number(f.months.value) || 1;
  const from = new Date(Math.max(Date.now(), toDate(c.expiresAt)?.getTime() || 0));
  const to = addMonths(from, months); to.setHours(23, 59, 59);
  const upd = { expiresAt: Timestamp.fromDate(to), active: true, trial: false };
  if (p) {
    upd.planId = p.id; upd.planName = p.name; upd.plan = { ...(c.plan || {}), ...p.limits };
    const feats = { ...(c.features || {}) };
    P.features.forEach(x => { if (x.top) upd[x.key] = !!p.features?.[x.key]; else feats[x.key] = !!p.features?.[x.key]; });
    upd.features = feats;
  } else if (f.planId.value === '' && c.planId) { upd.planId = ''; upd.planName = ''; }
  busy(btn, true, 'جاري التجديد...');
  try {
    const batch = writeBatch(db);
    batch.update(tdoc(P, c.id), upd);
    batch.set(doc(collection(db, 'billing')), billingDoc(P, { ...c, ...upd }, 'renew', months, from, to, Number(f.amount.value) || 0, f.method.value, f.note.value.trim()));
    if (p) batch.set(doc(db, 'brands', c.id), brandDoc(P, { ...c, ...upd }));
    await batch.commit();
    await syncRemote(P, c.id);
    A.closeModal(); toast('اتجدد لحد ' + fmt(to));
    if (S.devView === 'tenant') A.openTenant(P.key, c.id); else A.dev(S.devView || 'home');
  } catch (err) { console.error(err); busy(btn, false, 'تجديد'); toast('مقدرتش أجدد: ' + (err.code || err.message)); }
};

A.saveUser = async (e, id) => {
  e.preventDefault();
  const f = e.target, P = S.dp, c = S.dc, btn = f.querySelector('[type=submit]');
  const role = f.role.value;
  const branchIds = P.roles[role].scope === 'all' ? [] : [...f.querySelectorAll('[name=br]:checked')].map(x => x.value);
  if (P.roles[role].scope !== 'all' && !branchIds.length) return toast('اختار فرع واحد على الأقل');
  const clientId = role === P.linkedRole && f.clientId ? f.clientId.value : '';
  if (role === 'client' && P.linkedRole === 'client' && !clientId) return toast('اختار ملف العميل المربوط بالحساب');
  const wasStaff = id ? !isLinked(P, S.dUsers.find(x => x.id === id)) : false;
  const staffCount = S.dUsers.filter(u => !isLinked(P, u)).length;
  if (role !== P.linkedRole && !wasStaff && staffCount >= (c.plan?.maxUsers ?? 0)) return toast('وصلت لحد اليوزرات في الباكدج');
  const data = { name: f.name.value.trim(), role, branchIds, perms: role === P.linkedRole ? P.rolePerms[role] : readPerms(f, P.modules), active: f.act.checked,
    product: P.key, tenantId: c.id, [P.userKey]: c.id, clientId };
  let newCreds = null;
  busy(btn, true, 'جاري الحفظ...');
  try {
    if (id) {
      await updateDoc(doc(db, 'users', id), data);
    } else {
      const username = f.username.value.trim().toLowerCase();
      const taken = await getDoc(doc(db, 'logins', username)).catch(() => null);
      if (taken?.exists()) throw Object.assign(new Error('taken'), { code: 'auth/email-already-in-use' });
      const email = `${username}@${EMAIL_DOMAIN}`;
      const cred = await createUserWithEmailAndPassword(auth2, email, f.pass.value);
      await signOut(auth2);
      id = cred.user.uid;
      const batch = writeBatch(db);
      batch.set(doc(db, 'users', id), { ...data, username, authEmail: email, prevIds: [], createdAt: serverTimestamp() });
      batch.set(doc(db, 'logins', username), { email });
      await batch.commit();
      newCreds = { name: data.name, username, pass: f.pass.value };
    }
    const prev = S.dUsers.find(x => x.id === id)?.prevIds || [];
    await setDoc(tdoc(P, c.id, 'staff', id), { name: data.name, role: data.role, branchIds: data.branchIds, active: data.active, prevIds: prev });
    A.closeModal(); toast('اتحفظ');
    await A.openTenant(P.key, c.id, 'users');
    if (newCreds) showCreds(newCreds, 'اليوزر اتعمل');
  } catch (err) {
    console.error(err); busy(btn, false, 'حفظ');
    toast(err.code === 'auth/email-already-in-use' ? 'اسم المستخدم ده مستخدم قبل كده' : err.code === 'auth/weak-password' ? 'كلمة السر ضعيفة (6 حروف على الأقل)' : 'مقدرتش أحفظ: ' + (err.code || err.message));
  }
};

function genPw() {
  const a = 'abcdefghjkmnpqrstuvwxyz', d = '23456789';
  let s = '';
  for (let i = 0; i < 6; i++) s += a[Math.floor(Math.random() * a.length)];
  for (let i = 0; i < 3; i++) s += d[Math.floor(Math.random() * d.length)];
  return s;
}

A.resetPw = async (e, id) => {
  e.preventDefault();

  const u = S.dUsers.find(x => x.id === id);
  if (!u.username) return toast('اليوزر ده مالوش اسم مستخدم');
  busy(btn, true, 'جاري التغيير...');

    const cred = await createUserWithEmailAndPassword(auth2, email, f.pass.value);
    await signOut(auth2);
    const nid = cred.user.uid;

    const prevIds = [...(u.prevIds || []), id];

    batch.set(doc(db, 'users', nid), { ...rest, prevIds, authEmail: email, product: P.key, tenantId: c.id, [P.userKey]: c.id });

// مين ميعاد متابعته جه: آخر جلسة لكل عميل في خدمة ليها "كل كام يوم"، ومفيش له حجز جاي
async function followUps() {
  const flat = svcFlat(await loadServices());
  const ev = name => { const x = flat.find(s => s.name === name); return x ? Number(x.every) || 0 : 0; };
  if (!flat.some(x => Number(x.every) > 0)) return [];
  const today = todayStr(), back = d => { const x = new Date(); x.setDate(x.getDate() - d); return toInput(x); };
  const ss = await getDocs(query(ccol('sessions'), where('date', '>=', back(400)))).then(r => r.docs.map(d => d.data())).catch(() => []);
  const last = {};
  ss.forEach(x => { const nm = x.area || x.packageName || ''; const e = ev(nm) || ev(x.packageName || ''); if (!e) return; const parent = flat.find(s => s.name === nm)?.parentName || nm; const k = x.clientId + '|' + parent; if (!last[k] || last[k].date < x.date) last[k] = { clientId: x.clientId, clientName: x.clientName, svc: parent, date: x.date, every: e }; });
  const fut = new Set(await getDocs(query(ccol('bookings'), where('date', '>=', today))).then(r => r.docs.map(d => d.data()).filter(b => b.status !== 'cancelled').map(b => b.clientId)).catch(() => []));
  const sent = (() => { try { return JSON.parse(localStorage.getItem('bc-fu-' + S.clinic.id) || '{}'); } catch (e) { return {}; } })();
  return Object.values(last).map(x => { const due = new Date(x.date + 'T12:00:00'); due.setDate(due.getDate() + x.every); return { ...x, due: toInput(due) }; })
    .filter(x => x.due <= today && x.due >= back(45) && !fut.has(x.clientId) && sent[x.clientId + '|' + x.svc] !== x.date)
    .sort((a, b) => a.due.localeCompare(b.due));
}

A.saveClient = async (e, id) => {
  e.preventDefault();
  const f = e.target, btn = f.querySelector('[type=submit]');
  const data = { name: f.name.value.trim(), phone: f.phone.value.trim(), phone2: f.phone2.value.trim(), gender: f.gender.value, birth: f.birth.value, notes: f.notes.value.trim(), address: f.address.value.trim(),
    status: f.cst?.value || 'active', tag: f.ctag?.value || '', source: f.src?.value || '', lastPower: f.lastPower?.value === '' ? '' : Number(f.lastPower?.value) || 0,
    flags: Object.fromEntries(CL_FLAGS.map(([k]) => [k, !!f['fl_' + k]?.checked])) };
  if (f.pDate && (f.pDate.value || f.pArea.value.trim() || f.pPower.value)) data.prior = { date: f.pDate.value, area: f.pArea.value.trim().slice(0, 60), power: Number(f.pPower.value) || 0, pulses: Number(f.pPulses.value) || 0, ms: Number(f.pMs.value) || 0, note: f.pNote.value.trim().slice(0, 200) };
  if (f.opening) data.openingBalance = Number(f.opening.value) || 0;
  const refC = !id && f.ref?.value.trim() ? findClient(f.ref.value) : null;
  if (!id && f.ref?.value.trim() && !refC) return toast('اختار العميل اللي رشّحه من القايمة، أو سيب الخانة فاضية');
  if (!id && (S.clients || []).some(c => c.phone === data.phone) && !confirm('فيه عميل متسجل بنفس رقم الموبايل. تكمّل برضه؟')) return;
  busy(btn, true, 'جاري الحفظ...');
  try {
    if (id) {
      await updateDoc(cdoc('clients', id), data);
    } else {
      const max = S.clinic.plan?.maxClients ?? 0;
      const ctr = cdoc('meta', 'counters');
      const nref = doc(ccol('clients'));
      if (NET_OFF) {
        // من غير نت: بنزود العدّاد ونسجل العميل في عملية واحدة، وبتترفع لما النت يرجع
        let n = 0; try { const cs = await getDoc(ctr); n = cs.exists() ? (cs.data().clients || 0) : 0; } catch (e) {}
        if (n >= max) throw Object.assign(new Error('limit'), { code: 'limit' });
        const b = writeBatch(db);
        b.set(ctr, { clients: increment(1) }, { merge: true });
        b.set(nref, { ...data, ...(refC ? { referredBy: refC.id } : {}), branchId: S.branch || '', month: todayStr().slice(0, 7), createdAt: serverTimestamp(), createdBy: S.profile.id });
        await b.commit();
      } else await runTransaction(db, async tx => {
        const cs = await tx.get(ctr);
        const n = cs.exists() ? (cs.data().clients || 0) : 0;
        if (n >= max) throw Object.assign(new Error('limit'), { code: 'limit' });
        tx.set(ctr, { clients: n + 1 }, { merge: true });
        tx.set(nref, { ...data, ...(refC ? { referredBy: refC.id } : {}), branchId: S.branch || '', month: todayStr().slice(0, 7), createdAt: serverTimestamp(), createdBy: S.profile.id });
      });
      id = nref.id;
      if (refC && loy().on && loy().referral > 0) await addPoints(refC.id, refC.name, loy().referral, 'ref', 'رشّح ' + data.name).catch(er => console.error(er));
    }
    A.closeModal(); toast('اتحفظ');
    await loadClients(true);
    if (S.clientThenBook) { S.clientThenBook = false; return A.bookingModal({ clientId: id, online: true }); }
    A.openClient(id);
  } catch (err) {
    console.error(err); busy(btn, false, 'حفظ');
    toast(err.code === 'limit' ? 'العيادة وصلت لحد العملاء في الباكدج. كلّم Beam Care' : 'مقدرتش أحفظ: ' + (err.code || err.message));
  }
};

A.saveSession = async (e, bookingId) => {
  e.preventDefault();
  const f = e.target, btn = f.querySelector('[type=submit]');
  const cl = findClient(f.client.value);
  if (!cl) return toast('اختار العميل من القايمة');
  const pkg = (S.mPkgs || []).find(p => p.id === f.pkg.value);
  if (pkg && pLeft(pkg) <= 0) return toast('الباكدج ده خلص');
  const itIdx = pkg?.items?.length ? Number(f.item.value) : -1;
  if (itIdx >= 0 && (pkg.items[itIdx].used || 0) >= pkg.items[itIdx].total) return toast('الخدمة دي خلصت من الباكدج');
  const isPulses = pkg?.unit === 'pulses';
  let deduct = pkg ? 1 : 0;
  if (isPulses) {
    const n = Number(f.shots.value) || 0;
    if (n <= 0) return toast('اكتب عدد النبضات علشان تتخصم من الباكدج');
    deduct = n;
    if (n > pLeft(pkg)) {
      if (!confirm(`النبضات (${n}) أكتر من الفاضل في الباكدج (${pLeft(pkg)}). هيتخصم ${pLeft(pkg)} بس والباكدج هيخلص. تكمّل؟`)) return;
      deduct = pLeft(pkg);
    }
  }
  const dr = allDocs().find(x => x.id === f.doctor.value) || (f.doctor.value === S.profile.id ? { id: S.profile.id, name: S.profile.name } : null);
  const num = v => v === '' ? null : Number(v);
  const data = {
    clientId: cl.id, clientName: cl.name, date: f.date.value, branchId: S.branch,
    doctorId: dr?.id || '', doctorName: dr?.name || '',
    packageId: pkg?.id || '', packageName: pkg?.name || '', sessionNo: pkg && !isPulses ? (pkg.usedSessions || 0) + 1 : null, pulsesDeducted: isPulses ? deduct : null,
    price: pkg ? 0 : (Number(f.price.value) || 0),
    area: f.area.value.trim(),
    deviceId: f.deviceId ? f.deviceId.value : '',
    device: f.deviceId ? ((S.devices || []).find(d => d.id === f.deviceId.value)?.name || '') : f.device.value.trim(),
    month: f.date.value.slice(0, 7),
    fluence: num(f.fluence.value), pulse: num(f.pulse.value), spot: num(f.spot.value), shots: num(f.shots.value),
    notes: f.notes.value.trim(), bookingId: bookingId || '',
    createdAt: serverTimestamp(), createdBy: S.profile.id, createdByName: S.profile.name,
  };
  busy(btn, true, 'جاري الحفظ...');
  try {
    const batch = writeBatch(db);
    const sref = doc(ccol('sessions'));
    batch.set(sref, data);
    if (pkg && itIdx >= 0) batch.update(cdoc('cpackages', pkg.id), { usedSessions: increment(1), items: pkg.items.map((i, k) => k === itIdx ? { ...i, used: (i.used || 0) + 1 } : i) });
    else if (pkg) batch.update(cdoc('cpackages', pkg.id), { usedSessions: increment(deduct) });
    if (data.deviceId && data.shots > 0) batch.update(cdoc('devices', data.deviceId), { shots: increment(data.shots) });
    if (bookingId) batch.update(cdoc('bookings', bookingId), { status: 'done', sessionId: sref.id });
    await batch.commit();
    A.closeModal();
    toast(pkg ? `اتسجلت الجلسة (فاضل ${(pLeft(pkg) - deduct).toLocaleString('ar-EG')} ${unitOf(pkg)} في الباكدج)` : 'اتسجلت الجلسة');
    S.sDate = data.date;
    if (data.fluence) updateDoc(cdoc('clients', cl.id), { lastPower: data.fluence }).catch(() => {});
    afterSave(bookingId ? 'bookings' : 'sessions');
    if (feat('feedback') && cl.phone) setTimeout(() => A.fbAsk(sref.id, cl, data.area || data.packageName || 'الجلسة'), 400);
  } catch (err) { console.error(err); busy(btn, false, 'حفظ الجلسة'); toast('مقدرتش أحفظ: ' + err.code); }
};

  const data = { name: f.name.value.trim(), catId: f.cat.value, kind, unit: kind === 'package' ? f.unit.value : 'sessions', sessions: kind === 'package' ? (Number(f.sessions.value) || 1) : 1, price: Number(f.price.value) || 0, dur: Math.max(5, Math.round(Number(f.dur.value) || 30)), gender: f.gender.value, hidden: f.hidden.checked };

    if (!items.length) return toast('ضيف خدمة واحدة على الأقل جوه الباكدج');
    data.items = items.map(i => ({ svcId: i.svcId, name: i.name, n: Number(i.n) || 1 }));
    data.sessions = data.items.reduce((a, i) => a + i.n, 0);

    data.until = f.until.value || '';
    data.offerOnline = !!f.offerOnline?.checked && !data.hidden;
  }
  if (f.res) data.resId = f.res.value;
  if (f.online) data.online = (kind === 'combo' ? data.offerOnline : f.online.checked) && !data.hidden;
  if (feat('onlineBooking')) data.staffIds = (S.staff || []).filter(s => f['st_' + s.id]?.checked).map(s => s.id);
  if (kind === 'session') {
    data.areas = (S.areaDraft || []).filter(a => String(a.name || '').trim()).slice(0, 40).map(a => ({ id: a.id || Math.random().toString(36).slice(2, 8), name: String(a.name).trim().slice(0, 60), dur: Math.max(5, Math.round(Number(a.dur) || data.dur)), price: a.price === '' || a.price == null ? '' : Number(a.price) || 0 }));

async function renderStaff() {
  const tab = S.stTab || 'list';
  clinicShell('staff', LOADING);
  await loadStaff();
  const emps = (await qAll('employees', 'branchId', S.branch)).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar'));
  S.emps = emps;
  const ed = can('staff_edit');
  let body = '';
  if (tab === 'list') {
    body = emps.length ? `<div class="card tbl-wrap" style="padding:0"><table><thead><tr><th>الاسم</th><th>الوظيفة</th><th>الموبايل</th><th>طريقة الحساب</th><th>عمولة الجلسة</th><th>مربوط بيوزر</th><th>الحالة</th><th></th></tr></thead>
      <tbody>${emps.map(x => `<tr><td><b>${esc(x.name)}</b>${x.isDoctor ? ' <span class="chip ok" style="font-size:11px">دكتور</span>' : ''}</td><td>${esc(x.job)}</td><td dir="ltr" style="text-align:right">${esc(x.phone)}</td><td>${payTxt(x)}</td><td>${[x.perSession ? money(x.perSession) : '', x.pct ? x.pct + '٪' : ''].filter(Boolean).join(' + ') || '—'}</td>
        <td>${esc((S.staff || []).find(s => s.id === x.userId)?.name) || '—'}</td><td>${x.active === false ? '<span class="chip mute">مش شغال</span>' : '<span class="chip ok">شغال</span>'}</td>
        <td>${ed ? `<button class="btn ghost sm" onclick="A.empModal('${x.id}')">تعديل</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`
      : `<div class="card empty">مفيش موظفين مسجلين في الفرع ده.</div>`;
  } else {
    const M = S.prMonth || monthStr();
    const [sess, pr, pun] = await Promise.all([qBranch('sessions', 'month', M).catch(() => []), qBranch('payroll', 'month', M), qBranch('punches', 'month', M).catch(() => [])]);
    S.prCalc = {};
    const rows = emps.filter(x => x.active !== false).map(x => {
      const st = (S.staff || []).find(s => s.id === x.userId);
      const ids = new Set([x.userId, ...(st?.prevIds || []), 'e_' + x.id].filter(Boolean));
      const mine = sess.filter(s => ids.has(s.doctorId));
      const n = mine.length, pulses = mine.reduce((a, s) => a + (Number(s.shots) || 0), 0), rev = mine.reduce((a, s) => a + (Number(s.price) || 0), 0);
      const pp = pun.filter(p => p.uid && p.uid === x.userId);
      const hours = pp.reduce((a, p) => a + (p.in && p.out ? Math.max(0, (tsMs(p.out) - tsMs(p.in)) / 36e5) : 0), 0);
      const days = pp.length || new Set(mine.map(s => s.date)).size;
      const t = x.payType || 'monthly', r = Number(x.rate) || 0;
      const base = t === 'pulse' ? r * pulses : t === 'hour' ? Math.round(r * hours) : t === 'day' ? r * days : t === 'session' ? 0 : (x.salary || 0);
      const comm = Math.round(n * (x.perSession || 0) + rev * (Number(x.pct) || 0) / 100);

A.calcDebts = async () => {
  const box = document.getElementById('debtsBox');
  box.innerHTML = LOADING;
  try {
    const [pk, ss, pay, cls] = await Promise.all([getDocs(ccol('cpackages')), getDocs(ccol('sessions')), getDocs(ccol('payments')), getDocs(ccol('clients'))]);
    const bal = {};
    const add = (id, name, v) => { bal[id] = bal[id] || { name, v: 0 }; bal[id].v += v; };
    cls.forEach(d => { const x = d.data(); if (x.openingBalance) add(d.id, x.name, x.openingBalance); });
    pk.forEach(d => { const x = d.data(); if (!x.imported) add(x.clientId, x.clientName, x.price || 0); });
    ss.forEach(d => { const x = d.data(); if (!x.packageId) add(x.clientId, x.clientName, x.price || 0); });
    pay.forEach(d => { const x = d.data(); add(x.clientId, x.clientName, -(x.amount || 0)); });
    const list = Object.entries(bal).filter(([, b]) => b.v > 0).sort((a, b) => b[1].v - a[1].v);
    const tot = list.reduce((a, [, b]) => a + b.v, 0);
    S.debts = list;
    box.innerHTML = `<div class="head"><h3 style="flex:1">المديونيات (${list.length} عميل · ${money(tot)})</h3>${list.length ? '<button class="btn ghost sm" onclick="A.exportDebts()">تحميل Excel</button>' : ''}</div>

  } catch (e) { console.error(e); box.innerHTML = `<div class="notice warn">مقدرتش أحسب (${esc(e.code || e.message)})</div>`; }
};

let XLSXp = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!XLSXp) XLSXp = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload = () => res(window.XLSX);
    s.onerror = () => { XLSXp = null; rej(new Error('مقدرتش أحمّل مكتبة الإكسل، اتأكد من النت')); };
    document.head.appendChild(s);
  });
  return XLSXp;
}
async function downloadXLSX(fileName, sheetName, rows) {
  try {
    const X = await loadXLSX();
    const ws = X.utils.aoa_to_sheet(rows);
    ws['!cols'] = rows[0].map(() => ({ wch: 18 }));
    const wb = X.utils.book_new();
    wb.Workbook = { Views: [{ RTL: true }] };
    X.utils.book_append_sheet(wb, ws, sheetName);
    X.writeFile(wb, fileName);
  } catch (e) { console.error(e); toast(e.message); }
}

const normTxt = v => String(v ?? '').toLowerCase().replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/[\s_\-:.()]/g, '');
const latinDigits = v => String(v ?? '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
function impNum(v) {
  const s = latinDigits(v).replace(/[,٬\s]/g, '').replace(/[^\d.\-]/g, '');
  if (!s) return null;
  const n = Number(s);
  return isNaN(n) ? null : n;
}
function impPhone(v) {
  let s = latinDigits(v).replace(/[^\d+]/g, '');
  if (s.startsWith('+20')) s = '0' + s.slice(3);
  else if (s.startsWith('0020')) s = '0' + s.slice(4);
  else if (s.length === 12 && s.startsWith('20')) s = '0' + s.slice(2);
  if (s.length === 10 && s.startsWith('1')) s = '0' + s;
  return s;
}
function impDate(v) {
  const s = latinDigits(v).trim();
  if (!s) return '';
  let m = s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if (m) {
    let [, a, b, y] = m;
    if (y.length === 2) y = (Number(y) > 50 ? '19' : '20') + y;
    let d = Number(a), mo = Number(b);
    if (mo > 12 && d <= 12) [d, mo] = [mo, d];
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return '';
    return `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  }
  return '';
}
function impGender(v) {
  const s = normTxt(v);
  if (!s) return 'f';
  if (/(female|انث|ست|سيده|بنت|^f$)/.test(s)) return 'f';
  if (/(male|ذكر|رجل|راجل|^m$|^ذ$)/.test(s)) return 'm';
  return 'f';
}

function impLoadSheet(guess) {
  const I = S.imp;
  const cell = v => v instanceof Date ? `${v.getFullYear()}-${String(v.getMonth() + 1).padStart(2, '0')}-${String(v.getDate()).padStart(2, '0')}` : v;
  const aoa = window.XLSX.utils.sheet_to_json(I.wb.Sheets[I.sheet], { header: 1, raw: true, defval: '', blankrows: false }).map(r => r.map(cell));
  const h = Math.max(1, I.headerRow) - 1;
  I.headers = (aoa[h] || []).map(x => String(x).trim());
  const width = Math.max(I.headers.length, ...aoa.slice(h + 1, h + 50).map(r => r.length));
  while (I.headers.length < width) I.headers.push('');
  I.rows = aoa.slice(h + 1).filter(r => r.some(v => String(v).trim() !== ''));
  if (guess) {
    I.map = {};
    const used = new Set();
    const hn = I.headers.map(normTxt);
    IMP_GUESS.forEach(([k, kws]) => {
      const i = hn.findIndex((x, j) => !used.has(j) && x && kws.some(w => x.includes(w)));
      if (i >= 0) { I.map[k] = i; used.add(i); }
    });
  }
}
A.impSheet = v => { S.imp.sheet = v; S.imp.headerRow = 1; impLoadSheet(true); renderTenant(); };

function impPrepare() {
  const I = S.imp, M = I.map;
  const get = (r, k) => M[k] === undefined ? '' : String(r[M[k]] ?? '').trim();
  const has = k => M[k] !== undefined;
  const seen = new Set((S.dClientList || []).map(c => impPhone(c.phone)).filter(Boolean));
  const brs = S.dBranches.map(b => ({ id: b.id, n: normTxt(b.name) }));
  const out = { records: [], dup: 0, noName: 0, withPkg: 0, debt: 0 };
  I.rows.forEach(r => {
    const name = get(r, 'name');
    if (!name) { out.noName++; return; }
    const phone = impPhone(get(r, 'phone'));
    if (phone) { if (seen.has(phone)) { out.dup++; return; } seen.add(phone); }
    let branchId = I.defBranch;
    const bn = normTxt(get(r, 'branch'));
    if (bn) { const b = brs.find(x => x.n && (bn.includes(x.n) || x.n.includes(bn))); if (b) branchId = b.id; }
    const regDate = impDate(get(r, 'regDate'));
    const c = { name, phone, phone2: impPhone(get(r, 'phone2')), address: get(r, 'address'), gender: impGender(get(r, 'gender')), birth: impDate(get(r, 'birth')), notes: get(r, 'notes'), branchId, regDate, openingBalance: 0 };
    const price = impNum(get(r, 'pkgPrice')), paid = impNum(get(r, 'pkgPaid'));
    if (has('debt')) c.openingBalance = Math.max(0, impNum(get(r, 'debt')) || 0);
    else if (price != null && paid != null) c.openingBalance = Math.max(0, price - paid);
    let total = impNum(get(r, 'pkgTotal')), usedN = impNum(get(r, 'pkgUsed')), left = impNum(get(r, 'pkgLeft'));
    let p = null;
    if ((total || 0) > 0 || (left || 0) > 0) {
      if (!(total > 0)) total = (left || 0) + (usedN || 0);
      let usedV = usedN != null ? usedN : (left != null ? total - left : 0);
      usedV = Math.min(Math.max(0, usedV), total);
      p = { name: get(r, 'pkgName') || I.defPkg || 'باكدج سابق', unit: I.unit, totalSessions: total, usedSessions: usedV, price: price || 0 };
      out.withPkg++;
    }
    out.debt += c.openingBalance;
    out.records.push({ c, p });
  });
  return out;
}

A.impRun = async () => {
  const P = impPrepare();
  const c = S.dc;
  const room = Math.max(0, (c.plan?.maxClients ?? 0) - (S.dClients ?? 0));
  const list = P.records.slice(0, room);
  if (!list.length) return;
  if (!confirm(`هيتسجل ${list.length} عميل في ${c.name}. متأكد؟`)) return;
  const prog = document.getElementById('impProg');
  document.querySelectorAll('#app .acts .btn').forEach(b => b.disabled = true);
  let done = 0;
  try {
    for (let i = 0; i < list.length; i += 200) {
      const batch = writeBatch(db);
      list.slice(i, i + 200).forEach(({ c: cl, p }) => {
        const cref = doc(collection(db, 'clinics', c.id, 'clients'));
        batch.set(cref, { ...cl, month: '', imported: true, createdAt: serverTimestamp(), createdBy: 'import' });
        if (p) batch.set(doc(collection(db, 'clinics', c.id, 'cpackages')), { ...p, clientId: cref.id, clientName: cl.name, branchId: cl.branchId, date: cl.regDate || '', imported: true, notes: 'مستورد من إكسل', createdAt: serverTimestamp(), createdBy: 'import', createdByName: 'استيراد' });
      });
      await batch.commit();
      done = Math.min(list.length, i + 200);
      prog.innerHTML = `<div class="notice info">اتسجل ${done} من ${list.length}...</div>`;
    }
    await setDoc(doc(db, 'clinics', c.id, 'meta', 'counters'), { clients: (S.dClients ?? 0) + list.length }, { merge: true });
    S.imp = null;
    toast(`اتسجل ${list.length} عميل`);
    A.openClinic(c.id, 'import');
  } catch (e) {
    console.error(e);
    if (done) await setDoc(doc(db, 'clinics', c.id, 'meta', 'counters'), { clients: (S.dClients ?? 0) + done }, { merge: true }).catch(() => {});
    prog.innerHTML = `<div class="notice warn">وقف بعد ${done} عميل بسبب مشكلة (${esc(e.code || e.message)}). اللي اتسجل محفوظ.</div>`;
  }
};

async function loadPubCfg(force) {
  if (S.pubCfg && S.pubCfgFor === S.clinic?.id && !force) return S.pubCfg;
  try { const d = await getDoc(cdoc('cfg', 'public')); S.pubCfg = { ...PUB_DEF, ...(d.exists() ? d.data() : {}) }; } catch (e) { S.pubCfg = { ...PUB_DEF }; }
  S.pubCfgFor = S.clinic?.id;
  return S.pubCfg;
}
// شبكة المواعيد لليوم: من الفتح للقفل كل "step" دقيقة
function slotGrid(pub) { const o = toMin(pub.open), c = toMin(pub.close), st = Number(pub.step) || 30, L = []; if (o == null || c == null) return L; for (let m = o; m + st <= c; m += st) L.push(m); return L; }
// فريق العيادة اللي بيتحجز معاه (من الإعدادات): أيام شغله وساعاته وإجازاته
const staffWorks = (s, date, from, to) => {
  const wd = new Date(date + 'T12:00:00').getDay();
  if (s.days && !s.days.includes(wd)) return false;
  if ((s.off || []).includes(date)) return false;
  const a = toMin(s.from) ?? 0, b = toMin(s.to) ?? 24 * 60;
  return from >= a && to <= b;
};
// المواعيد اللي تنفع تبدأ فيها خدمة مدتها dur:
// الجهاز (لو ليه جهاز) لسه فيه مكان + حد من الفريق اللي بيعمل الخدمة فاضي وشغال + مفيش حجز مبدئي في نفس الوقت
// null = اليوم إجازة للعيادة
function availStarts(pub, bz, o) {
  const st = Number(pub.step) || 30, c = toMin(pub.close);
  const need = Math.max(1, Math.ceil((Number(o.dur) || st) / st));
  const wd = new Date(o.date + 'T12:00:00').getDay();
  if ((pub.off || []).includes(wd)) return null;
  const now = new Date(), isToday = o.date === todayStr(), nowM = now.getHours() * 60 + now.getMinutes() + 30;
  const res = o.resId ? (pub.res || []).find(r => r.id === o.resId) : null;
  const R = (bz?.r || {})[o.resId] || {}, SS = bz?.s || {}, H = bz?.h || {}, T = bz?.t || {};
  const useT = !res && !(pub.res || []).length;
  const cap = Math.max(1, Number(pub.cap) || 1);
  const team = o.staffCands ? (pub.staff || []).filter(s => o.staffCands.includes(s.id) && (!o.branchId || !s.branchIds?.length || s.branchIds.includes(o.branchId))) : null;
  const out = [];
  for (const m of slotGrid(pub)) {
    if (isToday && m < nowM) continue;
    if (m + need * st > c) continue;
    const keys = Array.from({ length: need }, (_, i) => fromMin(m + i * st));
    if (keys.some(k => H[k])) continue;
    if (res && keys.some(k => (R[k] || 0) >= Math.max(1, Number(res.count) || 1))) continue;
    if (useT && keys.some(k => (T[k] || 0) >= cap)) continue;
    let who = '';
    if (team) {
      const free = team.find(s => staffWorks(s, o.date, m, m + need * st) && keys.every(k => !(SS[s.id] || {})[k]));
      if (!free) continue;
      who = free.id;
    }
    out.push({ m, staff: who });
  }
  return out;
}
// الفريق اللي يقدر يعمل كل الخدمات اللي العميل اختارها (null = مفيش تحديد، أي حد)
function staffFor(svcs, pub) {
  const lists = svcs.map(x => x.staffIds || []).filter(l => l.length);
  if (!lists.length) return (pub.staff || []).length ? (pub.staff || []).map(s => s.id) : null;
  return lists.reduce((a, l) => a.filter(id => l.includes(id)));
}
// مرة في اليوم: نحسب المواعيد المشغولة لكل الأيام الجاية (علشان الحجوزات اللي اتعملت قبل تشغيل الحجز أونلاين)
async function syncBusyRange(branchId, force) {
  if (!feat('onlineBooking') || !branchId || (!can('bookings_edit') && !can('sessions_edit'))) return;
  const key = 'bc-busy2-' + S.clinic.id + '-' + branchId;
  try { if (!force && localStorage.getItem(key) === todayStr()) return; } catch (e) {}
  try {
    const pub = await loadPubCfg(), today = todayStr();
    const end = (() => { const x = new Date(); x.setDate(x.getDate() + (Number(pub.ahead) || 30)); return toInput(x); })();
    const months = [...new Set([today.slice(0, 7), end.slice(0, 7), (() => { const x = new Date(today + 'T12:00:00'); x.setMonth(x.getMonth() + 1); return toInput(x).slice(0, 7); })()])].filter(m => m <= end.slice(0, 7));
    const lists = await Promise.all(months.map(m => getDocs(query(ccol('bookings'), where('branchId', '==', branchId), where('month', '==', m))).then(s => s.docs.map(d => d.data())).catch(() => [])));
    const dates = [...new Set(lists.flat().map(b => b.date).filter(d => d >= today && d <= end))];
    for (const d of dates) await syncBusy(branchId, d);
    try { localStorage.setItem(key, today); } catch (e) {}
  } catch (e) { console.error(e); }
}
// الريسبشن بيحسب المواعيد المشغولة من الحجوزات الفعلية (بعد أي حجز أو إلغاء أو تعديل):
// t = كل الحجوزات، r = لكل جهاز، s = لكل حد في الفريق، h = حجوزات أونلاين لسه متأكدتش
async function syncBusy(branchId, date) {
  if (!feat('onlineBooking') || !branchId || !/^\d{4}-\d{2}-\d{2}$/.test(date || '')) return;
  if (!can('bookings_edit') && !can('sessions_edit')) return;
  try {
    const pub = await loadPubCfg(), st = Number(pub.step) || 30, o = toMin(pub.open) ?? 0;
    await loadServices();
    const [bs, os] = await Promise.all([
      getDocs(query(ccol('bookings'), where('branchId', '==', branchId), where('date', '==', date))),
      can('bookings_view') ? getDocs(query(ccol('online'), where('status', '==', 'new'))).catch(() => null) : null,
    ]);
    const t = {}, r = {}, s = {}, h = {};
    const add = (obj, k) => { obj[k] = (obj[k] || 0) + 1; };
    const occ = (time, dur, resId, staffId, hold) => {
      let m = toMin(time); if (m == null) return;
      m = m - (((m - o) % st) + st) % st;
      const n = Math.max(1, Math.ceil((Number(dur) || st) / st));
      for (let i = 0; i < n; i++) {
        const k = fromMin(m + i * st);
        add(t, k);
        if (resId) add(r[resId] = r[resId] || {}, k);
        if (staffId) add(s[staffId] = s[staffId] || {}, k);
      }
      if (hold) h[fromMin(m)] = 1;
    };
    const svcOf = name => svcFlat().find(x => x.name === name);
    bs.docs.forEach(d => {
      const b = d.data(); if (!['booked', 'arrived', 'done'].includes(b.status || 'booked')) return;
      const sv = svcOf(b.service);
      occ(b.time, b.dur || sv?.dur, b.resId || sv?.resId || '', b.doctorId || '', false);
    });
    os?.docs.forEach(d => { const q = d.data(); if (q.branchId === branchId && q.date === date && q.time) occ(q.time, q.dur, q.resId || '', q.staffId || '', true); });
    await setDoc(cdoc('busy', branchId + '_' + date), { t, r, s, h, last: '' });
  } catch (e) { console.error(e); }
}

const fillTpl = (t, o) => String(t || '').replace(/\{([^}]+)\}/g, (m, k) => o[k] ?? m);
const dayName = s => { const d = new Date(s + 'T12:00:00'); return isNaN(d) ? s : d.toLocaleDateString('ar-EG', { weekday: 'long', day: 'numeric', month: 'long' }); };
const time12 = t => { if (!t) return ''; const [h, m] = t.split(':').map(Number); const d = new Date(2000, 0, 1, h, m || 0); return d.toLocaleTimeString('ar-EG', { hour: 'numeric', minute: '2-digit' }); };

function renderCSettingsKeep() {

  if (f) [...f.elements].forEach(el => { if (el.name) keep[el.name] = el.type === 'checkbox' ? el.checked : el.value; });
  const y = window.scrollY;
  renderCSettings().then(() => { const g = document.querySelector('.main form'); if (g) Object.entries(keep).forEach(([k, v]) => { const el = g.elements[k]; if (!el || el.length) return; if (el.type === 'checkbox') el.checked = v; else el.value = v; }); window.scrollTo(0, y); });
}

  function foot() {
    if (P.step === 5) return wa ? `<p class="meta" style="justify-content:center;margin:0">محتاج مساعدة؟ <a href="${wa}" target="_blank" rel="noopener">كلّمنا على الواتساب</a></p>` : '';
    if (P.step === 2) return `${P.picked.length ? `<div style="display:flex;gap:6px;flex-wrap:wrap;max-height:76px;overflow-y:auto">${sel().map(x => `<span style="display:inline-flex;align-items:center;gap:4px;background:var(--ok-bg);color:var(--brand);border-radius:99px;padding:4px 6px 4px 10px;font-size:13px;font-weight:600">${esc(x.name)}<button type="button" aria-label="شيل ${esc(x.name)}" onclick="BK.pick('${x.id}',false)" style="border:0;background:transparent;color:inherit;cursor:pointer;font-size:15px;line-height:1;padding:0 2px">×</button></span>`).join('')}</div><div style="display:flex;justify-content:space-between;font-size:14px"><span>${n(P.picked.length)} ${P.picked.length === 1 ? 'خدمة' : 'خدمات'} · ${n(totDur())} دقيقة</span>${pub.showPrice ? `<b>${money(totPrice())}</b>` : ''}</div>` : wa ? `<p class="meta" style="justify-content:center;margin:0">محتاج مساعدة؟ <a href="${wa}" target="_blank" rel="noopener">كلّمنا على الواتساب</a></p>` : ''}${btn('كمّل واختار الميعاد ←', 'BK.go(3)', !P.picked.length && !P.offer)}`;
    if (P.step === 3) return btn(P.time ? `${esc(dayName(P.date))} · ${esc(time12(P.time))} ← التالي` : 'اختار ميعاد', 'BK.go(4)', !P.time);
    return btn('احجز الميعاد', 'BK.submit()', false);
  }
  function draw() {
    $app.innerHTML = `<div style="max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)">${head()}
      <main style="flex:1;padding:16px 18px;display:flex;flex-direction:column;gap:14px">${body()}</main>
      <footer style="position:sticky;bottom:0;padding:12px 18px calc(16px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px">${foot()}</footer></div>`;
  }
  try { history.replaceState({ bk: 2 }, ''); } catch (e) {}
  window.onpopstate = e => { if (P.step === 5) return; const st = e.state?.bk || 2; if (st === 3) return BK.go(3, true); P.step = st; if (st === 2 && groups.length > 1) P.cat = e.state?.cat ? groups.find(g => g.id === e.state.cat) || null : null; draw(); window.scrollTo(0, 0); };
  window.BK = {
    back: () => { if (P.step > 2 && P.step < 5) history.back(); },
    jump: k => { if (k === P.step) return; if (k < P.step) { history.go(k - P.step); return; } BK.go(k); },
    cat: id => { P.cat = groups.find(g => g.id === id) || P.cat; try { history.pushState({ bk: 2, cat: id }, ''); } catch (e) {} draw(); window.scrollTo(0, 0); },
    cats: () => { if (history.state?.cat) history.back(); else { P.cat = null; draw(); } },

    pick: (id, on) => { P.picked = on ? [...new Set([...P.picked, id])] : P.picked.filter(x => x !== id); draw(); },
    go: (s, fromPop) => { if (!fromPop && s > P.step) { try { history.pushState({ bk: s }, ''); } catch (e) {} } P.step = s; if (s === 3) { P.time = ''; if (P.staff && !(team() || []).some(x => x.id === P.staff)) P.staff = ''; return loadSlots(); } draw(); window.scrollTo(0, 0); },

    time: (t, who) => { P.time = t; P.who = who; draw(); },
    f: (k, v) => { P[k] = v; },

      const err = m => { const e = document.getElementById('bkErr'); if (e) e.innerHTML = `<div class="err" role="alert">${m}</div>`; };
      const name = P.name.trim(), phone = latinDigits(P.phone).replace(/[^\d+]/g, '');
      if (name.length < 2) return err('اكتب اسمك');
      if (!/^[+]?[0-9]{8,15}$/.test(phone)) return err('اكتب رقم موبايل صحيح');
      if (document.getElementById('bkHp')?.value) { P.step = 5; return draw(); }
      if (Date.now() - t0 < 4000) return err('ثانية واحدة… راجع بياناتك ودوس تاني.');
      let sent = []; try { sent = JSON.parse(localStorage.getItem('bc-bk-' + cid) || '[]').filter(t => Date.now() - t < 864e5); } catch (x) {}
      if (sent.length >= 3) return err('بعت طلبات كتير النهارده. لو محتاج حاجة كلّمنا على الواتساب.');
      const svList = sel(), staffId = P.staff || P.who || '';
      const st = (pub.staff || []).find(s => s.id === staffId);
      const data = { name, phone, date: P.date, time: P.time, status: 'new', createdAt: serverTimestamp(), service: svList.map(x => x.name).join(' + ').slice(0, 240), dur: Math.min(600, Math.round(totDur())) };
      const resId = svList.find(x => x.resId)?.resId; if (resId) data.resId = resId;
      if (staffId) { data.staffId = staffId; if (P.staff && st) data.staffName = String(st.name || '').slice(0, 80); }
      if (P.br) { data.branchId = P.br.id; data.branchName = P.br.name; }
      if (svList.some(x => x.gender === 'f' || x.gender === 'm')) data.gender = P.gender;
      const extra = [P.offer ? 'عرض: ' + P.offer.name : '', P.want ? 'عايز يعرف تفاصيل عرض: ' + P.want : ''].filter(Boolean).join(' · ');
      const nt = [extra, P.notes.trim()].filter(Boolean).join(' — ');
      if (nt) data.notes = nt.slice(0, 500);
      if (!svList.length && P.offer) data.service = ('عرض: ' + P.offer.name).slice(0, 240);
      const b = document.querySelector('footer .btn'); busy(b, true, 'بيتحجز...');
      try {
        const bt = writeBatch(db);
        bt.set(doc(collection(db, 'clinics', cid, 'online')), data);
        bt.set(busyRef(), { h: { [P.time]: 1 }, last: P.time }, { merge: true });
        await bt.commit();
        try { localStorage.setItem('bc-bk-' + cid, JSON.stringify([...sent, Date.now()])); } catch (x) {}
        P.phone = phone; P.step = 5; draw(); window.scrollTo(0, 0);
      } catch (x) {
        console.error(x); busy(b, false, 'احجز الميعاد');
        if (x.code === 'permission-denied') { P.step = 3; P.time = ''; await loadSlots(); const e = document.querySelector('main'); if (e) e.insertAdjacentHTML('afterbegin', '<div class="err" role="alert">الميعاد ده لسه اتحجز حالاً 🙏 اختار ميعاد تاني.</div>'); }
        else err('مقدرناش نبعت الطلب — جرّب تاني بعد شوية.');
      }
    },
  };
  if (!groups.length && !offers.length) { $app.innerHTML = `<div class="locked"><div class="card">${logoHTML(B, 64)}<h2>${esc(B.name)}</h2><p>الحجز أونلاين لسه بيتجهز.${wa ? ` <a href="${wa}" target="_blank" rel="noopener">كلّمنا على الواتساب</a>.` : ''}</p></div></div>`; return; }
  draw();
}

async function campAudience(C) {
  let L = (S.clients || []).filter(c => c.phone);
  if (C.gender !== 'all') L = L.filter(c => (c.gender || 'f') === C.gender);
  if (C.branch) L = L.filter(c => c.branchId === C.branch);
  if (C.bday) { const m = todayStr().slice(5, 7); L = L.filter(c => (c.birth || '').slice(5, 7) === m); }
  if (C.cat || C.away) {
    if (!S.campSess) { try { S.campSess = (await getDocs(ccol('sessions'))).docs.map(d => d.data()); } catch (e) { S.campSess = []; } }
    if (C.cat) {
      const names = new Set((S.services || []).filter(x => x.catId === C.cat).map(x => x.name));
      const ids = new Set(S.campSess.filter(x => names.has(x.area) || [...names].some(n => (x.area || '').includes(n))).map(x => x.clientId));
      L = L.filter(c => ids.has(c.id));
    }
    if (C.away) {
      const last = {}; S.campSess.forEach(x => { if (!last[x.clientId] || x.date > last[x.clientId]) last[x.clientId] = x.date; });
      const lim = (() => { const d = new Date(); d.setDate(d.getDate() - C.away); return toInput(d); })();
      L = L.filter(c => last[c.id] && last[c.id] < lim);
    }
  }
  if (C.noPkg) {
    if (!S.campPk) { try { S.campPk = (await getDocs(ccol('cpackages'))).docs.map(d => d.data()); } catch (e) { S.campPk = []; } }
    const act = new Set(S.campPk.filter(p => pLeft(p) > 0).map(p => p.clientId));
    L = L.filter(c => !act.has(c.id));
  }
  return L.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar'));
}
