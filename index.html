A.campSend = async id => {
  const c = (S.campList || []).find(x => x.id === id); if (!c) return;
  const cv = document.getElementById('offerCv');
  // نحاول ننسخ الصورة علشان تتلزق في المحادثة
  try {
    const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    if (blob && navigator.clipboard && window.ClipboardItem) await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
    toast('الصورة اتنسخت — اعمل لصق في المحادثة قبل ما تبعت');
  } catch (e) { toast('نزّل الصورة وابعتها مع الرسالة'); }
  window.open(`https://wa.me/${waNum(c.phone)}?text=${encodeURIComponent(campMsg(c))}`, '_blank', 'noopener');
  const key = 'bc-camp-' + S.clinic.id + '-' + S.camp.offerId;
  try { const s = JSON.parse(localStorage.getItem(key) || '{}'); s[id] = Date.now(); localStorage.setItem(key, JSON.stringify(s)); } catch (e) {}
  const el = document.getElementById('cs_' + id); if (el) el.innerHTML = '<span class="chip ok">اتبعت ✓</span>';
};
A.campDownload = () => { const cv = document.getElementById('offerCv'); if (!cv) return; try { const a = document.createElement('a'); a.download = 'offer.png'; a.href = cv.toDataURL('image/png'); a.click(); } catch (e) { toast('مقدرتش أنزّل الصورة'); } };
A.campShare = async () => {
  const cv = document.getElementById('offerCv'); if (!cv) return;
  try {
    const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    const file = new File([blob], 'offer.png', { type: 'image/png' });
    await navigator.share({ files: [file], text: campMsg({ name: '' }).replace(/^أهلاً\s*🌸?\n?/, '') });
  } catch (e) { if (e?.name !== 'AbortError') toast('المشاركة مش متاحة هنا — نزّل الصورة'); }
};
// رسم صورة العرض (١٠٨٠×١٠٨٠) بلوجو العيادة وألوانها
async function drawOffer(cv, o, styleKey, upload) {
  if (!cv) return;
  const x = cv.getContext('2d'), W = cv.width, H = cv.height;
  const loadImg = (src, cors) => new Promise((res, rej) => { const im = new Image(); if (cors) im.crossOrigin = 'anonymous'; im.onload = () => res(im); im.onerror = rej; im.src = src; });
  if (upload) { try { const im = await loadImg(upload); const s = Math.max(W / im.width, H / im.height); x.drawImage(im, (W - im.width * s) / 2, (H - im.height * s) / 2, im.width * s, im.height * s); } catch (e) {} return; }
  try { await document.fonts?.load('800 60px Cairo'); await document.fonts?.load('700 30px Cairo'); } catch (e) {}
  const st = OFFER_STYLES[styleKey] || OFFER_STYLES.brand;
  const css = getComputedStyle(document.body);
  const brand = css.getPropertyValue('--brand').trim() || '#2F6F68', gold = css.getPropertyValue('--gold-l').trim() || '#DDA86E';
  const bg = st.bg || brand, acc = st.acc || (styleKey === 'white' ? brand : gold), ink = st.ink, sub = st.sub;
  const b = brandOf(S.clinic);
  x.fillStyle = bg; x.fillRect(0, 0, W, H);
  // زخرفة هادية
  x.globalAlpha = .08; x.fillStyle = acc; x.beginPath(); x.arc(W - 40, 120, 300, 0, Math.PI * 2); x.fill(); x.beginPath(); x.arc(80, H - 260, 220, 0, Math.PI * 2); x.fill(); x.globalAlpha = 1;
  x.direction = 'rtl'; x.textAlign = 'right';
  // اللوجو والاسم
  const lx = W - 80 - 96, ly = 70;
  let logoOk = false;
  if (b.logo) { try { const im = await loadImg(b.logo, true); x.save(); x.beginPath(); x.roundRect ? x.roundRect(lx, ly, 96, 96, 22) : x.rect(lx, ly, 96, 96); x.clip(); x.fillStyle = '#fff'; x.fillRect(lx, ly, 96, 96); const s = Math.min(96 / im.width, 96 / im.height); x.drawImage(im, lx + (96 - im.width * s) / 2, ly + (96 - im.height * s) / 2, im.width * s, im.height * s); x.restore(); x.getImageData(0, 0, 1, 1); logoOk = true; } catch (e) { logoOk = false; } }
  if (!logoOk) { x.fillStyle = styleKey === 'white' ? brand : '#ffffff'; x.beginPath(); x.roundRect ? x.roundRect(lx, ly, 96, 96, 22) : x.rect(lx, ly, 96, 96); x.fill(); x.fillStyle = styleKey === 'white' ? '#fff' : brand; x.textAlign = 'center'; x.font = '800 40px Cairo, sans-serif'; x.fillText((b.name || '').trim().split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase(), lx + 48, ly + 62); x.textAlign = 'right'; }
  x.fillStyle = ink; x.font = '800 40px Cairo, sans-serif'; x.fillText(b.name, lx - 24, ly + 62);
  // شارة
  x.fillStyle = acc; x.beginPath(); x.roundRect ? x.roundRect(80, ly + 22, 220, 56, 28) : x.rect(80, ly + 22, 220, 56); x.fill();
  x.fillStyle = styleKey === 'lux' || styleKey === 'brand' ? '#1E1B18' : '#ffffff'; x.textAlign = 'center'; x.font = '800 28px Cairo, sans-serif'; x.fillText(o?.until ? 'عرض لفترة محدودة' : 'عرض خاص', 190, ly + 60); x.textAlign = 'right';
  if (!o) return;
  // اسم العرض (سطرين بالكتير)
  const wrap = (t, maxW, font) => { x.font = font; const ws = String(t).split(/\s+/), L = []; let cur = ''; ws.forEach(w => { const tr = cur ? cur + ' ' + w : w; if (x.measureText(tr).width > maxW && cur) { L.push(cur); cur = w; } else cur = tr; }); if (cur) L.push(cur); return L; };
  x.fillStyle = sub; x.font = '700 34px Cairo, sans-serif'; x.fillText(o.kind === 'combo' ? 'باكدج مجمّع' : o.kind === 'package' ? 'باكدج' : 'جلسة', W - 80, 300);
  const tl = wrap(o.name, W - 160, '800 92px Cairo, sans-serif').slice(0, 2);
  x.fillStyle = acc; x.font = '800 92px Cairo, sans-serif'; tl.forEach((l, i) => x.fillText(l, W - 80, 400 + i * 104));
  let y = 400 + tl.length * 104 + 20;
  const items = o.kind === 'combo' ? (o.items || []).map(i => `${Number(i.n) > 1 ? Number(i.n).toLocaleString('ar-EG') + ' جلسة ' : ''}${i.name}`) : o.kind === 'package' ? [`${Number(o.sessions).toLocaleString('ar-EG')} ${unitOf(o)}`] : [];
  x.font = '700 44px Cairo, sans-serif';
  items.slice(0, 5).forEach(t => { x.fillStyle = acc; x.beginPath(); x.arc(W - 92, y - 14, 10, 0, Math.PI * 2); x.fill(); x.fillStyle = ink; x.fillText(t, W - 120, y); y += 66; });
  // السعر
  const bandY = H - 230;
  x.fillStyle = st.band; x.fillRect(0, bandY, W, 230);
  const orig = o.kind === 'combo' ? (o.items || []).reduce((a, i) => a + (Number((S.services || []).find(s => s.id === i.svcId)?.price) || 0) * (Number(i.n) || 1), 0) : 0;
  x.textAlign = 'right';
  if (orig > o.price) { x.fillStyle = sub; x.font = '700 40px Cairo, sans-serif'; const t = money(orig); x.fillText(t, W - 80, bandY + 76); const w = x.measureText(t).width; x.strokeStyle = sub; x.lineWidth = 4; x.beginPath(); x.moveTo(W - 80, bandY + 62); x.lineTo(W - 80 - w, bandY + 62); x.stroke(); }
  x.fillStyle = ink; x.font = '800 96px Cairo, sans-serif'; x.fillText(money(o.price), W - 80, bandY + 178);
  x.textAlign = 'left'; x.fillStyle = sub; x.font = '700 32px Cairo, sans-serif';
  if (o.until) { x.fillText('صالح لحد', 80, bandY + 100); x.fillStyle = ink; x.font = '800 38px Cairo, sans-serif'; x.fillText(dayName(o.until), 80, bandY + 150); }
  else { x.fillText('احجز دلوقتي', 80, bandY + 100); if (S.pubCfg?.wa) { x.direction = 'ltr'; x.fillStyle = ink; x.font = '800 38px Cairo, sans-serif'; x.fillText(S.pubCfg.wa, 80, bandY + 150); x.direction = 'rtl'; } }
}
