<style>
:root{
  --brand:#163A6B; --brand-d:#0E2747; --gold:#B98A35; --gold-l:#D7AE57; --mint:#BFD0EA;
  --bg:#F3F5F9; --card:#fff; --ink:#13233D; --muted:#5D6B82; --line:#DCE2EC;
  --red:#B3412F; --red-bg:#FBEDEA; --ok:#2E7D4F; --ok-bg:#E6F4EC; --warn:#8A5A12; --warn-bg:#FCF3E3;
}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,select{font-family:inherit;font-size:15px}
a{color:var(--brand)}
h1,h2,h3{margin:0}
.btn{border:0;border-radius:10px;padding:10px 18px;cursor:pointer;font-weight:700;min-height:44px;background:var(--brand);color:#fff}
.btn:hover{filter:brightness(.92)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.gold{background:var(--gold)}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--line)}
.btn.danger{background:var(--red)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:14px}
input,select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-height:44px}
input:focus,select:focus{outline:2px solid var(--mint);border-color:var(--brand)}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px;color:var(--muted)}
label.chk{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick label{cursor:pointer;position:relative}
.pick input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.pick span{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:14px;color:var(--ink);transition:.12s}
.pick label:hover span{border-color:var(--brand)}
.pick input:checked+span{background:var(--brand);color:#fff;border-color:var(--brand)}
.pick input:checked+span svg{stroke:#fff}
.pick input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}
.pick input:disabled+span{opacity:.55;cursor:default}
.pick input:disabled:checked+span{opacity:1}
.pick.swatch span{width:34px;height:34px;padding:0;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.pick.swatch input:checked+span{border-color:#fff;box-shadow:0 0 0 2.5px var(--ink)}
label.sw{justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}
label.sw input[type=checkbox]{appearance:none;-webkit-appearance:none;order:2;width:46px;height:27px;min-height:0;border-radius:99px;background:#CDD4DF;position:relative;flex:none;cursor:pointer;transition:.15s;margin:0;padding:0;border:0}
label.sw input[type=checkbox]::after{content:'';position:absolute;top:3px;right:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.15s}
label.sw input[type=checkbox]:checked{background:var(--brand)}
label.sw input[type=checkbox]:checked::after{right:22px}
label.sw input[type=checkbox]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
label.chk input{width:20px;height:20px;min-height:0;accent-color:var(--brand)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}

function letterPng(b, size) {
  const cv = document.createElement('canvas'); cv.width = cv.height = size; const g = cv.getContext('2d');
  g.fillStyle = b.color || '#163A6B'; g.fillRect(0, 0, size, size);
  g.fillStyle = '#ffffff'; g.font = `bold ${Math.round(size * 0.46)}px Cairo, Arial, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(String(b.name).trim().replace(/^(عيادة|عيادات|مركز)\s+/, '').replace(/^ال(?=\S{2})/, '').slice(0, 1).toUpperCase(), size / 2, size / 2 + size * 0.03);
  return cv.toDataURL('image/png');
}
async function logoPng(url, size) {
  const im = await new Promise((ok, no) => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => ok(i); i.onerror = no; i.src = url; });
  const cv = document.createElement('canvas'); cv.width = cv.height = size; const g = cv.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, size, size);
  const pad = size * 0.14, box = size - pad * 2, k = Math.min(box / im.width, box / im.height);
  g.drawImage(im, (size - im.width * k) / 2, (size - im.height * k) / 2, im.width * k, im.height * k);
  return cv.toDataURL('image/png');
}

A.login = async e => {
  e.preventDefault();
  const f = e.target, btn = f.querySelector('button');
  const u = f.u.value.trim();
  busy(btn, true, 'جاري الدخول...');
  let email = u.includes('@') ? u : `${u.toLowerCase()}@${EMAIL_DOMAIN}`;
  if (!u.includes('@')) {
    try { const l = await getDoc(doc(db, 'logins', u.toLowerCase())); if (l.exists() && l.data().email) email = l.data().email; } catch {}
  }
  try { await signInWithEmailAndPassword(auth, email, f.p.value); }
  catch (err) {
    console.error(err);
    const code = err.code || err.message || '';
    const msg = code.includes('api-key') ? 'مشكلة في إعدادات الربط (API key)'
      : code.includes('unauthorized-domain') ? 'هذا النطاق غير مضاف في Firebase'
      : code.includes('too-many-requests') ? 'محاولات كثيرة، انتظر قليلًا ثم حاول مرة أخرى'
      : code.includes('network') ? 'لا يوجد اتصال بالإنترنت'
      : 'اسم المستخدم أو كلمة المرور غير صحيحة';
    busy(btn, false, 'دخول');
    renderLogin(`${msg} (${code})`);
  }
};

  S = { user: u };
  $app.innerHTML = `<div class="loading">جاري التحميل...</div>`;
  try {
    const dev = await getDoc(doc(db, 'devs', u.uid));
    if (dev.exists()) {
      const dd = dev.data();
      if (dd.active === false) { await signOut(auth); return renderLogin('هذا الحساب موقوف — تواصل مع صاحب الشركة'); }
      S.isDev = true; S.dev = dd; try { localStorage.setItem('bc-dev-device', '1'); localStorage.removeItem('bc-brand-last'); } catch (e) {} applyBrand(null); return A.devHome();
    }
    const p = await getDoc(doc(db, 'users', u.uid));
    if (!p.exists() || p.data().active === false) { await signOut(auth); return renderLogin('هذا الحساب موقوف أو غير موجود'); }
    S.profile = { id: u.uid, ...p.data() };
    const c = await getDoc(doc(db, 'clinics', S.profile.clinicId));
    S.clinic = { id: c.id, ...c.data() };
    applyBrand(S.clinic); bcPing(); setTimeout(bcBeat, 3000); bcPushUrl();
    if (!clinicActive(S.clinic)) return renderLocked();
    applyLook(S.clinic.look); lookAnnounce(S.clinic.look || '');
    watchClinicUpd();
    if (S.clinic.upd) return renderUpdate();
    const bs = await getDocs(collection(db, 'clinics', S.clinic.id, 'branches'));
    S.branches = bs.docs.map(x => ({ id: x.id, ...x.data() }));
    initBranch();
    await loadCfg().catch(() => {});
    A.go('home');
  } catch (e) {
    console.error(e);
    await signOut(auth);
    renderLogin('حدثت مشكلة في التحميل، حاول مرة أخرى');
  }
});

let UPD_UNSUB = null;
function watchClinicUpd() {
  try { if (UPD_UNSUB) UPD_UNSUB(); } catch (e) {}
  const id = S.clinic?.id; if (!id) return;
  let was = !!S.clinic.upd;
  UPD_UNSUB = onSnapshot(doc(db, 'clinics', id), d => {
    if (!S.clinic || S.clinic.id !== id || S.viewAs) return;
    const x = d.data() || {}; const now = !!x.upd;
    const lookChanged = (x.look || '') !== (S.clinic.look || '');
    S.clinic = { ...S.clinic, upd: x.upd, updMsg: x.updMsg, updUntil: x.updUntil, look: x.look };
    if (lookChanged && !now) { applyLook(x.look); lookAnnounce(x.look || ''); if (S.view) A.go(S.view); }
    if (now && !was) renderUpdate();
    else if (!now && was) location.reload();
    else if (now) renderUpdate();
    was = now;
  }, () => {});
}

function parseFbCfg(text) {
  const o = {};
  ['apiKey', 'authDomain', 'projectId', 'storageBucket', 'messagingSenderId', 'appId'].forEach(k => {
    const m = String(text || '').match(new RegExp(k + '["\']?\\s*:\\s*["\']([^"\']+)["\']'));
    if (m) o[k] = m[1];
  });
  return o.apiKey && o.projectId ? o : null;
}

function remoteFieldsRead(f, data) {
  data.url = f.url.value.trim();
  const fb = parseFbCfg(f.fb.value);
  if (f.fb.value.trim() && !fb) throw new Error('بيانات Firebase غير صحيحة — الصق firebaseConfig كاملة كما هي');
  data.fb = fb || null;
  data.grace = Math.max(0, Number(f.grace.value) || 0);
  data.warn = Math.max(0, Number(f.warn.value) || 0);
  data.mode = f.mode.value;
  data.renewPhone = f.rphone.value.trim();
  data.theme = f.querySelector('[name=theme]:checked')?.value || '';
  data.layout = f.layout?.value || '';
  data.mods = {};
  PIONEER_PARTS.forEach(([k]) => { if (!f['part_' + k].checked) data.mods[k] = false; });

const REM = {};

const withTimeout = (p, ms, msg) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(msg)), ms))]);
async function remoteConn(t, fresh) {
  if (REM[t.id] && !fresh) return REM[t.id];
  if (REM[t.id]) { try { await deleteApp(REM[t.id].app); } catch (e) {} delete REM[t.id]; }
  if (!t.fb?.apiKey) throw new Error('لا توجد بيانات بعد Firebase لهذه الشركة — أضفها من "تعديل البيانات والباقة"');
  const cs = await getDoc(doc(db, PRODUCTS.maint.col, t.id, 'meta', 'conn'));
  const conn = cs.exists() ? cs.data() : {};
  if (!conn.user || !conn.pass) throw new Error('لم يُضف اسم مستخدم وكلمة مرور المطوّر بعد — أضفهما من "تعديل البيانات والباقة"');
  const old = getApps().find(a => a.name === 'co_' + t.id);
  if (old) { try { await deleteApp(old); } catch (e) {} }
  const app = initializeApp(t.fb, 'co_' + t.id);
  const rauth = getAuth(app), rdb = getFirestore(app);
  const email = conn.user.includes('@') ? conn.user : conn.user.trim().toLowerCase() + '@' + (t.emailDomain || PIONEER_DOMAIN);
  try { await withTimeout(signInWithEmailAndPassword(rauth, email, conn.pass), 15000, 'timeout'); }
  catch (e) {
    try { await deleteApp(app); } catch (x) {}
    if (e.message === 'timeout') throw new Error('نظام الشركة لا يستجيب (تأخر أكثر من اللازم). إذا كانت الشركة جديدة: افتح رابط النظام وأنشئ أول حساب بنفس اسم مستخدم وكلمة مرور المطوّر.');
    throw new Error('تعذّر الدخول إلى نظام الشركة بحساب المطوّر — راجع اسم المستخدم وكلمة المرور. وإذا كانت الشركة جديدة: افتح رابط النظام وأنشئ أول حساب بنفس اسم المستخدم وكلمة المرور (' + (e.code || e.message) + ')');
  }
  REM[t.id] = { app, auth: rauth, db: rdb };
  return REM[t.id];
}
function subDocOf(t) {
  const until = toInput(t.expiresAt);
  const grace = t.trial ? 0 : Number(t.grace ?? 3);
  const lock = new Date(until + 'T00:00:00'); lock.setDate(lock.getDate() + grace + 1);
  return {
    on: true, until, grace, warn: Number(t.warn ?? 7), mode: t.trial ? 'full' : (t.mode || 'read'), stop: t.active === false, trial: !!t.trial,
    maxUsers: Number(t.plan?.maxUsers) || 0, maxClients: Number(t.plan?.maxCustomers) || 0,
    mods: t.mods || {}, whiteLabel: !!t.whiteLabel, ownerPerms: !!t.features?.ownerManagesPerms, webReq: !!t.features?.webReq,
    contact: t.renewPhone || '', vendor: 'Beam Care', product: PRODUCTS.maint.name, planName: t.planName || '',
    upd: !!t.upd, updMsg: t.updMsg || '', updUntil: t.updUntil || '', theme: t.theme || '', layout: t.layout || '', icons: t.icons || '', look: t.look || '', lookName: (typeof LOOKS !== 'undefined' && LOOKS[t.look]?.name) || '',
    lockAt: Timestamp.fromDate(lock), updatedAt: new Date().toISOString(), by: 'panel', tid: t.id,
  };
}
async function pushRemoteSub(t) {
  const r = await remoteConn(t);
  await setDoc(doc(r.db, 'meta', 'sub'), subDocOf(t));
  // لو الميزة اتقفلت: صفحة طلب الخدمة بتاعة الشركة تتقفل كمان
  if (!t.features?.webReq) await setDoc(doc(r.db, 'meta', 'webreq'), { on: false }, { merge: true }).catch(() => {});
}
// بعد أي حفظ أو تجديد أو إيقاف: الاشتراك يتكتب جوه سيستم الشركة
async function syncRemote(P, id) {
  if (!P.remote) return true;
  try {
    const d = await getDoc(tdoc(P, id));
    await pushRemoteSub({ ...d.data(), id });
    return true;
  } catch (e) {
    console.error(e);
    toast('تم الحفظ في اللوحة، لكن تعذّر الوصول إلى نظام الشركة: ' + (e.message || e.code));
    return false;
  }
}
async function saveConn(P, id, f) {
  if (!P.remote) return;
  const user = f.duser.value.trim(), pass = f.dpass.value;
  if (!user && !pass) return;
  const ref = doc(db, P.col, id, 'meta', 'conn');
  const cur = (await getDoc(ref)).data() || {};
  await setDoc(ref, { user: user || cur.user || '', pass: pass || cur.pass || '' });
}
async function loadRemoteInto(t) {
  S.dRemoteErr = ''; S.dUsers = []; S.dBranches = []; S.dClients = null; S.dRemoteSub = null;
  try {
    const r = await remoteConn(t);
    const [us, sec, cl, sub] = await withTimeout(Promise.all([
      getDocs(collection(r.db, 'users')),
      getDocs(collection(r.db, 'secrets')).catch(() => null),
      getDocs(collection(r.db, 'clients')),
      getDoc(doc(r.db, 'meta', 'sub')).catch(() => null),
    ]), 20000, 'نظام الشركة لا يستجيب الآن — حاول مرة أخرى بعد قليل');

    S.dClients = cl.size;
    S.dRemoteSub = sub?.exists() ? sub.data() : null;
  } catch (e) { console.error(e); S.dRemoteErr = e.message || e.code || 'مشكلة'; }
}

async function updSet(ts, on, msg, until, pk = 'maint') {
  const P = PRODUCTS[pk]; let bad = 0;
  for (const t of ts) {
    try { await updateDoc(tdoc(P, t.id), { upd: on, updMsg: on ? msg : '', updUntil: on ? until : '' }); if (P.remote && !(await syncRemote(P, t.id))) bad++; }
    catch (e) { console.error(e); bad++; }
  }
  return bad;
}

// ادخل السيستم: بيفتح سيستم الشركة ويدخل بحساب المطوّر لوحده (البيانات بتتبعت للصفحة مباشرة، مش في الرابط)
A.enterSys = async (go, cred) => {
  const c = S.dc;
  if (!c?.url) return toast('أضف رابط نظام الشركة أولًا من "تعديل البيانات والباقة"');
  let url, origin;
  try { url = c.url.replace(/#.*$/, ''); origin = new URL(url).origin; } catch (e) { return toast('رابط نظام الشركة غير صحيح'); }
  const w = window.open(url + '#bc-login', '_blank');
  if (!w) return toast('منع المتصفح فتح صفحة جديدة — اسمح بالنوافذ المنبثقة للوحة');
  let conn = cred || {};
  if (!cred) { try { const cs = await getDoc(doc(db, PRODUCTS.maint.col, c.id, 'meta', 'conn')); conn = cs.exists() ? cs.data() : {}; } catch (e) {} }
  if (!conn.user || !conn.pass) return toast('لا يوجد حساب مطوّر مسجل لهذه الشركة');
  const email = conn.user.includes('@') ? conn.user : conn.user.trim().toLowerCase() + '@' + (c.emailDomain || PIONEER_DOMAIN);
  const h = e => {
    if (e.source !== w || e.origin !== origin || e.data?.type !== 'pm-ready') return;
    w.postMessage({ type: 'bc-login', email, pass: conn.pass, go: go || '' }, origin);
    window.removeEventListener('message', h);
  };
  window.addEventListener('message', h);

async function bkRestoreClinic(c, date, prog) {
  prog('جارٍ تحميل النسخة من GitHub…');
  const bk = await bkLoadDay(bkDir(c), date);
  if (bk.cols.cmeta) { bk.cols.meta = bk.cols.cmeta; delete bk.cols.cmeta; }
  prog('جارٍ أخذ نسخة من الوضع الحالي…');
  const sub = [...new Set([...Object.keys(bk.cols).filter(x => x !== 'users'), ...CLINIC_BK_COLS])];
  const cur = {};
  for (const col of sub) { try { const s = await getDocs(collection(db, 'clinics', c.id, col)); cur[col] = {}; s.docs.forEach(d => { cur[col][d.id] = encTs(d.data()); }); } catch (err) { cur[col] = null; } }
  try { const s = await getDocs(query(collection(db, 'users'), where('clinicId', '==', c.id))); cur.users = {}; s.docs.forEach(d => { cur.users[d.id] = encTs(d.data()); }); } catch (err) { cur.users = null; }
  saveBlob(new Blob([JSON.stringify({ clinic: c.name, date: 'قبل-الاسترجاع-' + todayStr(), cols: cur })], { type: 'application/json' }), `${c.name || c.id}-before-restore-${todayStr()}.json`);
  prog('جارٍ استرجاع البيانات…');
  const ops = [];
  for (const col of [...sub, 'users']) {
    if (cur[col] === null || cur[col] === undefined) continue;
    const want = bk.cols[col] || {}, have = cur[col] || {};
    const ref = id => col === 'users' ? doc(db, 'users', id) : doc(db, 'clinics', c.id, col, id);
    for (const [id, x] of Object.entries(want)) if (!have[id] || JSON.stringify(have[id]) !== JSON.stringify(x)) ops.push(['set', ref(id), decTs(x)]);
    if (col !== 'users') for (const id of Object.keys(have)) if (!want[id]) ops.push(['del', ref(id)]);
  }
  for (let i = 0; i < ops.length; i += 400) {
    const b = writeBatch(db);
    ops.slice(i, i + 400).forEach(([k, ref, x]) => { if (k === 'set') b.set(ref, x); else b.delete(ref); });
    await b.commit(); prog(`جارٍ استرجاع البيانات… ${Math.min(ops.length, i + 400)} من ${ops.length}`);
  }
  return ops.length;
}
const CLINIC_BK_COLS = ['branches', 'staff', 'meta', 'clients', 'services', 'bookings', 'sessions', 'cpackages', 'payments', 'expenses', 'items', 'stockMoves', 'devices', 'deviceLogs', 'employees', 'payroll'];
A.bkRestore = async (e, date) => {
  e.preventDefault();
  const f = e.target; if (f.ok.value.trim() !== 'استرجع') { toast('اكتب كلمة استرجع'); return; }
  const btn = f.querySelector('[type=submit]'); busy(btn, true, 'جارٍ...');
  const prog = t => { const p = document.getElementById('rsProg'); if (p) p.textContent = t; };
  const c = S.dc;
  if (isClinicT()) {
    try { const n = await bkRestoreClinic(c, date, prog); A.closeModal(); toast(`تم استرجاع نسخة ${date} ✓ (${n} تغيير)`); }
    catch (err) { console.error(err); busy(btn, false, 'استرجع'); prog(''); toast('توقف الاسترجاع: ' + (err.message || err.code)); }
    return;
  }
  try {
    prog('جارٍ تحميل النسخة من GitHub…');
    const bk = await bkLoadDay(bkDir(c), date);
    const r = await remoteConn(c);
    prog('جارٍ أخذ نسخة من الوضع الحالي…');
    const cols = [...new Set([...Object.keys(bk.cols), ...BK_ALL_COLS])].filter(x => !RESTORE_SKIP.includes(x));
    const cur = {}, curMeta = {};
    for (const col of cols) {
      try { const s = await getDocs(collection(r.db, col)); cur[col] = {}; s.docs.forEach(d => { cur[col][d.id] = encTs(d.data()); }); }
      catch (err) { cur[col] = null; }
    }
    for (const m of ['settings', 'nav', 'gs', 'counter']) { try { const s = await getDoc(doc(r.db, 'meta', m)); if (s.exists()) curMeta[m] = encTs(s.data()); } catch (err) {} }
    saveBlob(new Blob([JSON.stringify({ company: c.name, date: 'قبل-الاسترجاع-' + todayStr(), cols: cur, meta: curMeta })], { type: 'application/json' }), `${c.name || c.id}-before-restore-${todayStr()}.json`);
    prog('جارٍ استرجاع البيانات…');
    const ops = [];
    for (const col of cols) {
      if (cur[col] === null) continue;
      const want = bk.cols[col] || {}, have = cur[col] || {};
      const strip = o => { const { _u, ...rest } = o || {}; return JSON.stringify(rest); };
      for (const [id, x] of Object.entries(want)) if (!have[id] || strip(have[id]) !== strip(x)) ops.push(['set', col, id, { ...decTs(x), _u: serverTimestamp() }]);
      if (col !== 'users') for (const id of Object.keys(have)) if (!want[id]) ops.push(['del', col, id]);
    }
    for (const m of ['nav', 'gs', 'counter']) if (bk.meta[m]) ops.push(['set', 'meta', m, decTs(bk.meta[m])]);
    const st = { ...(bk.meta.settings || curMeta.settings || {}) };
    st.dsEpoch = Math.max(Number(curMeta.settings?.dsEpoch || 0), Number(st.dsEpoch || 0)) + 1;
    if (curMeta.settings?.announcements) st.announcements = curMeta.settings.announcements;
    ops.push(['set', 'meta', 'settings', decTs(st)]);
    let done = 0;
    for (let i = 0; i < ops.length; i += 400) {
      const b = writeBatch(r.db);
      ops.slice(i, i + 400).forEach(([k, col, id, x]) => { const ref = doc(r.db, col, id); if (k === 'set') b.set(ref, x); else b.delete(ref); });
      await b.commit(); done = Math.min(ops.length, i + 400); prog(`جارٍ استرجاع البيانات… ${done} من ${ops.length}`);
    }
    A.closeModal();
    toast(`تم استرجاع نسخة ${date} ✓ (${ops.length} تغيير) — ستحمّل جميع الأجهزة البيانات من جديد تلقائيًا`);
  } catch (err) {
    console.error(err); busy(btn, false, 'استرجع'); prog('');
    toast('توقف الاسترجاع: ' + (err.message || err.code));
  }
};

const PM_GS_COLS = {clients:'العيادات',reports:'تقارير الصيانة',contracts:'عقود الصيانة',partSales:'فواتير البيع',payments:'التحصيلات',orders:'طلبات المستهلكات',requests:'طلبات الصيانة',parts:'المخزن',purchases:'المشتريات',suppliers:'الموردون',supplierPayments:'دفعات الموردين',treasury:'الخزينة',vouchers:'أذونات الصرف',sales:'بيع الأجهزة',rentals:'الإيجارات',stockDevices:'أجهزة الشركة',freon:'الفريون',frret:'مرتجعات الفريون',custody:'العهد والمصاريف',hr:'الإجازات والطلبات',punches:'البصمات',payroll:'الرواتب',users:'الموظفون'};
const PM_GS_DEF = ['clients', 'reports', 'contracts', 'partSales', 'payments', 'orders', 'parts', 'purchases', 'suppliers', 'treasury'];
function gsAppsCode(token, brand){return `// ${String(brand || '').replace(/[`$\\]/g,'')} → Google Sheet (الصق هذا الكود كاملًا في Apps Script)
const TOKEN='${token}';
function doGet(){return ContentService.createTextOutput('OK');}
function doPost(e){
  const d=JSON.parse(e.postData.contents);
  if(d.token!==TOKEN)return ContentService.createTextOutput('bad token');
  const ss=SpreadsheetApp.getActiveSpreadsheet();
  const lock=LockService.getScriptLock();lock.waitLock(30000);
  try{
    const getSh=name=>{let sh=ss.getSheetByName(name);if(!sh){sh=ss.insertSheet(name);sh.setRightToLeft(true);sh.getRange(1,1).setValue('id').setFontWeight('bold');sh.setFrozenRows(1);}return sh;};
    if(d.bulk){
      const sh=getSh(d.bulk.s);const rows=d.bulk.rows||[];
      let head=d.bulk.append?sh.getRange(1,1,1,Math.max(1,sh.getLastColumn())).getValues()[0].filter(String):['id'];
      rows.forEach(r=>Object.keys(r).forEach(k=>{if(head.indexOf(k)<0)head.push(k);}));
      if(!d.bulk.append){sh.clearContents();}
      sh.getRange(1,1,1,head.length).setValues([head]).setFontWeight('bold');
      if(rows.length){const vals=rows.map(r=>head.map(h=>r[h]!==undefined?r[h]:''));const start=d.bulk.append?sh.getLastRow()+1:2;sh.getRange(start,1,vals.length,head.length).setValues(vals);}
      return ContentService.createTextOutput('ok');
    }
    (d.ops||[]).forEach(op=>{
      const sh=getSh(op.s);
      let head=sh.getRange(1,1,1,Math.max(1,sh.getLastColumn())).getValues()[0];
      const n=sh.getLastRow()-1;const ids=n>0?sh.getRange(2,1,n,1).getValues().map(r=>String(r[0])):[];
      const ri=ids.indexOf(String(op.id));
      if(op.del){if(ri>=0)sh.deleteRow(ri+2);return;}
      Object.keys(op.row).forEach(k=>{if(head.indexOf(k)<0){head.push(k);sh.getRange(1,head.length).setValue(k).setFontWeight('bold');}});
      const vals=head.map(h=>h==='id'?op.id:(op.row[h]!==undefined?op.row[h]:''));
      if(ri>=0)sh.getRange(ri+2,1,1,vals.length).setValues([vals]);else sh.appendRow(vals);
    });
  }finally{lock.releaseLock();}
  return ContentService.createTextOutput('ok');
}`}

const ymd = d => { const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; };
async function myCoStats(t) {
  const r = await remoteConn(t);
  const now = new Date(), m1 = ymd(new Date(now.getFullYear(), now.getMonth(), 1));
  const cnt = async q => { try { return (await getCountFromServer(q)).data().count; } catch (e) { return (await getDocs(q)).size; } };
  const sumOf = async q => {
    try { return (await getAggregateFromServer(q, { s: sum('amount') })).data().s || 0; }
    catch (e) { const s = await getDocs(q); return s.docs.reduce((a, d) => a + (Number(d.data().amount) || 0), 0); }
  };
  const [rep, pay, reqs, cl] = await Promise.all([
    cnt(query(collection(r.db, 'reports'), where('date', '>=', m1))).catch(() => null),
    sumOf(query(collection(r.db, 'payments'), where('date', '>=', m1))).catch(() => null),
    cnt(query(collection(r.db, 'requests'), where('status', '==', 'new'))).catch(() => null),
    cnt(collection(r.db, 'clients')).catch(() => null),
  ]);
  return { rep, pay, reqs, cl, at: Date.now() };
}

let QR_LIB = null;
function loadQrLib() {
  if (window.QRCode) return Promise.resolve();
  if (QR_LIB) return QR_LIB;

}

async function drawQrCard(k) {
  await loadQrLib();

  const [, , title, sub] = JOIN_KINDS.find(x => x[0] === k) || JOIN_KINDS[0];
  const link = joinLink(k);
  const tmp = document.createElement('div');
  new window.QRCode(tmp, { text: link, width: 460, height: 460, colorDark: '#13233D', colorLight: '#ffffff', correctLevel: window.QRCode.CorrectLevel.H });
  const qc = tmp.querySelector('canvas');
  try { await document.fonts?.load('800 40px Cairo'); await document.fonts?.load('600 24px Cairo'); } catch (e) {}
  const x = cv.getContext('2d'), W = cv.width, H = cv.height;
  x.fillStyle = '#ffffff'; x.fillRect(0, 0, W, H);
  x.fillStyle = '#163A6B'; x.fillRect(0, 0, W, 200);
  const star = (cx, cy, r, col) => { x.fillStyle = col; x.beginPath(); const pts = [[0, -1], [.11, -.11], [1, 0], [.11, .11], [0, 1], [-.11, .11], [-1, 0], [-.11, -.11]]; pts.forEach(([a, b], i) => i ? x.lineTo(cx + a * r, cy + b * r) : x.moveTo(cx + a * r, cy + b * r)); x.closePath(); x.fill(); };
  star(W / 2, 62, 34, '#D7AE57');
  x.direction = 'rtl'; x.textAlign = 'center'; x.fillStyle = '#ffffff';
  x.font = '800 40px Cairo, sans-serif'; x.fillText('Beam Care', W / 2, 150);
  x.fillStyle = '#13233D'; x.font = '800 38px Cairo, sans-serif'; x.fillText(title, W / 2, 268);
  x.fillStyle = '#5D6B82'; x.font = '600 24px Cairo, sans-serif'; x.fillText(sub, W / 2, 310);
  if (qc) { x.fillStyle = '#F3F5F9'; x.fillRect(W / 2 - 250, 340, 500, 500); x.drawImage(qc, W / 2 - 230, 360, 460, 460); }
  star(W / 2, 590, 30, '#ffffff'); star(W / 2, 590, 22, '#B98A35');
  x.fillStyle = '#163A6B'; x.font = '700 26px Cairo, sans-serif'; x.fillText('امسح الرمز واختر الباقة المناسبة', W / 2, 888);
  x.fillStyle = '#5D6B82'; x.font = '600 20px Cairo, sans-serif'; x.direction = 'ltr'; x.fillText('beamcare.eg@gmail.com', W / 2, 926);
}

function applyLook(key) {
  const L = LOOKS[key];
  let st = document.getElementById('lookCss');
  document.body.classList.remove('lk-dark', 'nav-top', 'nav-rail', 'nav-bottom', 'ico-filled', 'ico-duotone', 'ico-circle', 'ico-square', 'lk-on');
  if (!L) { st?.remove(); return; }
  if (!st) { st = document.createElement('style'); st.id = 'lookCss'; document.head.appendChild(st); }
  const c = L.c;
  st.textContent = `:root{--brand:${c[0]};--brand-d:${c[1]};--gold:${c[2]};--gold-l:${c[3]};--bg:${c[4]};--line:${c[5]};--muted:${c[6]};--ink:${c[7]};--mint:${c[8]};--soft:${c[8]}55}`;
  document.documentElement.style.setProperty('--brand', c[0]);
  document.body.classList.add('lk-on');
  if (L.dark) document.body.classList.add('lk-dark');
  if (L.nav !== 'side') document.body.classList.add('nav-' + L.nav);
  if (L.icons !== 'outline') document.body.classList.add('ico-' + L.icons);
}
function lookAnnounce(key) {
  try {
    const k = 'bc-look:' + (S.clinic?.id || ''), old = localStorage.getItem(k);
    if (old !== key) { localStorage.setItem(k, key || ''); if (old !== null && key && LOOKS[key]) setTimeout(() => toast('🎉 شكل جديد للنظام — ' + LOOKS[key].name), 600); }
  } catch (e) {}
}

/* ----- صفحة "أشكال السيستم" في اللوحة ----- */
function lookMini(L) {
  const c = L.c, dark = !!L.dark, card = dark ? '#1B1B1F' : '#fff';
  const ic = (k, on) => {
    const col = on || ['circle', 'square', 'duotone'].includes(L.icons) ? c[0] : c[6];
    const base = `width="16" height="16" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"`;
    if (L.icons === 'filled') return `<svg ${base} fill="${col}" stroke="${card}" stroke-width="1.3">${NAV_ICO[k]}</svg>`;
    if (L.icons === 'duotone') return `<svg ${base} fill="${c[8]}" stroke="${c[0]}" stroke-width="1.8">${NAV_ICO[k]}</svg>`;
    if (L.icons === 'circle') return `<span style="width:24px;height:24px;border-radius:50%;background:${c[0]};display:inline-flex;align-items:center;justify-content:center"><svg ${base} width="14" height="14" fill="none" stroke="#fff" stroke-width="2">${NAV_ICO[k]}</svg></span>`;
    if (L.icons === 'square') return `<span style="width:24px;height:24px;border-radius:7px;background:${c[8]}88;display:inline-flex;align-items:center;justify-content:center"><svg ${base} width="14" height="14" fill="none" stroke="${c[0]}" stroke-width="2">${NAV_ICO[k]}</svg></span>`;
    return `<svg ${base} fill="none" stroke="${col}" stroke-width="1.7">${NAV_ICO[k]}</svg>`;
  };
  const items = ['home', 'bookings', 'clients', 'payments'];
  const stat = (v, l) => `<div style="background:${card};border:1px solid ${c[5]};border-radius:8px;padding:5px 7px"><b style="font-size:13px;color:${c[7]}">${v}</b><div style="font-size:9px;color:${c[6]}">${l}</div></div>`;
  const body = `<div style="flex:1;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0"><b style="font-size:11px;color:${c[7]}">الرئيسية</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:5px">${stat('١٢', 'حجز')}${stat('٨', 'جلسة')}</div><span style="background:${c[0]};color:${dark ? '#111' : '#fff'};font-size:9px;font-weight:700;border-radius:6px;padding:3px 7px;align-self:flex-start">+ حجز جديد</span></div>`;
  let nav;
  if (L.nav === 'side') nav = `<div style="width:84px;background:${card};border-left:1px solid ${c[5]};padding:6px 4px;display:flex;flex-direction:column;gap:3px">${items.map((k, i) => `<div style="display:flex;align-items:center;gap:4px;padding:3px 4px;border-radius:6px;background:${i ? 'transparent' : c[8] + '66'};font-size:9px;color:${i ? c[6] : c[7]};font-weight:${i ? 500 : 700}">${ic(k, !i)}<span>${['الرئيسية', 'الحجوزات', 'العملاء', 'الحسابات'][i]}</span></div>`).join('')}</div>`;
  else if (L.nav === 'rail') nav = `<div style="width:36px;background:${card};border-left:1px solid ${c[5]};padding:6px 4px;display:flex;flex-direction:column;gap:5px;align-items:center">${items.map((k, i) => `<div style="padding:3px;border-radius:6px;background:${i ? 'transparent' : c[8] + '66'}">${ic(k, !i)}</div>`).join('')}</div>`;
  else if (L.nav === 'top') return `<div style="height:134px;background:${c[4]};border-radius:10px;border:1px solid ${c[5]};overflow:hidden;display:flex;flex-direction:column"><div style="background:${card};border-bottom:1px solid ${c[5]};padding:4px 6px;display:flex;gap:6px">${items.map((k, i) => ic(k, !i)).join('')}</div>${body}</div>`;
  else return `<div style="height:134px;background:${c[4]};border-radius:10px;border:1px solid ${c[5]};overflow:hidden;display:flex;flex-direction:column">${body}<div style="background:${card};border-top:1px solid ${c[5]};padding:4px 6px;display:flex;justify-content:space-around">${items.map((k, i) => ic(k, !i)).join('')}</div></div>`;
  return `<div style="height:134px;background:${c[4]};border-radius:10px;border:1px solid ${c[5]};overflow:hidden;display:flex">${nav}${body}</div>`;
}

async function setLook(t, k) {
  const P = PRODUCTS[t.product];
  const L = LOOKS[k];
  const upd = { look: k };
  if (P.remote) Object.assign(upd, { theme: L.pm[0], layout: L.pm[1], icons: L.icons });
  await updateDoc(tdoc(P, t.id), upd);
  if (P.remote) { if (!(await syncRemote(P, t.id))) return false; }
  return true;
}
A.lookAll = async (k, pk) => {
  const P = PRODUCTS[pk];
  if (!confirm(`إرسال شكل "${LOOKS[k].name}" لجميع ${P.short}؟`)) return;
  const ts = (await loadAllTenants()).filter(t => t.product === pk && t.id !== MYCO?.tenantId);
  let bad = 0; toast('جارٍ الإرسال…');
  for (const t of ts) { try { if (!(await setLook(t, k))) bad++; } catch (e) { console.error(e); bad++; } }
  toast(bad ? `تم الإرسال، لكن ${bad} تعذّر الوصول إليهم` : `تم الإرسال إلى ${ts.length} ✓`);
  A.dev('looks');
};
A.lookOneModal = async k => {
  const all = (await loadAllTenants()).filter(t => PRODUCTS[t.product]?.ready);
  openModal(`<h3>أرسل شكل "${esc(LOOKS[k].name)}" لعميل واحد</h3>

    ${formActs('أرسله')}</form>`);
};
A.lookOneSave = async (e, k) => {
  e.preventDefault();
  const id = e.target.t.value, t = (S.tenants || []).find(x => x.id === id);
  busy(e.target.querySelector('[type=submit]'), true, '...');
  try { const ok = await setLook(t, k); A.closeModal(); toast(ok ? 'تم الإرسال ✓' : 'تم الحفظ، لكن تعذّر الوصول إلى نظامهم'); A.dev('looks'); }

};

function mkPlansData() {
  const P = PRODUCTS.clinic, ps = plansOf(P).slice().sort((a, b) => (a.order ?? a.price ?? 0) - (b.order ?? b.price ?? 0)).slice(0, 3);
  const n = (v, one, two, few, many) => v === 1 ? one : v === 2 ? two : v <= 10 ? `${v} ${few}` : `${v} ${many}`;
  return ps.map((p, i) => {
    const L = p.limits || {}, prev = ps[i - 1];
    const lim = [L.maxBranches ? n(+L.maxBranches, 'فرع واحد', 'فرعين', 'فروع', 'فرع') : '', L.maxUsers ? (+L.maxUsers === 1 ? 'مستخدم واحد' : `${L.maxUsers} مستخدم`) : '', L.maxClients ? `حتى ${Number(L.maxClients).toLocaleString('en')} عميل` : 'عملاء بدون حد'].filter(Boolean).join(' · ');
    const has = k => !!p.features?.[k], had = k => !!prev?.features?.[k];
    const fe = P.features.filter(f => has(f.key) && !had(f.key)).map(f => MK_FEAT[f.key] || f.label);
    const feats = (i === 0 ? [...MK_CORE.slice(0, Math.max(2, 6 - fe.length)), ...fe] : fe).slice(0, 6);
    return { name: p.name, price: Number(p.price) || 0, per: p.months ? (Number(p.months) === 1 ? 'شهريًا' : `كل ${reqMonths(p.months)}`) : '', lim, lead: i === 0 ? 'أساسيات إدارة العيادة:' : `كل مزايا «${prev.name}»، وكمان:`, feats: feats.length ? feats : ['كل المزايا الأساسية'], hot: i === 1 };
  });
}

  if (JSPDF_LIB) return JSPDF_LIB;
  JSPDF_LIB = new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'; sc.onload = () => res(); sc.onerror = () => { JSPDF_LIB = null; rej(new Error('pdf')); }; document.head.appendChild(sc); });
  return JSPDF_LIB;
}
async function pzPdf() {
  await Promise.all([loadH2C(), loadJsPdf()]);
  if (!document.getElementById('pzCss')) { const st = document.createElement('style'); st.id = 'pzCss'; st.textContent = PZ_CSS; document.head.appendChild(st); }
  try { await document.fonts?.load('800 72px Cairo'); await document.fonts?.load('400 28px Cairo'); } catch (e) {}
  const c = await mkCtx(), W = 1440, H = 810;
  const pdf = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'pt', format: [W, H], compress: true });
  const st = document.createElement('div'); st.style.cssText = 'position:fixed;top:0;left:-30000px;width:1920px;height:1080px;z-index:-1;direction:rtl'; document.body.appendChild(st);
  try {
    for (let i = 0; i < PRESO.length; i++) {
      st.innerHTML = pzSlide(PRESO[i], i, c);
      await Promise.all([...st.querySelectorAll('img')].map(im => im.complete ? 0 : new Promise(ok => { im.onload = im.onerror = ok; })));
      const cv = await window.html2canvas(st.firstElementChild, { scale: 0.75, width: 1920, height: 1080, backgroundColor: '#ffffff', useCORS: true, logging: false });
      if (i) pdf.addPage([W, H], 'landscape');
      pdf.addImage(cv.toDataURL('image/jpeg', 0.86), 'JPEG', 0, 0, W, H);
    }
  } finally { st.remove(); }
  return pdf.output('blob');
}
A.pzBlob = () => pzPdf();

function tenantFields(f, P) {

  P.features.forEach(x => { if (x.top) data[x.key] = f['ft_' + x.key].checked; else data.features[x.key] = f['ft_' + x.key].checked; });

A.logoPick = async inp => {
  const fl = inp.files?.[0]; if (!fl) return;
  if (!/^image\//.test(fl.type)) return toast('اختر صورة');
  try {
    const url = await new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(fl); });
    const im = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    const max = 360, k = Math.min(1, max / Math.max(im.width, im.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
    cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
    let data = cv.toDataURL('image/png');
    if (data.length > 180000) data = cv.toDataURL('image/webp', 0.9);
    if (data.length > 180000) data = cv.toDataURL('image/jpeg', 0.85);
    const f = inp.closest('form'); f.logo.value = data;
    document.getElementById('logoPrev').innerHTML = logoHTML({ logo: data }, 44);
    toast('تم — اضغط حفظ لتسجيل الشعار');
  } catch (e) { console.error(e); toast('تعذّرت قراءة الصورة'); }
};

const MAINT_APP = 'https://beamcare.github.io/m/';
A.saveTenant = async (e, pk, id) => {
  e.preventDefault();
  const isNew = !id;
  const f = e.target, P = PRODUCTS[pk], btn = f.querySelector('[type=submit]');
  let data;
  try { data = tenantFields(f, P); } catch (er) { return toast(er.message); }
  busy(btn, true, 'جارٍ الحفظ...');
  try {
    const batch = writeBatch(db);
    if (id) {
      if (endOfDay(f.ed.value) <= new Date(f.sd.value + 'T00:00:00')) { busy(btn, false, 'حفظ'); return toast('يجب أن يكون تاريخ النهاية بعد البداية'); }
      data.startAt = Timestamp.fromDate(new Date(f.sd.value + 'T00:00:00'));
      data.expiresAt = Timestamp.fromDate(endOfDay(f.ed.value));
      if (f.isTrial) data.trial = !!f.isTrial.checked;
      if (P.remote && !data.url) data.url = MAINT_APP + '?c=' + id;
      batch.update(tdoc(P, id), data);
    } else {
      const ref = doc(tcol(P));
      id = ref.id;
      if (P.remote && !data.url) data.url = MAINT_APP + '?c=' + id;
      let tdays = Number(f.trialDays?.value) || 0;
      const start = new Date(f.sd.value + 'T00:00:00');
      const manualTrial = f.subKind?.value === 'trial';
      if (manualTrial) {
        if (!f.trialEnd.value || f.trialEnd.value < f.sd.value) { busy(btn, false, 'حفظ'); return toast('حدد يوم انتهاء التجربة (بعد يوم البداية)'); }
        tdays = Math.round((new Date(f.trialEnd.value + 'T00:00:00') - start) / 864e5) + 1;
      }
      const months = tdays ? 0 : (Number(f.months.value) || 1);
      const end = tdays ? new Date(start.getTime() + (tdays - 1) * 864e5) : addMonths(start, months); end.setHours(23, 59, 59);
      if (tdays) data.trial = true;
      data.startAt = Timestamp.fromDate(start);
      data.expiresAt = Timestamp.fromDate(end);
      data.createdAt = serverTimestamp();
      batch.set(ref, data);
      batch.set(doc(collection(db, 'billing')), billingDoc(P, { id, ...data }, manualTrial ? 'trial' : 'new', months, start, end, manualTrial ? 0 : (Number(f.amount.value) || 0), f.method.value, manualTrial ? 'فترة تجريبية' : f.note.value.trim()));
    }
    batch.set(doc(db, 'brands', id), brandDoc(P, data));
    await batch.commit();
    if (isNew && S.reqFill?.pk === pk) await reqMarkPaid(id, data, f).catch(er => { console.error(er); toast('تم الحفظ، لكن تعذّر تحديث الطلب: ' + (er.code || er.message)); });
    if (P.remote) { await saveConn(P, id, f); await withTimeout(remoteConn({ ...data, id }, true), 20000, 'timeout').catch(() => {}); await withTimeout(syncRemote(P, id), 25000, 'timeout').catch(() => {}); }
    A.closeModal(); toast('تم الحفظ'); A.openTenant(pk, id);
  } catch (err) { console.error(err); busy(btn, false, 'حفظ'); toast('تعذّر الحفظ: ' + (err.code || err.message)); }
};
function billingDoc(P, t, kind, months, from, to, amount, method, note) {
  const today = todayStr();
  return { product: P.key, tenantId: t.id, tenantName: t.name, kind, months, from: toInput(from), to: toInput(to), amount, method, note: note || '',
    planId: t.planId || '', planName: t.planName || '', date: today, month: today.slice(0, 7), createdAt: serverTimestamp(), createdByName: S.user?.email || '' };
}

async function loadTenant(pk, id) {
  await loadMyCo();
  const P = PRODUCTS[pk];
  if (P.remote) {
    const [t, bl, cs] = await Promise.all([
      getDoc(tdoc(P, id)),
      getDocs(query(collection(db, 'billing'), where('tenantId', '==', id))).catch(() => null),
      getDoc(doc(db, P.col, id, 'meta', 'conn')).catch(() => null),
    ]);
    if (!t.exists()) throw new Error('لم يتم العثور على هذه البيانات');
    S.dp = P; S.dc = { ...t.data(), id, product: P.key };
    S.dBilling = bl ? bl.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.date || '').localeCompare(a.date || '')) : [];
    S.dConn = { user: cs && cs.exists() ? cs.data().user || '' : '' };
    await loadRemoteInto(S.dc);
    if (!S.plans) await loadPlans().catch(() => {});
    return;
  }
  const [t, bs, us] = await Promise.all([
    getDoc(tdoc(P, id)),
    getDocs(tcol(P, id, 'branches')),
    getDocs(query(collection(db, 'users'), where(P.userKey, '==', id))),
  ]);
  if (!t.exists()) throw new Error('لم يتم العثور على هذه البيانات');
  S.dp = P;
  S.dc = { ...t.data(), id, product: t.data().product || P.key };
  S.dBranches = bs.docs.map(d => ({ id: d.id, ...d.data() }));
  S.dUsers = us.docs.map(d => ({ id: d.id, ...d.data() }));
  const extra = [
    getDocs(query(collection(db, 'billing'), where('tenantId', '==', id))).then(s => { S.dBilling = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.date || '').localeCompare(a.date || '')); }).catch(() => { S.dBilling = []; }),
    getDoc(tdoc(P, id, 'meta', 'counters')).then(c => { S.dClients = c.exists() ? (c.data().clients || 0) : 0; }).catch(() => { S.dClients = 0; }),
  ];
  if (P.key === 'clinic') extra.push(getDocs(tcol(P, id, 'clients')).then(s => { S.dClientList = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar')); }).catch(() => { S.dClientList = []; }));
  await Promise.all(extra);
  if (!S.plans) await loadPlans().catch(() => {});
  // تحديث البيانات القديمة: نوع المنتج على العميل واليوزرات، ودليل الموظفين
  try {
    const batch = writeBatch(db);
    if (!t.data().product) batch.update(tdoc(P, id), { product: P.key });
    S.dUsers.forEach(u => {
      if (u.product !== P.key || u.tenantId !== id) batch.update(doc(db, 'users', u.id), { product: P.key, tenantId: id });
      batch.set(tdoc(P, id, 'staff', u.id), { name: u.name || '', role: u.role, branchIds: u.branchIds || [], active: u.active !== false, prevIds: u.prevIds || [] });
    });
    await batch.commit();
  } catch (e) { console.error('sync', e); }
}

A.tenantTab = async t => {
  S.dTab = t;
  const ld = (S.dp?.remote || (S.dp?.key === 'clinic' && ['backups', 'gs'].includes(t))) && typeof TAB_LOAD !== 'undefined' && TAB_LOAD[t];
  if (!ld) { renderTenant(); return; }
  S.dTabBusy = true; renderTenant();

  if (S.dTab === t) renderTenant();
};

  if (l.count === 'staff') return S.dUsers.filter(u => !isLinked(S.dp, u)).length;
  if (l.count === 'clients') return S.dClients ?? 0;
  return null;
}

A.renewCalc = f => {
  const c = S.dc, p = (S.plans || []).find(x => x.id === f.planId.value);
  const months = Number(f.months.value) || 1;
  const from = new Date(Math.max(Date.now(), toDate(c.expiresAt)?.getTime() || 0));
  const to = addMonths(from, months);
  if (p) f.amount.value = Math.round((p.price || 0) * months / (p.months || 1));
  document.getElementById('renewTo').textContent = `سيستمر الاشتراك حتى ${fmt(to)}` + (p && p.id !== c.planId ? ` · ستتغير الحدود والمزايا إلى باقة "${p.name}"` : '');
};
A.saveRenew = async e => {
  e.preventDefault();
  const f = e.target, P = S.dp, c = S.dc, btn = f.querySelector('[type=submit]');
  const p = (S.plans || []).find(x => x.id === f.planId.value);
  const months = Number(f.months.value) || 1;
  const from = new Date(Math.max(Date.now(), toDate(c.expiresAt)?.getTime() || 0));
  const to = addMonths(from, months); to.setHours(23, 59, 59);
  const upd = { expiresAt: Timestamp.fromDate(to), active: true, trial: false };
  if (p) {
    upd.planId = p.id; upd.planName = p.name; upd.plan = { ...(c.plan || {}), ...p.limits };
    const feats = { ...(c.features || {}) };
    P.features.forEach(x => { if (x.top) upd[x.key] = !!p.features?.[x.key]; else feats[x.key] = !!p.features?.[x.key]; });
    upd.features = feats;
  } else if (f.planId.value === '' && c.planId) { upd.planId = ''; upd.planName = ''; }
  busy(btn, true, 'جارٍ التجديد...');
  try {
    const batch = writeBatch(db);
    batch.update(tdoc(P, c.id), upd);
    batch.set(doc(collection(db, 'billing')), billingDoc(P, { ...c, ...upd }, 'renew', months, from, to, Number(f.amount.value) || 0, f.method.value, f.note.value.trim()));
    if (p) batch.set(doc(db, 'brands', c.id), brandDoc(P, { ...c, ...upd }));
    await batch.commit();
    await syncRemote(P, c.id);
    A.closeModal(); toast('تم التجديد حتى ' + fmt(to));
    if (S.devView === 'tenant') A.openTenant(P.key, c.id); else A.dev(S.devView || 'home');
  } catch (err) { console.error(err); busy(btn, false, 'تجديد'); toast('تعذّر التجديد: ' + (err.code || err.message)); }
};

A.saveBranch = async (e, id) => {
  e.preventDefault();
  const f = e.target, P = S.dp, c = S.dc;
  if (!id && S.dBranches.length >= (c.plan?.maxBranches ?? 0)) return toast('وصلت إلى حد الفروع في الباقة');

};

/* ----- اليوزرات والصلاحيات ----- */
function permsGrid(perms, mods = MODULES) {
  const ex = mods === MODULES ? `<div class="section-t" style="margin-top:10px">صلاحيات الحذف والأموال</div><div class="grid2">${EXTRA_PERMS.map(([k, l]) => `<label class="chk"><input type="checkbox" name="px_${k}" ${perms?.[k] ? 'checked' : ''}> ${l}</label>`).join('')}</div>` : '';
  return permsGridT(perms, mods) + ex;
}
function permsGridT(perms, mods) {
  return `<div class="tbl-wrap" style="border:1px solid var(--line);border-radius:12px"><table class="perms">
    <thead><tr><th>القسم</th><th>عرض</th><th>تعديل</th></tr></thead>
    <tbody>${mods.map(m => `<tr><td>${m.label}</td>
      <td><input type="checkbox" name="p_${m.key}_view" aria-label="عرض ${m.label}" ${perms?.[m.key + '_view'] ? 'checked' : ''} onchange="A.permTick(this)"></td>
      <td><input type="checkbox" name="p_${m.key}_edit" aria-label="تعديل ${m.label}" ${perms?.[m.key + '_edit'] ? 'checked' : ''} onchange="A.permTick(this)"></td></tr>`).join('')}</tbody></table></div>`;
}
A.permTick = el => {
  const f = el.form, m = el.name.match(/^p_(.+)_(view|edit)$/);
  const key = m[1], kind = m[2];
  if (kind === 'edit' && el.checked) f[`p_${key}_view`].checked = true;
  if (kind === 'view' && !el.checked) f[`p_${key}_edit`].checked = false;
};
function readPerms(f, mods = MODULES) {
  const o = {};
  mods.forEach(m => {
    o[m.key + '_edit'] = f[`p_${m.key}_edit`].checked;
    o[m.key + '_view'] = f[`p_${m.key}_view`].checked || o[m.key + '_edit'];
  });
  if (mods === MODULES) EXTRA_PERMS.forEach(([k]) => { if (f['px_' + k]) o[k] = f['px_' + k].checked; });
  return o;
}
function setPerms(f, perms, mods = MODULES) { mods.forEach(m => { f[`p_${m.key}_view`].checked = !!perms?.[m.key + '_view']; f[`p_${m.key}_edit`].checked = !!perms?.[m.key + '_edit']; }); if (mods === MODULES) EXTRA_PERMS.forEach(([k]) => { if (f['px_' + k]) f['px_' + k].checked = !!perms?.[k]; }); }

    <div class="grid2">

      <div class="section-t">الفروع</div>

        : `<div class="notice info">لا توجد فروع بعد.</div>`}
    </div>

      <label class="f">ملف العميل المربوط بالحساب<select name="clientId"><option value="">اختر العميل</option>${linked.map(x => `<option value="${x.id}" ${u?.clientId === x.id ? 'selected' : ''}>${esc(x.name)} - ${esc(x.phone)}</option>`).join('')}</select></label>

    <div id="permWrap" style="display:${role === P.linkedRole ? 'none' : 'flex'};flex-direction:column;gap:8px">
      <div class="head"><div class="section-t" style="flex:1">الصلاحيات</div><button type="button" class="btn ghost sm" onclick="A.resetPerms(this.form)">استعادة صلاحيات الدور الافتراضية</button></div>
      ${permsGrid(perms, P.modules)}
    </div>
    <label class="chk"><input type="checkbox" name="act" ${u?.active === false ? '' : 'checked'}> المستخدم مفعّل</label>
    ${formActs()}
  </form>`);
};
A.roleChanged = sel => {
  const P = S.dp, f = sel.form, r = sel.value;
  document.getElementById('brWrap').style.display = P.roles[r].scope === 'all' ? 'none' : 'flex';
  document.getElementById('permWrap').style.display = r === P.linkedRole ? 'none' : 'flex';
  const cw = document.getElementById('clWrap');
  if (cw) cw.style.display = r === P.linkedRole ? 'flex' : 'none';
  setPerms(f, P.rolePerms[r], P.modules);
};
A.resetPerms = f => {
  const inDev = !!S.dp && !S.profile;
  if (inDev) setPerms(f, S.dp.rolePerms[f.role.value], S.dp.modules);
  else setPerms(f, ROLE_PERMS[f.role.value]);
};

A.saveUser = async (e, id) => {
  e.preventDefault();
  const f = e.target, P = S.dp, c = S.dc, btn = f.querySelector('[type=submit]');
  const role = f.role.value;
  const branchIds = P.roles[role].scope === 'all' ? [] : [...f.querySelectorAll('[name=br]:checked')].map(x => x.value);
  if (P.roles[role].scope !== 'all' && !branchIds.length) return toast('اختر فرعًا واحدًا على الأقل');
  const clientId = role === P.linkedRole && f.clientId ? f.clientId.value : '';
  if (role === 'client' && P.linkedRole === 'client' && !clientId) return toast('اختر ملف العميل المرتبط بالحساب');
  const wasStaff = id ? !isLinked(P, S.dUsers.find(x => x.id === id)) : false;
  const staffCount = S.dUsers.filter(u => !isLinked(P, u)).length;
  if (role !== P.linkedRole && !wasStaff && staffCount >= (c.plan?.maxUsers ?? 0)) return toast('وصلت إلى حد المستخدمين في الباقة');
  const data = { name: f.name.value.trim(), title: (f.title?.value || '').trim(), ...(f.hr ? { hr: role === 'owner' && f.hr.checked } : {}), role, branchIds, perms: role === P.linkedRole ? P.rolePerms[role] : readPerms(f, P.modules), active: f.act.checked,
    product: P.key, tenantId: c.id, [P.userKey]: c.id, clientId };
  let newCreds = null;
  busy(btn, true, 'جارٍ الحفظ...');
  try {
    if (id) {
      await updateDoc(doc(db, 'users', id), data);
    } else {
      const username = f.username.value.trim().toLowerCase();
      const taken = await getDoc(doc(db, 'logins', username)).catch(() => null);
      if (taken?.exists()) throw Object.assign(new Error('taken'), { code: 'auth/email-already-in-use' });
      const email = `${username}@${EMAIL_DOMAIN}`;
      const cred = await createUserWithEmailAndPassword(auth2, email, f.pass.value);
      await signOut(auth2);
      id = cred.user.uid;
      const batch = writeBatch(db);
      batch.set(doc(db, 'users', id), { ...data, username, authEmail: email, prevIds: [], createdAt: serverTimestamp() });
      batch.set(doc(db, 'logins', username), { email });
      await batch.commit();
      newCreds = { name: data.name, username, pass: f.pass.value };
    }
    const prev = S.dUsers.find(x => x.id === id)?.prevIds || [];
    await setDoc(tdoc(P, c.id, 'staff', id), { name: data.name, role: data.role, branchIds: data.branchIds, active: data.active, prevIds: prev });
    A.closeModal(); toast('تم الحفظ');
    await A.openTenant(P.key, c.id, 'users');
    if (newCreds) showCreds(newCreds, 'تم إنشاء المستخدم');
  } catch (err) {
    console.error(err); busy(btn, false, 'حفظ');
    toast(err.code === 'auth/email-already-in-use' ? 'اسم المستخدم هذا مستخدم من قبل' : err.code === 'auth/weak-password' ? 'كلمة السر ضعيفة (6 حروف على الأقل)' : 'تعذّر الحفظ: ' + (err.code || err.message));
  }
};

/* ----- كلمات السر ----- */
function genPw() {
  const a = 'abcdefghjkmnpqrstuvwxyz', d = '23456789';
  let s = '';
  for (let i = 0; i < 6; i++) s += a[Math.floor(Math.random() * a.length)];
  for (let i = 0; i < 3; i++) s += d[Math.floor(Math.random() * d.length)];
  return s;
}
A.genPw = genPw;
function credsText(cr) {
  const P = S.dp, c = S.dc;
  const link = `${location.origin}${location.pathname}${c ? '?c=' + c.id : ''}`;
  return `أهلًا ${cr.name}\nبيانات دخولك إلى نظام ${c?.whiteLabel ? c.name : P?.name || 'Beam Care'}:\nالرابط: ${link}\nاسم المستخدم: ${cr.username}\nكلمة المرور: ${cr.pass}\n\nتقدر تغيّر كلمة المرور من زرار "كلمة المرور" فوق بعد ما تدخل.`;
}
function showCreds(cr, title) {
  S.lastCreds = cr;
  openModal(`<h3>${esc(title)}</h3>
    <div class="notice warn">انسخ هذه البيانات أو أرسلها الآن. لن تظهر كلمة المرور مرة أخرى، ولا تُحفظ في أي مكان.</div>
    <div class="card" style="display:flex;flex-direction:column;gap:8px">
      <div class="meta" style="font-size:16px"><span>اسم المستخدم:</span><b dir="ltr" id="credUser">${esc(cr.username)}</b></div>
      <div class="meta" style="font-size:16px"><span>كلمة المرور:</span><b dir="ltr" id="credPass">${esc(cr.pass)}</b></div>
    </div>
    <div class="acts">
      <button class="btn" onclick="navigator.clipboard.writeText(A.credsText());A.toast('تم النسخ')">نسخ</button>
      <a class="btn gold" style="text-decoration:none;display:inline-flex;align-items:center" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(credsText(cr))}">أرسل عبر واتساب</a>
      <button class="btn ghost" onclick="A.closeModal()">حسنًا</button>
    </div>`);
}
A.credsText = () => credsText(S.lastCreds);

A.userDel = id => {
  const u = (S.dUsers || []).find(x => x.id === id); if (!u) return;
  openModal(`<h3>حذف ${esc(u.name)}؟</h3><p class="meta">سيُحذف المستخدم ولن يتمكن من الدخول مرة أخرى. أما البيانات التي سجّلها (جلسات، تحصيلات، تقارير…) فتبقى كما هي.</p>${u.role === 'owner' || u.main ? '<div class="notice warn">هذا صاحب الحساب! تأكد من وجود شخص آخر يستطيع الدخول.</div>' : ''}
    <div class="acts"><button class="btn danger" onclick="A.userDelGo('${esc(id)}')">حذف نهائي</button><button class="btn ghost" onclick="A.closeModal()">إلغاء</button></div>`);
};
A.userDelGo = async id => {
  const P = S.dp, c = S.dc, u = (S.dUsers || []).find(x => x.id === id); if (!u) return;
  try {
    if (P.remote) {
      const r = await remoteConn(c);
      await deleteDoc(doc(r.db, 'users', id));
    } else {
      const b = writeBatch(db);
      b.delete(doc(db, 'users', id)); b.delete(tdoc(P, c.id, 'staff', id)); if (u.username) b.delete(doc(db, 'logins', u.username));
      await b.commit();
    }
    A.closeModal(); toast('تم حذف المستخدم'); await A.openTenant(P.key, c.id, 'users');
  } catch (e) { console.error(e); toast('تعذّر حذفه: ' + (e.code || e.message)); }
};
A.resetPw = async (e, id) => {
  e.preventDefault();
  const f = e.target, btn = f.querySelector('[type=submit]'), P = S.dp, c = S.dc;
  const u = S.dUsers.find(x => x.id === id);
  if (!u.username) return toast('هذا المستخدم ليس له اسم مستخدم');
  busy(btn, true, 'جارٍ التغيير...');
  try {
    const email = `${u.username}+${Date.now().toString(36)}@${EMAIL_DOMAIN}`;
    const cred = await createUserWithEmailAndPassword(auth2, email, f.pass.value);
    await signOut(auth2);
    const nid = cred.user.uid;
    const { id: _old, ...rest } = u;
    const prevIds = [...(u.prevIds || []), id];
    const batch = writeBatch(db);
    batch.set(doc(db, 'users', nid), { ...rest, prevIds, authEmail: email, product: P.key, tenantId: c.id, [P.userKey]: c.id });
    batch.delete(doc(db, 'users', id));
    batch.set(doc(db, 'logins', u.username), { email });
    batch.set(tdoc(P, c.id, 'staff', nid), { name: u.name || '', role: u.role, branchIds: u.branchIds || [], active: u.active !== false, prevIds });
    batch.delete(tdoc(P, c.id, 'staff', id));
    if (P.key === 'clinic') {
      const emps = await getDocs(query(tcol(P, c.id, 'employees'), where('userId', '==', id))).catch(() => null);
      emps?.forEach(d => batch.update(d.ref, { userId: nid }));
    }
    await batch.commit();
    A.closeModal();
    await A.openTenant(P.key, c.id, 'users');
    showCreds({ name: u.name, username: u.username, pass: f.pass.value }, 'تم تغيير كلمة المرور');
  } catch (err) {
    console.error(err); busy(btn, false, 'غيّر كلمة المرور');
    toast(err.code === 'auth/weak-password' ? 'كلمة السر ضعيفة (6 حروف على الأقل)' : 'تعذّر تغييرها: ' + (err.code || err.message));
  }
};

/* ----- الدخول كأي يوزر ----- */
A.viewAs = id => {
  const P = S.dp, u = S.dUsers.find(x => x.id === id);
  if (!P.viewAs) return;
  if (u.role === 'client' && !u.clientId) return toast('حساب هذا العميل غير مرتبط بملف');
  S.viewAs = { product: P.key, tenantId: S.dc.id };
  S.profile = { ...u, id };
  S.clinic = { ...S.dc };
  S.branches = S.dBranches;
  ['clients', 'staff', 'services', 'devices', 'bookings', 'openClientId', 'bDate', 'sDate', 'payDate', 'branch', 'cfg', 'online', 'cats', 'pubCfg', 'pCat', 'camp', 'campSess', 'campPk'].forEach(k => { S[k] = null; });
  applyBrand(S.clinic);
  initBranch();
  loadCfg().catch(() => {}).finally(() => A.go('home'));
};
A.exitViewAs = () => {
  const v = S.viewAs;
  S.viewAs = null; S.profile = null; S.clinic = null; S.branches = null;
  ['clients', 'staff', 'services', 'devices', 'bookings', 'openClientId'].forEach(k => { S[k] = null; });
  applyBrand(null);
  if (v) A.openTenant(v.product, v.tenantId, 'users'); else A.devHome();
};

/* =========================================================
   سيستم العيادة (لكل اليوزرات غير المطور)
   ========================================================= */
const can = k => { const v = S.profile?.perms?.[k]; return v === undefined ? !!ROLE_PERMS[S.profile?.role]?.[k] : !!v; };
const isOwner = () => S.profile?.role === 'owner';
const ownerPerms = () => isOwner() && S.clinic?.features?.ownerManagesPerms;
const LOADING = `<div class="loading">جاري التحميل...</div>`;
const todayStr = () => toInput(new Date());
const money = n => (Number(n) || 0).toLocaleString('ar-EG') + ' ج.م';
const ccol = (...p) => collection(db, 'clinics', S.clinic.id, ...p);
const cdoc = (...p) => doc(db, 'clinics', S.clinic.id, ...p);
const METHODS = { cash: 'نقدًا', visa: 'بطاقة', instapay: 'إنستاباي', wallet: 'محفظة إلكترونية' };
const methodOpts = sel => Object.entries(METHODS).map(([k, l]) => `<option value="${k}" ${k === sel ? 'selected' : ''}>${l}</option>`).join('');
const unitOf = p => p?.unit === 'pulses' ? 'نبضة' : 'جلسة';
const itLeft = i => Math.max(0, (Number(i.total) || 0) - (Number(i.used) || 0));
const itUnit = i => i.unit === 'pulses' ? 'بلصة' : 'جلسة';
const pLeft = p => p.cancelled ? 0 : p.items?.length ? p.items.reduce((a, i) => a + itLeft(i), 0) : (p.totalSessions || 0) - (p.usedSessions || 0);
const pDue = p => Math.max(0, (Number(p.price) || 0) - (Number(p.paid) || 0));
const pkgUse = p => p.items?.length ? p.items.map(i => `${esc(i.name)} ${(i.used || 0).toLocaleString('ar-EG')}/${(i.total || 0).toLocaleString('ar-EG')}${i.unit === 'pulses' ? ' نبضة' : ''}`).join(' · ')
  : `${(p.usedSessions || 0).toLocaleString('ar-EG')} من ${(p.totalSessions || 0).toLocaleString('ar-EG')} ${unitOf(p)}`;
const pkgChip = p => p.cancelled ? `<span class="chip bad">ملغاة${p.refunded ? ' · مستردة ' + money(p.refunded) : ''}</span>` : pLeft(p) > 0 ? `<span class="chip ok">${p.items?.length ? 'شغال' : `متبقٍ ${pLeft(p).toLocaleString('ar-EG')} ${unitOf(p)}`}</span>` : `<span class="chip mute">منتهية</span>`;
const payChip = p => p.paid == null ? '' : pDue(p) > 0 ? `<span class="chip warn">مدفوع ${money(p.paid)} · متبقٍ ${money(pDue(p))}</span>` : `<span class="chip ok">مدفوع بالكامل</span>`;
const chargedOf = (c, pk, ss) => (c?.openingBalance || 0) + pk.filter(x => !x.imported).reduce((a, x) => a + (x.price || 0), 0) + ss.filter(x => !x.packageId).reduce((a, x) => a + (x.price || 0), 0);
const BSTATUS = { booked: ['محجوز', 'mute'], arrived: ['حضر', 'warn'], done: ['تم', 'ok'], noshow: ['لم يحضر', 'bad'], cancelled: ['ملغاة', 'bad'] };
const bChip = s => { const x = BSTATUS[s] || BSTATUS.booked; return `<span class="chip ${x[1]}">${x[0]}</span>`; };
const timeOf = ts => { const d = toDate(ts); return d ? d.toLocaleTimeString('ar-EG', { hour: 'numeric', minute: '2-digit' }) : ''; };
const formActs = (label = 'حفظ') => `<div class="acts"><button class="btn" type="submit">${label}</button><button class="btn ghost" type="button" onclick="A.closeModal()">إلغاء</button></div>`;

/* ----- الفروع ----- */
function myBranches() {
  const all = (S.branches || []).filter(b => b.active !== false);
  return ROLES[S.profile.role]?.scope === 'all' ? all : all.filter(b => (S.profile.branchIds || []).includes(b.id));
}
function initBranch() {
  const list = myBranches();
  let saved = null;
  try { saved = localStorage.getItem('bc_branch_' + S.clinic.id); } catch {}
  S.branch = list.find(b => b.id === saved)?.id || list[0]?.id || null;
}
A.setBranch = id => {
  S.branch = id;
  try { localStorage.setItem('bc_branch_' + S.clinic.id, id); } catch {}

async function followUps() {
  const flat = svcFlat(await loadServices());
  const ev = name => { const x = flat.find(s => s.name === name); return x ? Number(x.every) || 0 : 0; };
  if (!flat.some(x => Number(x.every) > 0)) return [];
  const today = todayStr(), back = d => { const x = new Date(); x.setDate(x.getDate() - d); return toInput(x); };
  const ss = await getDocs(query(ccol('sessions'), where('date', '>=', back(400)))).then(r => r.docs.map(d => d.data())).catch(() => []);
  const last = {};
  ss.forEach(x => { const nm = x.area || x.packageName || ''; const e = ev(nm) || ev(x.packageName || ''); if (!e) return; const parent = flat.find(s => s.name === nm)?.parentName || nm; const k = x.clientId + '|' + parent; if (!last[k] || last[k].date < x.date) last[k] = { clientId: x.clientId, clientName: x.clientName, svc: parent, date: x.date, every: e }; });
  const fut = new Set(await getDocs(query(ccol('bookings'), where('date', '>=', today))).then(r => r.docs.map(d => d.data()).filter(b => b.status !== 'cancelled').map(b => b.clientId)).catch(() => []));
  const sent = (() => { try { return JSON.parse(localStorage.getItem('bc-fu-' + S.clinic.id) || '{}'); } catch (e) { return {}; } })();
  return Object.values(last).map(x => { const due = new Date(x.date + 'T12:00:00'); due.setDate(due.getDate() + x.every); return { ...x, due: toInput(due) }; })
    .filter(x => x.due <= today && x.due >= back(45) && !fut.has(x.clientId) && sent[x.clientId + '|' + x.svc] !== x.date)

    getDocs(query(ccol('bookings'), where('date', '>=', back(30)))).then(r => r.docs.map(d => ({ id: d.id, ...d.data() }))).catch(() => []),
  ]);
  const fut = new Set(bk.filter(b => b.date >= today && !['cancelled', 'noshow'].includes(b.status)).map(b => b.clientId));
  const ending = pk.filter(p => !p.cancelled && !p.imported && pTot(p) > 0 && pLeft(p) > 0 && (pIsPulses(p) ? pLeft(p) / pTot(p) <= 0.15 : pLeft(p) <= 1))
    .filter(p => sent['pk|' + p.id] !== pLeft(p)).map(p => ({ kind: 'pk', id: p.id, clientId: p.clientId, clientName: p.clientName, name: p.name, left: pLeft(p), unit: pIsPulses(p) ? 'بلصة' : 'جلسة' }));

A.saveClient = async (e, id) => {
  e.preventDefault();
  const f = e.target, btn = f.querySelector('[type=submit]');
  const data = { name: f.name.value.trim(), phone: f.phone.value.trim(), phone2: f.phone2.value.trim(), gender: f.gender.value, birth: f.birth.value, notes: f.notes.value.trim(), address: f.address.value.trim(),
    status: f.cst?.value || 'active', tag: f.ctag?.value || '', source: f.src?.value || '', lastPower: f.lastPower?.value === '' ? '' : Number(f.lastPower?.value) || 0,
    flags: Object.fromEntries(CL_FLAGS.map(([k]) => [k, !!f['fl_' + k]?.checked])) };
  if (f.pDate && (f.pDate.value || f.pArea.value.trim() || f.pPower.value)) data.prior = { date: f.pDate.value, area: f.pArea.value.trim().slice(0, 60), power: Number(f.pPower.value) || 0, pulses: Number(f.pPulses.value) || 0, ms: Number(f.pMs.value) || 0, note: f.pNote.value.trim().slice(0, 200) };
  if (f.opening) data.openingBalance = Number(f.opening.value) || 0;
  const refC = !id && f.ref?.value.trim() ? findClient(f.ref.value) : null;
  if (!id && f.ref?.value.trim() && !refC) return toast('اختر العميل الذي رشّحه من القائمة، أو اترك الخانة فارغة');
  if (!id && (S.clients || []).some(c => c.phone === data.phone) && !confirm('يوجد عميل مسجل بنفس رقم الهاتف. هل تريد المتابعة؟')) return;
  busy(btn, true, 'جارٍ الحفظ...');
  try {
    if (id) {
      await updateDoc(cdoc('clients', id), data);
    } else {
      const max = S.clinic.plan?.maxClients ?? 0;
      const ctr = cdoc('meta', 'counters');
      const nref = doc(ccol('clients'));
      if (NET_OFF) {
        // من غير نت: بنزود العدّاد ونسجل العميل في عملية واحدة، وبتترفع لما النت يرجع
        let n = 0; try { const cs = await getDoc(ctr); n = cs.exists() ? (cs.data().clients || 0) : 0; } catch (e) {}
        if (n >= max) throw Object.assign(new Error('limit'), { code: 'limit' });
        const b = writeBatch(db);
        b.set(ctr, { clients: increment(1) }, { merge: true });
        b.set(nref, { ...data, ...(refC ? { referredBy: refC.id } : {}), branchId: S.branch || '', month: todayStr().slice(0, 7), createdAt: serverTimestamp(), createdBy: S.profile.id });
        await b.commit();
      } else await runTransaction(db, async tx => {
        const cs = await tx.get(ctr);
        const n = cs.exists() ? (cs.data().clients || 0) : 0;
        if (n >= max) throw Object.assign(new Error('limit'), { code: 'limit' });
        tx.set(ctr, { clients: n + 1 }, { merge: true });
        tx.set(nref, { ...data, ...(refC ? { referredBy: refC.id } : {}), branchId: S.branch || '', month: todayStr().slice(0, 7), createdAt: serverTimestamp(), createdBy: S.profile.id });
      });
      id = nref.id;
      if (refC && loy().on && loy().referral > 0) await addPoints(refC.id, refC.name, loy().referral, 'ref', 'رشّح ' + data.name).catch(er => console.error(er));
    }
    A.closeModal(); toast('تم الحفظ');
    await loadClients(true);
    if (S.clientThenBook) { S.clientThenBook = false; return A.bookingModal({ clientId: id, online: true }); }
    A.openClient(id);
  } catch (err) {
    console.error(err); busy(btn, false, 'حفظ');
    toast(err.code === 'limit' ? 'وصلت العيادة إلى حد العملاء في الباقة. تواصل مع Beam Care' : 'تعذّر الحفظ: ' + (err.code || err.message));
  }
};

A.saveBooking = async (e, id) => {
  e.preventDefault();
  const f = e.target, btn = f.querySelector('[type=submit]');
  const cl = findClient(f.client.value);
  if (!cl) return toast('اختر العميل من القائمة، أو سجّله أولًا');
  const dr = allDocs().find(x => x.id === f.doctor.value);
  const data = { clientId: cl.id, clientName: cl.name, clientPhone: cl.phone || '', date: f.date.value, time: f.time.value, doctorId: dr?.id || '', doctorName: dr?.name || '', service: f.service.value.trim(), notes: f.notes.value.trim(), branchId: S.branch, month: f.date.value.slice(0, 7) };
  const sv = svcFlat().find(x => x.name === data.service);
  data.dur = (S.onlineArm && S.onlineFill?.dur) || Number(sv?.dur) || 0;
  data.resId = (S.onlineArm && S.onlineFill?.resId) || sv?.resId || (id ? (S.bookings || []).find(x => x.id === id)?.resId : '') || '';
  const old = id ? (S.bookings || []).find(x => x.id === id) : null;
  if (dr && data.date === (S.bDate || todayStr()) && (S.bookings || []).some(x => x.id !== id && x.doctorId === dr.id && x.time === data.time && !['cancelled', 'noshow'].includes(x.status))
    && !confirm(`${dr.name} لديه حجز آخر في نفس الساعة. هل تريد المتابعة؟`)) return;
  busy(btn, true, 'جارٍ الحفظ...');
  try {
    if (id) await updateDoc(cdoc('bookings', id), data);
    else {
      const nr = await addDoc(ccol('bookings'), { ...data, status: 'booked', createdAt: serverTimestamp(), createdBy: S.profile.id, createdByName: S.profile.name });
      S.lastBookingId = nr.id;
      const dep = Number(f.dep?.value) || 0;
      if (dep > 0) { try { const proofId = f.depP?.files?.[0] ? await saveProof(f.depP.files[0], { clientId: cl.id, kind: 'payment', branchId: data.branchId }) : '';
        const nos = await takeNos(['rcpt']); await addDoc(ccol('payments'), { ...(nos.rcpt ? { no: nos.rcpt } : {}), ...(proofId ? { proofId } : {}), bookingId: nr.id, clientId: cl.id, clientName: cl.name, branchId: data.branchId, amount: dep, method: f.depM.value, date: todayStr(), month: todayStr().slice(0, 7), note: 'عربون حجز ' + (data.service || ''), createdAt: serverTimestamp(), createdBy: S.profile.id, createdByName: S.profile.name }); }
        catch (er) { console.error(er); toast('تم حفظ الحجز، لكن لم يُسجَّل العربون: ' + (er.code || er.message)); } }
      if (S.onlineArm && S.onlineFill) {
        const of = S.onlineFill;
        await updateDoc(cdoc('online', of.id), { status: 'done', bookingId: nr.id, handledBy: S.profile.id, handledAt: serverTimestamp() }).catch(er => console.error(er));
        if (of.branchId && (of.branchId !== data.branchId || of.date !== data.date)) syncBusy(of.branchId, of.date);
        S.onlineFill = null; S.onlineArm = false;
      }
    }
    syncBusy(data.branchId, data.date);
    if (old && (old.date !== data.date || old.branchId !== data.branchId)) syncBusy(old.branchId, old.date);
    A.closeModal(); toast('تم حفظ الحجز');
    S.bDate = data.date;
    afterSave('bookings');
    if (!id && data.clientPhone) setTimeout(() => A.bkInvoice(S.lastBookingId), 400);
  } catch (err) { console.error(err); busy(btn, false, 'حفظ'); toast('تعذّر الحفظ: ' + err.code); }
};

    const pb = writeBatch(db), pref = doc(ccol('payments'));

const DEV_TYPES = [['laser', 'ليزر إزالة شعر', 'shots'], ['ipl', 'IPL', 'shots'], ['fractional', 'فراكشنال', 'shots'], ['carbon', 'ليزر كربوني / تفتيح', 'shots'], ['rf', 'RF وشدّ البشرة', 'uses'], ['hifu', 'هايفو HIFU', 'shots'], ['prp', 'بلازما PRP', 'uses'], ['micro', 'ديرمابن / ميكرونيدلنج', 'uses'], ['hydra', 'هيدرافيشيال وتنظيف بشرة', 'uses'], ['body', 'مساج وتخسيس ونحت', 'uses'], ['other', 'جهاز تاني', 'uses']];
const devT = d => DEV_TYPES.find(t => t[0] === (d?.type || 'laser')) || DEV_TYPES[0];
const devCounter = d => d?.counter || devT(d)[2];
const DEV_TYPES_C = Object.fromEntries(DEV_TYPES.map(t => [t[0], t[2]]));
window.DEV_TYPES_C = DEV_TYPES_C;
// حالة صيانة الجهاز: «محتاج صيانة» أو «قربت الصيانة» (بالعدد أو بالتاريخ)
function devDue(d) {
  const sh = devCounter(d) === 'shots', cnt = sh ? (d.shots || 0) : (d.uses || 0), since = cnt - (sh ? (d.lastServiceShots || 0) : (d.lastServiceUses || 0));

const geoDist = (a, b) => { const R = 6371e3, t = x => x * Math.PI / 180, dl = t(b.lat - a.lat), dg = t(b.lng - a.lng); const h = Math.sin(dl / 2) ** 2 + Math.cos(t(a.lat)) * Math.cos(t(b.lat)) * Math.sin(dg / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };
const getPos = () => new Promise((ok, no) => { if (!navigator.geolocation) return no(new Error('nogeo')); navigator.geolocation.getCurrentPosition(p => ok({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }), no, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }); });

  await loadCfg(); const g = S.cfg?.hr?.geo?.[S.branch];
  if (!g || !S.cfg?.hr?.gps) return {};
  let pos; try { pos = await getPos(); } catch (e) { throw new Error('فعّل خدمة Location (الموقع) في الهاتف واسمح للنظام باستخدامها لتسجيل البصمة'); }
  const dist = Math.round(geoDist(pos, g));
  if (dist > (Number(g.r) || 100)) throw new Error(`أنت بعيد عن العيادة ${dist.toLocaleString('ar-EG')} مترًا — يجب أن تكون في حدود ${(Number(g.r) || 100).toLocaleString('ar-EG')} مترًا لتسجيل البصمة`);
  return { lat: +pos.lat.toFixed(6), lng: +pos.lng.toFixed(6), dist };
}

  if (!lines.length) return toast('لا توجد رواتب للصرف');
  if (!confirm(`ستوافق على صرف ${lines.length.toLocaleString('ar-EG')} راتبًا بإجمالي ${money(lines.reduce((a, l) => a + l.net, 0))}، وستُسجَّل مصروفات في الخزينة اليوم. هل تريد المتابعة؟`)) return;
  try {
    for (let i = 0; i < lines.length; i += 120) {
      const b = writeBatch(db);
      lines.slice(i, i + 120).forEach(l => {
        b.set(cdoc('payroll', `${M}_${l.empId}`), { employeeId: l.empId, employeeName: l.name, branchId: S.branch, month: M, base: l.base, commission: l.comm, bonus: (+l.bonus || 0) + (+l.ot || 0), deductions: (+l.late || 0) + (+l.absent || 0) + (+l.penalty || 0) + (+l.adv || 0) - (+l.manual || 0), net: l.net, method: 'cash', note: l.detail || '', paidDate: today, createdAt: serverTimestamp(), createdBy: S.profile.id });
        b.set(doc(ccol('expenses')), { branchId: S.branch, category: 'مرتبات', amount: l.net, method: 'cash', date: today, month: today.slice(0, 7), note: `راتب ${l.name} عن ${M}`, createdAt: serverTimestamp(), createdBy: S.profile.id, createdByName: S.profile.name });
        if (l.userId) b.set(cdoc('payslips', `${M}_${l.userId}`), { uid: l.userId, name: l.name, month: M, branchId: S.branch, base: l.base, comm: l.comm, ot: l.ot, bonus: l.bonus, late: l.late, absent: l.absent, penalty: l.penalty, adv: l.adv, manual: l.manual, net: l.net, detail: l.detail || '', seen: false, at: serverTimestamp() });
      });
      await b.commit();
    }
    await setDoc(cdoc('payrun', `${M}_${S.branch}`), { month: M, branchId: S.branch, status: 'approved', lines, total: lines.reduce((a, l) => a + l.net, 0), approvedBy: S.profile.name, approvedAt: serverTimestamp(), note: '' }, { merge: true });
    toast('تم صرف الرواتب ✓ ووصل كل موظف إشعار'); A.go('staff');
  } catch (e) { console.error(e); toast('تعذّر الصرف: ' + (e.code || e.message)); }
};

async function renderReports() {
  const M = S.rMonth || monthStr();
  const all = ['owner', 'accounts'].includes(S.profile.role) && S.rScope !== 'branch';
  clinicShell('reports', LOADING);
  await ensureData();
  const g = col => (all ? qAll(col, 'month', M) : qBranch(col, 'month', M)).catch(() => []);
  const [pays, exps, sess, pkgs, newCl, bks, mv] = await Promise.all([g('payments'), g('expenses'), g('sessions'), g('cpackages'), qAll('clients', 'month', M).catch(() => []),
    can('bookings_view') ? g('bookings') : Promise.resolve([]), can('inventory_view') ? g('stockMoves') : Promise.resolve([])]);
  const inc = sumAmt(pays), out = sumAmt(exps);
  // قيمة كل جلسة: سعرها لو منفردة، ولو من باكدج = سعر الباكدج ÷ عدد جلساتها/بلصاتها
  const pkIds = [...new Set(sess.filter(x => x.packageId).map(x => x.packageId))].slice(0, 200);
  const PK = {}; pkgs.forEach(p => PK[p.id] = p);
  await Promise.all(pkIds.filter(i => !PK[i]).map(i => getDoc(cdoc('cpackages', i)).then(d => { if (d.exists()) PK[i] = { id: i, ...d.data() }; }).catch(() => {})));
  const sVal = x => { if (!x.packageId) return Number(x.price) || 0; const p = PK[x.packageId]; if (!p || !pTot(p)) return 0; const per = (Number(p.price) || 0) / pTot(p); return per * (x.pulsesDeducted || 1); };
  // المستهلكات التشغيلية والهالك وتكلفة المنتجات المباعة (بسعر التكلفة)
  let IC = {}; if (mv.length) { try { (await getDocs(ccol('items'))).forEach(d => IC[d.id] = Number(d.data().cost) || 0); } catch (e) {} }
  const mvCost = x => (Number(x.qty) || 0) * (x.cost != null ? Number(x.cost) || 0 : IC[x.itemId] || 0);
  const useC = mv.filter(m => ['use', 'session', 'out'].includes(m.type)).reduce((a, m) => a + mvCost(m), 0), wasteC = mv.filter(m => m.type === 'waste').reduce((a, m) => a + mvCost(m), 0), saleC = mv.filter(m => m.type === 'sale').reduce((a, m) => a + mvCost(m), 0);
  const buyPaid = exps.filter(e => e.category === 'مشتريات').reduce((a, e) => a + (Number(e.amount) || 0), 0);
  const opNet = inc - (out - buyPaid) - useC - wasteC - saleC;
  const bk = bks.filter(b => b.status !== 'cancelled'), bDone = bk.filter(b => b.status === 'done').length, bNo = bk.filter(b => b.status === 'noshow').length;
  const bPast = bk.filter(b => b.date < todayStr()).length;
  const group = (l, key, val = () => 1) => { const o = {}; l.forEach(x => { const k = key(x) || '—'; o[k] = (o[k] || 0) + val(x); }); return Object.entries(o).sort((a, b) => b[1] - a[1]); };
  const box = (title, rows, fmtV = v => v.toLocaleString('ar-EG')) => {
    const max = rows[0]?.[1] || 0;
    return `<div class="card" style="display:flex;flex-direction:column;gap:12px"><h3>${title}</h3>${rows.length ? rows.slice(0, 10).map(([k, v]) => barRow(k, v, max, fmtV(v))).join('') : '<p class="meta">لا توجد بيانات.</p>'}</div>`;
  };

A.calcDebts = async () => {
  const box = document.getElementById('debtsBox');
  box.innerHTML = LOADING;
  try {
    const [pk, ss, pay, cls] = await Promise.all([getDocs(ccol('cpackages')), getDocs(ccol('sessions')), getDocs(ccol('payments')), getDocs(ccol('clients'))]);
    const bal = {};
    const add = (id, name, v) => { bal[id] = bal[id] || { name, v: 0 }; bal[id].v += v; };
    cls.forEach(d => { const x = d.data(); if (x.openingBalance) add(d.id, x.name, x.openingBalance); });
    pk.forEach(d => { const x = d.data(); if (!x.imported) add(x.clientId, x.clientName, x.price || 0); });
    ss.forEach(d => { const x = d.data(); if (!x.packageId) add(x.clientId, x.clientName, x.price || 0); });
    pay.forEach(d => { const x = d.data(); add(x.clientId, x.clientName, -(x.amount || 0)); });
    const list = Object.entries(bal).filter(([, b]) => b.v > 0).sort((a, b) => b[1].v - a[1].v);
    const tot = list.reduce((a, [, b]) => a + b.v, 0);
    S.debts = list;
    box.innerHTML = `<div class="head"><h3 style="flex:1">المديونيات (${list.length} عميل · ${money(tot)})</h3>${list.length ? '<button class="btn ghost sm" onclick="A.exportDebts()">تحميل Excel</button>' : ''}</div>
      ${list.length ? `<div class="tbl-wrap"><table><thead><tr><th>العميل</th><th>المتبقي</th><th></th></tr></thead><tbody>${list.map(([id, b]) => `<tr><td><b>${esc(b.name)}</b></td><td style="color:var(--red)"><b>${money(b.v)}</b></td><td><button class="btn ghost sm" onclick="A.openClient('${id}')">فتح</button></td></tr>`).join('')}</tbody></table></div>` : '<p class="meta">لا توجد مديونيات 👌</p>'}`;
  } catch (e) { console.error(e); box.innerHTML = `<div class="notice warn">تعذّر الحساب (${esc(e.code || e.message)})</div>`; }
};

let XLSXp = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!XLSXp) XLSXp = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload = () => res(window.XLSX);
    s.onerror = () => { XLSXp = null; rej(new Error('تعذّر تحميل مكتبة Excel، تأكد من الإنترنت')); };
    document.head.appendChild(s);
  });
  return XLSXp;
}
async function downloadXLSX(fileName, sheetName, rows) {
  try {
    const X = await loadXLSX();
    const ws = X.utils.aoa_to_sheet(rows);
    ws['!cols'] = rows[0].map(() => ({ wch: 18 }));
    const wb = X.utils.book_new();
    wb.Workbook = { Views: [{ RTL: true }] };
    X.utils.book_append_sheet(wb, ws, sheetName);
    X.writeFile(wb, fileName);
  } catch (e) { console.error(e); toast(e.message); }
}

const normTxt = v => String(v ?? '').toLowerCase().replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/[\s_\-:.()]/g, '');
const latinDigits = v => String(v ?? '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
function impNum(v) {
  const s = latinDigits(v).replace(/[,٬\s]/g, '').replace(/[^\d.\-]/g, '');
  if (!s) return null;
  const n = Number(s);
  return isNaN(n) ? null : n;
}
function impPhone(v) {
  let s = latinDigits(v).replace(/[^\d+]/g, '');
  if (s.startsWith('+20')) s = '0' + s.slice(3);
  else if (s.startsWith('0020')) s = '0' + s.slice(4);
  else if (s.length === 12 && s.startsWith('20')) s = '0' + s.slice(2);
  if (s.length === 10 && s.startsWith('1')) s = '0' + s;
  return s;
}
function impDate(v) {
  const s = latinDigits(v).trim();
  if (!s) return '';
  let m = s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if (m) {
    let [, a, b, y] = m;
    if (y.length === 2) y = (Number(y) > 50 ? '19' : '20') + y;
    let d = Number(a), mo = Number(b);
    if (mo > 12 && d <= 12) [d, mo] = [mo, d];
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return '';
    return `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  }
  return '';
}
function impGender(v) {
  const s = normTxt(v);
  if (!s) return 'f';
  if (/(female|انث|ست|سيده|بنت|^f$)/.test(s)) return 'f';
  if (/(male|ذكر|رجل|راجل|^m$|^ذ$)/.test(s)) return 'm';
  return 'f';
}
