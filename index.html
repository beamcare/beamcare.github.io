<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beam Care Clinic</title>
<meta name="theme-color" content="#2F6F68">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 220 220'%3E%3Crect width='220' height='220' rx='52' fill='%232F6F68'/%3E%3Cpath d='M110 40 L122 98 L180 110 L122 122 L110 180 L98 122 L40 110 L98 98 Z' fill='%23DDA86E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#2F6F68; --brand-d:#1F4E49; --gold:#C98F4E; --gold-l:#DDA86E; --mint:#A9CEC4;
  --bg:#F4F6F5; --card:#fff; --ink:#1E3B38; --muted:#5E7E79; --line:#DCE5E2;
  --red:#B3412F; --red-bg:#FBEDEA; --ok:#2E7D4F; --ok-bg:#E6F4EC; --warn:#8A5A12; --warn-bg:#FCF3E3;
}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,select{font-family:inherit;font-size:15px}
a{color:var(--brand)}
h1,h2,h3{margin:0}
.btn{border:0;border-radius:10px;padding:10px 18px;cursor:pointer;font-weight:700;min-height:44px;background:var(--brand);color:#fff}
.btn:hover{filter:brightness(.92)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.gold{background:var(--gold)}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--line)}
.btn.danger{background:var(--red)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:14px}
input,select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-height:44px}
input:focus,select:focus{outline:2px solid var(--mint);border-color:var(--brand)}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px;color:var(--muted)}
label.chk{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
label.chk input{width:20px;height:20px;min-height:0;accent-color:var(--brand)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}

/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login-card{background:#fff;border-radius:24px;padding:40px 32px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:18px;box-shadow:0 10px 40px rgba(30,59,56,.08)}
.login-brand{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.login-brand h1{font-size:24px;color:var(--brand)}
.login-brand p{margin:0;color:var(--muted);font-size:14px}
.err{background:var(--red-bg);color:var(--red);padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600}

/* shell */
.top{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.top .name{font-weight:800;font-size:18px;color:var(--brand)}
.top .sub{color:var(--muted);font-size:13px}
.top .sp{flex:1}
.layout{display:flex;gap:0;min-height:calc(100vh - 61px)}
.side{width:230px;background:#fff;border-left:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.side button{background:transparent;border:0;text-align:right;padding:10px 14px;border-radius:10px;cursor:pointer;color:var(--ink);font-weight:600;min-height:44px}
.side button:hover{background:var(--bg)}
.side button.on{background:var(--brand);color:#fff}
.main{flex:1;padding:24px;min-width:0;display:flex;flex-direction:column;gap:20px}
@media(max-width:820px){
  .layout{flex-direction:column}
  .side{width:auto;flex-direction:row;overflow-x:auto;border-left:0;border-bottom:1px solid var(--line);padding:8px}
  .side button{white-space:nowrap}
  .main{padding:16px}
}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.head h2{font-size:24px;flex:1}
.card{background:#fff;border-radius:16px;padding:20px;border:1px solid var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.clinic-card{display:flex;flex-direction:column;gap:12px}
.clinic-card .row{display:flex;align-items:center;gap:10px}
.clinic-card h3{font-size:18px;flex:1}
.meta{color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:6px 16px}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:700}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.bad{background:var(--red-bg);color:var(--red)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.mute{background:var(--bg);color:var(--muted)}
.tabs{display:flex;gap:6px;border-bottom:1.5px solid var(--line);overflow-x:auto}
.tabs button{background:transparent;border:0;padding:10px 16px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1.5px;white-space:nowrap;min-height:44px}
.tabs button.on{color:var(--brand);border-bottom-color:var(--gold)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{padding:12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-size:13px;font-weight:700;background:#FAFCFB}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:26px;color:var(--brand)}
.stat span{color:var(--muted);font-size:13px}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.bar i.full{background:var(--red)}
.notice{padding:14px 16px;border-radius:12px;font-weight:600}
.notice.warn{background:var(--warn-bg);color:var(--warn)}
.notice.info{background:#EAF3F1;color:var(--brand-d)}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.perms th,.perms td{text-align:center}
.perms td:first-child,.perms th:first-child{text-align:right}
.perms input{width:20px;height:20px;min-height:0;accent-color:var(--brand)}
.linkbox{display:flex;gap:8px}
.linkbox input{direction:ltr;text-align:left;font-size:13px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(20,40,38,.45);display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto;z-index:20}
.modal{background:#fff;border-radius:18px;width:100%;max-width:640px;padding:24px;display:flex;flex-direction:column;gap:16px}
.modal h3{font-size:20px}
.modal .acts{display:flex;gap:10px;justify-content:flex-start;flex-wrap:wrap}
.section-t{font-weight:800;color:var(--brand);font-size:15px;margin-top:4px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;z-index:30}
.loading{display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--muted)}
.locked{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center}
.locked .card{max-width:440px;display:flex;flex-direction:column;gap:14px;align-items:center}
</style>
</head>
<body>
<div id="app"><div class="loading">جاري التحميل...</div></div>
<div id="modal"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, getDocs, setDoc, updateDoc, addDoc, collection, query, where, Timestamp, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* =========================================================
   1) حط بيانات مشروع Firebase هنا
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyBF42mXPiwrPm4QKd55YtZVUtmZcbr3s_0",
  authDomain: "beamcare-clinic.firebaseapp.com",
  projectId: "beamcare-clinic",
  storageBucket: "beamcare-clinic.firebasestorage.app",
  messagingSenderId: "614318040492",
  appId: "1:614318040492:web:70fcf7b8de6be822684609"
};
// الدومين اللي بيتعمل بيه إيميل داخلي لكل يوزر (المستخدم بيكتب اسم المستخدم بس)
const EMAIL_DOMAIN = "beamcare-clinic.app";

/* ========================================================= */
const $app = document.getElementById('app');
const $modal = document.getElementById('modal');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

if (firebaseConfig.apiKey.startsWith('PASTE')) {
  $app.innerHTML = `<div class="locked"><div class="card">${ICON(64)}<h2>لسه محتاج إعداد</h2><p>افتح الملف وحط بيانات مشروع Firebase مكان <b>firebaseConfig</b> في أول الكود.</p></div></div>`;
  throw new Error('firebase config missing');
}

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
// تطبيق تاني بيستخدمه المطور لعمل يوزرات جديدة من غير ما يخرج من حسابه
const auth2 = getAuth(initializeApp(firebaseConfig, 'secondary'));

/* ---------------- الأدوار والصلاحيات ---------------- */
const ROLES = {
  owner:            { label: 'صاحب العيادة / رئيس مجلس الإدارة', scope: 'all' },
  accounts:         { label: 'الحسابات', scope: 'all' },
  branches_manager: { label: 'مدير الفروع', scope: 'branches' },
  branch_manager:   { label: 'مدير فرع', scope: 'branches' },
  reception:        { label: 'ريسبشن', scope: 'branches' },
  doctor:           { label: 'دكتور', scope: 'branches' },
  client:           { label: 'عميل', scope: 'branches' },
};
const STAFF_ROLES = Object.keys(ROLES).filter(r => r !== 'client');

const MODULES = [
  { key: 'clients',   label: 'العملاء' },
  { key: 'bookings',  label: 'الحجوزات' },
  { key: 'sessions',  label: 'الجلسات' },
  { key: 'packages',  label: 'باكدجات العملاء' },
  { key: 'payments',  label: 'الحسابات والخزنة' },
  { key: 'inventory', label: 'المخزن' },
  { key: 'staff',     label: 'الموظفين والمرتبات' },
  { key: 'devices',   label: 'الأجهزة والشوتات' },
  { key: 'reports',   label: 'التقارير' },
];
function permsFrom(list) {
  const o = {};
  MODULES.forEach(m => { o[m.key + '_view'] = false; o[m.key + '_edit'] = false; });
  if (list === '*') { Object.keys(o).forEach(k => o[k] = true); return o; }
  list.forEach(k => { o[k] = true; if (k.endsWith('_edit')) o[k.replace('_edit', '_view')] = true; });
  return o;
}
const ROLE_PERMS = {
  owner: permsFrom('*'),
  accounts: permsFrom(['payments_edit', 'reports_view', 'clients_view', 'packages_view', 'staff_view', 'inventory_view']),
  branches_manager: permsFrom(['clients_edit', 'bookings_edit', 'sessions_edit', 'packages_edit', 'payments_edit', 'inventory_edit', 'staff_view', 'devices_edit', 'reports_view']),
  branch_manager: permsFrom(['clients_edit', 'bookings_edit', 'sessions_edit', 'packages_edit', 'payments_view', 'inventory_edit', 'staff_view', 'devices_edit', 'reports_view']),
  reception: permsFrom(['clients_edit', 'bookings_edit', 'sessions_view', 'packages_view', 'payments_edit']),
  doctor: permsFrom(['clients_view', 'bookings_view', 'sessions_edit', 'devices_view']),
  client: permsFrom([]),
};

/* ---------------- أدوات ---------------- */
let S = {};
const A = window.A = {};

function ICON(size = 36) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 220 220" aria-hidden="true"><rect width="220" height="220" rx="52" fill="#2F6F68"/><path d="M110 40 L122 98 L180 110 L122 122 L110 180 L98 122 L40 110 L98 98 Z" fill="#DDA86E"/></svg>`;
}
function brandOf(c) {
  return c && c.whiteLabel
    ? { name: c.name, logo: c.logoUrl || '', color: c.color || '#2F6F68', white: true }
    : { name: 'Beam Care Clinic', logo: '', color: '#2F6F68', white: false };
}
function logoHTML(b, size = 36) {
  return b.logo ? `<img src="${esc(b.logo)}" alt="" style="width:${size}px;height:${size}px;border-radius:10px;object-fit:cover">` : ICON(size);
}
function applyBrand(c) {
  const b = brandOf(c);
  document.documentElement.style.setProperty('--brand', b.color);
  document.title = b.name;
}
const toDate = ts => ts && ts.toDate ? ts.toDate() : (ts ? new Date(ts) : null);
const fmt = ts => { const d = toDate(ts); return d ? d.toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' }) : '—'; };
const toInput = d => { d = toDate(d) || new Date(); const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; };
const endOfDay = s => new Date(s + 'T23:59:59');
const addMonths = (d, n) => { const x = new Date(d); x.setMonth(x.getMonth() + n); return x; };
const daysLeft = c => { const d = toDate(c.expiresAt); return d ? Math.ceil((d - new Date()) / 86400000) : 0; };
const clinicActive = c => c && c.active !== false && toDate(c.expiresAt) > new Date();
function statusChip(c) {
  if (c.active === false) return `<span class="chip bad">موقوفة</span>`;
  const d = daysLeft(c);
  if (d <= 0) return `<span class="chip bad">الاشتراك منتهي</span>`;
  if (d <= 7) return `<span class="chip warn">فاضل ${d} يوم</span>`;
  return `<span class="chip ok">شغالة</span>`;
}
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
function openModal(html) { $modal.innerHTML = `<div class="ov" onclick="if(event.target===this)A.closeModal()"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`; }
A.closeModal = () => { $modal.innerHTML = ''; };
function busy(btn, on, txt) { if (!btn) return; btn.disabled = on; if (txt) btn.textContent = txt; }
function branchNames(u, branches) {
  if (ROLES[u.role]?.scope === 'all') return 'كل الفروع';
  const n = (u.branchIds || []).map(id => branches.find(b => b.id === id)?.name).filter(Boolean);
  return n.length ? n.join('، ') : '—';
}
A.logout = async () => { await signOut(auth); };

/* ---------------- تسجيل الدخول ---------------- */
async function loginBrand() {
  const c = new URLSearchParams(location.search).get('c');
  if (!c) return brandOf(null);
  try { const b = await getDoc(doc(db, 'brands', c)); return b.exists() ? brandOf(b.data()) : brandOf(null); }
  catch { return brandOf(null); }
}
async function renderLogin(msg = '') {
  const b = await loginBrand();
  document.documentElement.style.setProperty('--brand', b.color);
  document.title = b.name;
  $app.innerHTML = `
  <div class="login"><form class="login-card" onsubmit="A.login(event)">
    <div class="login-brand">${logoHTML(b, 72)}<h1>${esc(b.name)}</h1><p>${b.white ? '' : 'سيستم إدارة العيادات'}</p></div>
    ${msg ? `<div class="err">${esc(msg)}</div>` : ''}
    <label class="f">اسم المستخدم<input name="u" autocomplete="username" required dir="ltr"></label>
    <label class="f">كلمة السر<input name="p" type="password" autocomplete="current-password" required dir="ltr"></label>
    <button class="btn" type="submit">دخول</button>
    ${b.white ? `<p style="margin:0;text-align:center;color:var(--muted);font-size:12px">Powered by Beam Care</p>` : ''}
  </form></div>`;
}
A.login = async e => {
  e.preventDefault();
  const f = e.target, btn = f.querySelector('button');
  const u = f.u.value.trim();
  const email = u.includes('@') ? u : `${u.toLowerCase()}@${EMAIL_DOMAIN}`;
  busy(btn, true, 'جاري الدخول...');
  try { await signInWithEmailAndPassword(auth, email, f.p.value); }
  catch (err) {
    console.error(err);
    const code = err.code || err.message || '';
    const msg = code.includes('api-key') ? 'مشكلة في إعدادات الربط (API key)'
      : code.includes('unauthorized-domain') ? 'الدومين ده مش مضاف في Firebase'
      : code.includes('too-many-requests') ? 'محاولات كتير، استنى شوية وجرّب تاني'
      : code.includes('network') ? 'مفيش اتصال بالإنترنت'
      : 'اسم المستخدم أو كلمة السر غلط';
    busy(btn, false, 'دخول');
    renderLogin(`${msg} (${code})`);
  }
};

onAuthStateChanged(auth, async u => {
  if (!u) { S = {}; return renderLogin(); }
  S = { user: u };
  $app.innerHTML = `<div class="loading">جاري التحميل...</div>`;
  try {
    const dev = await getDoc(doc(db, 'devs', u.uid));
    if (dev.exists()) { S.isDev = true; applyBrand(null); return A.devHome(); }
    const p = await getDoc(doc(db, 'users', u.uid));
    if (!p.exists() || p.data().active === false) { await signOut(auth); return renderLogin('الحساب ده موقوف أو مش موجود'); }
    S.profile = { id: u.uid, ...p.data() };
    const c = await getDoc(doc(db, 'clinics', S.profile.clinicId));
    S.clinic = { id: c.id, ...c.data() };
    applyBrand(S.clinic);
    if (!clinicActive(S.clinic)) return renderLocked();
    const bs = await getDocs(collection(db, 'clinics', S.clinic.id, 'branches'));
    S.branches = bs.docs.map(x => ({ id: x.id, ...x.data() }));
    A.go('home');
  } catch (e) {
    console.error(e);
    await signOut(auth);
    renderLogin('حصلت مشكلة في التحميل، جرّب تاني');
  }
});

function renderLocked() {
  const b = brandOf(S.clinic);
  const stopped = S.clinic.active === false;
  $app.innerHTML = `<div class="locked"><div class="card">${logoHTML(b, 64)}
    <h2>${stopped ? 'السيستم موقوف مؤقتاً' : 'الاشتراك انتهى'}</h2>
    <p style="margin:0;color:var(--muted)">${stopped ? 'تم إيقاف الحساب ده.' : `اشتراك ${esc(S.clinic.name)} انتهى يوم ${fmt(S.clinic.expiresAt)}.`} من فضلك تواصل مع Beam Care علشان ${stopped ? 'تفعيله' : 'التجديد'}.</p>
    <button class="btn ghost" onclick="A.logout()">خروج</button></div></div>`;
}

/* =========================================================
   لوحة المطور
   ========================================================= */
function devShell(content) {
  $app.innerHTML = `
  <div class="top">${ICON(36)}<div><div class="name">Beam Care Clinic</div><div class="sub">لوحة المطور</div></div><div class="sp"></div>
    <button class="btn ghost sm" onclick="A.logout()">خروج</button></div>
  <div class="main" style="max-width:1200px;margin:0 auto;width:100%">${content}</div>`;
}

A.devHome = async () => {
  devShell(`<div class="loading">جاري التحميل...</div>`);
  const snap = await getDocs(collection(db, 'clinics'));
  S.clinics = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar'));
  const active = S.clinics.filter(clinicActive).length;
  const soon = S.clinics.filter(c => clinicActive(c) && daysLeft(c) <= 7).length;
  devShell(`
    <div class="head"><h2>العيادات</h2><button class="btn gold" onclick="A.clinicModal()">+ عيادة جديدة</button></div>
    <div class="grid3">
      <div class="card stat"><b>${S.clinics.length}</b><span>كل العيادات</span></div>
      <div class="card stat"><b>${active}</b><span>اشتراك شغال</span></div>
      <div class="card stat"><b>${soon}</b><span>هتخلص خلال أسبوع</span></div>
    </div>
    ${S.clinics.length ? `<div class="cards">${S.clinics.map(c => {
      const b = brandOf({ ...c, whiteLabel: true });
      return `<div class="card clinic-card">
        <div class="row">${logoHTML(b, 40)}<h3>${esc(c.name)}</h3>${statusChip(c)}</div>
        <div class="meta"><span>ينتهي: ${fmt(c.expiresAt)}</span><span>فروع: ${c.plan?.maxBranches ?? 0}</span><span>يوزرات: ${c.plan?.maxUsers ?? 0}</span><span>عملاء: ${c.plan?.maxClients ?? 0}</span></div>
        <div class="meta">${c.whiteLabel ? '<span class="chip mute">باسم العيادة</span>' : ''}${c.features?.ownerManagesPerms ? '<span class="chip mute">صاحب العيادة بيدير الصلاحيات</span>' : ''}</div>
        <button class="btn sm" onclick="A.openClinic('${c.id}')">فتح</button>
      </div>`;
    }).join('')}</div>` : `<div class="card empty">لسه مفيش عيادات. اضغط "عيادة جديدة" علشان تبدأ.</div>`}
  `);
};

/* ----- نموذج العيادة ----- */
A.clinicModal = id => {
  const c = id ? S.dc : null;
  const start = c ? toInput(c.startAt) : toInput(new Date());
  const end = c ? toInput(c.expiresAt) : toInput(addMonths(new Date(), 1));
  openModal(`
  <h3>${c ? 'تعديل بيانات العيادة' : 'عيادة جديدة'}</h3>
  <form onsubmit="A.saveClinic(event,'${id || ''}')" style="display:flex;flex-direction:column;gap:14px">
    <label class="f">اسم العيادة<input name="name" required value="${esc(c?.name)}"></label>
    <div class="section-t">الباكدج</div>
    <div class="grid3">
      <label class="f">عدد الفروع<input name="mb" type="number" min="1" required value="${c?.plan?.maxBranches ?? 1}"></label>
      <label class="f">عدد اليوزرات (الموظفين)<input name="mu" type="number" min="1" required value="${c?.plan?.maxUsers ?? 5}"></label>
      <label class="f">عدد العملاء<input name="mc" type="number" min="0" required value="${c?.plan?.maxClients ?? 500}"></label>
    </div>
    <div class="section-t">مدة الاشتراك</div>
    <div class="grid2">
      <label class="f">من<input name="sd" type="date" required value="${start}"></label>
      <label class="f">لحد<input name="ed" type="date" required value="${end}"></label>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${[[1, 'شهر'], [3, '3 شهور'], [6, '6 شهور'], [12, 'سنة']].map(([m, l]) => `<button type="button" class="btn ghost sm" onclick="A.setDuration(this.form,${m})">${l}</button>`).join('')}
    </div>
    <div class="section-t">المميزات الإضافية</div>
    <label class="chk"><input type="checkbox" name="wl" ${c?.whiteLabel ? 'checked' : ''}> السيستم يظهر باسم العيادة ولوجوها</label>
    <label class="chk"><input type="checkbox" name="omp" ${c?.features?.ownerManagesPerms ? 'checked' : ''}> صاحب العيادة يقدر يعدّل صلاحيات يوزراته</label>
    <div class="grid2">
      <label class="f">لون العيادة<input name="color" type="color" value="${esc(c?.color || '#2F6F68')}" style="padding:4px"></label>
      <label class="f">رابط اللوجو (اختياري)<input name="logo" dir="ltr" placeholder="https://..." value="${esc(c?.logoUrl)}"></label>
    </div>
    <label class="chk"><input type="checkbox" name="act" ${c?.active === false ? '' : 'checked'}> العيادة مفعّلة</label>
    <div class="acts"><button class="btn" type="submit">حفظ</button><button class="btn ghost" type="button" onclick="A.closeModal()">إلغاء</button></div>
  </form>`);
};
A.setDuration = (f, m) => {
  const s = f.sd.value ? new Date(f.sd.value + 'T00:00:00') : new Date();
  f.ed.value = toInput(addMonths(s, m));
};
A.saveClinic = async (e, id) => {
  e.preventDefault();
  const f = e.target, btn = f.querySelector('[type=submit]');
  if (endOfDay(f.ed.value) <= new Date(f.sd.value + 'T00:00:00')) return toast('تاريخ النهاية لازم يكون بعد البداية');
  const data = {
    name: f.name.value.trim(),
    plan: { maxBranches: +f.mb.value, maxUsers: +f.mu.value, maxClients: +f.mc.value },
    startAt: Timestamp.fromDate(new Date(f.sd.value + 'T00:00:00')),
    expiresAt: Timestamp.fromDate(endOfDay(f.ed.value)),
    whiteLabel: f.wl.checked,
    features: { ownerManagesPerms: f.omp.checked },
    color: f.color.value,
    logoUrl: f.logo.value.trim(),
    active: f.act.checked,
  };
  busy(btn, true, 'جاري الحفظ...');
  try {
    if (id) await updateDoc(doc(db, 'clinics', id), data);
    else { data.createdAt = serverTimestamp(); id = (await addDoc(collection(db, 'clinics'), data)).id; }
    await setDoc(doc(db, 'brands', id), { name: data.name, logoUrl: data.logoUrl, color: data.color, whiteLabel: data.whiteLabel });
    A.closeModal(); toast('اتحفظ'); A.openClinic(id);
  } catch (err) { console.error(err); busy(btn, false, 'حفظ'); toast('مقدرتش أحفظ: ' + err.code); }
};

/* ----- صفحة العيادة ----- */
A.openClinic = async (id, tab = 'sub') => {
  devShell(`<div class="loading">جاري التحميل...</div>`);
  const [c, bs, us] = await Promise.all([
    getDoc(doc(db, 'clinics', id)),
    getDocs(collection(db, 'clinics', id, 'branches')),
    getDocs(query(collection(db, 'users'), where('clinicId', '==', id))),
  ]);
  S.dc = { id, ...c.data() };
  S.dBranches = bs.docs.map(d => ({ id: d.id, ...d.data() }));
  S.dUsers = us.docs.map(d => ({ id: d.id, ...d.data() }));
  S.dTab = tab;
  renderClinic();
};
function renderClinic() {
  const c = S.dc, tab = S.dTab;
  const staff = S.dUsers.filter(u => u.role !== 'client').length;
  const b = brandOf({ ...c, whiteLabel: true });
  let body = '';
  if (tab === 'sub') {
    const link = `${location.origin}${location.pathname}?c=${c.id}`;
    const usage = (n, max) => `<div class="bar"><i class="${n >= max ? 'full' : ''}" style="width:${Math.min(100, max ? n / max * 100 : 0)}%"></i></div>`;
    body = `
    <div class="grid3">
      <div class="card stat"><b>${S.dBranches.length} / ${c.plan?.maxBranches ?? 0}</b><span>الفروع</span>${usage(S.dBranches.length, c.plan?.maxBranches)}</div>
      <div class="card stat"><b>${staff} / ${c.plan?.maxUsers ?? 0}</b><span>اليوزرات</span>${usage(staff, c.plan?.maxUsers)}</div>
      <div class="card stat"><b>— / ${c.plan?.maxClients ?? 0}</b><span>العملاء (هيتحسب في المرحلة التانية)</span></div>
    </div>
    <div class="card" style="display:flex;flex-direction:column;gap:14px">
      <div class="head"><h3 style="flex:1">الاشتراك</h3>${statusChip(c)}</div>
      <div class="meta"><span>من: ${fmt(c.startAt)}</span><span>لحد: ${fmt(c.expiresAt)}</span><span>${daysLeft(c) > 0 ? `فاضل ${daysLeft(c)} يوم` : 'منتهي'}</span></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn sm" onclick="A.renew(1)">تجديد شهر</button>
        <button class="btn sm" onclick="A.renew(3)">تجديد 3 شهور</button>
        <button class="btn sm" onclick="A.renew(12)">تجديد سنة</button>
        <button class="btn ghost sm" onclick="A.clinicModal('${c.id}')">تعديل البيانات والباكدج</button>
        <button class="btn ${c.active === false ? '' : 'danger'} sm" onclick="A.toggleClinic()">${c.active === false ? 'تفعيل العيادة' : 'إيقاف العيادة'}</button>
      </div>
    </div>
    <div class="card" style="display:flex;flex-direction:column;gap:10px">
      <h3>لينك دخول العيادة</h3>
      <p style="margin:0;color:var(--muted);font-size:14px">${c.whiteLabel ? 'صفحة الدخول هتظهر باسم العيادة ولوجوها.' : 'صفحة الدخول هتظهر باسم Beam Care Clinic.'}</p>
      <div class="linkbox"><input readonly value="${esc(link)}"><button class="btn sm" onclick="navigator.clipboard.writeText('${esc(link)}');A.toast('اتنسخ')">نسخ</button></div>
    </div>`;
  } else if (tab === 'branches') {
    const full = S.dBranches.length >= (c.plan?.maxBranches ?? 0);
    body = `
    <div class="head"><h3 style="flex:1">الفروع (${S.dBranches.length} من ${c.plan?.maxBranches ?? 0})</h3>
      <button class="btn gold sm" ${full ? 'disabled title="وصلت لحد الباكدج"' : ''} onclick="A.branchModal()">+ فرع</button></div>
    ${full ? `<div class="notice warn">العيادة وصلت لعدد الفروع اللي في الباكدج. زوّد الباكدج من تبويب الاشتراك.</div>` : ''}
    ${S.dBranches.length ? `<div class="card tbl-wrap" style="padding:0"><table>
      <thead><tr><th>الفرع</th><th>العنوان</th><th>التليفون</th><th>الحالة</th><th></th></tr></thead>
      <tbody>${S.dBranches.map(x => `<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.address) || '—'}</td><td dir="ltr" style="text-align:right">${esc(x.phone) || '—'}</td>
        <td>${x.active === false ? '<span class="chip bad">مقفول</span>' : '<span class="chip ok">شغال</span>'}</td>
        <td><button class="btn ghost sm" onclick="A.branchModal('${x.id}')">تعديل</button></td></tr>`).join('')}</tbody></table></div>`
      : `<div class="card empty">مفيش فروع لسه. أضف أول فرع.</div>`}`;
  } else {
    const full = staff >= (c.plan?.maxUsers ?? 0);
    body = `
    <div class="head"><h3 style="flex:1">اليوزرات (${staff} من ${c.plan?.maxUsers ?? 0} موظف)</h3>
      <button class="btn gold sm" onclick="A.userModal()">+ يوزر</button></div>
    ${full ? `<div class="notice warn">العيادة وصلت لعدد اليوزرات اللي في الباكدج. تقدر تضيف عملاء بس.</div>` : ''}
    ${!S.dBranches.length ? `<div class="notice info">ضيف فرع الأول علشان تقدر تربط اليوزرات بيه.</div>` : ''}
    ${S.dUsers.length ? `<div class="card tbl-wrap" style="padding:0"><table>
      <thead><tr><th>الاسم</th><th>اسم المستخدم</th><th>الدور</th><th>الفروع</th><th>الحالة</th><th></th></tr></thead>
      <tbody>${S.dUsers.sort((a, b) => STAFF_ROLES.indexOf(a.role) - STAFF_ROLES.indexOf(b.role)).map(u => `<tr>
        <td><b>${esc(u.name)}</b></td><td dir="ltr" style="text-align:right">${esc(u.username)}</td><td>${esc(ROLES[u.role]?.label)}</td>
        <td>${esc(branchNames(u, S.dBranches))}</td>
        <td>${u.active === false ? '<span class="chip bad">موقوف</span>' : '<span class="chip ok">شغال</span>'}</td>
        <td><button class="btn ghost sm" onclick="A.userModal('${u.id}')">تعديل</button></td></tr>`).join('')}</tbody></table></div>`
      : `<div class="card empty">مفيش يوزرات لسه. ابدأ بصاحب العيادة.</div>`}`;
  }
  devShell(`
    <div><button class="btn ghost sm" onclick="A.devHome()">→ كل العيادات</button></div>
    <div class="head">${logoHTML(b, 48)}<h2>${esc(c.name)}</h2>${statusChip(c)}</div>
    <div class="tabs">
      ${[['sub', 'الاشتراك'], ['branches', 'الفروع'], ['users', 'اليوزرات والصلاحيات']].map(([k, l]) => `<button class="${tab === k ? 'on' : ''}" onclick="A.clinicTab('${k}')">${l}</button>`).join('')}
    </div>${body}`);
}
A.clinicTab = t => { S.dTab = t; renderClinic(); };
A.toast = toast;

A.renew = async months => {
  const c = S.dc;
  const base = new Date(Math.max(Date.now(), toDate(c.expiresAt)?.getTime() || 0));
  const end = addMonths(base, months); end.setHours(23, 59, 59);
  await updateDoc(doc(db, 'clinics', c.id), { expiresAt: Timestamp.fromDate(end), active: true });
  toast('اتجدد لحد ' + fmt(end)); A.openClinic(c.id, 'sub');
};
A.toggleClinic = async () => {
  const c = S.dc, on = c.active === false;
  if (!on && !confirm(`متأكد إنك عايز توقف ${c.name}؟ محدش من العيادة هيقدر يدخل.`)) return;
  await updateDoc(doc(db, 'clinics', c.id), { active: on });
  toast(on ? 'العيادة اتفعّلت' : 'العيادة اتوقفت'); A.openClinic(c.id, 'sub');
};

/* ----- الفروع ----- */
A.branchModal = id => {
  const x = id ? S.dBranches.find(b => b.id === id) : null;
  openModal(`<h3>${x ? 'تعديل فرع' : 'فرع جديد'}</h3>
  <form onsubmit="A.saveBranch(event,'${id || ''}')" style="display:flex;flex-direction:column;gap:14px">
    <label class="f">اسم الفرع<input name="name" required value="${esc(x?.name)}"></label>
    <label class="f">العنوان<input name="address" value="${esc(x?.address)}"></label>
    <label class="f">التليفون<input name="phone" dir="ltr" value="${esc(x?.phone)}"></label>
    <label class="chk"><input type="checkbox" name="act" ${x?.active === false ? '' : 'checked'}> الفرع شغال</label>
    <div class="acts"><button class="btn" type="submit">حفظ</button><button class="btn ghost" type="button" onclick="A.closeModal()">إلغاء</button></div>
  </form>`);
};
A.saveBranch = async (e, id) => {
  e.preventDefault();
  const f = e.target, c = S.dc;
  if (!id && S.dBranches.length >= (c.plan?.maxBranches ?? 0)) return toast('وصلت لحد الفروع في الباكدج');
  const data = { name: f.name.value.trim(), address: f.address.value.trim(), phone: f.phone.value.trim(), active: f.act.checked };
  busy(f.querySelector('[type=submit]'), true, 'جاري الحفظ...');
  try {
    if (id) await updateDoc(doc(db, 'clinics', c.id, 'branches', id), data);
    else await addDoc(collection(db, 'clinics', c.id, 'branches'), { ...data, createdAt: serverTimestamp() });
    A.closeModal(); toast('اتحفظ'); A.openClinic(c.id, 'branches');
  } catch (err) { console.error(err); toast('مقدرتش أحفظ: ' + err.code); }
};

/* ----- اليوزرات والصلاحيات ----- */
function permsGrid(perms) {
  return `<div class="tbl-wrap" style="border:1px solid var(--line);border-radius:12px"><table class="perms">
    <thead><tr><th>القسم</th><th>عرض</th><th>تعديل</th></tr></thead>
    <tbody>${MODULES.map(m => `<tr><td>${m.label}</td>
      <td><input type="checkbox" name="p_${m.key}_view" aria-label="عرض ${m.label}" ${perms[m.key + '_view'] ? 'checked' : ''} onchange="A.permTick(this)"></td>
      <td><input type="checkbox" name="p_${m.key}_edit" aria-label="تعديل ${m.label}" ${perms[m.key + '_edit'] ? 'checked' : ''} onchange="A.permTick(this)"></td></tr>`).join('')}</tbody></table></div>`;
}
A.permTick = el => {
  const f = el.form, [, key, kind] = el.name.split('_');
  if (kind === 'edit' && el.checked) f[`p_${key}_view`].checked = true;
  if (kind === 'view' && !el.checked) f[`p_${key}_edit`].checked = false;
};
function readPerms(f) {
  const o = {};
  MODULES.forEach(m => {
    o[m.key + '_edit'] = f[`p_${m.key}_edit`].checked;
    o[m.key + '_view'] = f[`p_${m.key}_view`].checked || o[m.key + '_edit'];
  });
  return o;
}
function setPerms(f, perms) { MODULES.forEach(m => { f[`p_${m.key}_view`].checked = !!perms[m.key + '_view']; f[`p_${m.key}_edit`].checked = !!perms[m.key + '_edit']; }); }

A.userModal = id => {
  const u = id ? S.dUsers.find(x => x.id === id) : null;
  const role = u?.role || 'owner';
  const perms = u?.perms || ROLE_PERMS[role];
  openModal(`<h3>${u ? 'تعديل يوزر' : 'يوزر جديد'}</h3>
  <form onsubmit="A.saveUser(event,'${id || ''}')" style="display:flex;flex-direction:column;gap:14px">
    <div class="grid2">
      <label class="f">الاسم<input name="name" required value="${esc(u?.name)}"></label>
      <label class="f">الدور<select name="role" onchange="A.roleChanged(this)">${Object.entries(ROLES).map(([k, r]) => `<option value="${k}" ${k === role ? 'selected' : ''}>${r.label}</option>`).join('')}</select></label>
    </div>
    ${u ? `<div class="meta"><span>اسم المستخدم: <b dir="ltr">${esc(u.username)}</b></span></div>` : `
    <div class="grid2">
      <label class="f">اسم المستخدم (إنجليزي)<input name="username" required dir="ltr" pattern="[a-zA-Z0-9._\\-]{3,30}" title="حروف إنجليزي وأرقام بس، من 3 لـ 30"></label>
      <label class="f">كلمة السر<input name="pass" required dir="ltr" minlength="6"></label>
    </div>`}
    <div id="brWrap" style="display:${ROLES[role].scope === 'all' ? 'none' : 'flex'};flex-direction:column;gap:8px">
      <div class="section-t">الفروع</div>
      ${S.dBranches.length ? `<div style="display:flex;gap:16px;flex-wrap:wrap">${S.dBranches.map(b => `<label class="chk"><input type="checkbox" name="br" value="${b.id}" ${(u?.branchIds || []).includes(b.id) ? 'checked' : ''}> ${esc(b.name)}</label>`).join('')}</div>`
        : `<div class="notice info">مفيش فروع لسه.</div>`}
    </div>
    <div id="permWrap" style="display:${role === 'client' ? 'none' : 'flex'};flex-direction:column;gap:8px">
      <div class="head"><div class="section-t" style="flex:1">الصلاحيات</div><button type="button" class="btn ghost sm" onclick="A.resetPerms(this.form)">رجّع صلاحيات الدور الافتراضية</button></div>
      ${permsGrid(perms)}
    </div>
    <label class="chk"><input type="checkbox" name="act" ${u?.active === false ? '' : 'checked'}> اليوزر شغال</label>
    <div class="acts"><button class="btn" type="submit">حفظ</button><button class="btn ghost" type="button" onclick="A.closeModal()">إلغاء</button></div>
  </form>`);
};
A.roleChanged = sel => {
  const f = sel.form, r = sel.value;
  document.getElementById('brWrap').style.display = ROLES[r].scope === 'all' ? 'none' : 'flex';
  document.getElementById('permWrap').style.display = r === 'client' ? 'none' : 'flex';
  setPerms(f, ROLE_PERMS[r]);
};
A.resetPerms = f => setPerms(f, ROLE_PERMS[f.role.value]);

A.saveUser = async (e, id) => {
  e.preventDefault();
  const f = e.target, c = S.dc, btn = f.querySelector('[type=submit]');
  const role = f.role.value;
  const branchIds = ROLES[role].scope === 'all' ? [] : [...f.querySelectorAll('[name=br]:checked')].map(x => x.value);
  if (ROLES[role].scope !== 'all' && !branchIds.length) return toast('اختار فرع واحد على الأقل');
  const wasStaff = id ? S.dUsers.find(x => x.id === id).role !== 'client' : false;
  const staffCount = S.dUsers.filter(u => u.role !== 'client').length;
  if (role !== 'client' && !wasStaff && staffCount >= (c.plan?.maxUsers ?? 0)) return toast('وصلت لحد اليوزرات في الباكدج');
  const data = { name: f.name.value.trim(), role, branchIds, perms: role === 'client' ? ROLE_PERMS.client : readPerms(f), active: f.act.checked, clinicId: c.id };
  busy(btn, true, 'جاري الحفظ...');
  try {
    if (id) {
      await updateDoc(doc(db, 'users', id), data);
    } else {
      const username = f.username.value.trim().toLowerCase();
      const cred = await createUserWithEmailAndPassword(auth2, `${username}@${EMAIL_DOMAIN}`, f.pass.value);
      await signOut(auth2);
      await setDoc(doc(db, 'users', cred.user.uid), { ...data, username, createdAt: serverTimestamp() });
    }
    A.closeModal(); toast('اتحفظ'); A.openClinic(c.id, 'users');
  } catch (err) {
    console.error(err); busy(btn, false, 'حفظ');
    toast(err.code === 'auth/email-already-in-use' ? 'اسم المستخدم ده مستخدم قبل كده' : err.code === 'auth/weak-password' ? 'كلمة السر ضعيفة (6 حروف على الأقل)' : 'مقدرتش أحفظ: ' + err.code);
  }
};

/* =========================================================
   سيستم العيادة (لكل اليوزرات غير المطور)
   ========================================================= */
const can = k => !!S.profile?.perms?.[k];
const isOwner = () => S.profile?.role === 'owner';
const ownerPerms = () => isOwner() && S.clinic?.features?.ownerManagesPerms;

function clinicShell(view, content) {
  const b = brandOf(S.clinic);
  const nav = [['home', 'الرئيسية']];
  if (S.profile.role !== 'client') MODULES.forEach(m => { if (can(m.key + '_view')) nav.push([m.key, m.label]); });
  if (ownerPerms()) nav.push(['team', 'اليوزرات والصلاحيات']);
  $app.innerHTML = `
  <div class="top">${logoHTML(b, 36)}<div><div class="name">${esc(b.name)}</div><div class="sub">${esc(S.profile.name)} · ${esc(ROLES[S.profile.role]?.label)}</div></div><div class="sp"></div>
    <button class="btn ghost sm" onclick="A.logout()">خروج</button></div>
  <div class="layout"><nav class="side">${nav.map(([k, l]) => `<button class="${view === k ? 'on' : ''}" onclick="A.go('${k}')">${l}</button>`).join('')}</nav>
  <div class="main">${content}</div></div>`;
}

A.go = async view => {
  if (view === 'home') return renderHome();
  if (view === 'team') return renderTeam();
  const m = MODULES.find(x => x.key === view);
  if (!m || !can(m.key + '_view')) return renderHome();
  clinicShell(view, `<div class="head"><h2>${m.label}</h2></div>
    <div class="card empty">القسم ده هيتبني في المرحلة الجاية.<br><span style="font-size:13px">صلاحيتك هنا: ${can(m.key + '_edit') ? 'عرض وتعديل' : 'عرض بس'}</span></div>`);
};

function renderHome() {
  const c = S.clinic, d = daysLeft(c);
  const seesSub = ['owner', 'accounts'].includes(S.profile.role);
  const myBranches = branchNames(S.profile, S.branches);
  clinicShell('home', `
    <div class="head"><h2>أهلاً ${esc(S.profile.name)}</h2></div>
    ${seesSub && d <= 7 ? `<div class="notice warn">الاشتراك هيخلص بعد ${d} يوم (${fmt(c.expiresAt)}). كلّم Beam Care علشان التجديد.</div>` : ''}
    <div class="grid3">
      <div class="card stat"><b style="font-size:18px">${esc(ROLES[S.profile.role]?.label)}</b><span>دورك</span></div>
      <div class="card stat"><b style="font-size:18px">${esc(myBranches)}</b><span>الفروع</span></div>
      ${seesSub ? `<div class="card stat"><b style="font-size:18px">${fmt(c.expiresAt)}</b><span>نهاية الاشتراك (فاضل ${d} يوم)</span></div>` : ''}
    </div>
    ${isOwner() ? `<div class="card" style="display:flex;flex-direction:column;gap:10px"><h3>الباكدج</h3>
      <div class="meta"><span>الفروع: ${S.branches.length} من ${c.plan?.maxBranches ?? 0}</span><span>اليوزرات: حتى ${c.plan?.maxUsers ?? 0}</span><span>العملاء: حتى ${c.plan?.maxClients ?? 0}</span></div></div>` : ''}
    ${S.profile.role === 'client' ? `<div class="card empty">صفحة حجوزاتك وباكدجاتك هتكون هنا قريب.</div>` : ''}
  `);
}

async function renderTeam() {
  if (!ownerPerms()) return renderHome();
  clinicShell('team', `<div class="loading">جاري التحميل...</div>`);
  const us = await getDocs(query(collection(db, 'users'), where('clinicId', '==', S.clinic.id)));
  S.team = us.docs.map(d => ({ id: d.id, ...d.data() })).filter(u => u.role !== 'owner' && u.role !== 'client');
  clinicShell('team', `
    <div class="head"><h2>اليوزرات والصلاحيات</h2></div>
    <div class="notice info">تقدر تحدد كل موظف يشوف ويعدّل إيه. لإضافة يوزر جديد أو إيقافه كلّم Beam Care.</div>
    ${S.team.length ? `<div class="card tbl-wrap" style="padding:0"><table>
      <thead><tr><th>الاسم</th><th>الدور</th><th>الفروع</th><th>الحالة</th><th></th></tr></thead>
      <tbody>${S.team.map(u => `<tr><td><b>${esc(u.name)}</b></td><td>${esc(ROLES[u.role]?.label)}</td><td>${esc(branchNames(u, S.branches))}</td>
        <td>${u.active === false ? '<span class="chip bad">موقوف</span>' : '<span class="chip ok">شغال</span>'}</td>
        <td><button class="btn ghost sm" onclick="A.teamPerms('${u.id}')">الصلاحيات</button></td></tr>`).join('')}</tbody></table></div>`
      : `<div class="card empty">مفيش موظفين لسه.</div>`}`);
}
A.teamPerms = id => {
  const u = S.team.find(x => x.id === id);
  openModal(`<h3>صلاحيات ${esc(u.name)}</h3>
  <div class="meta"><span>${esc(ROLES[u.role]?.label)}</span><span>${esc(branchNames(u, S.branches))}</span></div>
  <form onsubmit="A.saveTeamPerms(event,'${id}')" style="display:flex;flex-direction:column;gap:14px">
    <input type="hidden" name="role" value="${u.role}">
    <div class="head"><div class="section-t" style="flex:1">الصلاحيات</div><button type="button" class="btn ghost sm" onclick="A.resetPerms(this.form)">رجّع الافتراضي</button></div>
    ${permsGrid(u.perms || ROLE_PERMS[u.role])}
    <div class="acts"><button class="btn" type="submit">حفظ</button><button class="btn ghost" type="button" onclick="A.closeModal()">إلغاء</button></div>
  </form>`);
};
A.saveTeamPerms = async (e, id) => {
  e.preventDefault();
  try { await updateDoc(doc(db, 'users', id), { perms: readPerms(e.target) }); A.closeModal(); toast('اتحفظت الصلاحيات'); renderTeam(); }
  catch (err) { console.error(err); toast('مقدرتش أحفظ: ' + err.code); }
};
</script>
</body>
</html>
