function impPrepare() {
  const I = S.imp, M = I.map;
  const get = (r, k) => M[k] === undefined ? '' : String(r[M[k]] ?? '').trim();
  const has = k => M[k] !== undefined;
  const seen = new Set((S.dClientList || []).map(c => impPhone(c.phone)).filter(Boolean));
  const brs = S.dBranches.map(b => ({ id: b.id, n: normTxt(b.name) }));
  const out = { records: [], dup: 0, noName: 0, withPkg: 0, debt: 0 };
  I.rows.forEach(r => {
    const name = get(r, 'name');
    if (!name) { out.noName++; return; }
    const phone = impPhone(get(r, 'phone'));
    if (phone) { if (seen.has(phone)) { out.dup++; return; } seen.add(phone); }
    let branchId = I.defBranch;
    const bn = normTxt(get(r, 'branch'));
    if (bn) { const b = brs.find(x => x.n && (bn.includes(x.n) || x.n.includes(bn))); if (b) branchId = b.id; }
    const regDate = impDate(get(r, 'regDate'));
    const c = { name, phone, phone2: impPhone(get(r, 'phone2')), address: get(r, 'address'), gender: impGender(get(r, 'gender')), birth: impDate(get(r, 'birth')), notes: get(r, 'notes'), branchId, regDate, openingBalance: 0 };
    const price = impNum(get(r, 'pkgPrice')), paid = impNum(get(r, 'pkgPaid'));
    if (has('debt')) c.openingBalance = Math.max(0, impNum(get(r, 'debt')) || 0);
    else if (price != null && paid != null) c.openingBalance = Math.max(0, price - paid);
    let total = impNum(get(r, 'pkgTotal')), usedN = impNum(get(r, 'pkgUsed')), left = impNum(get(r, 'pkgLeft'));
    let p = null;
    if ((total || 0) > 0 || (left || 0) > 0) {
      if (!(total > 0)) total = (left || 0) + (usedN || 0);
      let usedV = usedN != null ? usedN : (left != null ? total - left : 0);
      usedV = Math.min(Math.max(0, usedV), total);
      p = { name: get(r, 'pkgName') || I.defPkg || 'باقة سابقة', unit: I.unit, totalSessions: total, usedSessions: usedV, price: price || 0 };
      out.withPkg++;
    }
    out.debt += c.openingBalance;
    out.records.push({ c, p });
  });
  return out;
}

// شبكة المواعيد لليوم: من الفتح للقفل كل "step" دقيقة
function slotGrid(pub) { const o = toMin(pub.open), c = toMin(pub.close), st = Number(pub.step) || 30, L = []; if (o == null || c == null) return L; for (let m = o; m + st <= c; m += st) L.push(m); return L; }
// فريق العيادة اللي بيتحجز معاه (من الإعدادات): أيام شغله وساعاته وإجازاته
const staffWorks = (s, date, from, to) => {
  const wd = new Date(date + 'T12:00:00').getDay();
  if (s.days && !s.days.includes(wd)) return false;
  if ((s.off || []).includes(date)) return false;
  const a = toMin(s.from) ?? 0, b = toMin(s.to) ?? 24 * 60;
  return from >= a && to <= b;
};
// المواعيد اللي تنفع تبدأ فيها خدمة مدتها dur:
// الجهاز (لو ليه جهاز) لسه فيه مكان + حد من الفريق اللي بيعمل الخدمة فاضي وشغال + مفيش حجز مبدئي في نفس الوقت
// null = اليوم إجازة للعيادة
function availStarts(pub, bz, o) {
  const st = Number(pub.step) || 30, c = toMin(pub.close);
  const need = Math.max(1, Math.ceil((Number(o.dur) || st) / st));
  const wd = new Date(o.date + 'T12:00:00').getDay();
  if ((pub.off || []).includes(wd)) return null;
  const now = new Date(), isToday = o.date === todayStr(), nowM = now.getHours() * 60 + now.getMinutes() + 30;
  const res = o.resId ? (pub.res || []).find(r => r.id === o.resId) : null;
  const R = (bz?.r || {})[o.resId] || {}, SS = bz?.s || {}, H = bz?.h || {}, T = bz?.t || {};
  const useT = !res && !(pub.res || []).length;
  const cap = Math.max(1, Number(pub.cap) || 1);
  const team = o.staffCands ? (pub.staff || []).filter(s => o.staffCands.includes(s.id) && (!o.branchId || !s.branchIds?.length || s.branchIds.includes(o.branchId))) : null;
  const out = [];
  for (const m of slotGrid(pub)) {
    if (isToday && m < nowM) continue;
    if (m + need * st > c) continue;
    const keys = Array.from({ length: need }, (_, i) => fromMin(m + i * st));
    if (keys.some(k => H[k])) continue;
    if (res && keys.some(k => (R[k] || 0) >= Math.max(1, Number(res.count) || 1))) continue;
    if (useT && keys.some(k => (T[k] || 0) >= cap)) continue;
    let who = '';
    if (team) {
      const free = team.find(s => staffWorks(s, o.date, m, m + need * st) && keys.every(k => !(SS[s.id] || {})[k]));
      if (!free) continue;
      who = free.id;
    }
    out.push({ m, staff: who });
  }
  return out;
}
// الفريق اللي يقدر يعمل كل الخدمات اللي العميل اختارها (null = مفيش تحديد، أي حد)
function staffFor(svcs, pub) {
  const lists = svcs.map(x => x.staffIds || []).filter(l => l.length);
  if (!lists.length) return (pub.staff || []).length ? (pub.staff || []).map(s => s.id) : null;
  return lists.reduce((a, l) => a.filter(id => l.includes(id)));
}
// مرة في اليوم: نحسب المواعيد المشغولة لكل الأيام الجاية (علشان الحجوزات اللي اتعملت قبل تشغيل الحجز أونلاين)

    const months = [...new Set([today.slice(0, 7), end.slice(0, 7), (() => { const x = new Date(today + 'T12:00:00'); x.setMonth(x.getMonth() + 1); return toInput(x).slice(0, 7); })()])].filter(m => m <= end.slice(0, 7));
    const lists = await Promise.all(months.map(m => getDocs(query(ccol('bookings'), where('branchId', '==', branchId), where('month', '==', m))).then(s => s.docs.map(d => d.data())).catch(() => [])));

// الريسبشن بيحسب المواعيد المشغولة من الحجوزات الفعلية (بعد أي حجز أو إلغاء أو تعديل):
// t = كل الحجوزات، r = لكل جهاز، s = لكل حد في الفريق، h = حجوزات أونلاين لسه متأكدتش
async function syncBusy(branchId, date) {
  if (!feat('onlineBooking') || !branchId || !/^\d{4}-\d{2}-\d{2}$/.test(date || '')) return;
  if (!can('bookings_edit') && !can('sessions_edit')) return;
  try {
    const pub = await loadPubCfg(), st = Number(pub.step) || 30, o = toMin(pub.open) ?? 0;
    await loadServices();
    const [bs, os] = await Promise.all([
      getDocs(query(ccol('bookings'), where('branchId', '==', branchId), where('date', '==', date))),
      can('bookings_view') ? getDocs(query(ccol('online'), where('status', '==', 'new'))).catch(() => null) : null,
    ]);
    const t = {}, r = {}, s = {}, h = {};
    const add = (obj, k) => { obj[k] = (obj[k] || 0) + 1; };
    const occ = (time, dur, resId, staffId, hold) => {
      let m = toMin(time); if (m == null) return;
      m = m - (((m - o) % st) + st) % st;
      const n = Math.max(1, Math.ceil((Number(dur) || st) / st));
      for (let i = 0; i < n; i++) {
        const k = fromMin(m + i * st);
        add(t, k);
        if (resId) add(r[resId] = r[resId] || {}, k);
        if (staffId) add(s[staffId] = s[staffId] || {}, k);
      }
      if (hold) h[fromMin(m)] = 1;
    };
    const svcOf = name => svcFlat().find(x => x.name === name);
    bs.docs.forEach(d => {
      const b = d.data(); if (!['booked', 'arrived', 'done'].includes(b.status || 'booked')) return;
      const sv = svcOf(b.service);
      occ(b.time, b.dur || sv?.dur, b.resId || sv?.resId || '', b.doctorId || '', false);
    });
    os?.docs.forEach(d => { const q = d.data(); if (q.branchId === branchId && q.date === date && q.time) occ(q.time, q.dur, q.resId || '', q.staffId || '', true); });
    await setDoc(cdoc('busy', branchId + '_' + date), { t, r, s, h, last: '' });
  } catch (e) { console.error(e); }
}

function renderCSettingsKeep() {
  const f = document.querySelector('.main form'); const keep = {};
  if (f) [...f.elements].forEach(el => { if (el.name) keep[el.name] = el.type === 'checkbox' ? el.checked : el.value; });
  const y = window.scrollY;
  renderCSettings().then(() => { const g = document.querySelector('.main form'); if (g) Object.entries(keep).forEach(([k, v]) => { const el = g.elements[k]; if (!el || el.length) return; if (el.type === 'checkbox') el.checked = v; else el.value = v; }); window.scrollTo(0, y); });
}
A.saveCSettings = async e => {
  e.preventDefault();
  const f = e.target, btn = f.querySelector('[type=submit]');
  const brs = (S.branches || []).filter(b => b.active !== false);
  const pickBr = brs.length > 1 ? brs.filter(b => f['bbr_' + b.id]?.checked) : brs;
  const main = {};
  if (isOwner() && f['rp_reception_svc']) main.rp = Object.fromEntries(RP_ROLES.map(r => [r, Object.fromEntries(RP_KEYS.map(([k]) => [k, k === 'disc' ? Math.max(0, Math.min(100, Math.round(Number(f[`rp_${r}_${k}`].value) || 0))) : f[`rp_${r}_${k}`].checked]))]));
  if (f.remind) main.remindTpl = f.remind.value.trim() || REMIND_DEF;
  if (f.consent) main.consentText = f.consent.value.trim() || CONSENT_DEF;
  if (f.rwa) main.reportWa = f.rwa.value.trim();
  if (f.lon) main.loyalty = { on: f.lon.checked, per100: Math.max(0, Number(f.lper.value) || 0), referral: Math.max(0, Math.round(Number(f.lref.value) || 0)), value: Math.max(0, Number(f.lval.value) || 0) };
  let pub = null;
  if (f.bon) {
    if ((toMin(f.bclose.value) ?? 0) <= (toMin(f.bopen.value) ?? 0)) return toast('يجب أن تكون ساعة الإغلاق بعد ساعة الفتح');
    const brIds = (S.branches || []).map(b => b.id);
    const res = (S.resDraft || []).filter(r => r.name.trim()).map(r => ({ id: r.id, name: r.name.trim().slice(0, 40), count: Math.max(1, Math.min(20, Math.round(Number(r.count) || 1))), branchId: r.branchId || brIds[0] || '' }));
    const staff = (S.staff || []).filter(x => S.staffDraft?.[x.id]?.on).map(x => { const d = S.staffDraft[x.id]; return { id: x.id, name: x.name, role: x.role || '', branchIds: x.branchIds || [], days: d.days, from: d.from, to: d.to, off: d.off.filter(o => o >= todayStr()).slice(0, 60) }; });
    pub = { on: f.bon.checked, wa: f.bwa.value.trim(), pay: { vf: (f.bvf?.value || '').trim().slice(0, 40), insta: (f.bin?.value || '').trim().slice(0, 60) }, branches: pickBr.map(b => ({ id: b.id, name: b.name })), open: f.bopen.value, close: f.bclose.value, step: Number(f.bstep.value) || 30, showPrice: f.bprice.checked, res, staff,
      cap: Math.max(1, Math.min(20, Math.round(Number(f.bcap.value) || 1))), ahead: Math.max(1, Math.min(120, Math.round(Number(f.bahead.value) || 30))), off: [0, 1, 2, 3, 4, 5, 6].filter(i => f['boff_' + i]?.checked) };
  }
  busy(btn, true, 'جارٍ الحفظ...');
  try {
    await Promise.all([isOwner() && Object.keys(main).length ? setDoc(cdoc('cfg', 'main'), main, { merge: true }) : null, pub ? setDoc(cdoc('cfg', 'public'), pub) : null]);
    if (pub) { S.pubCfg = { ...PUB_DEF, ...pub }; S.resDraft = null; S.staffDraft = null; if (pub.on) (S.branches || []).forEach(b => syncBusyRange(b.id, true)); }

};

A.bookQr = async () => {

    try { await document.fonts?.load('800 36px Cairo'); } catch (e) {}

// ألوان صفحة الحجز من لوجو العيادة نفسه: أكتر لونين واضحين في اللوجو
function logoPalette(url) {
  return new Promise(ok => { if (!url) return ok(null); const im = new Image(); im.crossOrigin = 'anonymous';
    im.onload = () => { try {
      const W = 64, H = Math.max(1, Math.round(64 * im.height / im.width)); const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const g = cv.getContext('2d'); g.drawImage(im, 0, 0, W, H);
      const d = g.getImageData(0, 0, W, H).data, B = {};
      for (let i = 0; i < d.length; i += 4) { if (d[i + 3] < 200) continue; const r = d[i], gg = d[i + 1], b = d[i + 2], mx = Math.max(r, gg, b), mn = Math.min(r, gg, b);
        if (mx - mn < 40 || mx < 50 || mn > 225) continue; const k = (r >> 5) + ',' + (gg >> 5) + ',' + (b >> 5); const o = B[k] = B[k] || { n: 0, r: 0, g: 0, b: 0 }; o.n++; o.r += r; o.g += gg; o.b += b; }
      const L = Object.values(B).sort((a, b) => b.n - a.n).map(o => [o.r / o.n, o.g / o.n, o.b / o.n]);
      if (!L.length) return ok(null);
      const hex = c => '#' + c.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('');
      const lum = c => (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255;
      // اللون الأساسي لازم يبقى غامق كفاية علشان الكلام الأبيض يبان عليه
      let p = L[0]; while (lum(p) > 0.42) p = p.map(v => v * 0.85);
      const s2 = L.find(c => Math.abs(c[0] - L[0][0]) + Math.abs(c[1] - L[0][1]) + Math.abs(c[2] - L[0][2]) > 90) || null;
      ok({ brand: hex(p), dark: hex(p.map(v => v * 0.7)), accent: s2 ? hex(s2) : null, tint: hex(p.map(v => 255 - (255 - v) * 0.1)) });
    } catch (e) { ok(null); } };
    im.onerror = () => ok(null); im.src = url; });
}

    if (P.shopOn) return '<p class="meta" style="margin:0;text-align:center">الطلب بيوصل العيادة على طول، وهيكلموك للتسليم.</p>';

    if (P.step === 2) return `${P.picked.length ? `<div style="display:flex;gap:6px;flex-wrap:wrap;max-height:76px;overflow-y:auto">${sel().map(x => `<span style="display:inline-flex;align-items:center;gap:4px;background:var(--ok-bg);color:var(--brand);border-radius:99px;padding:4px 6px 4px 10px;font-size:13px;font-weight:600">${esc(x.name)}<button type="button" aria-label="إزالة ${esc(x.name)}" onclick="BK.pick('${x.id}',false)" style="border:0;background:transparent;color:inherit;cursor:pointer;font-size:15px;line-height:1;padding:0 2px">×</button></span>`).join('')}</div><div style="display:flex;justify-content:space-between;font-size:14px"><span>${n(P.picked.length)} ${P.picked.length === 1 ? 'خدمة' : 'خدمات'} · ${n(totDur())} دقيقة</span>${pub.showPrice ? `<b>${money(totPrice())}</b>` : ''}</div>` : wa ? `<p class="meta" style="justify-content:center;margin:0">محتاج مساعدة؟ <a href="${wa}" target="_blank" rel="noopener">كلّمنا على واتساب</a></p>` : ''}${btn('كمّل واختار الميعاد ←', 'BK.go(3)', !P.picked.length && !P.offer)}`;
    if (P.step === 3) return btn(P.time ? `${esc(dayName(P.date))} · ${esc(time12(P.time))} ← التالي` : 'اختر موعدًا', 'BK.go(4)', !P.time);
    return btn('احجز الموعد', 'BK.submit()', false);
  }
  function draw() {
    $app.innerHTML = `<div style="max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)">${head()}
      <main style="flex:1;padding:16px 18px;display:flex;flex-direction:column;gap:14px">${P.shopOn ? shopView() : (P.step === 2 && SHOP.length ? `<button type="button" onclick="BK.shop(true)" style="font:inherit;cursor:pointer;text-align:right;display:flex;gap:10px;align-items:center;background:#fff;border:1.5px dashed var(--brand);border-radius:16px;padding:12px 14px;color:var(--ink)"><span style="font-size:26px">🛍️</span><span style="flex:1;display:flex;flex-direction:column"><b>اطلب منتجاتنا</b><span class="meta" style="font-size:13px">${SHOP.length.toLocaleString('ar-EG')} منتجات وبوكسات — من غير حجز</span></span><b style="color:var(--brand)">←</b></button>` : '') + body()}<p style="margin:8px 0 0;text-align:center;color:var(--muted);font-size:11px;opacity:.75">Powered by Beam Care</p></main>
      <footer style="position:sticky;bottom:0;padding:12px 18px calc(16px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px">${foot()}</footer></div>`;
  }
  try { history.replaceState({ bk: 2 }, ''); } catch (e) {}
  window.onpopstate = e => { if (P.step === 5) return; const st = e.state?.bk || 2; if (st === 3) return BK.go(3, true); P.step = st; if (st === 2 && groups.length > 1) P.cat = e.state?.cat ? groups.find(g => g.id === e.state.cat) || null : null; draw(); window.scrollTo(0, 0); };
  window.BK = {
    shop: on => { P.shopOn = !!on; P.shopDone = false; draw(); window.scrollTo(0, 0); },
    cart: (id, d) => { P.cart[id] = Math.max(0, Math.min(20, (P.cart[id] || 0) + d)); draw(); },
    order: async () => {
      const err = m => { const e = document.getElementById('shErr'); if (e) e.innerHTML = `<div class="err" role="alert">${m}</div>`; };
      const name = P.name.trim(), phone = latinDigits(P.phone).replace(/[^\d+]/g, '');
      if (name.length < 2) return err('اكتب اسمك'); if (!/^[+]?[0-9]{8,15}$/.test(phone)) return err('اكتب رقم موبايل صحيح');
      if (Date.now() - t0 < 4000) return err('لحظة واحدة… راجع طلبك واضغط تاني.');
      const lines = SHOP.filter(x => P.cart[x.id] > 0).map(x => ({ ref: x.id, name: x.name.slice(0, 80), qty: P.cart[x.id], price: x.price })).slice(0, 20);
      if (!lines.length) return err('اختر منتجًا');
      const total = lines.reduce((a, l) => a + l.qty * l.price, 0);
      try { const bt = writeBatch(db); const data = { name, phone, lines, total, status: 'new', createdAt: serverTimestamp(), ...(P.br ? { branchId: P.br.id } : {}) };
        if (P.proofImg) { const pr = doc(collection(db, 'clinics', cid, 'proofs')); bt.set(pr, { img: P.proofImg, kind: 'order', clientId: '', branchId: P.br?.id || '', createdAt: serverTimestamp(), createdBy: '', createdByName: name.slice(0, 80) }); data.proofId = pr.id; }
        bt.set(doc(collection(db, 'clinics', cid, 'orders')), data); await bt.commit(); bcNotify(cid, 'order');
        P.phone = phone; P.cart = {}; P.proofImg = null; P.proofName = ''; P.shopDone = true; draw(); window.scrollTo(0, 0);
      } catch (x) { console.error(x); err('ما قدرناش نبعت الطلب — جرّب تاني بعد شوية.'); }
    },
    proof: async file => { if (!file) return; try { P.proofImg = await shrinkImg(file, 1000); P.proofName = file.name; P.depOpen = true; draw(); } catch (e) { alert('ما قدرناش نقرا الصورة، جرّب صورة تانية'); } },
    back: () => { if (P.step > 2 && P.step < 5) history.back(); },
    jump: k => { if (k === P.step) return; if (k < P.step) { history.go(k - P.step); return; } BK.go(k); },
    cat: id => { P.cat = groups.find(g => g.id === id) || P.cat; try { history.pushState({ bk: 2, cat: id }, ''); } catch (e) {} draw(); window.scrollTo(0, 0); },
    cats: () => { if (history.state?.cat) history.back(); else { P.cat = null; draw(); } },
    noOffer: () => { P.offer = null; draw(); },
    offer: id => {
      const o = offers.find(x => x.id === id); if (!o) return;
      P.offer = o; P.cat = null;
      const first = (o.items || []).map(i => svx.find(s => s.id === i.svcId)).find(Boolean);
      P.picked = first ? [first.id] : [];
      if (first && (first.gender === 'f' || first.gender === 'm')) P.gender = first.gender;
      BK.go(3);
    },
    gender: g => { P.gender = g; P.picked = P.picked.filter(id => { const x = svx.find(y => y.id === id); return (x?.gender || 'all') === 'all' || x.gender === g; }); draw(); },
    pick: (id, on) => { P.picked = on ? [...new Set([...P.picked, id])] : P.picked.filter(x => x !== id); draw(); },
    go: (s, fromPop) => { if (!fromPop && s > P.step) { try { history.pushState({ bk: s }, ''); } catch (e) {} } P.step = s; if (s === 3) { P.time = ''; if (P.staff && !(team() || []).some(x => x.id === P.staff)) P.staff = ''; return loadSlots(); } draw(); window.scrollTo(0, 0); },
    branch: id => { P.br = brs.find(b => b.id === id) || null; P.time = ''; loadSlots(); },
    staff: id => { P.staff = id; P.time = ''; loadSlots(); },
    date: d => { P.date = d; P.time = ''; loadSlots(); },
    time: (t, who) => { P.time = t; P.who = who; draw(); },
    f: (k, v) => { P[k] = v; },
    submit: async () => {
      const err = m => { const e = document.getElementById('bkErr'); if (e) e.innerHTML = `<div class="err" role="alert">${m}</div>`; };
      const name = P.name.trim(), phone = latinDigits(P.phone).replace(/[^\d+]/g, '');
      if (name.length < 2) return err('اكتب اسمك');
      if (!/^[+]?[0-9]{8,15}$/.test(phone)) return err('اكتب رقم موبايل صحيح');
      if (document.getElementById('bkHp')?.value) { P.step = 5; return draw(); }
      if (Date.now() - t0 < 4000) return err('لحظة واحدة… راجع بياناتك واضغط تاني.');
      let sent = []; try { sent = JSON.parse(localStorage.getItem('bc-bk-' + cid) || '[]').filter(t => Date.now() - t < 864e5); } catch (x) {}
      if (sent.length >= 3) return err('بعت طلبات كتير النهارده. لو محتاج حاجة كلّمنا على واتساب.');
      const svList = sel(), staffId = P.staff || P.who || '';
      const st = (pub.staff || []).find(s => s.id === staffId);
      const data = { name, phone, date: P.date, time: P.time, status: 'new', createdAt: serverTimestamp(), service: svList.map(x => x.name).join(' + ').slice(0, 240), dur: Math.min(600, Math.round(totDur())) };
      const resId = svList.find(x => x.resId)?.resId; if (resId) data.resId = resId;
      if (staffId) { data.staffId = staffId; if (P.staff && st) data.staffName = String(st.name || '').slice(0, 80); }
      if (P.br) { data.branchId = P.br.id; data.branchName = P.br.name; }
      if (svList.some(x => x.gender === 'f' || x.gender === 'm')) data.gender = P.gender;
      const extra = [P.offer ? 'عرض: ' + P.offer.name : '', P.want ? 'يريد معرفة تفاصيل عرض: ' + P.want : ''].filter(Boolean).join(' · ');
      const nt = [extra, P.notes.trim()].filter(Boolean).join(' — ');
      if (nt) data.notes = nt.slice(0, 500);
      if (!svList.length && P.offer) data.service = ('عرض: ' + P.offer.name).slice(0, 240);
      const b = document.querySelector('footer .btn'); busy(b, true, 'جارٍ الحجز...');
      try {
        const bt = writeBatch(db);
        if (P.proofImg) { const pr = doc(collection(db, 'clinics', cid, 'proofs')); bt.set(pr, { img: P.proofImg, kind: 'online', clientId: '', branchId: data.branchId || '', createdAt: serverTimestamp(), createdBy: '', createdByName: name.slice(0, 80) }); data.proofId = pr.id; }
        if (Number(P.dep) > 0) data.paidClaim = Math.min(1e6, Number(P.dep));
        const onRef = doc(collection(db, 'clinics', cid, 'online'));
        bt.set(onRef, data);
        bt.set(busyRef(), { h: { [P.time]: 1 }, last: P.time }, { merge: true });
        await bt.commit();
        bcNotify(cid, 'book');
        try { localStorage.setItem('bc-bk-' + cid, JSON.stringify([...sent, Date.now()])); } catch (x) {}
        P.phone = phone; P.step = 5; draw(); window.scrollTo(0, 0);
      } catch (x) {
        console.error(x); busy(b, false, 'احجز الموعد');
        if (x.code === 'permission-denied') { P.step = 3; P.time = ''; await loadSlots(); const e = document.querySelector('main'); if (e) e.insertAdjacentHTML('afterbegin', '<div class="err" role="alert">الميعاد ده لسه اتحجز حالًا 🙏 اختار ميعاد تاني.</div>'); }
        else err('ما قدرناش نبعت الطلب — جرّب تاني بعد شوية.');
      }
    },
  };
  if (!groups.length && !offers.length && SHOP.length) P.shopOn = true;
  if (!groups.length && !offers.length && !SHOP.length) { $app.innerHTML = `<div class="locked"><div class="card">${logoHTML(B, 64)}<h2>${esc(B.name)}</h2><p>الحجز أونلاين بيتجهز.${wa ? ` <a href="${wa}" target="_blank" rel="noopener">كلّمنا على واتساب</a>.` : ''}</p></div></div>`; return; }
  draw();
}

};

function campDue() {
  const c = S.cfg?.campSched; if (!c?.on || !(c.days || []).includes(new Date().getDay())) return 0;
  const [h, m] = String(c.time || '12:00').split(':').map(Number), now = new Date(), base = new Date(); base.setHours(h, m || 0, 0, 0);
  let slot = 0; for (let i = 0; i < (c.times || 1); i++) { const t = new Date(base.getTime() + i * 3 * 36e5); if (now >= t) slot = i + 1; }
  if (!slot) return 0; let done = 0; try { done = Number(localStorage.getItem('bc-campdone-' + S.clinic.id + '-' + todayStr()) || 0); } catch (e) {}
  return done < slot ? slot : 0;
}
async function campAudience(C) {
  let L = (S.clients || []).filter(c => c.phone);
  // ما يتبعتش نفس العرض لنفس العميل تاني قبل المدة اللي اتحددت (علشان الرقم ما يتقفلش سبام)
  const gap = Number(S.cfg?.campSched?.gap) || 0;
  if (gap) { let sent = {}; try { sent = JSON.parse(localStorage.getItem('bc-camp-' + S.clinic.id + '-' + C.offerId) || '{}'); } catch (e) {} L = L.filter(c => !sent[c.id] || Date.now() - sent[c.id] >= gap * 864e5); }
  if (C.gender !== 'all') L = L.filter(c => (c.gender || 'f') === C.gender);
  if (C.branch) L = L.filter(c => c.branchId === C.branch);
  if (C.bday) { const m = todayStr().slice(5, 7); L = L.filter(c => (c.birth || '').slice(5, 7) === m); }
  if (C.cat || C.away) {
    if (!S.campSess) { try { S.campSess = (await getDocs(ccol('sessions'))).docs.map(d => d.data()); } catch (e) { S.campSess = []; } }
    if (C.cat) {
      const names = new Set((S.services || []).filter(x => x.catId === C.cat).map(x => x.name));
      const ids = new Set(S.campSess.filter(x => names.has(x.area) || [...names].some(n => (x.area || '').includes(n))).map(x => x.clientId));
      L = L.filter(c => ids.has(c.id));
    }
    if (C.away) {
      const last = {}; S.campSess.forEach(x => { if (!last[x.clientId] || x.date > last[x.clientId]) last[x.clientId] = x.date; });
      const lim = (() => { const d = new Date(); d.setDate(d.getDate() - C.away); return toInput(d); })();
      L = L.filter(c => last[c.id] && last[c.id] < lim);
    }
  }
  if (C.noPkg) {
    if (!S.campPk) { try { S.campPk = (await getDocs(ccol('cpackages'))).docs.map(d => d.data()); } catch (e) { S.campPk = []; } }
    const act = new Set(S.campPk.filter(p => pLeft(p) > 0).map(p => p.clientId));
    L = L.filter(c => !act.has(c.id));
  }
  return L.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar'));
}

A.campSend = async id => {
  const c = (S.campList || []).find(x => x.id === id); if (!c) return;
  const cv = document.getElementById('offerCv');

  if (!shared) {
    try { if (blob && navigator.clipboard && window.ClipboardItem) { await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]); toast('تم نسخ الصورة — الصقها في المحادثة قبل الإرسال'); } else { A.campDownload(); toast('تم تحميل الصورة — أرسلها مع الرسالة'); } }

// رسم صورة العرض (١٠٨٠×١٠٨٠) بلوجو العيادة وألوانها
async function drawOffer(cv, o, styleKey, upload) {
  if (!cv) return;
  const x = cv.getContext('2d'), W = cv.width, H = cv.height;
  const loadImg = (src, cors) => new Promise((res, rej) => { const im = new Image(); if (cors) im.crossOrigin = 'anonymous'; im.onload = () => res(im); im.onerror = rej; im.src = src; });
  if (upload) { try { const im = await loadImg(upload); const s = Math.max(W / im.width, H / im.height); x.drawImage(im, (W - im.width * s) / 2, (H - im.height * s) / 2, im.width * s, im.height * s); } catch (e) {} return; }
  try { await document.fonts?.load('800 60px Cairo'); await document.fonts?.load('700 30px Cairo'); } catch (e) {}
  const st = OFFER_STYLES[styleKey] || OFFER_STYLES.brand;
  const css = getComputedStyle(document.body);
  const brand = css.getPropertyValue('--brand').trim() || '#163A6B', gold = css.getPropertyValue('--gold-l').trim() || '#D7AE57';
  const bg = st.bg || brand, acc = st.acc || (styleKey === 'white' ? brand : gold), ink = st.ink, sub = st.sub;

  x.direction = 'rtl'; x.textAlign = 'right';
  // اللوجو والاسم
  const lx = W - 80 - 96, ly = 70;
  let logoOk = false;
  if (b.logo) { try { const im = await loadImg(b.logo, true); x.save(); x.beginPath(); x.roundRect ? x.roundRect(lx, ly, 96, 96, 22) : x.rect(lx, ly, 96, 96); x.clip(); x.fillStyle = '#fff'; x.fillRect(lx, ly, 96, 96); const s = Math.min(96 / im.width, 96 / im.height); x.drawImage(im, lx + (96 - im.width * s) / 2, ly + (96 - im.height * s) / 2, im.width * s, im.height * s); x.restore(); x.getImageData(0, 0, 1, 1); logoOk = true; } catch (e) { logoOk = false; } }
  if (!logoOk) { x.fillStyle = styleKey === 'white' ? brand : '#ffffff'; x.beginPath(); x.roundRect ? x.roundRect(lx, ly, 96, 96, 22) : x.rect(lx, ly, 96, 96); x.fill(); x.fillStyle = styleKey === 'white' ? '#fff' : brand; x.textAlign = 'center'; x.font = '800 40px Cairo, sans-serif'; x.fillText((b.name || '').trim().split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase(), lx + 48, ly + 62); x.textAlign = 'right'; }
  x.fillStyle = ink; x.font = '800 40px Cairo, sans-serif'; x.fillText(b.name, lx - 24, ly + 62);
  // شارة
  x.fillStyle = acc; x.beginPath(); x.roundRect ? x.roundRect(80, ly + 22, 220, 56, 28) : x.rect(80, ly + 22, 220, 56); x.fill();
  x.fillStyle = styleKey === 'lux' || styleKey === 'brand' ? '#1E1B18' : '#ffffff'; x.textAlign = 'center'; x.font = '800 28px Cairo, sans-serif'; x.fillText(o?.until ? 'عرض لفترة محدودة' : 'عرض خاص', 190, ly + 60); x.textAlign = 'right';
  if (!o) return;
  // اسم العرض (سطرين بالكتير)
  const wrap = (t, maxW, font) => { x.font = font; const ws = String(t).split(/\s+/), L = []; let cur = ''; ws.forEach(w => { const tr = cur ? cur + ' ' + w : w; if (x.measureText(tr).width > maxW && cur) { L.push(cur); cur = w; } else cur = tr; }); if (cur) L.push(cur); return L; };
  x.fillStyle = sub; x.font = '700 34px Cairo, sans-serif'; x.fillText(o.kind === 'combo' ? 'باكدج مجمّع' : o.kind === 'package' ? 'باكدج' : 'جلسة', W - 80, 300);
  const tl = wrap(o.name, W - 160, '800 92px Cairo, sans-serif').slice(0, 2);
  x.fillStyle = acc; x.font = '800 92px Cairo, sans-serif'; tl.forEach((l, i) => x.fillText(l, W - 80, 400 + i * 104));
  let y = 400 + tl.length * 104 + 20;
  const items = o.kind === 'combo' ? (o.items || []).map(i => `${Number(i.n) > 1 ? Number(i.n).toLocaleString('ar-EG') + ' جلسة ' : ''}${i.name}`) : o.kind === 'package' ? [`${Number(o.sessions).toLocaleString('ar-EG')} ${unitOf(o)}`] : [];
  x.font = '700 44px Cairo, sans-serif';
  items.slice(0, 5).forEach(t => { x.fillStyle = acc; x.beginPath(); x.arc(W - 92, y - 14, 10, 0, Math.PI * 2); x.fill(); x.fillStyle = ink; x.fillText(t, W - 120, y); y += 66; });

  const orig = o.kind === 'combo' ? (o.items || []).reduce((a, i) => a + (Number((S.services || []).find(s => s.id === i.svcId)?.price) || 0) * (Number(i.n) || 1), 0) : 0;
  x.textAlign = 'right';

  x.fillStyle = ink; x.font = '800 96px Cairo, sans-serif'; x.fillText(money(o.price), W - 80, bandY + 178);

  else { x.fillText('احجز الآن', 80, bandY + 100); if (S.pubCfg?.wa) { x.direction = 'ltr'; x.fillStyle = ink; x.font = '800 38px Cairo, sans-serif'; x.fillText(S.pubCfg.wa, 80, bandY + 150); x.direction = 'rtl'; } }
}
