<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beam Care</title>
<meta name="theme-color" content="#2F6F68">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 220 220'%3E%3Crect width='220' height='220' rx='52' fill='%232F6F68'/%3E%3Cpath d='M110 40 L122 98 L180 110 L122 122 L110 180 L98 122 L40 110 L98 98 Z' fill='%23DDA86E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#2F6F68; --brand-d:#1F4E49; --gold:#C98F4E; --gold-l:#DDA86E; --mint:#A9CEC4;
  --bg:#F4F6F5; --card:#fff; --ink:#1E3B38; --muted:#5E7E79; --line:#DCE5E2;
  --red:#B3412F; --red-bg:#FBEDEA; --ok:#2E7D4F; --ok-bg:#E6F4EC; --warn:#8A5A12; --warn-bg:#FCF3E3;
}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,select{font-family:inherit;font-size:15px}
a{color:var(--brand)}
h1,h2,h3{margin:0}
.btn{border:0;border-radius:10px;padding:10px 18px;cursor:pointer;font-weight:700;min-height:44px;background:var(--brand);color:#fff}
.btn:hover{filter:brightness(.92)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.gold{background:var(--gold)}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--line)}
.btn.danger{background:var(--red)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:14px}
input,select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-height:44px}
input:focus,select:focus{outline:2px solid var(--mint);border-color:var(--brand)}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px;color:var(--muted)}
label.chk{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
label.chk input{width:20px;height:20px;min-height:0;accent-color:var(--brand)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:900px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}

/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login-card{background:#fff;border-radius:24px;padding:40px 32px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:18px;box-shadow:0 10px 40px rgba(30,59,56,.08)}
.login-brand{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.login-brand h1{font-size:24px;color:var(--brand)}
.login-brand p{margin:0;color:var(--muted);font-size:14px}
.err{background:var(--red-bg);color:var(--red);padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600}

/* shell */
.top{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5;flex-wrap:wrap}
.fcol{display:flex;flex-direction:column;gap:14px}
.top .name{font-weight:800;font-size:18px;color:var(--brand)}
.top .sub{color:var(--muted);font-size:13px}
.top .sp{flex:1}
.layout{display:flex;gap:0;min-height:calc(100vh - 61px)}
.side{width:230px;background:#fff;border-left:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.side button{background:transparent;border:0;text-align:right;padding:10px 14px;border-radius:10px;cursor:pointer;color:var(--ink);font-weight:600;min-height:44px}
.side button:hover{background:var(--bg)}
.side button.on{background:var(--brand);color:#fff}
.side button{display:flex;align-items:center;gap:10px}
.nico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
body.ico-filled .side .nico{fill:currentColor;stroke:var(--card,#fff);stroke-width:1.3}
body.ico-duotone .side .nico{fill:var(--mint);stroke:var(--brand)}
body.ico-circle .side .nico{background:var(--brand);stroke:#fff;border-radius:50%;padding:5px;box-sizing:content-box}
body.ico-square .side .nico{background:var(--soft);stroke:var(--brand);border-radius:8px;padding:5px;box-sizing:content-box}
body.ico-circle .side button.on,body.ico-square .side button.on{background:var(--soft);color:var(--ink)}
body.nav-top .layout{flex-direction:column}
body.nav-top .side{width:auto;flex-direction:row;overflow-x:auto;border-left:0;border-bottom:1px solid var(--line);padding:8px}
body.nav-top .side button{white-space:nowrap}
body.nav-top .side .side-end{margin-top:0;margin-inline-start:auto;border-top:0;padding-top:0;flex-direction:row}
body.nav-rail .side{width:74px;align-items:stretch}
body.nav-rail .side button{justify-content:center;padding:10px 6px}
body.nav-rail .side button span{display:none}
body.lk-dark .card,body.lk-dark .top,body.lk-dark .side,body.lk-dark table,body.lk-dark .modal,body.lk-dark input,body.lk-dark select,body.lk-dark textarea,body.lk-dark .login-card,body.lk-dark .locked .card{background:#1B1B1F;color:var(--ink)}
body.lk-dark .btn,body.lk-dark .side button.on{color:#111}
body.lk-dark .btn.ghost{color:var(--brand);background:transparent}
body.lk-dark .chip.mute{background:#2A2A2E}
body.lk-dark th{color:var(--muted)}
.side .side-end{margin-top:auto;border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:4px}
.side .side-end button.out{color:var(--red)}
.main{flex:1;padding:24px;min-width:0;display:flex;flex-direction:column;gap:20px}
@media(max-width:820px){
  .layout{flex-direction:column}
  .side{width:auto;flex-direction:row;overflow-x:auto;border-left:0;border-bottom:1px solid var(--line);padding:8px}
  .side button{white-space:nowrap}
  .side .side-end{margin-top:0;margin-inline-start:auto;border-top:0;padding-top:0;flex-direction:row}
  body.nav-rail .side{width:auto;flex-direction:row}
  body.nav-bottom .side{position:fixed;bottom:0;left:0;right:0;z-index:20;justify-content:space-around;border-bottom:0;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  body.nav-bottom .side button{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px;min-height:52px}
  body.nav-bottom .main{padding-bottom:96px}
  .main{padding:16px}
}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.head h2{font-size:24px;flex:1}
.card{background:#fff;border-radius:16px;padding:20px;border:1px solid var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.clinic-card{display:flex;flex-direction:column;gap:12px}
.clinic-card .row{display:flex;align-items:center;gap:10px}
.clinic-card h3{font-size:18px;flex:1}
.meta{color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:6px 16px}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:700}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.bad{background:var(--red-bg);color:var(--red)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.mute{background:var(--bg);color:var(--muted)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.theme-o{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer;font-size:13px;min-height:44px}
.theme-o:has(input:checked){border-color:var(--brand);background:var(--ok-bg)}
.theme-o input{position:absolute;opacity:0;pointer-events:none}
.theme-o:has(input:focus-visible){outline:3px solid var(--gold);outline-offset:2px}
.theme-o .sw{display:flex;gap:3px;padding:4px;border-radius:8px;border:1px solid var(--line);flex:none}
.theme-o .sw i{width:12px;height:18px;border-radius:4px;display:block}
.tabs{display:flex;gap:6px;border-bottom:1.5px solid var(--line);overflow-x:auto}
.tabs button{background:transparent;border:0;padding:10px 16px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1.5px;white-space:nowrap;min-height:44px}
.tabs button.on{color:var(--brand);border-bottom-color:var(--gold)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{padding:12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-size:13px;font-weight:700;background:#FAFCFB}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:26px;color:var(--brand)}
.stat span{color:var(--muted);font-size:13px}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.bar i.full{background:var(--red)}
.notice{padding:14px 16px;border-radius:12px;font-weight:600}
.notice.warn{background:var(--warn-bg);color:var(--warn)}
.notice.info{background:#EAF3F1;color:var(--brand-d)}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.perms th,.perms td{text-align:center}
.perms td:first-child,.perms th:first-child{text-align:right}
.perms input{width:20px;height:20px;min-height:0;accent-color:var(--brand)}
.linkbox{display:flex;gap:8px}
.linkbox input{direction:ltr;text-align:left;font-size:13px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(20,40,38,.45);display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto;z-index:20}
.modal{background:#fff;border-radius:18px;width:100%;max-width:640px;padding:24px;display:flex;flex-direction:column;gap:16px}
.modal h3{font-size:20px}
.modal .acts{display:flex;gap:10px;justify-content:flex-start;flex-wrap:wrap}
.section-t{font-weight:800;color:var(--brand);font-size:15px;margin-top:4px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;z-index:30}
.loading{display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--muted)}
.locked{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center}
@media print{.top,.side,.btn,#installBtn,.tabs{display:none!important}.main{padding:0}}
.locked .card{max-width:440px;display:flex;flex-direction:column;gap:14px;align-items:center}
</style>
</head>
<body>
<div id="app"><div class="loading">جاري التحميل...</div></div>
<div id="modal"></div>
<button id="installBtn" class="btn gold sm" style="display:none;position:fixed;bottom:16px;left:16px;z-index:15;box-shadow:0 6px 20px rgba(0,0,0,.2)" onclick="A.install()">ثبّت الأبليكيشن على جهازك</button>

<script type="module">
import { initializeApp, deleteApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, createUserWithEmailAndPassword, EmailAuthProvider, reauthenticateWithCredential, updatePassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, onSnapshot, getCountFromServer, getAggregateFromServer, sum, doc, getDoc, getDocs, setDoc, updateDoc, addDoc, deleteDoc, collection, query, where, orderBy, limit, Timestamp, serverTimestamp, writeBatch, increment, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* =========================================================
   1) حط بيانات مشروع Firebase هنا
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyBF42mXPiwrPm4QKd55YtZVUtmZcbr3s_0",
  authDomain: "beamcare-clinic.firebaseapp.com",
  projectId: "beamcare-clinic",
  storageBucket: "beamcare-clinic.firebasestorage.app",
  messagingSenderId: "614318040492",
  appId: "1:614318040492:web:70fcf7b8de6be822684609"
};
// الدومين اللي بيتعمل بيه إيميل داخلي لكل يوزر (المستخدم بيكتب اسم المستخدم بس)
const EMAIL_DOMAIN = "beamcare-clinic.app";

/* ========================================================= */
const $app = document.getElementById('app');
const $modal = document.getElementById('modal');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

if (firebaseConfig.apiKey.startsWith('PASTE')) {
  $app.innerHTML = `<div class="locked"><div class="card">${ICON(64)}<h2>لسه محتاج إعداد</h2><p>افتح الملف وحط بيانات مشروع Firebase مكان <b>firebaseConfig</b> في أول الكود.</p></div></div>`;
  throw new Error('firebase config missing');
}

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
// تطبيق تاني بيستخدمه المطور لعمل يوزرات جديدة من غير ما يخرج من حسابه
const auth2 = getAuth(initializeApp(firebaseConfig, 'secondary'));

/* ---------------- الأدوار والصلاحيات ---------------- */
const ROLES = {
  owner:            { label: 'صاحب العيادة / رئيس مجلس الإدارة', scope: 'all' },
  accounts:         { label: 'الحسابات', scope: 'all' },
  branches_manager: { label: 'مدير الفروع', scope: 'branches' },
  branch_manager:   { label: 'مدير فرع', scope: 'branches' },
  reception:        { label: 'ريسبشن', scope: 'branches' },
  doctor:           { label: 'دكتور', scope: 'branches' },
  client:           { label: 'عميل', scope: 'branches' },
};
const STAFF_ROLES = Object.keys(ROLES).filter(r => r !== 'client');

const MODULES = [
  { key: 'clients',   label: 'العملاء' },
  { key: 'bookings',  label: 'الحجوزات' },
  { key: 'sessions',  label: 'الجلسات' },
  { key: 'packages',  label: 'باكدجات العملاء' },
  { key: 'payments',  label: 'الحسابات والخزنة' },
  { key: 'inventory', label: 'المخزن' },
  { key: 'staff',     label: 'الموظفين والمرتبات' },
  { key: 'devices',   label: 'الأجهزة والشوتات' },
  { key: 'reports',   label: 'التقارير' },
];
function permsFrom(list, mods = MODULES) {
  const o = {};
  mods.forEach(m => { o[m.key + '_view'] = false; o[m.key + '_edit'] = false; });
  if (list === '*') { Object.keys(o).forEach(k => o[k] = true); return o; }
  list.forEach(k => { o[k] = true; if (k.endsWith('_edit')) o[k.replace('_edit', '_view')] = true; });
  return o;
}
const ROLE_PERMS = {
  owner: permsFrom('*'),
  accounts: permsFrom(['payments_edit', 'reports_view', 'clients_view', 'packages_view', 'staff_view', 'inventory_view']),
  branches_manager: permsFrom(['clients_edit', 'bookings_edit', 'sessions_edit', 'packages_edit', 'payments_edit', 'inventory_edit', 'staff_view', 'devices_edit', 'reports_view']),
  branch_manager: permsFrom(['clients_edit', 'bookings_edit', 'sessions_edit', 'packages_edit', 'payments_view', 'inventory_edit', 'staff_view', 'devices_edit', 'reports_view']),
  reception: permsFrom(['clients_edit', 'bookings_edit', 'sessions_view', 'packages_edit', 'payments_edit']),
  doctor: permsFrom(['clients_view', 'bookings_view', 'sessions_edit', 'devices_view']),
  client: permsFrom([]),
};

/* ---------------- أدوات ---------------- */
let S = {};
const A = window.A = {};

function ICON(size = 36) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 220 220" aria-hidden="true"><rect width="220" height="220" rx="52" fill="#2F6F68"/><path d="M110 40 L122 98 L180 110 L122 122 L110 180 L98 122 L40 110 L98 98 Z" fill="#DDA86E"/></svg>`;
}
function brandOf(c) {
  return c && c.whiteLabel
    ? { name: c.name, logo: c.logoUrl || '', color: c.color || '#2F6F68', white: true }
    : { name: 'Beam Care Clinic', logo: '', color: '#2F6F68', white: false };
}
function logoHTML(b, size = 36) {
  return b.logo ? `<img src="${esc(b.logo)}" alt="" style="width:${size}px;height:${size}px;border-radius:10px;object-fit:cover">` : ICON(size);
}
function applyBrand(c) {
  const b = brandOf(c);
  document.documentElement.style.setProperty('--brand', b.color);
  document.title = b.name;
}
const toDate = ts => ts && ts.toDate ? ts.toDate() : (ts ? new Date(ts) : null);
const fmt = ts => { const d = toDate(ts); return d ? d.toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' }) : '—'; };
const toInput = d => { d = toDate(d) || new Date(); const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; };
const endOfDay = s => new Date(s + 'T23:59:59');
const addMonths = (d, n) => { const x = new Date(d); x.setMonth(x.getMonth() + n); return x; };
const daysLeft = c => { const d = toDate(c.expiresAt); return d ? Math.ceil((d - new Date()) / 86400000) : 0; };
const clinicActive = c => c && c.active !== false && toDate(c.expiresAt) > new Date();
function statusChip(c) {
  if (c.active === false) return `<span class="chip bad">موقوفة</span>`;
  const d = daysLeft(c);
  if (d <= 0) return `<span class="chip bad">الاشتراك منتهي</span>`;
  if (d <= 7) return `<span class="chip warn">فاضل ${d} يوم</span>`;
  return `<span class="chip ok">شغالة</span>`;
}
function toast(msg) {
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
function openModal(html) { $modal.innerHTML = `<div class="ov" onclick="if(event.target===this)A.closeModal()"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`; }
A.closeModal = () => { $modal.innerHTML = ''; };
function busy(btn, on, txt) { if (!btn) return; btn.disabled = on; if (txt) btn.textContent = txt; }
function branchNames(u, branches, roles = ROLES) {
  if (roles[u.role]?.scope === 'all') return 'كل الفروع';
  const n = (u.branchIds || []).map(id => branches.find(b => b.id === id)?.name).filter(Boolean);
  return n.length ? n.join('، ') : '—';
}
A.logout = async () => {
  if (S.viewAs) return A.exitViewAs();
  await signOut(auth);
};

/* ---------------- تسجيل الدخول ---------------- */
async function loginBrand() {
  const c = new URLSearchParams(location.search).get('c');
  if (!c) return brandOf(null);
  try { const b = await getDoc(doc(db, 'brands', c)); return b.exists() ? brandOf(b.data()) : brandOf(null); }
  catch { return brandOf(null); }
}
async function renderLogin(msg = '') {
  const b = await loginBrand();
  document.documentElement.style.setProperty('--brand', b.color);
  document.title = b.name;
  $app.innerHTML = `
  <div class="login"><form class="login-card" onsubmit="A.login(event)">
    <div class="login-brand">${logoHTML(b, 72)}<h1>${esc(b.name)}</h1><p>${b.white ? '' : 'سيستم إدارة العيادات'}</p></div>
    ${msg ? `<div class="err">${esc(msg)}</div>` : ''}
    <label class="f">اسم المستخدم<input name="u" autocomplete="username" required dir="ltr"></label>
    <label class="f">كلمة السر<input name="p" type="password" autocomplete="current-password" required dir="ltr"></label>
    <button class="btn" type="submit">دخول</button>
    ${b.white ? `<p style="margin:0;text-align:center;color:var(--muted);font-size:12px">Powered by Beam Care</p>` : ''}
  </form></div>`;
}
A.login = async e => {
  e.preventDefault();
  const f = e.target, btn = f.querySelector('button');
  const u = f.u.value.trim();
  busy(btn, true, 'جاري الدخول...');
  let email = u.includes('@') ? u : `${u.toLowerCase()}@${EMAIL_DOMAIN}`;
  if (!u.includes('@')) {
    try { const l = await getDoc(doc(db, 'logins', u.toLowerCase())); if (l.exists() && l.data().email) email = l.data().email; } catch {}
  }
  try { await signInWithEmailAndPassword(auth, email, f.p.value); }
  catch (err) {
    console.error(err);
    const code = err.code || err.message || '';
    const msg = code.includes('api-key') ? 'مشكلة في إعدادات الربط (API key)'
      : code.includes('unauthorized-domain') ? 'الدومين ده مش مضاف في Firebase'
      : code.includes('too-many-requests') ? 'محاولات كتير، استنى شوية وجرّب تاني'
      : code.includes('network') ? 'مفيش اتصال بالإنترنت'
      : 'اسم المستخدم أو كلمة السر غلط';
    busy(btn, false, 'دخول');
    renderLogin(`${msg} (${code})`);
  }
};

onAuthStateChanged(auth, async u => {
  if (!u) { S = {}; return renderLogin(); }
  S = { user: u };
  $app.innerHTML = `<div class="loading">جاري التحميل...</div>`;
  try {
    const dev = await getDoc(doc(db, 'devs', u.uid));
    if (dev.exists()) { S.isDev = true; applyBrand(null); return A.devHome(); }
    const p = await getDoc(doc(db, 'users', u.uid));
    if (!p.exists() || p.data().active === false) { await signOut(auth); return renderLogin('الحساب ده موقوف أو مش موجود'); }
    S.profile = { id: u.uid, ...p.data() };
    const c = await getDoc(doc(db, 'clinics', S.profile.clinicId));
    S.clinic = { id: c.id, ...c.data() };
    applyBrand(S.clinic);
    if (!clinicActive(S.clinic)) return renderLocked();
    applyLook(S.clinic.look); lookAnnounce(S.clinic.look || '');
    watchClinicUpd();
    if (S.clinic.upd) return renderUpdate();
    const bs = await getDocs(collection(db, 'clinics', S.clinic.id, 'branches'));
    S.branches = bs.docs.map(x => ({ id: x.id, ...x.data() }));
    initBranch();
    A.go('home');
  } catch (e) {
    console.error(e);
    await signOut(auth);
    renderLogin('حصلت مشكلة في التحميل، جرّب تاني');
  }
});

let UPD_UNSUB = null;
function watchClinicUpd() {
  try { if (UPD_UNSUB) UPD_UNSUB(); } catch (e) {}
  const id = S.clinic?.id; if (!id) return;
  let was = !!S.clinic.upd;
  UPD_UNSUB = onSnapshot(doc(db, 'clinics', id), d => {
    if (!S.clinic || S.clinic.id !== id || S.viewAs) return;
    const x = d.data() || {}; const now = !!x.upd;
    const lookChanged = (x.look || '') !== (S.clinic.look || '');
    S.clinic = { ...S.clinic, upd: x.upd, updMsg: x.updMsg, updUntil: x.updUntil, look: x.look };
    if (lookChanged && !now) { applyLook(x.look); lookAnnounce(x.look || ''); if (S.view) A.go(S.view); }
    if (now && !was) renderUpdate();

    else if (now) renderUpdate();

}

function flatRow(x) {
  const o = {};
  for (const k in x) {
    const v = x[k];
    if (['photo', 'photos', 'receipt', 'payPhoto', 'sigEng', 'sigClient', 'logo', 'image', 'img', '_u'].includes(k)) continue;
    if (v == null) o[k] = '';
    else if (typeof v === 'object') o[k] = v.__ts ? new Date(v.__ts).toISOString() : JSON.stringify(v).slice(0, 3000);
    else o[k] = typeof v === 'string' && v.startsWith('data:') ? '[صورة]' : v;
  }
  return o;
}

async function bkRestoreClinic(c, date, prog) {
  prog('بيحمّل النسخة من GitHub…');
  const bk = await bkLoadDay(bkDir(c), date);
  if (bk.cols.cmeta) { bk.cols.meta = bk.cols.cmeta; delete bk.cols.cmeta; }
  prog('بياخد نسخة من الوضع الحالي…');
  const sub = [...new Set([...Object.keys(bk.cols).filter(x => x !== 'users'), ...CLINIC_BK_COLS])];
  const cur = {};
  for (const col of sub) { try { const s = await getDocs(collection(db, 'clinics', c.id, col)); cur[col] = {}; s.docs.forEach(d => { cur[col][d.id] = encTs(d.data()); }); } catch (err) { cur[col] = null; } }
  try { const s = await getDocs(query(collection(db, 'users'), where('clinicId', '==', c.id))); cur.users = {}; s.docs.forEach(d => { cur.users[d.id] = encTs(d.data()); }); } catch (err) { cur.users = null; }
  saveBlob(new Blob([JSON.stringify({ clinic: c.name, date: 'قبل-الاسترجاع-' + todayStr(), cols: cur })], { type: 'application/json' }), `${c.name || c.id}-before-restore-${todayStr()}.json`);
  prog('بيرجّع البيانات…');
  const ops = [];
  for (const col of [...sub, 'users']) {
    if (cur[col] === null || cur[col] === undefined) continue;
    const want = bk.cols[col] || {}, have = cur[col] || {};
    const ref = id => col === 'users' ? doc(db, 'users', id) : doc(db, 'clinics', c.id, col, id);
    for (const [id, x] of Object.entries(want)) if (!have[id] || JSON.stringify(have[id]) !== JSON.stringify(x)) ops.push(['set', ref(id), decTs(x)]);
    if (col !== 'users') for (const id of Object.keys(have)) if (!want[id]) ops.push(['del', ref(id)]);
  }
  for (let i = 0; i < ops.length; i += 400) {
    const b = writeBatch(db);
    ops.slice(i, i + 400).forEach(([k, ref, x]) => { if (k === 'set') b.set(ref, x); else b.delete(ref); });
    await b.commit(); prog(`بيرجّع البيانات… ${Math.min(ops.length, i + 400)} من ${ops.length}`);
  }
  return ops.length;
}
const CLINIC_BK_COLS = ['branches', 'staff', 'meta', 'clients', 'services', 'bookings', 'sessions', 'cpackages', 'payments', 'expenses', 'items', 'stockMoves', 'devices', 'deviceLogs', 'employees', 'payroll'];
A.bkRestore = async (e, date) => {
  e.preventDefault();
  const f = e.target; if (f.ok.value.trim() !== 'استرجع') { toast('اكتب كلمة استرجع'); return; }
  const btn = f.querySelector('[type=submit]'); busy(btn, true, 'جاري...');
  const prog = t => { const p = document.getElementById('rsProg'); if (p) p.textContent = t; };
  const c = S.dc;
  if (isClinicT()) {
    try { const n = await bkRestoreClinic(c, date, prog); A.closeModal(); toast(`اترجعت نسخة ${date} ✓ (${n} تغيير)`); }
    catch (err) { console.error(err); busy(btn, false, 'استرجع'); prog(''); toast('الاسترجاع وقف: ' + (err.message || err.code)); }
    return;
  }
  try {
    prog('بيحمّل النسخة من GitHub…');
    const bk = await bkLoadDay(bkDir(c), date);
    const r = await remoteConn(c);
    prog('بياخد نسخة من الوضع الحالي…');
    const cols = [...new Set([...Object.keys(bk.cols), ...BK_ALL_COLS])].filter(x => !RESTORE_SKIP.includes(x));
    const cur = {}, curMeta = {};
    for (const col of cols) {
      try { const s = await getDocs(collection(r.db, col)); cur[col] = {}; s.docs.forEach(d => { cur[col][d.id] = encTs(d.data()); }); }
      catch (err) { cur[col] = null; }
    }
    for (const m of ['settings', 'nav', 'gs', 'counter']) { try { const s = await getDoc(doc(r.db, 'meta', m)); if (s.exists()) curMeta[m] = encTs(s.data()); } catch (err) {} }
    saveBlob(new Blob([JSON.stringify({ company: c.name, date: 'قبل-الاسترجاع-' + todayStr(), cols: cur, meta: curMeta })], { type: 'application/json' }), `${c.name || c.id}-before-restore-${todayStr()}.json`);
    prog('بيرجّع البيانات…');
    const ops = [];
    for (const col of cols) {
      if (cur[col] === null) continue;
      const want = bk.cols[col] || {}, have = cur[col] || {};
      const strip = o => { const { _u, ...rest } = o || {}; return JSON.stringify(rest); };
      for (const [id, x] of Object.entries(want)) if (!have[id] || strip(have[id]) !== strip(x)) ops.push(['set', col, id, { ...decTs(x), _u: serverTimestamp() }]);
      if (col !== 'users') for (const id of Object.keys(have)) if (!want[id]) ops.push(['del', col, id]);
    }
    for (const m of ['nav', 'gs', 'counter']) if (bk.meta[m]) ops.push(['set', 'meta', m, decTs(bk.meta[m])]);
    const st = { ...(bk.meta.settings || curMeta.settings || {}) };
    st.dsEpoch = Math.max(Number(curMeta.settings?.dsEpoch || 0), Number(st.dsEpoch || 0)) + 1;
    if (curMeta.settings?.announcements) st.announcements = curMeta.settings.announcements;
    ops.push(['set', 'meta', 'settings', decTs(st)]);
    let done = 0;
    for (let i = 0; i < ops.length; i += 400) {
      const b = writeBatch(r.db);
      ops.slice(i, i + 400).forEach(([k, col, id, x]) => { const ref = doc(r.db, col, id); if (k === 'set') b.set(ref, x); else b.delete(ref); });
      await b.commit(); done = Math.min(ops.length, i + 400); prog(`بيرجّع البيانات… ${done} من ${ops.length}`);
    }
    A.closeModal();
    toast(`اترجعت نسخة ${date} ✓ (${ops.length} تغيير) — كل الأجهزة هتحمّل البيانات من جديد لوحدها`);
  } catch (err) {
    console.error(err); busy(btn, false, 'استرجع'); prog('');
    toast('الاسترجاع وقف: ' + (err.message || err.code));
  }
};

const PM_GS_COLS = {clients:'العيادات',reports:'تقارير الصيانة',contracts:'عقود الصيانة',partSales:'فواتير البيع',payments:'التحصيلات',orders:'طلبات المستهلكات',requests:'طلبات الصيانة',parts:'المخزن',purchases:'المشتريات',suppliers:'الموردين',supplierPayments:'دفعات الموردين',treasury:'الخزينة',vouchers:'أذون الصرف',sales:'بيع الأجهزة',rentals:'الإيجارات',stockDevices:'أجهزة الشركة',freon:'الفريون',frret:'مرتجعات الفريون',custody:'العهد والمصاريف',hr:'الإجازات والطلبات',punches:'البصمات',payroll:'المرتبات',users:'الموظفين'};
const PM_GS_DEF = ['clients', 'reports', 'contracts', 'partSales', 'payments', 'orders', 'parts', 'purchases', 'suppliers', 'treasury'];
function gsAppsCode(token, brand){return `// ${String(brand || '').replace(/[`$\\]/g,'')} → Google Sheet (الصق الكود ده كله في Apps Script)
const TOKEN='${token}';
function doGet(){return ContentService.createTextOutput('OK');}
function doPost(e){
  const d=JSON.parse(e.postData.contents);
  if(d.token!==TOKEN)return ContentService.createTextOutput('bad token');
  const ss=SpreadsheetApp.getActiveSpreadsheet();
  const lock=LockService.getScriptLock();lock.waitLock(30000);
  try{
    const getSh=name=>{let sh=ss.getSheetByName(name);if(!sh){sh=ss.insertSheet(name);sh.setRightToLeft(true);sh.getRange(1,1).setValue('id').setFontWeight('bold');sh.setFrozenRows(1);}return sh;};
    if(d.bulk){
      const sh=getSh(d.bulk.s);const rows=d.bulk.rows||[];
      let head=d.bulk.append?sh.getRange(1,1,1,Math.max(1,sh.getLastColumn())).getValues()[0].filter(String):['id'];
      rows.forEach(r=>Object.keys(r).forEach(k=>{if(head.indexOf(k)<0)head.push(k);}));
      if(!d.bulk.append){sh.clearContents();}
      sh.getRange(1,1,1,head.length).setValues([head]).setFontWeight('bold');
      if(rows.length){const vals=rows.map(r=>head.map(h=>r[h]!==undefined?r[h]:''));const start=d.bulk.append?sh.getLastRow()+1:2;sh.getRange(start,1,vals.length,head.length).setValues(vals);}
      return ContentService.createTextOutput('ok');
    }
    (d.ops||[]).forEach(op=>{
      const sh=getSh(op.s);
      let head=sh.getRange(1,1,1,Math.max(1,sh.getLastColumn())).getValues()[0];
      const n=sh.getLastRow()-1;const ids=n>0?sh.getRange(2,1,n,1).getValues().map(r=>String(r[0])):[];
      const ri=ids.indexOf(String(op.id));
      if(op.del){if(ri>=0)sh.deleteRow(ri+2);return;}
      Object.keys(op.row).forEach(k=>{if(head.indexOf(k)<0){head.push(k);sh.getRange(1,head.length).setValue(k).setFontWeight('bold');}});
      const vals=head.map(h=>h==='id'?op.id:(op.row[h]!==undefined?op.row[h]:''));
      if(ri>=0)sh.getRange(ri+2,1,1,vals.length).setValues([vals]);else sh.appendRow(vals);
    });
  }finally{lock.releaseLock();}
  return ContentService.createTextOutput('ok');
}`}

/* ----- التنبيهات ----- */
async function loadAlerts(tenants) {
  const L = [];
  const P = t => PRODUCTS[t.product] || PRODUCTS.clinic;
  tenants.forEach(t => {
    if (t.id === MYCO?.tenantId) return;
    const d = daysLeft(t);
    if (t.active === false) L.push({ lv: 'mute', t, msg: 'موقوف' });
    else if (d <= 0) L.push({ lv: 'bad', t, msg: 'الاشتراك خلص', renew: true });
    else if (d <= 7) L.push({ lv: 'warn', t, msg: `الاشتراك هيخلص بعد ${d} يوم`, renew: true });
    if (t.upd) L.push({ lv: 'warn', t, msg: 'السيستم متوقف للتحديث — متنساش ترجّعه' });
  });
  try {
    const g = await ghCfg();
    if (g.token) {
      const idx = await gh('contents/index.json?ref=data', { raw: true, soft: true });
      const j = idx ? await idx.json() : {};
      const look = (ix, prod) => Object.entries(ix || {}).forEach(([id, x]) => {
        const t = tenants.find(y => y.id === id && y.product === prod); if (!t) return;
        if (x.last && !x.last.ok) L.push({ lv: 'bad', t, msg: 'آخر نسخة احتياطية فيها مشكلة', tab: 'backups' });
        else if (x.last?.at && Date.now() - new Date(x.last.at).getTime() > 2.5 * 864e5) L.push({ lv: 'warn', t, msg: 'مفيش نسخة احتياطية من أكتر من يومين', tab: 'backups' });
        const c = x.days?.[0]?.counts || {}, lim = prod === 'maint' ? t.plan?.maxCustomers : t.plan?.maxClients;
        if (lim && c.clients && c.clients >= lim * 0.9) L.push({ lv: 'gold', t, msg: `قرب يوصل لحد الباكدج (${c.clients} من ${lim} عميل) — فرصة تعرض عليه باكدج أكبر` });
      });
      look(j.companies, 'maint'); look(j.clinics, 'clinic');
    }
  } catch (e) { console.error(e); }
  const rank = { bad: 0, warn: 1, gold: 2, mute: 3 };
  return L.sort((a, b) => rank[a.lv] - rank[b.lv]);
}
function alertsCard(L) {
  if (L === null) return `<div class="card"><h3>⚠️ التنبيهات</h3><p class="meta">بيحمّل…</p></div>`;
  return `<div class="card" style="display:flex;flex-direction:column;gap:10px">
    <div class="head"><h3 style="flex:1">⚠️ التنبيهات</h3>${L.length ? `<span class="chip ${L.some(x => x.lv === 'bad') ? 'bad' : 'warn'}">${L.length}</span>` : '<span class="chip ok">مفيش</span>'}</div>

A.planPick = (f, pk, amountOnly) => {

function tenantFields(f, P) {

  const data = {
    product: P.key, name: f.name.value.trim(), contactName: f.cname.value.trim(), contactPhone: f.cphone.value.trim(),

    plan: Object.fromEntries(P.limits.map(l => [l.key, Number(f['lim_' + l.key].value) || 0])),

const brandDoc = (P, d) => ({ product: P.key, name: d.name, logoUrl: d.logoUrl || '', color: d.color || '#2F6F68', whiteLabel: !!d.whiteLabel, ...(P.remote && d.fb ? { fb: d.fb } : {}) });

const MAINT_APP = 'https://beamcare.github.io/m/';
A.saveTenant = async (e, pk, id) => {
  e.preventDefault();
  const f = e.target, P = PRODUCTS[pk], btn = f.querySelector('[type=submit]');
  let data;
  try { data = tenantFields(f, P); } catch (er) { return toast(er.message); }
  busy(btn, true, 'جاري الحفظ...');
  try {
    const batch = writeBatch(db);
    if (id) {
      if (endOfDay(f.ed.value) <= new Date(f.sd.value + 'T00:00:00')) { busy(btn, false, 'حفظ'); return toast('تاريخ النهاية لازم يكون بعد البداية'); }
      data.startAt = Timestamp.fromDate(new Date(f.sd.value + 'T00:00:00'));
      data.expiresAt = Timestamp.fromDate(endOfDay(f.ed.value));
      if (P.remote && !data.url) data.url = MAINT_APP + '?c=' + id;
      batch.update(tdoc(P, id), data);
    } else {
      const ref = doc(tcol(P));
      id = ref.id;
      if (P.remote && !data.url) data.url = MAINT_APP + '?c=' + id;
      const months = Number(f.months.value) || 1;
      const start = new Date(f.sd.value + 'T00:00:00');
      const end = addMonths(start, months); end.setHours(23, 59, 59);
      data.startAt = Timestamp.fromDate(start);
      data.expiresAt = Timestamp.fromDate(end);
      data.createdAt = serverTimestamp();
      batch.set(ref, data);
      batch.set(doc(collection(db, 'billing')), billingDoc(P, { id, ...data }, 'new', months, start, end, Number(f.amount.value) || 0, f.method.value, f.note.value.trim()));
    }
    batch.set(doc(db, 'brands', id), brandDoc(P, data));
    await batch.commit();
    if (P.remote) { await saveConn(P, id, f); await remoteConn({ ...data, id }, true).catch(() => {}); await syncRemote(P, id); }
    A.closeModal(); toast('اتحفظ'); A.openTenant(pk, id);
  } catch (err) { console.error(err); busy(btn, false, 'حفظ'); toast('مقدرتش أحفظ: ' + (err.code || err.message)); }
};
function billingDoc(P, t, kind, months, from, to, amount, method, note) {
  const today = todayStr();
  return { product: P.key, tenantId: t.id, tenantName: t.name, kind, months, from: toInput(from), to: toInput(to), amount, method, note: note || '',
    planId: t.planId || '', planName: t.planName || '', date: today, month: today.slice(0, 7), createdAt: serverTimestamp(), createdByName: S.user?.email || '' };
}

async function loadTenant(pk, id) {
  await loadMyCo();
  const P = PRODUCTS[pk];
  if (P.remote) {
    const [t, bl, cs] = await Promise.all([
      getDoc(tdoc(P, id)),
      getDocs(query(collection(db, 'billing'), where('tenantId', '==', id))).catch(() => null),
      getDoc(doc(db, P.col, id, 'meta', 'conn')).catch(() => null),
    ]);
    if (!t.exists()) throw new Error('مش لاقي البيانات دي');
    S.dp = P; S.dc = { ...t.data(), id, product: P.key };
    S.dBilling = bl ? bl.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.date || '').localeCompare(a.date || '')) : [];
    S.dConn = { user: cs && cs.exists() ? cs.data().user || '' : '' };
    await loadRemoteInto(S.dc);
    if (!S.plans) await loadPlans().catch(() => {});
    return;
  }
  const [t, bs, us] = await Promise.all([
    getDoc(tdoc(P, id)),
    getDocs(tcol(P, id, 'branches')),
    getDocs(query(collection(db, 'users'), where(P.userKey, '==', id))),
  ]);
  if (!t.exists()) throw new Error('مش لاقي البيانات دي');
  S.dp = P;
  S.dc = { ...t.data(), id, product: t.data().product || P.key };
  S.dBranches = bs.docs.map(d => ({ id: d.id, ...d.data() }));
  S.dUsers = us.docs.map(d => ({ id: d.id, ...d.data() }));
  const extra = [
    getDocs(query(collection(db, 'billing'), where('tenantId', '==', id))).then(s => { S.dBilling = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.date || '').localeCompare(a.date || '')); }).catch(() => { S.dBilling = []; }),
    getDoc(tdoc(P, id, 'meta', 'counters')).then(c => { S.dClients = c.exists() ? (c.data().clients || 0) : 0; }).catch(() => { S.dClients = 0; }),
  ];
  if (P.key === 'clinic') extra.push(getDocs(tcol(P, id, 'clients')).then(s => { S.dClientList = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar')); }).catch(() => { S.dClientList = []; }));
  await Promise.all(extra);
  if (!S.plans) await loadPlans().catch(() => {});
  // تحديث البيانات القديمة: نوع المنتج على العميل واليوزرات، ودليل الموظفين
  try {
    const batch = writeBatch(db);
    if (!t.data().product) batch.update(tdoc(P, id), { product: P.key });
    S.dUsers.forEach(u => {
      if (u.product !== P.key || u.tenantId !== id) batch.update(doc(db, 'users', u.id), { product: P.key, tenantId: id });
      batch.set(tdoc(P, id, 'staff', u.id), { name: u.name || '', role: u.role, branchIds: u.branchIds || [], active: u.active !== false, prevIds: u.prevIds || [] });
    });
    await batch.commit();
  } catch (e) { console.error('sync', e); }
}

A.renewCalc = f => {
  const c = S.dc, p = (S.plans || []).find(x => x.id === f.planId.value);
  const months = Number(f.months.value) || 1;
  const from = new Date(Math.max(Date.now(), toDate(c.expiresAt)?.getTime() || 0));
  const to = addMonths(from, months);
  if (p) f.amount.value = Math.round((p.price || 0) * months / (p.months || 1));
  document.getElementById('renewTo').textContent = `الاشتراك هيبقى لحد ${fmt(to)}` + (p && p.id !== c.planId ? ` · الحدود والمميزات هتتغير لباكدج "${p.name}"` : '');

A.saveRenew = async e => {
  e.preventDefault();
  const f = e.target, P = S.dp, c = S.dc, btn = f.querySelector('[type=submit]');
  const p = (S.plans || []).find(x => x.id === f.planId.value);
  const months = Number(f.months.value) || 1;
  const from = new Date(Math.max(Date.now(), toDate(c.expiresAt)?.getTime() || 0));
  const to = addMonths(from, months); to.setHours(23, 59, 59);
  const upd = { expiresAt: Timestamp.fromDate(to), active: true };
  if (p) {
    upd.planId = p.id; upd.planName = p.name; upd.plan = { ...(c.plan || {}), ...p.limits };
    const feats = { ...(c.features || {}) };
    P.features.forEach(x => { if (x.top) upd[x.key] = !!p.features?.[x.key]; else feats[x.key] = !!p.features?.[x.key]; });
    upd.features = feats;
  } else if (f.planId.value === '' && c.planId) { upd.planId = ''; upd.planName = ''; }
  busy(btn, true, 'جاري التجديد...');
  try {
    const batch = writeBatch(db);
    batch.update(tdoc(P, c.id), upd);
    batch.set(doc(collection(db, 'billing')), billingDoc(P, { ...c, ...upd }, 'renew', months, from, to, Number(f.amount.value) || 0, f.method.value, f.note.value.trim()));
    if (p) batch.set(doc(db, 'brands', c.id), brandDoc(P, { ...c, ...upd }));
    await batch.commit();
    await syncRemote(P, c.id);
    A.closeModal(); toast('اتجدد لحد ' + fmt(to));
    if (S.devView === 'tenant') A.openTenant(P.key, c.id); else A.dev(S.devView || 'home');
  } catch (err) { console.error(err); busy(btn, false, 'تجديد'); toast('مقدرتش أجدد: ' + (err.code || err.message)); }
};

}
A.permTick = el => {
  const f = el.form, m = el.name.match(/^p_(.+)_(view|edit)$/);
  const key = m[1], kind = m[2];
  if (kind === 'edit' && el.checked) f[`p_${key}_view`].checked = true;
  if (kind === 'view' && !el.checked) f[`p_${key}_edit`].checked = false;
};
function readPerms(f, mods = MODULES) {
  const o = {};
  mods.forEach(m => {
    o[m.key + '_edit'] = f[`p_${m.key}_edit`].checked;
    o[m.key + '_view'] = f[`p_${m.key}_view`].checked || o[m.key + '_edit'];
  });
  return o;
}
function setPerms(f, perms, mods = MODULES) { mods.forEach(m => { f[`p_${m.key}_view`].checked = !!perms?.[m.key + '_view']; f[`p_${m.key}_edit`].checked = !!perms?.[m.key + '_edit']; }); }

A.saveUser = async (e, id) => {
  e.preventDefault();
  const f = e.target, P = S.dp, c = S.dc, btn = f.querySelector('[type=submit]');
  const role = f.role.value;
  const branchIds = P.roles[role].scope === 'all' ? [] : [...f.querySelectorAll('[name=br]:checked')].map(x => x.value);
  if (P.roles[role].scope !== 'all' && !branchIds.length) return toast('اختار فرع واحد على الأقل');
  const clientId = role === P.linkedRole && f.clientId ? f.clientId.value : '';
  if (role === 'client' && P.linkedRole === 'client' && !clientId) return toast('اختار ملف العميل المربوط بالحساب');
  const wasStaff = id ? !isLinked(P, S.dUsers.find(x => x.id === id)) : false;
  const staffCount = S.dUsers.filter(u => !isLinked(P, u)).length;
  if (role !== P.linkedRole && !wasStaff && staffCount >= (c.plan?.maxUsers ?? 0)) return toast('وصلت لحد اليوزرات في الباكدج');
  const data = { name: f.name.value.trim(), role, branchIds, perms: role === P.linkedRole ? P.rolePerms[role] : readPerms(f, P.modules), active: f.act.checked,
    product: P.key, tenantId: c.id, [P.userKey]: c.id, clientId };
  let newCreds = null;
  busy(btn, true, 'جاري الحفظ...');
  try {
    if (id) {
      await updateDoc(doc(db, 'users', id), data);
    } else {
      const username = f.username.value.trim().toLowerCase();
      const taken = await getDoc(doc(db, 'logins', username)).catch(() => null);
      if (taken?.exists()) throw Object.assign(new Error('taken'), { code: 'auth/email-already-in-use' });
      const email = `${username}@${EMAIL_DOMAIN}`;
      const cred = await createUserWithEmailAndPassword(auth2, email, f.pass.value);
      await signOut(auth2);
      id = cred.user.uid;
      const batch = writeBatch(db);
      batch.set(doc(db, 'users', id), { ...data, username, authEmail: email, prevIds: [], createdAt: serverTimestamp() });
      batch.set(doc(db, 'logins', username), { email });
      await batch.commit();
      newCreds = { name: data.name, username, pass: f.pass.value };
    }
    const prev = S.dUsers.find(x => x.id === id)?.prevIds || [];
    await setDoc(tdoc(P, c.id, 'staff', id), { name: data.name, role: data.role, branchIds: data.branchIds, active: data.active, prevIds: prev });
    A.closeModal(); toast('اتحفظ');
    await A.openTenant(P.key, c.id, 'users');
    if (newCreds) showCreds(newCreds, 'اليوزر اتعمل');
  } catch (err) {
    console.error(err); busy(btn, false, 'حفظ');
    toast(err.code === 'auth/email-already-in-use' ? 'اسم المستخدم ده مستخدم قبل كده' : err.code === 'auth/weak-password' ? 'كلمة السر ضعيفة (6 حروف على الأقل)' : 'مقدرتش أحفظ: ' + (err.code || err.message));
  }
};

/* ----- كلمات السر ----- */
function genPw() {
  const a = 'abcdefghjkmnpqrstuvwxyz', d = '23456789';
  let s = '';
  for (let i = 0; i < 6; i++) s += a[Math.floor(Math.random() * a.length)];
  for (let i = 0; i < 3; i++) s += d[Math.floor(Math.random() * d.length)];
  return s;
}
A.genPw = genPw;
function credsText(cr) {
  const P = S.dp, c = S.dc;
  const link = `${location.origin}${location.pathname}${c ? '?c=' + c.id : ''}`;
  return `أهلاً ${cr.name}\nبيانات دخولك على سيستم ${c?.whiteLabel ? c.name : P?.name || 'Beam Care'}:\nاللينك: ${link}\nاسم المستخدم: ${cr.username}\nكلمة السر: ${cr.pass}\n\nتقدر تغيّر كلمة السر من زرار "كلمة السر" فوق بعد ما تدخل.`;
}
function showCreds(cr, title) {
  S.lastCreds = cr;
  openModal(`<h3>${esc(title)}</h3>

    <div class="card" style="display:flex;flex-direction:column;gap:8px">

      <div class="meta" style="font-size:16px"><span>كلمة السر:</span><b dir="ltr" id="credPass">${esc(cr.pass)}</b></div>

// Firebase مش بيسمح بتغيير كلمة سر يوزر تاني من المتصفح (على الخطة المجانية)،
// فبنعمل له حساب دخول جديد بكلمة السر الجديدة، وننقل عليه بياناته كلها، ونربط اسم المستخدم بيه.
// الحساب القديم بيفضل في Authentication من غير بيانات، فمبيقدرش يدخل.
A.resetPwModal = id => {
  const u = S.dUsers.find(x => x.id === id);
  openModal(`<h3>كلمة سر جديدة لـ ${esc(u.name)}</h3>
    <p class="meta">كلمة السر القديمة هتبطل تشتغل على طول، واليوزر هيدخل بالجديدة بنفس اسم المستخدم <b dir="ltr">${esc(u.username)}</b>. كل بياناته وصلاحياته زي ما هي.</p>
    <form onsubmit="A.resetPw(event,'${id}')" class="fcol">
      <label class="f">كلمة السر الجديدة<span style="display:flex;gap:6px"><input name="pass" required minlength="6" dir="ltr" value="${genPw()}" autocomplete="off"><button type="button" class="btn ghost sm" onclick="this.previousElementSibling.value=A.genPw()">جديدة</button></span></label>
      ${formActs('غيّر كلمة السر')}
    </form>`);
};
A.resetPw = async (e, id) => {
  e.preventDefault();
  const f = e.target, btn = f.querySelector('[type=submit]'), P = S.dp, c = S.dc;
  const u = S.dUsers.find(x => x.id === id);
  if (!u.username) return toast('اليوزر ده مالوش اسم مستخدم');
  busy(btn, true, 'جاري التغيير...');
  try {
    const email = `${u.username}+${Date.now().toString(36)}@${EMAIL_DOMAIN}`;
    const cred = await createUserWithEmailAndPassword(auth2, email, f.pass.value);
    await signOut(auth2);
    const nid = cred.user.uid;
    const { id: _old, ...rest } = u;
    const prevIds = [...(u.prevIds || []), id];
    const batch = writeBatch(db);
    batch.set(doc(db, 'users', nid), { ...rest, prevIds, authEmail: email, product: P.key, tenantId: c.id, [P.userKey]: c.id });
    batch.delete(doc(db, 'users', id));
    batch.set(doc(db, 'logins', u.username), { email });
    batch.set(tdoc(P, c.id, 'staff', nid), { name: u.name || '', role: u.role, branchIds: u.branchIds || [], active: u.active !== false, prevIds });
    batch.delete(tdoc(P, c.id, 'staff', id));
    if (P.key === 'clinic') {
      const emps = await getDocs(query(tcol(P, c.id, 'employees'), where('userId', '==', id))).catch(() => null);
      emps?.forEach(d => batch.update(d.ref, { userId: nid }));
    }
    await batch.commit();
    A.closeModal();
    await A.openTenant(P.key, c.id, 'users');
    showCreds({ name: u.name, username: u.username, pass: f.pass.value }, 'كلمة السر اتغيّرت');
  } catch (err) {
    console.error(err); busy(btn, false, 'غيّر كلمة السر');
    toast(err.code === 'auth/weak-password' ? 'كلمة السر ضعيفة (6 حروف على الأقل)' : 'مقدرتش أغيّرها: ' + (err.code || err.message));
  }
};

/* ----- الدخول كأي يوزر ----- */
A.viewAs = id => {

};
A.exitViewAs = () => {

const can = k => !!S.profile?.perms?.[k];

const LOADING = `<div class="loading">جاري التحميل...</div>`;
const todayStr = () => toInput(new Date());
const money = n => (Number(n) || 0).toLocaleString('ar-EG') + ' ج.م';
const ccol = (...p) => collection(db, 'clinics', S.clinic.id, ...p);
const cdoc = (...p) => doc(db, 'clinics', S.clinic.id, ...p);
const METHODS = { cash: 'كاش', visa: 'فيزا', instapay: 'إنستاباي', wallet: 'محفظة إلكترونية' };
const methodOpts = sel => Object.entries(METHODS).map(([k, l]) => `<option value="${k}" ${k === sel ? 'selected' : ''}>${l}</option>`).join('');
const unitOf = p => p?.unit === 'pulses' ? 'نبضة' : 'جلسة';
const pLeft = p => (p.totalSessions || 0) - (p.usedSessions || 0);
const pkgUse = p => `${(p.usedSessions || 0).toLocaleString('ar-EG')} من ${(p.totalSessions || 0).toLocaleString('ar-EG')} ${unitOf(p)}`;

const bChip = s => { const x = BSTATUS[s] || BSTATUS.booked; return `<span class="chip ${x[1]}">${x[0]}</span>`; };
const timeOf = ts => { const d = toDate(ts); return d ? d.toLocaleTimeString('ar-EG', { hour: 'numeric', minute: '2-digit' }) : ''; };
const formActs = (label = 'حفظ') => `<div class="acts"><button class="btn" type="submit">${label}</button><button class="btn ghost" type="button" onclick="A.closeModal()">إلغاء</button></div>`;

/* ----- الفروع ----- */
function myBranches() {
  const all = (S.branches || []).filter(b => b.active !== false);
  return ROLES[S.profile.role]?.scope === 'all' ? all : all.filter(b => (S.profile.branchIds || []).includes(b.id));
}
function initBranch() {
  const list = myBranches();
  let saved = null;
  try { saved = localStorage.getItem('bc_branch_' + S.clinic.id); } catch {}
  S.branch = list.find(b => b.id === saved)?.id || list[0]?.id || null;
}
A.setBranch = id => {
  S.branch = id;
  try { localStorage.setItem('bc_branch_' + S.clinic.id, id); } catch {}

};
const branchName = id => (S.branches || []).find(b => b.id === id)?.name || '—';

/* ----- تحميل البيانات المشتركة ----- */

  return S.clients;
}
async function loadStaff(force) {
  if (S.staff && !force) return S.staff;
  const s = await getDocs(ccol('staff'));
  S.staff = s.docs.map(d => ({ id: d.id, ...d.data() }));
  return S.staff;
}
async function loadServices(force) {
  if (S.services && !force) return S.services;
  const s = await getDocs(ccol('services'));

}
async function ensureData(forceServices) {
  await Promise.all([can('clients_view') ? loadClients() : null, loadStaff(), loadServices(forceServices)]);
}
const doctors = () => (S.staff || []).filter(s => s.role === 'doctor' && s.active !== false && (s.branchIds || []).includes(S.branch));
const clientLabel = c => `${c.name} - ${c.phone || ''}`;
const findClient = v => (S.clients || []).find(c => clientLabel(c) === String(v || '').trim());
function clientPicker(selId, onchange = '') {

}
const servDatalist = () => `<datalist id="servList">${(S.services || []).map(s => `<option value="${esc(s.name)}"></option>`).join('')}</datalist>`;
function afterSave(view) {

}
function dateBar(key, d) {
  return `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <button class="btn ghost sm" onclick="A.shiftDate('${key}',-1)">اليوم اللي قبله</button>

A.setDate = (k, v) => { S[k] = v; A.go(S.view); };
A.shiftDate = (k, n) => {

  S[k] = toInput(x); A.go(S.view);
};

/* ----- الهيكل ----- */
function clinicShell(view, content) {
  clearDevTheme(); applyBrand(S.clinic); applyLook(S.clinic?.look);
  S.view = view;
  const b = brandOf(S.clinic);
  const nav = [['home', 'الرئيسية']];
  if (S.profile.role !== 'client') MODULES.forEach(m => { if (can(m.key + '_view')) nav.push([m.key, m.label]); });
  if (ownerPerms()) nav.push(['team', 'اليوزرات والصلاحيات']);
  const brs = myBranches();
  const brSel = S.profile.role === 'client' ? '' : brs.length > 1
    ? `<select aria-label="الفرع" style="width:auto;min-height:38px" onchange="A.setBranch(this.value)">${brs.map(x => `<option value="${x.id}" ${x.id === S.branch ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>`
    : (brs[0] ? `<span class="chip mute">${esc(brs[0].name)}</span>` : '');
  $app.innerHTML = `
  ${S.viewAs ? `<div style="background:var(--gold);color:#fff;padding:8px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:700"><span style="flex:1">إنت شايف السيستم كأنك ${esc(S.profile.name)} (${esc(ROLES[S.profile.role]?.label)}). أي حاجة تعملها هتتسجل فعلاً.</span><button class="btn sm" style="background:#fff;color:var(--ink)" onclick="A.exitViewAs()">رجوع للوحة المطور</button></div>` : ''}
  <div class="top">${logoHTML(b, 36)}<div><div class="name">${esc(b.name)}</div><div class="sub">${esc(S.profile.name)} · ${esc(ROLES[S.profile.role]?.label)}</div></div><div class="sp"></div>

  <div class="layout"><nav class="side">${nav.map(([k, l]) => `<button class="${view === k ? 'on' : ''}" onclick="A.go('${k}')" title="${esc(l)}">${navIco(k)}<span>${l}</span></button>`).join('')}
    ${S.viewAs ? '' : `<div class="side-end"><button onclick="A.pwModal()" title="تغيير كلمة السر">🔑 <span>تغيير كلمة السر</span></button><button class="out" onclick="A.logout()" title="تسجيل الخروج">↩ <span>تسجيل الخروج</span></button></div>`}</nav>
  <div class="main">${content}</div></div>`;
}

A.go = async view => {
  if (S.clinic?.upd && !S.viewAs && !S.isDev) return renderUpdate();
  S.openClientId = null;
  try {
    if (view === 'home') return await renderHome();
    if (view === 'team') return await renderTeam();
    const m = MODULES.find(x => x.key === view);
    if (!m || !can(m.key + '_view')) return await renderHome();
    const R = { clients: renderClients, bookings: renderBookings, sessions: renderSessions, packages: renderPackages, payments: renderPayments, inventory: renderInventory, staff: renderStaff, devices: renderDevices, reports: renderReports }[view];
    if (R) {
      if (!S.branch && view !== 'clients') return clinicShell(view, `<div class="card empty">مفيش فرع متاح ليك. كلّم مدير العيادة.</div>`);
      return await R();
    }
    clinicShell(view, `<div class="head"><h2>${m.label}</h2></div>
      <div class="card empty">القسم ده هيتبني في المرحلة الجاية.<br><span style="font-size:13px">صلاحيتك هنا: ${can(m.key + '_edit') ? 'عرض وتعديل' : 'عرض بس'}</span></div>`);
  } catch (e) {
    console.error(e);
    clinicShell(view, `<div class="notice warn">حصلت مشكلة في التحميل (${esc(e.code || e.message)}). جرّب تعمل Refresh.</div>`);
  }
};

/* ----- الرئيسية ----- */
async function renderHome() {
  if (S.profile.role === 'client') return renderPortal();
  clinicShell('home', LOADING);
  const c = S.clinic, d = daysLeft(c), today = todayStr();
  const seesSub = ['owner', 'accounts'].includes(S.profile.role);
  const stats = [];
  if (S.branch && S.profile.role !== 'client') {
    const q2 = col => getDocs(query(ccol(col), where('branchId', '==', S.branch), where('date', '==', today))).then(s => s.docs.map(x => x.data()));
    const jobs = [];
    if (can('bookings_view')) jobs.push(q2('bookings').then(l => {
      stats.push([l.filter(x => x.status !== 'cancelled').length, 'حجوزات النهارده']);
      stats.push([l.filter(x => x.status === 'arrived').length, 'منتظرين في العيادة']);
    }));
    if (can('sessions_view')) jobs.push(q2('sessions').then(l => stats.push([l.length, 'جلسات النهارده'])));
    if (can('payments_view')) jobs.push(q2('payments').then(l => stats.push([money(l.reduce((a, x) => a + (x.amount || 0), 0)), 'تحصيل النهارده'])));
    await Promise.all(jobs);
  }
  const quick = [];
  if (can('clients_edit')) quick.push(`<button class="btn" onclick="A.clientModal()">+ عميل جديد</button>`);
  if (can('bookings_edit')) quick.push(`<button class="btn" onclick="A.bookingModal()">+ حجز</button>`);
  if (can('sessions_edit')) quick.push(`<button class="btn" onclick="A.sessionModal()">+ تسجيل جلسة</button>`);
  if (can('packages_edit')) quick.push(`<button class="btn" onclick="A.sellModal()">+ بيع باكدج</button>`);
  if (can('payments_edit')) quick.push(`<button class="btn gold" onclick="A.payModal()">+ تحصيل</button>`);
  clinicShell('home', `
    <div class="head"><h2>أهلاً ${esc(S.profile.name)}</h2></div>
    ${seesSub && d <= 7 ? `<div class="notice warn">الاشتراك هيخلص بعد ${d} يوم (${fmt(c.expiresAt)}). كلّم Beam Care علشان التجديد.</div>` : ''}
    ${quick.length ? `<div style="display:flex;gap:10px;flex-wrap:wrap">${quick.join('')}</div>` : ''}
    ${stats.length ? `<div class="cards">${stats.map(([n, l]) => `<div class="card stat"><b>${n}</b><span>${l}</span></div>`).join('')}</div>` : ''}
    ${isOwner() ? `<div class="card" style="display:flex;flex-direction:column;gap:10px"><h3>الاشتراك والباكدج</h3>
      <div class="meta"><span>ينتهي: ${fmt(c.expiresAt)} (فاضل ${d} يوم)</span><span>الفروع: ${S.branches.length} من ${c.plan?.maxBranches ?? 0}</span><span>اليوزرات: حتى ${c.plan?.maxUsers ?? 0}</span><span>العملاء: حتى ${c.plan?.maxClients ?? 0}</span></div></div>` : ''}
    ${S.profile.role === 'client' ? `<div class="card empty">صفحة حجوزاتك وباكدجاتك هتكون هنا قريب.</div>` : ''}
  `);
}

A.saveClient = async (e, id) => {
  e.preventDefault();
  const f = e.target, btn = f.querySelector('[type=submit]');
  const data = { name: f.name.value.trim(), phone: f.phone.value.trim(), phone2: f.phone2.value.trim(), gender: f.gender.value, birth: f.birth.value, notes: f.notes.value.trim(), address: f.address.value.trim() };
  if (f.opening) data.openingBalance = Number(f.opening.value) || 0;
  if (!id && (S.clients || []).some(c => c.phone === data.phone) && !confirm('فيه عميل متسجل بنفس رقم الموبايل. تكمّل برضه؟')) return;
  busy(btn, true, 'جاري الحفظ...');
  try {
    if (id) {
      await updateDoc(cdoc('clients', id), data);
    } else {
      const max = S.clinic.plan?.maxClients ?? 0;
      const ctr = cdoc('meta', 'counters');
      const nref = doc(ccol('clients'));
      await runTransaction(db, async tx => {
        const cs = await tx.get(ctr);
        const n = cs.exists() ? (cs.data().clients || 0) : 0;
        if (n >= max) throw Object.assign(new Error('limit'), { code: 'limit' });
        tx.set(ctr, { clients: n + 1 }, { merge: true });
        tx.set(nref, { ...data, branchId: S.branch || '', month: todayStr().slice(0, 7), createdAt: serverTimestamp(), createdBy: S.profile.id });
      });
      id = nref.id;
    }
    A.closeModal(); toast('اتحفظ');
    await loadClients(true);
    A.openClient(id);
  } catch (err) {
    console.error(err); busy(btn, false, 'حفظ');
    toast(err.code === 'limit' ? 'العيادة وصلت لحد العملاء في الباكدج. كلّم Beam Care' : 'مقدرتش أحفظ: ' + (err.code || err.message));
  }
};

A.saveSession = async (e, bookingId) => {
  e.preventDefault();
  const f = e.target, btn = f.querySelector('[type=submit]');
  const cl = findClient(f.client.value);
  if (!cl) return toast('اختار العميل من القايمة');
  const pkg = (S.mPkgs || []).find(p => p.id === f.pkg.value);
  if (pkg && pLeft(pkg) <= 0) return toast('الباكدج ده خلص');
  const isPulses = pkg?.unit === 'pulses';
  let deduct = pkg ? 1 : 0;
  if (isPulses) {
    const n = Number(f.shots.value) || 0;
    if (n <= 0) return toast('اكتب عدد النبضات علشان تتخصم من الباكدج');
    deduct = n;
    if (n > pLeft(pkg)) {
      if (!confirm(`النبضات (${n}) أكتر من الفاضل في الباكدج (${pLeft(pkg)}). هيتخصم ${pLeft(pkg)} بس والباكدج هيخلص. تكمّل؟`)) return;
      deduct = pLeft(pkg);
    }
  }
  const dr = (S.staff || []).find(x => x.id === f.doctor.value) || (f.doctor.value === S.profile.id ? { id: S.profile.id, name: S.profile.name } : null);
  const num = v => v === '' ? null : Number(v);
  const data = {
    clientId: cl.id, clientName: cl.name, date: f.date.value, branchId: S.branch,
    doctorId: dr?.id || '', doctorName: dr?.name || '',
    packageId: pkg?.id || '', packageName: pkg?.name || '', sessionNo: pkg && !isPulses ? (pkg.usedSessions || 0) + 1 : null, pulsesDeducted: isPulses ? deduct : null,
    price: pkg ? 0 : (Number(f.price.value) || 0),
    area: f.area.value.trim(),
    deviceId: f.deviceId ? f.deviceId.value : '',
    device: f.deviceId ? ((S.devices || []).find(d => d.id === f.deviceId.value)?.name || '') : f.device.value.trim(),
    month: f.date.value.slice(0, 7),
    fluence: num(f.fluence.value), pulse: num(f.pulse.value), spot: num(f.spot.value), shots: num(f.shots.value),
    notes: f.notes.value.trim(), bookingId: bookingId || '',
    createdAt: serverTimestamp(), createdBy: S.profile.id, createdByName: S.profile.name,
  };
  busy(btn, true, 'جاري الحفظ...');
  try {
    const batch = writeBatch(db);
    const sref = doc(ccol('sessions'));
    batch.set(sref, data);
    if (pkg) batch.update(cdoc('cpackages', pkg.id), { usedSessions: increment(deduct) });
    if (data.deviceId && data.shots > 0) batch.update(cdoc('devices', data.deviceId), { shots: increment(data.shots) });
    if (bookingId) batch.update(cdoc('bookings', bookingId), { status: 'done', sessionId: sref.id });
    await batch.commit();
    A.closeModal();
    toast(pkg ? `اتسجلت الجلسة (فاضل ${(pLeft(pkg) - deduct).toLocaleString('ar-EG')} ${unitOf(pkg)} في الباكدج)` : 'اتسجلت الجلسة');
    S.sDate = data.date;
    afterSave(bookingId ? 'bookings' : 'sessions');
  } catch (err) { console.error(err); busy(btn, false, 'حفظ الجلسة'); toast('مقدرتش أحفظ: ' + err.code); }
};

async function renderPayments() {
  const tab = S.payTab || 'in';

  clinicShell('payments', LOADING);
  await ensureData();

    qBranch('payments', 'date', d), qBranch('payments', 'month', month),
    qBranch('expenses', 'date', d).catch(() => []), qBranch('expenses', 'month', month).catch(() => []),
  ]);
  const byT = (a, b) => (toDate(a.createdAt) || 0) - (toDate(b.createdAt) || 0);
  pDay.sort(byT); eDay.sort(byT);
  const cashIn = sumAmt(pDay.filter(p => p.method === 'cash')), cashOut = sumAmt(eDay.filter(p => (p.method || 'cash') === 'cash'));

      <div class="card stat"><b>${money(sumAmt(pDay))}</b><span>تحصيل اليوم (${pDay.length})</span></div>
      <div class="card stat"><b>${money(sumAmt(eDay))}</b><span>مصروفات اليوم (${eDay.length})</span></div>
      <div class="card stat"><b style="color:var(--gold)">${money(cashIn - cashOut)}</b><span>صافي الكاش في الدرج</span></div>
      ${Object.entries(byM).map(([k, v]) => `<div class="card stat"><b>${money(v)}</b><span>${METHODS[k] || esc(k)}</span></div>`).join('')}
      <div class="card stat"><b>${money(sumAmt(pMon) - sumAmt(eMon))}</b><span>صافي شهر ${month}</span></div>
    </div>

A.saveMove = async (e, id, type) => {
  e.preventDefault();
  const f = e.target, i = S.items.find(x => x.id === id);
  const qty = Number(f.qty.value) || 0;
  if (qty <= 0) return toast('اكتب كمية صحيحة');
  if (type === 'out' && qty > (i.qty || 0)) return toast('الكمية أكبر من الرصيد');
  try {
    const batch = writeBatch(db);
    batch.set(doc(ccol('stockMoves')), { itemId: id, itemName: i.name, branchId: S.branch, type, qty, note: f.note.value.trim(), date: f.date.value, month: f.date.value.slice(0, 7), createdAt: serverTimestamp(), createdBy: S.profile.id, createdByName: S.profile.name });
    batch.update(cdoc('items', id), { qty: increment(type === 'in' ? qty : -qty) });
    await batch.commit();
    A.closeModal(); toast('اتسجلت الحركة'); A.go('inventory');
  } catch (err) { console.error(err); toast('مقدرتش أحفظ: ' + err.code); }
};

async function renderStaff() {
  const tab = S.stTab || 'list';
  clinicShell('staff', LOADING);
  await loadStaff();
  const emps = (await qAll('employees', 'branchId', S.branch)).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar'));
  S.emps = emps;
  const ed = can('staff_edit');
  let body = '';
  if (tab === 'list') {
    body = emps.length ? `<div class="card tbl-wrap" style="padding:0"><table><thead><tr><th>الاسم</th><th>الوظيفة</th><th>الموبايل</th><th>المرتب</th><th>عمولة الجلسة</th><th>مربوط بيوزر</th><th>الحالة</th><th></th></tr></thead>
      <tbody>${emps.map(x => `<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.job)}</td><td dir="ltr" style="text-align:right">${esc(x.phone)}</td><td>${money(x.salary)}</td><td>${x.perSession ? money(x.perSession) : '—'}</td>
        <td>${esc((S.staff || []).find(s => s.id === x.userId)?.name) || '—'}</td><td>${x.active === false ? '<span class="chip mute">مش شغال</span>' : '<span class="chip ok">شغال</span>'}</td>
        <td>${ed ? `<button class="btn ghost sm" onclick="A.empModal('${x.id}')">تعديل</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`
      : `<div class="card empty">مفيش موظفين مسجلين في الفرع ده.</div>`;
  } else {
    const M = S.prMonth || monthStr();
    const [sess, pr] = await Promise.all([qBranch('sessions', 'month', M).catch(() => []), qBranch('payroll', 'month', M)]);
    const cnt = {};
    sess.forEach(s => { if (s.doctorId) cnt[s.doctorId] = (cnt[s.doctorId] || 0) + 1; });
    S.prCalc = {};
    const rows = emps.filter(x => x.active !== false).map(x => {
      const st = (S.staff || []).find(s => s.id === x.userId);
      const n = x.userId ? [x.userId, ...(st?.prevIds || [])].reduce((a, id) => a + (cnt[id] || 0), 0) : 0;
      const comm = n * (x.perSession || 0);
      const paid = pr.find(p => p.employeeId === x.id);
      S.prCalc[x.id] = { base: x.salary || 0, n, comm };
      return `<tr><td><b>${esc(x.name)}</b></td><td>${money(x.salary)}</td><td>${x.userId ? n : '—'}</td><td>${comm ? money(comm) : '—'}</td>
        <td>${paid ? `<b>${money(paid.net)}</b>` : money((x.salary || 0) + comm)}</td>
        <td>${paid ? `<span class="chip ok">اتصرف ${esc(paid.paidDate)}</span>` : ed ? `<button class="btn gold sm" onclick="A.payrollModal('${x.id}')">صرف</button>` : '<span class="chip mute">لسه</span>'}</td></tr>`;
    });
    const totalPaid = pr.reduce((a, p) => a + (p.net || 0), 0);
    body = `${monthBar('prMonth', M)}
      <div class="meta"><span>اتصرف في الشهر ده: ${money(totalPaid)}</span><span>العمولة بتتحسب من الجلسات اللي الموظف سجّلها كدكتور</span></div>
      ${rows.length ? `<div class="card tbl-wrap" style="padding:0"><table><thead><tr><th>الموظف</th><th>الأساسي</th><th>جلسات</th><th>العمولة</th><th>الصافي</th><th></th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`
        : `<div class="card empty">ضيف الموظفين الأول من تبويب "الموظفين".</div>`}`;
  }
  clinicShell('staff', `
    <div class="head"><h2>الموظفين والمرتبات</h2>${ed && tab === 'list' ? `<button class="btn gold" onclick="A.empModal()">+ موظف</button>` : ''}</div>
    <div class="tabs">${[['list', 'الموظفين'], ['payroll', 'المرتبات']].map(([k, l]) => `<button class="${tab === k ? 'on' : ''}" onclick="A.stTabSet('${k}')">${l}</button>`).join('')}</div>
    ${body}`);
}

A.calcDebts = async () => {
  const box = document.getElementById('debtsBox');
  box.innerHTML = LOADING;
  try {
    const [pk, ss, pay, cls] = await Promise.all([getDocs(ccol('cpackages')), getDocs(ccol('sessions')), getDocs(ccol('payments')), getDocs(ccol('clients'))]);
    const bal = {};
    const add = (id, name, v) => { bal[id] = bal[id] || { name, v: 0 }; bal[id].v += v; };
    cls.forEach(d => { const x = d.data(); if (x.openingBalance) add(d.id, x.name, x.openingBalance); });
    pk.forEach(d => { const x = d.data(); if (!x.imported) add(x.clientId, x.clientName, x.price || 0); });
    ss.forEach(d => { const x = d.data(); if (!x.packageId) add(x.clientId, x.clientName, x.price || 0); });
    pay.forEach(d => { const x = d.data(); add(x.clientId, x.clientName, -(x.amount || 0)); });
    const list = Object.entries(bal).filter(([, b]) => b.v > 0).sort((a, b) => b[1].v - a[1].v);
    const tot = list.reduce((a, [, b]) => a + b.v, 0);
    S.debts = list;
    box.innerHTML = `<div class="head"><h3 style="flex:1">المديونيات (${list.length} عميل · ${money(tot)})</h3>${list.length ? '<button class="btn ghost sm" onclick="A.exportDebts()">تحميل Excel</button>' : ''}</div>

let XLSXp = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!XLSXp) XLSXp = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload = () => res(window.XLSX);
    s.onerror = () => { XLSXp = null; rej(new Error('مقدرتش أحمّل مكتبة الإكسل، اتأكد من النت')); };
    document.head.appendChild(s);
  });
  return XLSXp;
}
async function downloadXLSX(fileName, sheetName, rows) {
  try {
    const X = await loadXLSX();
    const ws = X.utils.aoa_to_sheet(rows);
    ws['!cols'] = rows[0].map(() => ({ wch: 18 }));
    const wb = X.utils.book_new();
    wb.Workbook = { Views: [{ RTL: true }] };
    X.utils.book_append_sheet(wb, ws, sheetName);
    X.writeFile(wb, fileName);
  } catch (e) { console.error(e); toast(e.message); }
}

const normTxt = v => String(v ?? '').toLowerCase().replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/[\s_\-:.()]/g, '');
const latinDigits = v => String(v ?? '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
function impNum(v) {
  const s = latinDigits(v).replace(/[,٬\s]/g, '').replace(/[^\d.\-]/g, '');
  if (!s) return null;
  const n = Number(s);
  return isNaN(n) ? null : n;
}
function impPhone(v) {
  let s = latinDigits(v).replace(/[^\d+]/g, '');
  if (s.startsWith('+20')) s = '0' + s.slice(3);
  else if (s.startsWith('0020')) s = '0' + s.slice(4);
  else if (s.length === 12 && s.startsWith('20')) s = '0' + s.slice(2);
  if (s.length === 10 && s.startsWith('1')) s = '0' + s;
  return s;
}
function impDate(v) {
  const s = latinDigits(v).trim();
  if (!s) return '';
  let m = s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if (m) {
    let [, a, b, y] = m;
    if (y.length === 2) y = (Number(y) > 50 ? '19' : '20') + y;
    let d = Number(a), mo = Number(b);
    if (mo > 12 && d <= 12) [d, mo] = [mo, d];
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return '';
    return `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  }
  return '';
}
function impGender(v) {
  const s = normTxt(v);
  if (!s) return 'f';
  if (/(female|انث|ست|سيده|بنت|^f$)/.test(s)) return 'f';
  if (/(male|ذكر|رجل|راجل|^m$|^ذ$)/.test(s)) return 'm';
  return 'f';
}

        <div class="card stat"><b style="color:${P.noName ? 'var(--warn)' : 'inherit'}">${P.noName}</b><span>من غير اسم (هيتجاهل)</span></div>
        <div class="card stat"><b>${room}</b><span>مكان فاضي في باكدج العيادة</span></div>
      </div>
      ${P.records.length > room ? `<div class="notice warn">الشيت فيه ${P.records.length} عميل والباكدج فاضل فيه ${room} بس. زوّد "عدد العملاء" من تبويب الاشتراك الأول، أو هيتسجل أول ${room} بس.</div>` : ''}
      ${prev.length ? `<div class="tbl-wrap" style="border:1px solid var(--line);border-radius:12px"><table>
        <thead><tr><th>الاسم</th><th>الموبايل</th><th>العنوان</th><th>الفرع</th><th>الباكدج</th><th>المديونية</th></tr></thead>
        <tbody>${prev.map(r => `<tr><td><b>${esc(r.c.name)}</b></td><td dir="ltr" style="text-align:right">${esc(r.c.phone) || '—'}</td><td>${esc(r.c.address) || '—'}</td><td>${esc(branchName2(r.c.branchId))}</td>
          <td>${r.p ? `${esc(r.p.name)}: ${r.p.usedSessions} من ${r.p.totalSessions} ${r.p.unit === 'pulses' ? 'نبضة' : 'جلسة'}` : '—'}</td><td>${r.c.openingBalance ? money(r.c.openingBalance) : '—'}</td></tr>`).join('')}</tbody></table></div>` : '<p class="meta">مفيش صفوف صالحة. اتأكد إنك حددت عمود الاسم.</p>'}
      <div id="impProg"></div>
      <div class="acts"><button class="btn gold" ${P.records.length && room ? '' : 'disabled'} onclick="A.impRun()">استيراد ${Math.min(P.records.length, room)} عميل</button>
        <button class="btn ghost" onclick="A.impReset()">إلغاء</button></div>
    </div>`;
}
const branchName2 = id => S.dBranches.find(b => b.id === id)?.name || '—';

A.impTemplate = () => downloadXLSX('beamcare-clients-template.xlsx', 'العملاء', [
  ['الاسم', 'الموبايل', 'موبايل 2', 'العنوان', 'النوع', 'تاريخ الميلاد', 'الفرع', 'تاريخ التسجيل', 'الباكدج', 'إجمالي النبضات', 'المستهلك', 'المتبقي', 'السعر', 'المدفوع', 'ملاحظات طبية'],
  ['مثال: سارة أحمد', '01012345678', '', 'المعادي', 'أنثى', '1995-04-20', S.dBranches[0]?.name || 'المعادي', '2025-09-01', 'فول بادي', 3000, 1200, 1800, 6000, 4000, 'حساسية من البنسلين'],
]);
A.impReset = () => { S.imp = null; renderTenant(); };
A.impFile = async input => {
  const file = input.files[0];
  if (!file) return;
  try {
    toast('جاري قراءة الملف...');
    const X = await loadXLSX();
    const wb = X.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
    S.imp = { fileName: file.name, wb, sheet: wb.SheetNames[0], headerRow: 1, map: {}, defBranch: S.dBranches[0]?.id || '', unit: 'pulses', defPkg: 'باكدج سابق' };
    impLoadSheet(true);
    renderTenant();
  } catch (e) { console.error(e); toast('مقدرتش أقرا الملف: ' + e.message); }
};
function impLoadSheet(guess) {
  const I = S.imp;
  const cell = v => v instanceof Date ? `${v.getFullYear()}-${String(v.getMonth() + 1).padStart(2, '0')}-${String(v.getDate()).padStart(2, '0')}` : v;
  const aoa = window.XLSX.utils.sheet_to_json(I.wb.Sheets[I.sheet], { header: 1, raw: true, defval: '', blankrows: false }).map(r => r.map(cell));
  const h = Math.max(1, I.headerRow) - 1;
  I.headers = (aoa[h] || []).map(x => String(x).trim());
  const width = Math.max(I.headers.length, ...aoa.slice(h + 1, h + 50).map(r => r.length));
  while (I.headers.length < width) I.headers.push('');
  I.rows = aoa.slice(h + 1).filter(r => r.some(v => String(v).trim() !== ''));
  if (guess) {
    I.map = {};
    const used = new Set();
    const hn = I.headers.map(normTxt);
    IMP_GUESS.forEach(([k, kws]) => {
      const i = hn.findIndex((x, j) => !used.has(j) && x && kws.some(w => x.includes(w)));
      if (i >= 0) { I.map[k] = i; used.add(i); }
    });
  }
}
A.impSheet = v => { S.imp.sheet = v; S.imp.headerRow = 1; impLoadSheet(true); renderTenant(); };
A.impHeader = v => { S.imp.headerRow = Number(v) || 1; impLoadSheet(true); renderTenant(); };
A.impMap = (k, v) => { if (v === '') delete S.imp.map[k]; else S.imp.map[k] = Number(v); renderTenant(); };
A.impSet = (k, v) => { S.imp[k] = v; renderTenant(); };

function impPrepare() {
  const I = S.imp, M = I.map;
  const get = (r, k) => M[k] === undefined ? '' : String(r[M[k]] ?? '').trim();
  const has = k => M[k] !== undefined;
  const seen = new Set((S.dClientList || []).map(c => impPhone(c.phone)).filter(Boolean));
  const brs = S.dBranches.map(b => ({ id: b.id, n: normTxt(b.name) }));
  const out = { records: [], dup: 0, noName: 0, withPkg: 0, debt: 0 };
  I.rows.forEach(r => {
    const name = get(r, 'name');
    if (!name) { out.noName++; return; }
    const phone = impPhone(get(r, 'phone'));
    if (phone) { if (seen.has(phone)) { out.dup++; return; } seen.add(phone); }
    let branchId = I.defBranch;
    const bn = normTxt(get(r, 'branch'));
    if (bn) { const b = brs.find(x => x.n && (bn.includes(x.n) || x.n.includes(bn))); if (b) branchId = b.id; }
    const regDate = impDate(get(r, 'regDate'));
    const c = { name, phone, phone2: impPhone(get(r, 'phone2')), address: get(r, 'address'), gender: impGender(get(r, 'gender')), birth: impDate(get(r, 'birth')), notes: get(r, 'notes'), branchId, regDate, openingBalance: 0 };
    const price = impNum(get(r, 'pkgPrice')), paid = impNum(get(r, 'pkgPaid'));
    if (has('debt')) c.openingBalance = Math.max(0, impNum(get(r, 'debt')) || 0);
    else if (price != null && paid != null) c.openingBalance = Math.max(0, price - paid);
    let total = impNum(get(r, 'pkgTotal')), usedN = impNum(get(r, 'pkgUsed')), left = impNum(get(r, 'pkgLeft'));
    let p = null;
    if ((total || 0) > 0 || (left || 0) > 0) {
      if (!(total > 0)) total = (left || 0) + (usedN || 0);
      let usedV = usedN != null ? usedN : (left != null ? total - left : 0);
      usedV = Math.min(Math.max(0, usedV), total);
      p = { name: get(r, 'pkgName') || I.defPkg || 'باكدج سابق', unit: I.unit, totalSessions: total, usedSessions: usedV, price: price || 0 };
      out.withPkg++;
    }
    out.debt += c.openingBalance;
    out.records.push({ c, p });
  });
  return out;
}

A.impRun = async () => {
  const P = impPrepare();
  const c = S.dc;
  const room = Math.max(0, (c.plan?.maxClients ?? 0) - (S.dClients ?? 0));
  const list = P.records.slice(0, room);
  if (!list.length) return;
  if (!confirm(`هيتسجل ${list.length} عميل في ${c.name}. متأكد؟`)) return;
  const prog = document.getElementById('impProg');
  document.querySelectorAll('#app .acts .btn').forEach(b => b.disabled = true);
  let done = 0;
  try {
    for (let i = 0; i < list.length; i += 200) {
      const batch = writeBatch(db);
      list.slice(i, i + 200).forEach(({ c: cl, p }) => {
        const cref = doc(collection(db, 'clinics', c.id, 'clients'));
        batch.set(cref, { ...cl, month: '', imported: true, createdAt: serverTimestamp(), createdBy: 'import' });
        if (p) batch.set(doc(collection(db, 'clinics', c.id, 'cpackages')), { ...p, clientId: cref.id, clientName: cl.name, branchId: cl.branchId, date: cl.regDate || '', imported: true, notes: 'مستورد من إكسل', createdAt: serverTimestamp(), createdBy: 'import', createdByName: 'استيراد' });
      });
      await batch.commit();
      done = Math.min(list.length, i + 200);
      prog.innerHTML = `<div class="notice info">اتسجل ${done} من ${list.length}...</div>`;
    }
    await setDoc(doc(db, 'clinics', c.id, 'meta', 'counters'), { clients: (S.dClients ?? 0) + list.length }, { merge: true });
    S.imp = null;
    toast(`اتسجل ${list.length} عميل`);
    A.openClinic(c.id, 'import');
  } catch (e) {
    console.error(e);
    if (done) await setDoc(doc(db, 'clinics', c.id, 'meta', 'counters'), { clients: (S.dClients ?? 0) + done }, { merge: true }).catch(() => {});
    prog.innerHTML = `<div class="notice warn">وقف بعد ${done} عميل بسبب مشكلة (${esc(e.code || e.message)}). اللي اتسجل محفوظ.</div>`;
  }
};
